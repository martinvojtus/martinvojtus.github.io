<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --banner-height: 40px;
            --size-large: 2.0rem;
            --size-small: 1rem;
            --black: #000000;
            --white: #ffffff;
            --content-width: 540px;
        }

        /* 🛠️ Fix pre Safari a nescrollovateľný layout */
        html, body {
            margin: 0; padding: 0;
            height: 100dvh; /* Dynamická výška podľa líšt prehliadača */
            width: 100%;
            overflow: hidden; /* Zákaz scrollovania pre Single-View */
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--white);
            color: var(--black);
            display: flex;
            flex-direction: column;
        }

        /* 🧊 Bannery (Header & Footer) */
        header, footer {
            position: fixed; left: 0; width: 100%; height: var(--banner-height);
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 2000;
        }

        header { top: 0; padding-top: env(safe-area-inset-top); }
        footer { 
            bottom: 0; 
            padding-bottom: env(safe-area-inset-bottom); 
            height: calc(var(--banner-height) + env(safe-area-inset-bottom));
        }

        .banner-content {
            width: 100%; max-width: var(--content-width);
            height: var(--banner-height); display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; box-sizing: border-box;
            position: relative;
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { height: 20px; width: auto; display: block; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); letter-spacing: 0.05em; white-space: nowrap; }
        .logo-text span { font-weight: 700; }

        /* ☰ Menu Toggle */
        .menu-toggle { width: 24px; height: 10px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; z-index: 2100; }
        .line { width: 24px; height: 1px; background-color: var(--black); transition: 0.3s; }
        .menu-toggle.active .line:nth-child(1) { transform: translateY(4.5px) rotate(45deg); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(-4.5px) rotate(-45deg); }

        /* 📜 Rolovacie Menu */
        .nav-overlay {
            position: fixed; top: -110%; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            transition: top 0.5s cubic-bezier(0.77, 0, 0.175, 1); z-index: 1500;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .nav-overlay.active { top: 0; }
        .menu-items { width: 100%; max-width: var(--content-width); display: flex; flex-direction: column; gap: 20px; padding: 0 20px; box-sizing: border-box; }
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; }

        /* 📏 Hlavný obsah - Vždy vycentrovaný */
        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: var(--banner-height) 20px;
            box-sizing: border-box;
            position: relative;
        }

        .content-section { display: none; width: 100%; max-width: var(--content-width); animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 🖼️ Foto rámy - Adaptívne pre Landscape */
        .portrait-container { width: 100%; display: flex; justify-content: center; }
        .photo-frame {
            width: 100%;
            max-height: calc(100dvh - 120px); /* Ochrana pred pretiahnutím na výšku v Landscape */
            border-radius: 12px; 
            overflow: hidden;
            background-color: #000000; 
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .photo-frame img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); display: block; }

        /* Galéria prekrývaná textom */
        .gallery-link { display: block; width: 100%; height: 100%; text-decoration: none; }
        .gallery-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.8) 100%);
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding-bottom: 20px; box-sizing: border-box; color: var(--white); text-align: center;
        }
        .gallery-title { font-size: var(--size-large); font-weight: 600; line-height: 1; margin: 0 0 5px 0; }
        .gallery-desc { font-size: var(--size-small); font-weight: 400; opacity: 0.8; margin: 0; }

        /* ✉️ Form styling */
        .contact-form { width: 100%; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: var(--size-small); text-transform: uppercase; font-weight: 600; margin-bottom: 5px; }
        .form-input, .form-textarea { width: 100%; border: none; border-bottom: 1px solid var(--black); background: transparent; font-family: inherit; font-size: var(--size-small); padding: 8px 0; outline: none; }
        .submit-btn { width: 100%; background: var(--black); color: var(--white); border: none; padding: 15px; font-weight: 600; text-transform: uppercase; cursor: pointer; margin-top: 10px; }

        /* 📱 Špecifické úpravy pre režim na šírku (Landscape) */
        @media (orientation: landscape) and (max-height: 500px) {
            .photo-frame { aspect-ratio: 16 / 7 !important; }
            .gallery-title { font-size: 1.5rem; }
            .menu-items { flex-direction: row; flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="banner-content">
            <div class="logo-link" onclick="showSection('about')">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="#000000" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle">
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <a class="menu-link" onclick="showSection('about')">About</a>
            <a class="menu-link" onclick="closeMenu()">Work</a>
            <a class="menu-link" onclick="showSection('photography')">iPhone photography</a>
            <a class="menu-link" onclick="showSection('contact')">Contact</a>
        </div>
    </nav>

    <main>
        <div id="section-about" class="content-section active">
            <div class="portrait-container">
                <div class="photo-frame" style="aspect-ratio: 3 / 4;">
                    <img src="portrait.jpeg" alt="Portrait" onerror="this.style.display='none'; this.parentNode.textContent='Portrait';">
                </div>
            </div>
        </div>

        <div id="section-photography" class="content-section">
            <div class="portrait-container">
                <div class="photo-frame" style="aspect-ratio: 16 / 9;">
                    <a href="#" class="gallery-link">
                        <img src="IMG_4850.jpeg" alt="Photography" onerror="this.style.display='none';">
                        <div class="gallery-overlay">
                            <h2 class="gallery-title">Gallery.</h2>
                            <p class="gallery-desc">World through my eyes.</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <div id="section-contact" class="content-section">
            <div class="contact-form">
                <div class="form-group"><label class="form-label">Name</label><input type="text" id="contact-name" class="form-input" placeholder="Charlie Harper"></div>
                <div class="form-group"><label class="form-label">Email</label><input type="email" id="contact-email" class="form-input" placeholder="charlie@example.com"></div>
                <div class="form-group"><label class="form-label">Message</label><textarea id="contact-message" class="form-textarea" placeholder="Message..."></textarea></div>
                <button type="button" class="submit-btn" onclick="sendMail()">Send message</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="banner-content" style="justify-content: center;">
            <div class="footer-info">build v1.1.12 • martin vojtus • 2026</div>
        </div>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');

        function toggleMenu() { menuToggle.classList.toggle('active'); navOverlay.classList.toggle('active'); }
        function closeMenu() { menuToggle.classList.remove('active'); navOverlay.classList.remove('active'); }

        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + sectionId).classList.add('active');
            closeMenu();
        }

        function sendMail() {
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const message = document.getElementById('contact-message').value;
            const subject = encodeURIComponent("Contact from " + name);
            const body = encodeURIComponent("Name: " + name + "\nEmail: " + email + "\n\nMessage:\n" + message);
            window.location.href = `mailto:martinvojtus@icloud.com?subject=${subject}&body=${body}`;
        }

        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => {
            if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu();
        });
    </script>

</body>
</html>
