<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* STRICT 2 FONT SIZES ONLY */
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            
            --black: #000000;
            --white: #ffffff;
            /* 30% BLACK FOR SUBTLE TEXT & PLACEHOLDERS */
            --grey-30: rgba(0, 0, 0, 0.3);
            /* 10% BLACK FOR DIVIDER LINES */
            --divider: rgba(0, 0, 0, 0.1);
            
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            
            /* ABSOLUTE 16px SYSTEM RADIUS & SPACING */
            --border-radius: 16px; 
            --gap-item: 16px; 
            
            /* UNIFIED LETTER SPACING */
            --letter-spacing: 0.05em;

            --glass-opacity: 0.6; 
            --glass-blur: 25px;   
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-30: rgba(255, 255, 255, 0.3); 
                --divider: rgba(255, 255, 255, 0.1); 
                --glass-rgb: 0, 0, 0;   
            }
        }

        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-weight: 400; 
            font-family: 'Space Grotesk', sans-serif; 
            letter-spacing: var(--letter-spacing); 
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.5; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        /* LINE HEIGHT KILLER FOR EXACT SPACING */
        .menu-link, .status-date, .admin-action-btn, .footer-info, .checkbox-label-text, .submit-btn, .form-input, .logo-text, .status-title {
            line-height: 1;
        }

        header {
            position: fixed; top: 0; left: 0;
            width: 100%; 
            display: flex; justify-content: center;
            padding: var(--gap-item) 0; 
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            display: flex; justify-content: space-between;
            align-items: center; padding: 0 var(--gap-item); 
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { height: 24px; width: auto; display: block; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); white-space: nowrap; margin: 0; }

        .menu-toggle { width: 24px; height: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; z-index: 2100; }
        .line { width: 24px; height: 1px; background-color: var(--black); transition: transform 0.3s ease, background-color 0.3s ease; }
        .menu-toggle.active .line:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(-5.5px) rotate(-45deg); }

        .nav-overlay {
            position: fixed; top: -100%; left: 0; width: 100%; 
            height: auto;
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            transition: top 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1500; 
            padding: calc(56px + var(--gap-item)) 0 var(--gap-item) 0; 
            display: flex; flex-direction: column; align-items: center;
        }
        .nav-overlay.active { top: 0; }
        
        .menu-items { 
            width: 100%; 
            max-width: var(--content-width); 
            display: flex; flex-direction: column; gap: var(--gap-item); padding: 0 var(--gap-item); 
        }
        
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; display: inline-block; padding: 0; border: none; background: transparent; text-align: left; margin: 0; }

        main {
            padding: calc(56px + var(--gap-item)) var(--gap-item) var(--gap-item); 
            width: 100%; max-width: var(--content-width); 
            flex-grow: 1; display: flex; flex-direction: column; gap: var(--gap-item);
        }

        #section-feed { display: flex; flex-direction: column; gap: var(--gap-item); }
        #feed-admin-zone { display: flex; flex-direction: column; gap: var(--gap-item); padding-bottom: var(--gap-item); border-bottom: 1px solid var(--divider); }
        #quick-post-wrapper { display: flex; gap: var(--gap-item); width: 100%; }
        #menu-login-section { display: flex; flex-direction: column; gap: var(--gap-item); }
        #menu-admin-section { display: flex; flex-direction: column; gap: var(--gap-item); }

        .status-feed {
            max-width: 600px; width: 100%;
            margin: 0 auto; 
            display: flex; flex-direction: column; gap: 0; 
        }

        .status-card {
            background: transparent; border: none;
            border-bottom: 1px solid var(--divider); 
            border-radius: 0; 
            padding: var(--gap-item) 0; 
            margin: 0;
            display: flex; flex-direction: column; gap: var(--gap-item);
        }
        .status-card:first-child { padding-top: 0; }
        .status-card:last-child { border-bottom: none; }

        .status-date { font-size: var(--size-small); color: var(--grey-30); display: block; text-transform: uppercase; margin: 0; }
        .status-title { font-size: var(--size-large); margin: 0; color: var(--black); }
        .status-image { width: 100%; height: auto; border-radius: var(--border-radius); display: block; margin: 0; border: none; }
        .status-text { font-size: var(--size-small); color: var(--black); opacity: 0.8; white-space: pre-line; text-align: justify; margin: 0; word-wrap: break-word; }
        .loading-text { text-align: center; font-size: var(--size-small); color: var(--grey-30); margin: 0; padding: var(--gap-item) 0; line-height: 1; }

        .form-input, .submit-btn { 
            height: 48px; border: 1px solid var(--black); border-radius: var(--border-radius); 
            background: transparent; font-size: var(--size-small); padding: 0 var(--gap-item); 
            outline: none; color: var(--black); box-sizing: border-box; display: flex; margin: 0; align-items: center;
            gap: var(--gap-item);
        }
        ::placeholder { color: var(--grey-30); opacity: 1; }
        
        .form-textarea { 
            width: 100%; border: 1px solid var(--black); border-radius: var(--border-radius); 
            background: transparent; font-size: var(--size-small); padding: var(--gap-item); 
            outline: none; color: var(--black); box-sizing: border-box; display: block; 
            transition: all 0.3s ease; min-height: 80px; resize: vertical; margin: 0;
        }

        .submit-btn {
            background: var(--black); color: var(--white); text-transform: uppercase; 
            cursor: pointer; justify-content: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .secondary-btn { background: transparent; color: var(--black); }

        .admin-action-btn { background: transparent; border: none; font-size: var(--size-small); color: var(--black); cursor: pointer; padding: 0; margin: 0; display: inline-flex; align-items: center;}
        .admin-action-link { text-decoration: underline; }

        .checkbox-wrapper { display: inline-flex; align-items: center; gap: var(--gap-item); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; }
        .checkbox-wrapper input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { position: relative; height: 16px; width: 16px; background-color: transparent; border: 1px solid var(--black); border-radius: 4px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin: 0; }
        .checkbox-wrapper input:checked ~ .checkmark { background-color: var(--black); }
        .checkmark::after { content: ""; position: absolute; display: none; width: 3px; height: 7px; border: solid var(--white); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin-bottom: 2px; }
        .checkbox-wrapper input:checked ~ .checkmark::after { display: block; }
        .checkbox-label-text { font-size: var(--size-small); color: var(--black); margin: 0; }

        .footer-info { font-size: var(--size-small); color: var(--grey-30); text-transform: uppercase; text-align: left; margin: 0; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="window.scrollTo(0,0)">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="935.31" height="810" viewBox="72.35 270 935.31 810"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="var(--black)" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle"><div class="line"></div><div class="line"></div></div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <a class="menu-link" onclick="window.scrollTo(0,0); closeMenu();"><span>Feed</span></a>
            
            <div style="width: 100%; height: 1px; background-color: var(--divider);"></div>
            
            <div id="menu-login-section">
                <form onsubmit="handleLogin(event)" style="display: flex; width: 100%; gap: var(--gap-item); margin: 0;">
                    <input type="password" id="admin-pass" class="form-input" placeholder="Password..." required style="flex-grow: 1; margin: 0;">
                    <button type="submit" id="login-btn" class="submit-btn" style="width: 120px; flex-shrink: 0; margin: 0;">LOG IN</button>
                </form>
                
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="remember-me">
                    <span class="checkmark"></span>
                    <span class="checkbox-label-text">Stay logged in</span>
                </label>
            </div>

            <div id="menu-admin-section" style="display: none;">
                <button onclick="handleLogout()" class="menu-link" style="text-decoration: underline;">Logout</button>
            </div>
            
            <div style="width: 100%; height: 1px; background-color: var(--divider);"></div>

            <div class="footer-info">build v3.2.1 • 2026</div>
        </div>
    </nav>

    <main>
        <div id="section-feed">
            <h2 style="font-size: var(--size-large); margin: 0; line-height: 1;">Feed.</h2>
            <div style="width: 100%; height: 1px; background-color: var(--divider);"></div>
            
            <div id="feed-admin-zone" style="display: none;">
                
                <div id="quick-post-wrapper">
                    <form onsubmit="handleQuickPost(event)" style="display: flex; gap: var(--gap-item); flex-grow: 1; margin: 0;">
                        <input type="text" id="quick-text" class="form-input" placeholder="Quick thought..." required style="flex-grow: 1; margin: 0;">
                        
                        <button type="button" id="add-adv-btn" class="submit-btn" style="width: 48px; height: 48px; flex-shrink: 0; padding: 0;" onclick="toggleAdvancedEditor(true)" title="Advanced Editor" aria-label="Advanced Editor">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>

                        <button type="submit" id="quick-btn" class="submit-btn" style="width: 48px; height: 48px; flex-shrink: 0; padding: 0;" aria-label="Post">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </form>
                </div>

                <div id="full-editor-wrapper" style="display: none; flex-direction: column; gap: var(--gap-item);">
                    <form id="editor-form" onsubmit="handlePublish(event)" style="display: flex; flex-direction: column; gap: var(--gap-item); width: 100%; margin: 0;">
                        <input type="text" id="edit-title" class="form-input" placeholder="Title (Optional)" style="width: 100%;">
                        
                        <div id="current-image-container" style="display: none; align-items: center; gap: var(--gap-item); margin: 0;">
                            <span style="color: var(--grey-30); font-size: var(--size-small); line-height: 1;">Attached image </span>
                            <button type="button" class="admin-action-btn admin-action-link" style="color: var(--black);" onclick="flagImageForRemoval()">Remove</button>
                        </div>

                        <input type="file" id="edit-image" accept="image/*" style="display: none;" onchange="updateFileName()">
                        <div class="form-input" style="cursor: pointer; width: 100%;" onclick="document.getElementById('edit-image').click()">
                            <span class="admin-action-btn admin-action-link" style="pointer-events: none; white-space: nowrap;">Upload image</span>
                            <span id="file-name-display" style="color: var(--grey-30); pointer-events: none; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--size-small); line-height: 1; margin: 0;">(Optional)</span>
                            <button type="button" id="clear-file-btn" class="admin-action-btn admin-action-link" style="color: var(--black); display: none; padding: 0; flex-shrink: 0;" onclick="clearSelectedFile(event)">Remove</button>
                        </div>

                        <textarea id="edit-text" class="form-textarea" placeholder="Content (Optional if image attached)"></textarea>
                        
                        <div style="display: flex; gap: var(--gap-item);">
                            <button type="submit" id="publish-btn" class="submit-btn" style="flex-grow: 1;">PUBLISH</button>
                            <button type="button" id="cancel-btn" class="submit-btn secondary-btn" style="flex-grow: 1;" onclick="toggleAdvancedEditor(false)">CANCEL</button>
                        </div>
                    </form>
                    
                    <div style="width: 100%; height: 1px; background-color: var(--divider);"></div>
                    <button type="button" id="delete-all-btn" data-state="0" class="submit-btn" style="width: 100%; margin: 0;" onclick="handleDeleteAllClick()">DELETE ALL POSTS</button>
                </div>

            </div>

            <div id="status-container" class="status-feed"></div>
            <div id="loading-indicator" class="loading-text">Loading...</div>
        </div>
    </main>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        let secretKey = ""; 
        let editingId = null;
        let globalPosts = [];
        let currentImageUrl = null; 
        let removeImageFlag = false; 

        let currentOffset = 0;
        const postsLimit = 10;
        let isLoading = false;
        let hasMorePosts = true;
        
        let deleteConfirmTimeout;
        let deleteCountdownInterval;
        let countdownValue = 5;

        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');
        
        function toggleMenu(forceOpen = false) { 
            if(forceOpen) {
                menuToggle.classList.add('active'); 
                navOverlay.classList.add('active');
            } else {
                menuToggle.classList.toggle('active'); 
                navOverlay.classList.toggle('active'); 
            }
        }
        function closeMenu() { 
            menuToggle.classList.remove('active'); 
            navOverlay.classList.remove('active'); 
        }

        function checkSavedLogin() {
            const savedKey = localStorage.getItem('adminSecretKey');
            if (savedKey) {
                secretKey = savedKey;
                activateAdminUI();
            }
        }

        function activateAdminUI() {
            document.getElementById('menu-login-section').style.display = 'none';
            document.getElementById('menu-admin-section').style.display = 'flex';
            document.getElementById('feed-admin-zone').style.display = 'flex';
            refreshFeedUI();
        }

        function handleLogin(e) {
            e.preventDefault();
            const passInput = document.getElementById('admin-pass');
            secretKey = passInput.value;
            const rememberMe = document.getElementById('remember-me').checked;
            if (rememberMe) localStorage.setItem('adminSecretKey', secretKey);
            passInput.value = ''; 
            activateAdminUI();
            closeMenu();
        }

        function handleLogout() {
            secretKey = "";
            localStorage.removeItem('adminSecretKey');
            document.getElementById('menu-admin-section').style.display = 'none';
            document.getElementById('menu-login-section').style.display = 'flex';
            document.getElementById('feed-admin-zone').style.display = 'none';
            document.getElementById('remember-me').checked = false;
            toggleAdvancedEditor(false);
            resetDeleteButton(); 
            refreshFeedUI();
            closeMenu(); 
        }

        function handleUnauthorized() {
            handleLogout();
            toggleMenu(true); 
            const passInput = document.getElementById('admin-pass');
            passInput.placeholder = "Invalid password.";
            setTimeout(() => { passInput.placeholder = "Password..."; }, 3000);
        }

        function refreshFeedUI() {
            const container = document.getElementById('status-container');
            if (globalPosts.length > 0) {
                container.innerHTML = '';
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = globalPosts.map(s => renderSinglePost(s)).join('');
                while(tempDiv.firstChild) {
                    container.appendChild(tempDiv.firstChild);
                }
            }
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" style="color: inherit; text-decoration: underline;">' + url + '</a>';
            });
        }

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(blob => { resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() })); }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function fetchStatuses(reset = false) {
            if (reset) {
                currentOffset = 0;
                hasMorePosts = true;
                globalPosts = [];
                document.getElementById('status-container').innerHTML = '';
                document.getElementById('loading-indicator').style.display = 'block';
                document.getElementById('loading-indicator').innerText = 'Loading...';
            }
            if (isLoading || !hasMorePosts) return;
            isLoading = true;
            const container = document.getElementById('status-container');
            const loader = document.getElementById('loading-indicator');
            try {
                const response = await fetch(`${API_URL}/posts?skip=${currentOffset}&limit=${postsLimit}`);
                if (!response.ok) throw new Error();
                const newPosts = await response.json();
                if (newPosts.length < postsLimit) { hasMorePosts = false; loader.style.display = 'none'; }
                currentOffset += newPosts.length;
                globalPosts = globalPosts.concat(newPosts);
                if (reset && globalPosts.length === 0) {
                    container.innerHTML = '<p class="loading-text">No posts yet.</p>';
                    loader.style.display = 'none';
                } else {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = newPosts.map(s => renderSinglePost(s)).join('');
                    while(tempDiv.firstChild) container.appendChild(tempDiv.firstChild);
                }
            } catch (error) {
                if (reset) container.innerHTML = `<p class="loading-text">Failed to load data.</p>`;
                loader.style.display = 'none';
            } finally {
                isLoading = false;
            }
        }

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) fetchStatuses();
        });

        function renderSinglePost(s) {
            const dateObj = new Date(s.at);
            const date = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
            const time = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            let editedHtml = '';
            if (s.updated_at) {
                const updateObj = new Date(s.updated_at);
                const updateDate = updateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
                const updateTime = updateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                editedHtml = `<div style="font-size: var(--size-small); color: var(--grey-30); margin: 0; line-height: 1;">EDITED: ${updateDate.toUpperCase()} • ${updateTime}</div>`;
            }
            const titleHtml = (s.title && s.title.trim() !== "") ? `<h3 class="status-title">${s.title}</h3>` : '';
            const imageHtml = s.image_url ? `<img src="${s.image_url}" class="status-image" alt="Post image" loading="lazy">` : '';
            let textHtml = (s.text && s.text.trim() !== "") ? `<div class="status-text">${linkify(s.text)}</div>` : '';
            let adminActionsHtml = '';
            if (secretKey) {
                adminActionsHtml = `
                <div style="display: flex; gap: var(--gap-item); align-items: center; margin: 0;">
                    <button onclick="startEdit(${s.id});" class="admin-action-btn admin-action-link">Edit</button>
                    <button id="feed-del-btn-${s.id}" onclick="handleDeleteFeed(${s.id})" class="admin-action-btn admin-action-link">Delete</button>
                </div>`;
            }
            return `
            <div class="status-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin: 0; gap: var(--gap-item);">
                    <span class="status-date">${date} • ${time}</span>
                    ${adminActionsHtml}
                </div>
                ${titleHtml}
                ${imageHtml}
                ${textHtml}
                ${editedHtml}
            </div>`;
        }

        function toggleAdvancedEditor(show) {
            const qWrapper = document.getElementById('quick-post-wrapper');
            const fWrapper = document.getElementById('full-editor-wrapper');
            const quickTextInput = document.getElementById('quick-text');
            const editorTextInput = document.getElementById('edit-text');

            if (show) {
                // If opening editor, copy text from quick post and clear it
                if(quickTextInput.value.trim() !== "" && !editingId) {
                    editorTextInput.value = quickTextInput.value;
                    quickTextInput.value = "";
                }
                qWrapper.style.display = 'none';
                fWrapper.style.display = 'flex';
            } else {
                editingId = null; currentImageUrl = null; removeImageFlag = false;
                document.getElementById('edit-title').value = "";
                editorTextInput.value = "";
                document.getElementById('edit-image').value = "";
                document.getElementById('current-image-container').style.display = 'none';
                document.getElementById('file-name-display').innerText = "(Optional)";
                document.getElementById('file-name-display').style.color = "var(--grey-30)";
                document.getElementById('clear-file-btn').style.display = "none";
                const publishBtn = document.getElementById('publish-btn');
                publishBtn.disabled = false; publishBtn.innerText = "PUBLISH";
                qWrapper.style.display = 'flex'; fWrapper.style.display = 'none';
                resetDeleteButton();
            }
        }

        function startEdit(id) {
            const post = globalPosts.find(p => p.id === id);
            if(!post) return;
            editingId = id; currentImageUrl = post.image_url || null; removeImageFlag = false; 
            document.getElementById('edit-title').value = post.title || "";
            document.getElementById('edit-text').value = post.text || "";
            document.getElementById('edit-image').value = ""; 
            document.getElementById('file-name-display').innerText = "(Optional)";
            document.getElementById('file-name-display').style.color = "var(--grey-30)";
            document.getElementById('clear-file-btn').style.display = "none";
            if (post.image_url) document.getElementById('current-image-container').style.display = 'flex';
            else document.getElementById('current-image-container').style.display = 'none';
            document.getElementById('publish-btn').innerText = "SAVE CHANGES";
            
            // Bypass the text transfer logic since we are explicitly editing an old post
            const qWrapper = document.getElementById('quick-post-wrapper');
            const fWrapper = document.getElementById('full-editor-wrapper');
            qWrapper.style.display = 'none';
            fWrapper.style.display = 'flex';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateFileName() {
            const input = document.getElementById('edit-image');
            const display = document.getElementById('file-name-display');
            const clearBtn = document.getElementById('clear-file-btn');
            if (input.files && input.files.length > 0) {
                display.innerText = input.files[0].name;
                display.style.color = "var(--black)";
                clearBtn.style.display = "block"; 
            } else {
                display.innerText = "(Optional)";
                display.style.color = "var(--grey-30)";
                clearBtn.style.display = "none";  
            }
        }

        function clearSelectedFile(e) {
            e.stopPropagation(); 
            document.getElementById('edit-image').value = ""; 
            updateFileName(); 
        }

        function flagImageForRemoval() {
            removeImageFlag = true;
            document.getElementById('current-image-container').style.display = 'none';
        }

        async function handlePublish(e) {
            e.preventDefault();
            const title = document.getElementById('edit-title').value.trim();
            const text = document.getElementById('edit-text').value.trim();
            const imageFile = document.getElementById('edit-image').files[0];
            const publishBtn = document.getElementById('publish-btn');
            const originalBtnText = publishBtn.innerText;
            let hasImage = !!imageFile || (currentImageUrl && !removeImageFlag);
            if (!text && !hasImage) {
                publishBtn.innerText = "Add text or image.";
                publishBtn.disabled = true;
                setTimeout(() => { publishBtn.innerText = originalBtnText; publishBtn.disabled = false; }, 2000);
                return;
            }
            publishBtn.disabled = true;
            let finalImageUrl = currentImageUrl;
            if (removeImageFlag && !imageFile) finalImageUrl = null; 
            if (imageFile) {
                publishBtn.innerText = "Compressing...";
                const compressedFile = await compressImage(imageFile);
                const formData = new FormData();
                formData.append("file", compressedFile);
                try {
                    publishBtn.innerText = "Uploading...";
                    const uploadRes = await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": secretKey }, body: formData });
                    if (uploadRes.status === 401) throw new Error("Unauthorized");
                    if (!uploadRes.ok) throw new Error("Upload failed");
                    const uploadData = await uploadRes.json();
                    finalImageUrl = uploadData.image_url;
                    publishBtn.innerText = "Saving...";
                } catch (err) {
                    if (err.message === "Unauthorized") return handleUnauthorized();
                    publishBtn.innerText = "Upload error!";
                    setTimeout(() => { publishBtn.innerText = originalBtnText; publishBtn.disabled = false; }, 2000);
                    return;
                }
            } else { publishBtn.innerText = "Saving..."; }
            const method = editingId ? "PUT" : "POST";
            const endpoint = editingId ? `${API_URL}/posts/${editingId}` : `${API_URL}/posts`;
            try {
                const res = await fetch(endpoint, {
                    method: method,
                    headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                    body: JSON.stringify({ title: title, text: text, image_url: finalImageUrl })
                });
                if (res.status === 401) return handleUnauthorized();
                if (!res.ok) throw new Error();
                publishBtn.innerText = editingId ? "Updated." : "Published.";
                await fetchStatuses(true); 
                setTimeout(() => { document.activeElement.blur(); toggleAdvancedEditor(false); }, 1500);
            } catch (err) {
                publishBtn.innerText = "Connection error!";
                setTimeout(() => { publishBtn.innerText = originalBtnText; publishBtn.disabled = false; }, 2000);
            }
        }

        async function handleQuickPost(e) {
            e.preventDefault();
            const inputField = document.getElementById('quick-text');
            const text = inputField.value.trim();
            const btn = document.getElementById('quick-btn');
            if(!text) return;
            btn.disabled = true; btn.innerHTML = "...";
            try {
                const res = await fetch(`${API_URL}/posts`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                    body: JSON.stringify({ title: "", text: text, image_url: null })
                });
                if (res.status === 401) return handleUnauthorized();
                if(!res.ok) throw new Error();
                inputField.value = ""; btn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><polyline points="9 18 15 12 9 6"></polyline></svg>';
                await fetchStatuses(true);
                setTimeout(() => { btn.disabled = false; document.activeElement.blur(); }, 1500);
            } catch(err) {
                btn.innerHTML = "!";
                setTimeout(() => { btn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><polyline points="9 18 15 12 9 6"></polyline></svg>'; btn.disabled = false; }, 1500);
            }
        }

        async function handleDeleteFeed(id) {
            const btn = document.getElementById(`feed-del-btn-${id}`);
            if (btn.dataset.confirm === "true") {
                clearTimeout(btn.timeoutId);
                btn.disabled = true; btn.innerText = "Deleting...";
                try {
                    const res = await fetch(`${API_URL}/posts/${id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } });
                    if (res.status === 401) return handleUnauthorized();
                    fetchStatuses(true); 
                } catch(e) {
                    alert("Error deleting post.");
                    btn.innerText = "Delete"; btn.disabled = false; btn.dataset.confirm = "false";
                }
            } else {
                btn.dataset.confirm = "true"; btn.innerText = "Confirm";
                btn.timeoutId = setTimeout(() => {
                    if (document.getElementById(`feed-del-btn-${id}`)) { 
                        btn.dataset.confirm = "false"; btn.innerText = "Delete"; 
                    }
                }, 3000);
            }
        }

        function resetDeleteButton() {
            const btn = document.getElementById('delete-all-btn');
            if(btn) {
                btn.dataset.state = "0"; 
                btn.innerText = "DELETE ALL POSTS"; 
                btn.disabled = false;
            }
        }

        function handleDeleteAllClick() {
            const btn = document.getElementById('delete-all-btn');
            const state = btn.dataset.state || "0";
            if (state === "0") {
                btn.dataset.state = "1"; btn.innerText = "CLICK TO CONFIRM";
                clearTimeout(deleteConfirmTimeout);
                deleteConfirmTimeout = setTimeout(() => resetDeleteButton(), 3000);
            } else if (state === "1") {
                clearTimeout(deleteConfirmTimeout);
                btn.dataset.state = "2"; countdownValue = 5;
                btn.innerText = `DELETING IN ${countdownValue}S (CANCEL)`;
                deleteCountdownInterval = setInterval(() => {
                    countdownValue--;
                    if (countdownValue > 0) btn.innerText = `DELETING IN ${countdownValue}S (CANCEL)`;
                    else {
                        clearInterval(deleteCountdownInterval);
                        btn.innerText = "DELETING EVERYTHING..."; btn.disabled = true;
                        executeDeleteAll();
                    }
                }, 1000);
            } else if (state === "2") {
                clearInterval(deleteCountdownInterval); resetDeleteButton();
            }
        }

        async function executeDeleteAll() {
            try {
                let deleting = true;
                while(deleting) {
                    const res = await fetch(`${API_URL}/posts?skip=0&limit=50`);
                    const posts = await res.json();
                    if (posts.length === 0) { deleting = false; break; }
                    for (const p of posts) {
                        await fetch(`${API_URL}/posts/${p.id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } });
                    }
                }
                fetchStatuses(true);
            } catch(e) {
                alert("An error occurred while deleting all posts.");
            } finally {
                resetDeleteButton(); closeMenu();
            }
        }

        fetchStatuses(true);
        checkSavedLogin(); 
        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => { 
            if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu(); 
        });
    </script>
</body>
</html>
