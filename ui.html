<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Animation</title>
    <style>
        /* 🎨 Základné nastavenie */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Pôvodné biele pozadie */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Počas animácie skryjeme scrollbar */
        }

        /* 📐 iPhone Obdĺžnik */
        .iphone-container {
            position: relative;
            background-color: #e0e0e0; /* Pôvodná svetlosivá */
            aspect-ratio: 1170 / 2532;
            width: 50vw;
            border-radius: 8vw;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            
            /* 🚀 Spustenie animácií: prílet a následné pohltenie */
            animation: 
                flyIn 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                expandAndBlacken 1s ease-in 2s forwards;
        }

        /* 🏎️ Fáza 1: Prílet zospodu */
        @keyframes flyIn {
            0% {
                transform: translateY(120vh) scale(0.8);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* 🌑 Fáza 2: Zväčšenie a zmena farby na čiernu */
        @keyframes expandAndBlacken {
            0% {
                width: 50vw;
                border-radius: 8vw;
                background-color: #e0e0e0;
            }
            100% {
                /* Roztiahnutie na celú obrazovku */
                width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                background-color: #000000; /* Zmena na čiernu */
                aspect-ratio: auto; /* Zrušenie pomeru strán pre fullscreen */
            }
        }
    </style>
</head>
<body>

    <div class="iphone-container"></div>

</body>
</html>
