<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Mockup - 1/2 Šírky</title>
    <style>
        /* 🎨 Vycentrovanie na stred */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            overflow: hidden; /* Zabráni skrolovaniu, ak je objekt príliš vysoký */
        }

        /* 📐 Geometria obdĺžnika */
        .iphone-container {
            width: 50vw; /* Presne 1/2 šírky displeja */
            max-height: 95vh; /* Poistka, aby nevyčnieval vertikálne z obrazovky */
            aspect-ratio: 1170 / 2532;
            background-color: #e0e0e0;
            
            /* 🌀 Zaoblenie rohov */
            /* Pre reálny vzhľad iPhonu používame 18% šírky objektu (cca 50-60px na reálnom zariadení) */
            border-radius: 8vw; 
            
            box-shadow: 0 15px 50px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        /* Prispôsobenie pre veľmi úzke okná */
        @media (max-aspect-ratio: 1170/2532) {
            .iphone-container {
                width: 40vw; /* O niečo menší na extrémne vysokých monitoroch */
            }
        }
    </style>
</head>
<body>

    <div class="iphone-container"></div>

</body>
</html>
