<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-header: 'Londrina Solid', cursive;
            --font-body: 'Inter', sans-serif;
            --size-large: 2.2rem;
            --size-small: 1rem;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            font-weight: 400;
            background-color: #ffffff; /* Čisto biele pozadie */
            color: #000000;
            line-height: 1.5;
        }

        /* 🧊 Fixný banner s vyššou transparentnosťou */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.5); /* Zvýšená priesvitnosť */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        h1.logo {
            font-family: var(--font-header);
            font-size: var(--size-large);
            font-weight: 900; /* Hrubšie, ale nie príliš */
            color: #000000;
            margin: 0;
            text-transform: lowercase; /* Umeleckejší štýl */
            letter-spacing: 0.5px;
        }

        main {
            padding: 120px 20px 50px;
            max-width: 900px;
            margin: 0 auto;
        }

        .content-text {
            font-size: var(--size-small);
            max-width: 600px;
        }

        .placeholder-box {
            height: 400px;
            background: #f0f0f0;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">martinvojtus.space</h1>
    </header>

    <main>
        <div class="content-text">
            Tento text reprezentuje základnú veľkosť písma. Je dostatočne veľký na to, aby bol dobre čitateľný na akomkoľvek zariadení, pričom zachováva čistotu bieleho pozadia.
        </div>
        
        <div class="placeholder-box">Miesto pre tvoje vizuálne diela</div>
        <div class="placeholder-box">Miesto pre tvoje vizuálne diela</div>
        <div class="placeholder-box">Miesto pre tvoje vizuálne diela</div>
    </main>

</body>
</html>
