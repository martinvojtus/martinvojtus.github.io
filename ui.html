<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Quicksand', sans-serif;
            --size-large: 2.5rem;   /* Veľký font pre nadpisy */
            --size-small: 0.9rem;   /* Mierne zvýšený malý font pre čitateľnosť */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            font-weight: 400; /* Vždy regular */
            background-color: #e0e0e0; /* Šedý podklad pre vyniknutie skla */
            color: #1a1a1a;
            line-height: 1.6;
        }

        /* 🧊 Pevný banner s efektom matného skla */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.7); /* Priesvitná biela */
            backdrop-filter: blur(15px);        /* Rozmazanie obsahu pod ním */
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo {
            font-size: var(--size-large);
            color: black;
            margin: 0;
            letter-spacing: -1px;
        }

        /* Testovací obsah pre scrollovanie */
        main {
            padding: 120px 20px 50px;
            max-width: 800px;
            margin: 0 auto;
        }

        p {
            font-size: var(--size-small);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: var(--size-large);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">martinvojtus.space 🚀</h1>
    </header>

    <main>
        <h2 class="section-title">Vitaj v portfóliu</h2>
        <p>Tento text slúži na ukážku toho, ako vyzerá menšie písmo na webe. Je nastavené tak, aby bolo dobre viditeľné a čitateľné.</p>
        
        <div style="height: 1500px; background: linear-gradient(to bottom, #e0e0e0, #a1a1a1);">
            <p>Scrolluj nižšie, aby si videl, ako sa tento obsah rozmazáva pod bannerom...</p>
        </div>
    </main>

</body>
</html>
