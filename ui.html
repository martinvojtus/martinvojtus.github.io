<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Mockup</title>
    <style>
        /* 🎨 Centrovanie a povolenie scrollovania */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Použitie min-height namiesto fixnej výšky umožní scrollovanie */
            min-height: 100vh; 
            background-color: #ffffff;
            /* Pridaný padding pre mobilné zobrazenie na šírku */
            padding: 40px 0;
            box-sizing: border-box;
        }

        /* 📐 Geometria objektu */
        .iphone-container {
            width: 50vw; /* 1/2 šírky displeja */
            aspect-ratio: 1170 / 2532;
            background-color: #e0e0e0;
            
            /* 🌀 Zaoblenie rohov (Aproximácia iPhone 14/16e) */
            border-radius: 8vw; 
            
            /* 🌑 Jemný tieň, aby vynikla sivá farba */
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        /* Responzivita pre veľmi úzke okná zostáva */
        @media (max-aspect-ratio: 1170/2532) {
            .iphone-container {
                width: 45vw;
            }
        }
    </style>
</head>
<body>

    <div class="iphone-container"></div>

</body>
</html>
