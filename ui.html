<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            --black: #000000;
            --white: #ffffff;
            --grey-50: rgba(0, 0, 0, 0.5);
            --divider: rgba(0, 0, 0, 0.1);
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            --border-radius: 1rem; 
            --gap-item: 1rem; 
            --letter-spacing: 0.05em;
            --glass-opacity: 0.5; 
            --glass-blur: 1rem;   
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-50: rgba(255, 255, 255, 0.5); 
                --divider: rgba(255, 255, 255, 0.1); 
                --glass-rgb: 0, 0, 0;   
            }
        }

        html { -webkit-text-size-adjust: 100%; }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-weight: 400; 
            font-family: 'Space Grotesk', sans-serif; 
            letter-spacing: var(--letter-spacing); 
            transition: none !important; 
            animation: none !important;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--white); color: var(--black);
            line-height: 1.5; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .submit-btn, .form-input, .admin-bar-item {
            line-height: 1;
        }

        header {
            position: fixed; top: 0; left: 0; width: 100%; 
            display: flex; justify-content: center; padding: var(--gap-item) 0; 
            background: rgba(var(--glass-rgb), var(--glass-opacity)); 
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            display: flex; justify-content: space-between; align-items: center; padding: 0 var(--gap-item); 
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { width: 1rem; height: 1rem; display: block; flex-shrink: 0; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); white-space: nowrap; margin: 0; pointer-events: none; }

        .menu-toggle { 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; z-index: 2100; position: relative;
            font-size: var(--size-small); font-weight: 400; user-select: none;
            line-height: 1; text-transform: uppercase;
        }

        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: auto;
            background: rgba(var(--glass-rgb), var(--glass-opacity)); 
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 1500; 
            padding: calc(3rem + var(--gap-item)) 0 var(--gap-item) 0; 
            display: none; flex-direction: column; align-items: center;
        }
        .nav-overlay.active { display: flex; }
        
        .menu-items { width: 100%; max-width: var(--content-width); display: flex; flex-direction: column; gap: var(--gap-item); padding: 0 var(--gap-item); }

        main {
            padding: calc(3rem + var(--gap-item)) var(--gap-item) var(--gap-item); 
            width: 100%; max-width: var(--content-width); 
            flex-grow: 1; display: block; 
        }

        #section-feed { display: block; }
        
        #login-ui { display: flex; flex-direction: column; gap: var(--gap-item); }
        #logout-ui { display: none; }
        #admin-upload-zone { display: none; flex-direction: column; gap: var(--gap-item); width: 100%; }

        .status-feed { max-width: 600px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: var(--gap-item); }
        .status-card { display: flex; flex-direction: column; position: relative; }

        .status-media-wrapper {
            position: relative;
            border-radius: var(--border-radius);
            overflow: hidden;
            transform: translateZ(0); 
            min-height: 3rem;
            background-color: var(--divider);
        }

        .status-glass-bar {
            height: 3rem; width: 100%;
            background: rgba(var(--glass-rgb), var(--glass-opacity)); 
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            position: absolute; top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 var(--gap-item);
        }

        .admin-bar-item { font-size: var(--size-small); color: var(--black); text-transform: uppercase; }
        .admin-delete-link { cursor: pointer; color: var(--black); text-decoration: none; }

        .status-image { width: 100%; height: auto; display: block; border-radius: var(--border-radius); cursor: pointer; }
        
        .loading-text { text-align: center; font-size: var(--size-small); color: var(--black); opacity: 0.5; padding: var(--gap-item) 0; }

        .form-input, .submit-btn { 
            height: 3rem; border: 1px solid var(--black); border-radius: var(--border-radius); 
            font-size: var(--size-small); padding: 0 var(--gap-item); 
            outline: none; display: flex; align-items: center; gap: var(--gap-item); 
        }

        .form-input { 
            background-color: transparent; 
            color: var(--black);
            box-shadow: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-input::placeholder { color: var(--black); opacity: 0.5; }

        .submit-btn { 
            background-color: var(--black); 
            color: var(--white);
            justify-content: center; text-transform: uppercase; cursor: pointer; white-space: nowrap;
        }

        .btn-outline {
            background-color: transparent; 
            color: var(--black);
        }

        .btn-ghost {
            background-color: transparent; 
            color: var(--grey-50); 
            border-color: var(--grey-50);
            pointer-events: none; 
        }

        .input-error { border: 1px solid var(--black) !important; opacity: 0.5; }
        .input-error span { color: var(--black) !important; }
        .input-error::placeholder { color: var(--black) !important; opacity: 1; }

        #upload-thumbnail { width: 3rem; height: 3rem; flex-shrink: 0; border-radius: var(--border-radius); object-fit: cover; cursor: pointer; background-color: var(--divider); }

        .custom-checkbox {
            appearance: none; width: 1rem; height: 1rem; border: 1px solid var(--black);
            border-radius: calc(var(--border-radius) / 3); cursor: pointer; display: grid; place-content: center;
        }
        .custom-checkbox::before { content: ""; width: 0.25rem; height: 0.5rem; border: solid var(--white); border-width: 0 1px 1px 0; transform: rotate(45deg); opacity: 0; margin-top: -0.125rem; }
        .custom-checkbox:checked { background-color: var(--black); }
        .custom-checkbox:checked::before { opacity: 1; }

        .footer-info { 
            font-size: var(--size-small); color: var(--grey-50); 
            text-transform: uppercase; text-align: center; width: 100%; 
        }

        #delete-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(var(--glass-rgb), var(--glass-opacity)); 
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 3000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }

        .modal-content {
            width: 100%; max-width: var(--content-width);
            display: flex; flex-direction: column; gap: var(--gap-item);
            padding: 0 var(--gap-item);
        }

        .status-confirm-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(var(--glass-rgb), var(--glass-opacity)); 
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 20;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            border-radius: var(--border-radius);
        }

        .action-row {
            display: flex; flex-direction: row; gap: var(--gap-item); justify-content: center;
            width: 100%; padding: 0 var(--gap-item);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="window.scrollTo(0,0)">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1rem" height="1rem" viewBox="72.35 270 935.31 810" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="var(--black)" /></g></svg>
                </div>
            </div>
            <div class="logo-text"><span>martinvojtus</span> • space</div>
            
            <div class="menu-toggle" id="menuToggle" onclick="toggleMenu()">MENU</div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            
            <div id="login-ui">
                <form id="login-form" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; width: 100%; gap: var(--gap-item); margin: 0;">
                    <input type="password" id="admin-pass" class="form-input" placeholder="Password..." style="width: 100%;">
                    <label class="form-input" style="cursor: pointer; justify-content: flex-start; user-select: none; width: 100%;">
                        <input type="checkbox" id="remember-login" class="custom-checkbox">
                        <span>Remember me</span>
                    </label>
                    <button type="submit" id="login-btn" class="submit-btn" style="width: 100%;">LOGIN</button>
                </form>
            </div>

            <div id="admin-upload-zone">
                <form id="editor-form" onsubmit="handleMainSubmit(event)" style="display: flex; flex-direction: column; width: 100%; gap: var(--gap-item); margin: 0;">
                    <input type="file" id="edit-image" accept="image/*" style="display: none;" onchange="updateImageUIState()">
                    
                    <div id="upload-empty-state" class="submit-btn btn-outline" style="width: 100%;" onclick="document.getElementById('edit-image').click()">
                        + ADD IMAGE
                    </div>

                    <div id="upload-filled-state" style="display: none; gap: var(--gap-item); width: 100%;">
                        <img id="upload-thumbnail" src="" alt="" onclick="document.getElementById('edit-image').click()">
                        <button type="submit" id="publish-btn" class="submit-btn" style="flex-grow: 1;">UPLOAD</button>
                        <div id="clear-upload-btn" class="submit-btn btn-outline" onclick="clearImageSelection(event)">DELETE</div>
                    </div>
                    
                    <button type="button" class="submit-btn" style="width: 100%;" onclick="handleDeleteAllClick()">DELETE ALL POSTS</button>
                </form>
            </div>

            <div id="logout-ui" style="display: none;">
                <button onclick="handleLogout()" class="submit-btn btn-outline" style="width: 100%;">LOGOUT</button>
            </div>
            
            <div class="footer-info">build v6.0.1 • 2026</div>
        </div>
    </nav>

    <main>
        <div id="section-feed">
            <div id="status-container" class="status-feed"></div>
            <div id="loading-indicator" class="loading-text">Loading...</div>
        </div>
    </main>

    <div id="delete-modal">
        <div id="modal-action-zone" class="action-row">
            <button id="modal-del-btn" class="submit-btn" onclick="executeModalDelete()">DELETE</button>
            <button id="modal-cancel-btn" class="submit-btn btn-outline" onclick="closeDeleteModal()">CANCEL</button>
        </div>
    </div>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        let secretKey = ""; let globalPosts = []; 
        let currentOffset = 0; const postsLimit = 10; let isLoading = false; let hasMorePosts = true;
        
        let deleteActionType = null;
        let deleteTargetId = null;

        const passInput = document.getElementById('admin-pass');
        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');

        if(passInput) {
            passInput.addEventListener('input', () => {
                passInput.classList.remove('input-error');
                passInput.placeholder = 'Password...';
            });
        }

        function toggleMenu() { 
            const isActive = menuToggle.classList.toggle('active'); 
            navOverlay.classList.toggle('active'); 
            menuToggle.innerText = isActive ? 'CLOSE' : 'MENU';
        }
        function closeMenu() { 
            menuToggle.classList.remove('active'); 
            navOverlay.classList.remove('active'); 
            menuToggle.innerText = 'MENU';
            resetEditor(); 
        }

        function updateUIVisibility() {
            if (secretKey) {
                document.body.classList.add('is-logged-in');
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('admin-upload-zone').style.display = 'flex';
                document.getElementById('logout-ui').style.display = 'block';
            } else {
                document.body.classList.remove('is-logged-in');
                document.getElementById('login-ui').style.display = 'flex';
                document.getElementById('admin-upload-zone').style.display = 'none';
                document.getElementById('logout-ui').style.display = 'none';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const loginBtn = document.getElementById('login-btn');
            loginBtn.innerText = 'LOGGING IN...';
            loginBtn.style.opacity = '0.5';
            loginBtn.disabled = true;

            const tempKey = passInput.value;
            const rememberMe = document.getElementById('remember-login').checked;
            try {
                const res = await fetch(`${API_URL}/verify`, { method: 'GET', headers: { 'x-admin-password': tempKey } });
                if (res.ok) { 
                    loginBtn.innerText = 'SUCCESS';
                    loginBtn.style.opacity = '1';
                    loginBtn.classList.add('btn-ghost');
                    
                    secretKey = tempKey; 
                    setTimeout(() => {
                        updateUIVisibility();
                        closeMenu(); 
                        refreshFeedUI(); 
                        passInput.value = ''; 
                        if (rememberMe) { localStorage.setItem('mv_admin_key', secretKey); } else { localStorage.removeItem('mv_admin_key'); }
                        
                        loginBtn.innerText = 'LOGIN';
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('btn-ghost');
                    }, 1000);
                } else { 
                    passInput.classList.add('input-error'); passInput.value = ''; passInput.placeholder = 'Invalid password!'; 
                    loginBtn.innerText = 'LOGIN'; loginBtn.style.opacity = '1'; loginBtn.disabled = false;
                }
            } catch (err) { 
                passInput.classList.add('input-error'); 
                loginBtn.innerText = 'LOGIN'; loginBtn.style.opacity = '1'; loginBtn.disabled = false;
            }
        }

        async function checkRememberedLogin() {
            const savedKey = localStorage.getItem('mv_admin_key');
            if (savedKey) {
                try {
                    const res = await fetch(`${API_URL}/verify`, { method: 'GET', headers: { 'x-admin-password': savedKey } });
                    if (res.ok) { 
                        secretKey = savedKey; 
                        updateUIVisibility();
                        refreshFeedUI(); 
                    } 
                    else { localStorage.removeItem('mv_admin_key'); updateUIVisibility(); }
                } catch (e) { updateUIVisibility(); }
            } else {
                updateUIVisibility();
            }
        }

        function handleLogout() {
            secretKey = ""; passInput.value = ''; 
            localStorage.removeItem('mv_admin_key');
            updateUIVisibility();
            closeMenu();
            refreshFeedUI();
        }

        function refreshFeedUI() { 
            if (globalPosts.length === 0) {
                if (!isLoading) {
                    document.getElementById('status-container').innerHTML = '<div class="loading-text">Nothing here yet.</div>';
                }
            } else {
                document.getElementById('status-container').innerHTML = globalPosts.map(s => renderSinglePost(s)).join(''); 
            }
        }

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const newName = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
                        canvas.toBlob(blob => { 
                            resolve(new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() })); 
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function fetchStatuses(reset = false) {
            if (reset) { currentOffset = 0; hasMorePosts = true; globalPosts = []; document.getElementById('status-container').innerHTML = ''; }
            if (isLoading || !hasMorePosts) return;
            isLoading = true;
            try {
                const response = await fetch(`${API_URL}/posts?skip=${currentOffset}&limit=${postsLimit}`);
                const newPosts = await response.json();
                if (newPosts.length < postsLimit) hasMorePosts = false;
                currentOffset += newPosts.length; globalPosts = globalPosts.concat(newPosts);
                
                if (globalPosts.length === 0) {
                    document.getElementById('status-container').innerHTML = '<div class="loading-text">Nothing here yet.</div>';
                } else if (reset) {
                    document.getElementById('status-container').innerHTML = globalPosts.map(s => renderSinglePost(s)).join('');
                } else {
                    document.getElementById('status-container').innerHTML += newPosts.map(s => renderSinglePost(s)).join('');
                }
            } catch (error) {} finally { 
                isLoading = false; 
                document.getElementById('loading-indicator').style.display = (hasMorePosts && globalPosts.length > 0) ? 'block' : 'none'; 
            }
        }

        window.addEventListener('scroll', () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) fetchStatuses(); });

        // 🛠️ ÚPRAVA: Nová funkcia na schovanie skla po kliknutí a jeho auto-návrat po 5s
        function toggleGlassBar(img) {
            const bar = img.parentElement.querySelector('.status-glass-bar');
            if (bar) {
                if (bar.style.display === 'none') {
                    // Manuálny návrat (užívateľ klikol skôr ako vypršal čas)
                    bar.style.display = 'flex';
                    clearTimeout(img.glassTimer);
                } else {
                    // Skrytie
                    bar.style.display = 'none';
                    clearTimeout(img.glassTimer); // Vyčistenie starého časovača pre istotu
                    
                    // Automatický návrat po 5 sekundách
                    img.glassTimer = setTimeout(() => {
                        bar.style.display = 'flex';
                    }, 5000);
                }
            }
        }

        function renderSinglePost(s) {
            const formattedDate = new Date(s.at).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
            
            let barHtml = `
            <div class="status-glass-bar">
                ${secretKey ? `<span class="admin-bar-item" style="opacity: 0.5;">#${s.id}</span>` : '<div></div>'}
                <span class="admin-bar-item" style="position: absolute; left: 50%; transform: translateX(-50%); opacity: 0.5;">${formattedDate}</span>
                ${secretKey ? `<span onclick="handleDeleteFeed(${s.id})" class="admin-bar-item admin-delete-link">DELETE</span>` : '<div></div>'}
            </div>`;

            // Onclick napojený priamo na fotku
            const imageHtml = s.image_url ? `<img src="${s.image_url}" class="status-image" alt="image" loading="lazy" onclick="toggleGlassBar(this)">` : '';
            
            let mediaHtml = '';
            if (imageHtml) {
                mediaHtml = `
                <div class="status-media-wrapper">
                    ${barHtml}${imageHtml}
                    ${secretKey ? `
                    <div id="confirm-overlay-${s.id}" class="status-confirm-overlay">
                        <div id="confirm-actions-${s.id}" class="action-row">
                            <button id="feed-del-btn-${s.id}" class="submit-btn" onclick="executeFeedDelete(${s.id})">DELETE</button>
                            <button id="feed-cancel-btn-${s.id}" class="submit-btn btn-outline" onclick="closeFeedDelete(${s.id})">CANCEL</button>
                        </div>
                    </div>
                    ` : ''}
                </div>`;
            }

            return `<div class="status-card">${mediaHtml}</div>`;
        }

        function resetEditor() {
            document.getElementById('edit-image').value = ""; 
            updateImageUIState(); 
            const pubBtn = document.getElementById('publish-btn');
            pubBtn.innerText = 'UPLOAD';
            pubBtn.classList.remove('btn-ghost');
            pubBtn.disabled = false;
            pubBtn.style.opacity = '1';
            
            const clearBtn = document.getElementById('clear-upload-btn');
            if (clearBtn) clearBtn.style.display = 'flex';
        }

        function updateImageUIState() {
            const input = document.getElementById('edit-image');
            const emptyState = document.getElementById('upload-empty-state');
            const filledState = document.getElementById('upload-filled-state');
            const thumbnail = document.getElementById('upload-thumbnail');

            if (input.files.length > 0) {
                thumbnail.src = URL.createObjectURL(input.files[0]);
                emptyState.style.display = 'none';
                filledState.style.display = 'flex';
            } else { 
                thumbnail.src = "";
                emptyState.style.display = 'flex';
                filledState.style.display = 'none';
            }
        }

        function handleDeleteFeed(id) {
            const card = document.getElementById(`confirm-overlay-${id}`).closest('.status-card');
            card.querySelector('.status-glass-bar').style.display = 'none';
            document.getElementById(`confirm-overlay-${id}`).style.display = 'flex';
            
            const delBtn = document.getElementById(`feed-del-btn-${id}`);
            const cancelBtn = document.getElementById(`feed-cancel-btn-${id}`);
            delBtn.innerText = 'DELETE';
            delBtn.style.opacity = '1';
            delBtn.disabled = false;
            delBtn.classList.remove('btn-ghost');
            cancelBtn.style.display = 'flex';
        }

        function closeFeedDelete(id) {
            document.getElementById(`confirm-overlay-${id}`).style.display = 'none';
            const card = document.getElementById(`confirm-overlay-${id}`).closest('.status-card');
            card.querySelector('.status-glass-bar').style.display = 'flex';
        }

        async function executeFeedDelete(id) {
            const delBtn = document.getElementById(`feed-del-btn-${id}`);
            const cancelBtn = document.getElementById(`feed-cancel-btn-${id}`);
            
            delBtn.innerText = 'DELETING...';
            delBtn.style.opacity = '0.5';
            delBtn.disabled = true;
            cancelBtn.style.display = 'none'; 
            
            await fetch(`${API_URL}/posts/${id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } });
            
            delBtn.style.opacity = '1';
            delBtn.classList.add('btn-ghost');
            delBtn.innerText = 'DELETED';
            
            setTimeout(() => {
                fetchStatuses(true);
            }, 1000);
        }

        function openDeleteModal(type) {
            deleteActionType = type;
            document.getElementById('delete-modal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').style.display = 'none';
            deleteActionType = null;
            
            const delBtn = document.getElementById('modal-del-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            delBtn.innerText = 'DELETE';
            delBtn.style.opacity = '1';
            delBtn.disabled = false;
            delBtn.classList.remove('btn-ghost');
            cancelBtn.style.display = 'flex';
        }

        async function executeModalDelete() {
            const delBtn = document.getElementById('modal-del-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            if (deleteActionType === 'clear_upload') {
                document.getElementById('edit-image').value = ""; 
                updateImageUIState(); 
                
                delBtn.classList.add('btn-ghost');
                delBtn.innerText = 'DELETED';
                cancelBtn.style.display = 'none';
                
                setTimeout(() => { closeDeleteModal(); }, 1000);
            } 
            else if (deleteActionType === 'delete_all') {
                delBtn.innerText = 'DELETING...';
                delBtn.style.opacity = '0.5';
                delBtn.disabled = true;
                cancelBtn.style.display = 'none';

                const res = await fetch(`${API_URL}/posts?skip=0&limit=100`);
                const posts = await res.json();
                for (const p of posts) { 
                    await fetch(`${API_URL}/posts/${p.id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } }); 
                }
                
                delBtn.style.opacity = '1';
                delBtn.classList.add('btn-ghost');
                delBtn.innerText = 'DELETED';
                
                setTimeout(() => {
                    fetchStatuses(true);
                    closeDeleteModal();
                    closeMenu();
                }, 1000);
            }
        }

        function clearImageSelection(e) {
            e.stopPropagation();
            openDeleteModal('clear_upload');
        }

        function handleDeleteAllClick() {
            openDeleteModal('delete_all');
        }

        async function handleMainSubmit(e) { 
            e.preventDefault(); 
            const imageFile = document.getElementById('edit-image').files[0];
            if (!imageFile) { return; }
            
            const publishBtn = document.getElementById('publish-btn'); 
            const clearBtn = document.getElementById('clear-upload-btn');
            
            publishBtn.disabled = true; 
            publishBtn.style.opacity = '0.5';
            publishBtn.innerText = 'UPLOADING...';
            if (clearBtn) clearBtn.style.display = 'none'; 
            
            try {
                let finalImageUrl = null;
                const compressedFile = await compressImage(imageFile);
                const formData = new FormData(); formData.append("file", compressedFile);
                
                const upRes = await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": secretKey }, body: formData });
                if (!upRes.ok) throw new Error("Upload failed");
                const upData = await upRes.json();
                finalImageUrl = upData.image_url;

                const res = await fetch(`${API_URL}/posts`, {
                    method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                    body: JSON.stringify({ title: "", text: "", image_url: finalImageUrl, show_date: true, author: "" })
                });
                
                if (res.ok) { 
                    fetchStatuses(true); 
                    publishBtn.style.opacity = '1';
                    publishBtn.classList.add('btn-ghost');
                    publishBtn.innerText = 'UPLOADED'; 
                    setTimeout(() => { resetEditor(); closeMenu(); }, 1000);
                } else { 
                    publishBtn.innerText = 'UPLOAD';
                    publishBtn.disabled = false; publishBtn.style.opacity = '1'; 
                    if (clearBtn) clearBtn.style.display = 'flex';
                }
            } catch (err) {
                console.error(err);
                publishBtn.innerText = 'UPLOAD';
                publishBtn.disabled = false; publishBtn.style.opacity = '1'; 
                if (clearBtn) clearBtn.style.display = 'flex';
            }
        }

        checkRememberedLogin();
        fetchStatuses(true);
        document.addEventListener('click', (e) => { if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu(); });
    </script>
</body>
</html>
