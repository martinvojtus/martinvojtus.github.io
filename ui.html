<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            
            --black: #000000;
            --white: #ffffff;
            --grey-50: rgba(0, 0, 0, 0.5);
            --divider: rgba(0, 0, 0, 0.12);
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            
            --border-radius: 12px; 
            --gap-item: 24px; 
            --input-padding: 16px; 

            --glass-opacity: 0.6; 
            --glass-blur: 25px;   
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-50: rgba(255, 255, 255, 0.5); 
                --divider: rgba(255, 255, 255, 0.12); 
                --glass-rgb: 0, 0, 0;   
            }
        }

        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 400;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.5;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        header {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 50px;
            display: flex; justify-content: center;
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            height: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; 
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { height: 24px; width: auto; display: block; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); letter-spacing: 0.05em; white-space: nowrap; }
        .logo-text span { font-weight: 700; }

        .menu-toggle { width: 24px; height: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; z-index: 2100; }
        .line { width: 24px; height: 1px; background-color: var(--black); transition: transform 0.3s ease, background-color 0.3s ease; }
        .menu-toggle.active .line:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(-5.5px) rotate(-45deg); }

        .nav-overlay {
            position: fixed; top: -100%; left: 0; width: 100%; 
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            transition: top 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1500; padding: 80px 0 40px 0; display: flex; flex-direction: column; align-items: center;
        }
        .nav-overlay.active { top: 0; }
        
        .menu-items { 
            width: 100%; 
            max-width: var(--content-width); 
            display: flex; flex-direction: column; gap: var(--gap-item); padding: 0 20px; 
        }
        
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; letter-spacing: 0.02em; }

        main {
            padding: 70px 20px 0px; 
            width: 100%; max-width: var(--content-width); 
            flex-grow: 1;
        }

        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- STATUS FEED --- */
        .status-feed {
            max-width: 600px;
            margin: 0 auto; 
            padding: 0 0 var(--gap-item) 0; 
        }

        .status-card {
            background: transparent; 
            border: none;
            border-bottom: 1px solid var(--divider); 
            border-radius: 0; 
            padding: var(--gap-item) 0; 
            margin-bottom: 0; 
        }

        .status-card:first-child { padding-top: 0; }
        .status-card:last-child { border-bottom: none; }

        .status-date {
            font-size: var(--size-small); 
            color: var(--grey-50);
            margin-bottom: 12px; 
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-title {
            font-size: var(--size-large); 
            font-weight: 700;
            margin: 0 0 16px 0; 
            color: var(--black);
            line-height: 1.1;
        }

        .status-image {
            width: 100%;
            height: auto; 
            border-radius: var(--border-radius);
            display: block;
            margin: 0 0 16px 0;
            border: none;
        }

        .status-text {
            font-size: var(--size-small); 
            line-height: 1.5;
            color: var(--black);
            opacity: 0.8;
            white-space: pre-line; 
            text-align: justify;
            margin-bottom: 0;
            word-wrap: break-word;
        }

        .loading-text {
            text-align: center;
            font-size: var(--size-small);
            color: var(--grey-50);
            padding-top: 10px;
            margin-bottom: 30px;
        }

        /* --- FORMULÁRE --- */
        .contact-form { margin-top: 0; max-width: 540px; width: 100%; }
        .form-group { margin-bottom: var(--gap-item); }
        
        .form-input, .form-textarea, .submit-btn { 
            width: 100%; 
            border: 1px solid var(--black); 
            border-radius: var(--border-radius); 
            background: transparent; 
            font-family: inherit; 
            font-size: var(--size-small); 
            padding: var(--input-padding); 
            outline: none; 
            color: var(--black);
            box-sizing: border-box;
            display: block;
            transition: all 0.3s ease; 
        }
        
        ::placeholder { color: var(--grey-50); opacity: 1; }
        .form-textarea { min-height: 120px; resize: vertical; }

        .submit-btn {
            background: var(--black); 
            color: var(--white); 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.1em; 
            cursor: pointer;
        }
        
        .secondary-btn {
            background: transparent; 
            color: var(--black); 
        }

        .admin-action-btn {
            background: transparent; border: none; font-family: inherit; 
            font-size: var(--size-small);
            color: var(--black); cursor: pointer; padding: 0; margin-right: 15px;
        }
        
        .admin-action-link {
            text-decoration: underline;
        }

        .admin-card {
            border: 1px solid var(--black);
            border-radius: var(--border-radius);
            padding: var(--input-padding); 
            margin-bottom: var(--gap-item);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-tabs {
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
            border-bottom: 1px solid var(--divider); 
            padding-bottom: 16px; 
            margin-bottom: var(--gap-item);
        }

        footer {
            width: 100%; max-width: var(--content-width); padding: 40px 20px 30px; 
            display: flex; flex-direction: column; align-items: center;
        }
        .footer-info { font-size: var(--size-small); color: var(--grey-50); text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="showSection('feed')">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="935.31" height="810" viewBox="72.35 270 935.31 810"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="var(--black)" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle"><div class="line"></div><div class="line"></div></div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <a class="menu-link" onclick="showSection('feed')"><span>Feed</span></a>
            <a class="menu-link" onclick="showSection('contact')"><span>Contact</span></a>
            <a class="menu-link" onclick="showSection('admin')"><span>Admin</span></a>
        </div>
    </nav>

    <main>
        <div id="section-feed" class="content-section active">
            <div id="status-container" class="status-feed">
                </div>
            <div id="loading-indicator" class="loading-text">Loading thoughts...</div>
        </div>

        <div id="section-contact" class="content-section">
            <h2 style="font-size: var(--size-large); margin: 0 0 var(--gap-item) 0;">Contact.</h2>
            <form class="contact-form" action="https://formsubmit.co/martinvojtus@icloud.com" method="POST">
                <input type="hidden" name="_captcha" value="false">
                <div class="form-group"><input type="text" name="name" class="form-input" placeholder="Name" required></div>
                <div class="form-group"><input type="email" name="email" class="form-input" placeholder="Email" required></div>
                <div class="form-group"><textarea name="message" class="form-textarea" placeholder="Message" required></textarea></div>
                <button type="submit" class="submit-btn">Send message</button>
            </form>
        </div>

        <div id="section-admin" class="content-section">
            <h2 style="font-size: var(--size-large); margin: 0 0 var(--gap-item) 0;">Admin.</h2>
            
            <div id="admin-login-view">
                <form id="login-form" class="contact-form" onsubmit="handleLogin(event)">
                    <div class="form-group"><input type="password" id="admin-pass" class="form-input" placeholder="Password" required></div>
                    <p id="login-error" style="color: red; font-size: var(--size-small); display: none; margin-top: -10px; margin-bottom: 15px;">Invalid password.</p>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
            </div>

            <div id="admin-dashboard-view" style="display: none;">
                <div class="admin-tabs">
                    <div style="display: flex; gap: 20px;">
                        <button id="tab-editor" onclick="switchAdminTab('editor')" class="admin-action-btn" style="font-weight: 700; color: var(--black); margin: 0;">Editor.</button>
                        <button id="tab-manage" onclick="switchAdminTab('manage')" class="admin-action-btn" style="color: var(--grey-50); margin: 0;">Manage.</button>
                    </div>
                    <button onclick="handleLogout()" class="admin-action-btn admin-action-link" style="margin: 0;">Logout</button>
                </div>

                <div id="admin-editor-view">
                    <form id="editor-form" class="contact-form" onsubmit="handlePublish(event)">
                        <div class="form-group"><input type="text" id="edit-title" class="form-input" placeholder="Title (Optional)"></div>
                        
                        <div id="current-image-container" style="display: none; margin-bottom: var(--gap-item); font-size: var(--size-small); align-items: center;">
                            <span style="color: var(--grey-50);">Attached image </span>
                            <button type="button" class="admin-action-btn admin-action-link" style="color: red; margin-left: 15px;" onclick="flagImageForRemoval()">Remove</button>
                        </div>

                        <div class="form-group">
                            <input type="file" id="edit-image" accept="image/*" style="display: none;" onchange="updateFileName()">
                            <div class="form-input" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; overflow: hidden;" onclick="document.getElementById('edit-image').click()">
                                <div style="display: flex; align-items: center; overflow: hidden;">
                                    <span class="admin-action-btn admin-action-link" style="margin: 0 15px 0 0; pointer-events: none;">Image</span>
                                    <span id="file-name-display" style="color: var(--grey-50); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--size-small);">(Optional)</span>
                                </div>
                                <button type="button" id="clear-file-btn" class="admin-action-btn admin-action-link" style="color: red; margin: 0; display: none; padding: 0;" onclick="clearSelectedFile(event)">Remove</button>
                            </div>
                        </div>

                        <div class="form-group"><textarea id="edit-text" class="form-textarea" placeholder="Content (Optional if image attached)"></textarea></div>
                        
                        <p id="admin-msg" style="font-size: var(--size-small); margin: 0 0 10px 0;"></p>
                        
                        <div class="form-group"><button type="submit" id="publish-btn" class="submit-btn">Publish</button></div>
                        <div class="form-group" id="cancel-btn-container" style="display: none;"><button type="button" id="cancel-btn" class="submit-btn secondary-btn" onclick="cancelEdit()">Cancel Edit</button></div>
                    </form>
                </div>

                <div id="admin-manage-view" style="display: none;">
                    
                    <div class="form-group" style="margin-bottom: 30px;">
                        <button type="button" id="delete-all-btn" data-state="0" class="submit-btn" style="background: #ff3b30; border-color: #ff3b30; color: #000000;" onclick="handleDeleteAllClick()">Delete All Posts</button>
                    </div>
                    
                    <div id="admin-posts-container" class="status-feed" style="padding: 0;"></div>
                    
                    <div id="admin-pagination-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; display: none;">
                        <button id="admin-prev-btn" onclick="changeAdminPage(-1)" class="admin-action-btn admin-action-link" style="margin: 0;">Prev</button>
                        <span id="admin-page-info" style="font-size: var(--size-small); color: var(--grey-50);"></span>
                        <button id="admin-next-btn" onclick="changeAdminPage(1)" class="admin-action-btn admin-action-link" style="margin: 0;">Next</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer>
        <div class="footer-info">build v2.7.2 • martin vojtus • 2026</div>
    </footer>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        let secretKey = ""; 
        let editingId = null;
        let globalPosts = [];
        let currentImageUrl = null; 
        let removeImageFlag = false; 

        let currentOffset = 0;
        const postsLimit = 10;
        let isLoading = false;
        let hasMorePosts = true;

        let adminCurrentPage = 1;
        const adminPostsPerPage = 10;
        let currentAdminPosts = [];
        
        // ⏱️ ZMENA: Premenné pre logiku odpočítavania
        let deleteConfirmTimeout;
        let deleteCountdownInterval;
        let countdownValue = 5;

        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');
        
        function toggleMenu() { menuToggle.classList.toggle('active'); navOverlay.classList.toggle('active'); }
        function closeMenu() { menuToggle.classList.remove('active'); navOverlay.classList.remove('active'); }
        
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + sectionId).classList.add('active');
            closeMenu(); 
            window.scrollTo(0, 0);
            if(sectionId === 'feed') {
                window.scrollTo(0, 0);
            }
        }

        function switchAdminTab(tab) {
            if (tab === 'editor') {
                document.getElementById('admin-editor-view').style.display = 'block';
                document.getElementById('admin-manage-view').style.display = 'none';
                document.getElementById('tab-editor').style.fontWeight = '700';
                document.getElementById('tab-editor').style.color = 'var(--black)';
                document.getElementById('tab-manage').style.fontWeight = '400';
                document.getElementById('tab-manage').style.color = 'var(--grey-50)';
            } else {
                document.getElementById('admin-editor-view').style.display = 'none';
                document.getElementById('admin-manage-view').style.display = 'block';
                document.getElementById('tab-manage').style.fontWeight = '700';
                document.getElementById('tab-manage').style.color = 'var(--black)';
                document.getElementById('tab-editor').style.fontWeight = '400';
                document.getElementById('tab-editor').style.color = 'var(--grey-50)';
                fetchAdminPosts(1); 
            }
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" style="color: inherit; text-decoration: underline;">' + url + '</a>';
            });
        }

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob(blob => {
                            resolve(new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function fetchStatuses(reset = false) {
            if (reset) {
                currentOffset = 0;
                hasMorePosts = true;
                globalPosts = [];
                document.getElementById('status-container').innerHTML = '';
                document.getElementById('loading-indicator').style.display = 'block';
            }

            if (isLoading || !hasMorePosts) return;
            isLoading = true;

            const container = document.getElementById('status-container');
            const loader = document.getElementById('loading-indicator');

            try {
                const response = await fetch(`${API_URL}/posts?skip=${currentOffset}&limit=${postsLimit}`);
                if (!response.ok) throw new Error();
                const newPosts = await response.json();
                
                if (newPosts.length < postsLimit) {
                    hasMorePosts = false;
                    loader.style.display = 'none';
                }

                currentOffset += newPosts.length;
                globalPosts = globalPosts.concat(newPosts);
                
                if (reset && globalPosts.length === 0) {
                    container.innerHTML = '<p class="loading-text">No posts yet.</p>';
                    loader.style.display = 'none';
                } else {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = newPosts.map(s => renderSinglePost(s)).join('');
                    while(tempDiv.firstChild) {
                        container.appendChild(tempDiv.firstChild);
                    }
                }
                
            } catch (error) {
                if (reset) container.innerHTML = `<p style="color:red; text-align:center;">Failed to load data.</p>`;
                loader.style.display = 'none';
            } finally {
                isLoading = false;
            }
        }

        window.addEventListener('scroll', () => {
            if (document.getElementById('section-feed').classList.contains('active')) {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    fetchStatuses();
                }
            }
        });

        function renderSinglePost(s) {
            const dateObj = new Date(s.at);
            const date = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
            const time = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            
            let editedHtml = '';
            if (s.updated_at) {
                const updateObj = new Date(s.updated_at);
                const updateDate = updateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                const updateTime = updateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                editedHtml = `<div style="font-size: var(--size-small); color: var(--grey-50); margin-top: 12px;">(Edited: ${updateDate} • ${updateTime})</div>`;
            }

            const titleHtml = (s.title && s.title.trim() !== "") ? `<h3 class="status-title">${s.title}</h3>` : '';
            const imageHtml = s.image_url ? `<img src="${s.image_url}" class="status-image" alt="Post image" loading="lazy">` : '';
            const textHtml = (s.text && s.text.trim() !== "") ? `<div class="status-text">${linkify(s.text)}</div>` : '';

            return `
            <div class="status-card">
                <span class="status-date">${date} • ${time}</span>
                ${titleHtml}
                ${imageHtml}
                ${textHtml}
                ${editedHtml}
            </div>`;
        }

        function handleLogin(e) {
            e.preventDefault();
            secretKey = document.getElementById('admin-pass').value;
            document.getElementById('admin-login-view').style.display = 'none';
            document.getElementById('admin-dashboard-view').style.display = 'block';
            document.getElementById('login-error').style.display = 'none';
            switchAdminTab('editor'); 
        }

        function handleLogout() {
            secretKey = "";
            editingId = null;
            document.getElementById('admin-pass').value = '';
            document.getElementById('admin-dashboard-view').style.display = 'none';
            document.getElementById('admin-login-view').style.display = 'block';
            cancelEdit();
            resetDeleteButton(); // Reset tlačidla pri odhlásení
        }

        function flagImageForRemoval() {
            removeImageFlag = true;
            currentImageUrl = null;
            document.getElementById('current-image-container').style.display = 'none';
        }

        function updateFileName() {
            const input = document.getElementById('edit-image');
            const display = document.getElementById('file-name-display');
            const clearBtn = document.getElementById('clear-file-btn');
            
            if (input.files && input.files.length > 0) {
                display.innerText = input.files[0].name;
                display.style.color = "var(--black)";
                clearBtn.style.display = "block"; 
            } else {
                display.innerText = "(Optional)";
                display.style.color = "var(--grey-50)";
                clearBtn.style.display = "none";  
            }
        }

        function clearSelectedFile(e) {
            e.stopPropagation(); 
            const input = document.getElementById('edit-image');
            input.value = ""; 
            updateFileName(); 
        }

        async function handlePublish(e) {
            e.preventDefault();
            const title = document.getElementById('edit-title').value.trim();
            const text = document.getElementById('edit-text').value.trim();
            const imageFile = document.getElementById('edit-image').files[0];
            const msgBox = document.getElementById('admin-msg');
            
            let hasImage = !!imageFile || (currentImageUrl && !removeImageFlag);
            if (!text && !hasImage) {
                msgBox.style.color = "red";
                msgBox.innerText = "Post must contain at least text or an image.";
                return;
            }

            msgBox.style.color = "var(--black)";
            let finalImageUrl = currentImageUrl;

            if (removeImageFlag && !imageFile) {
                finalImageUrl = null; 
            }

            if (imageFile) {
                msgBox.innerText = "Compressing image...";
                const compressedFile = await compressImage(imageFile);
                
                const formData = new FormData();
                formData.append("file", compressedFile);

                try {
                    msgBox.innerText = "Uploading image...";
                    const uploadRes = await fetch(`${API_URL}/upload-image`, {
                        method: "POST",
                        headers: { "x-admin-password": secretKey },
                        body: formData
                    });

                    if (uploadRes.status === 401) throw new Error("Unauthorized");
                    if (!uploadRes.ok) throw new Error("Upload failed");

                    const uploadData = await uploadRes.json();
                    finalImageUrl = uploadData.image_url;
                    msgBox.innerText = "Saving post...";
                } catch (err) {
                    if (err.message === "Unauthorized") {
                        handleLogout();
                        document.getElementById('login-error').style.display = 'block';
                    } else {
                        msgBox.style.color = "red";
                        msgBox.innerText = "Error uploading image.";
                    }
                    return;
                }
            } else {
                msgBox.innerText = "Saving post...";
            }

            const method = editingId ? "PUT" : "POST";
            const endpoint = editingId ? `${API_URL}/posts/${editingId}` : `${API_URL}/posts`;

            try {
                const res = await fetch(endpoint, {
                    method: method,
                    headers: { 
                        "Content-Type": "application/json",
                        "x-admin-password": secretKey 
                    },
                    body: JSON.stringify({ title: title, text: text, image_url: finalImageUrl })
                });

                if (res.status === 401) {
                    msgBox.style.color = "red";
                    msgBox.innerText = "Unauthorized. Wrong password.";
                    handleLogout();
                    document.getElementById('login-error').style.display = 'block';
                    return;
                }

                if (!res.ok) throw new Error();

                msgBox.style.color = "green";
                msgBox.innerText = editingId ? "Updated." : "Published.";
                setTimeout(() => { msgBox.innerText = ""; }, 3000);
                
                cancelEdit();
                fetchStatuses(true); 

            } catch (err) {
                msgBox.style.color = "red";
                msgBox.innerText = "Connection error.";
            }
        }

        async function fetchAdminPosts(page) {
            adminCurrentPage = page;
            const skip = (page - 1) * adminPostsPerPage;
            const container = document.getElementById('admin-posts-container');
            const paginationControls = document.getElementById('admin-pagination-controls');
            
            container.innerHTML = '<p class="loading-text">Loading...</p>';
            paginationControls.style.display = 'none';
            
            try {
                const res = await fetch(`${API_URL}/posts?skip=${skip}&limit=${adminPostsPerPage}`);
                if (res.status === 401) {
                    handleLogout();
                    return;
                }
                currentAdminPosts = await res.json();
                renderAdminList();
            } catch (e) {
                container.innerHTML = '<p class="loading-text" style="color:red;">Error loading posts.</p>';
            }
        }

        function changeAdminPage(dir) {
            fetchAdminPosts(adminCurrentPage + dir);
        }

        function renderAdminList() {
            const container = document.getElementById('admin-posts-container');
            const paginationControls = document.getElementById('admin-pagination-controls');
            
            if (currentAdminPosts.length === 0 && adminCurrentPage === 1) {
                container.innerHTML = '<p class="loading-text">No posts found.</p>';
                paginationControls.style.display = 'none';
                return;
            }

            if (currentAdminPosts.length === 0 && adminCurrentPage > 1) {
                fetchAdminPosts(adminCurrentPage - 1);
                return;
            }

            container.innerHTML = currentAdminPosts.map(p => {
                let displayTitle = p.title;
                if (!displayTitle || displayTitle.trim() === "") {
                    displayTitle = p.text ? p.text.substring(0, 30) + (p.text.length > 30 ? '...' : '') : 'Photo post';
                }

                const thumbHtml = p.image_url 
                    ? `<img src="${p.image_url}" style="width: 24px; height: 24px; object-fit: cover; border-radius: 4px; flex-shrink: 0;" alt="thumb" loading="lazy">` 
                    : '';

                const d = new Date(p.at);
                const postDate = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;

                return `
                <div class="admin-card">
                    <div style="display: flex; align-items: center; gap: 10px; overflow: hidden; flex-grow: 1;">
                        <span style="color: var(--grey-50); font-size: var(--size-small); white-space: nowrap; flex-shrink: 0;">ID: ${p.id}</span>
                        <span style="color: var(--grey-50); font-size: var(--size-small); white-space: nowrap; flex-shrink: 0;">• ${postDate}</span>
                        ${thumbHtml}
                        <span style="font-weight: 700; font-size: var(--size-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${displayTitle}</span>
                    </div>
                    <div style="display: flex; gap: 15px; flex-shrink: 0; margin-left: 10px;">
                        <button onclick="startEdit(${p.id})" class="admin-action-btn admin-action-link" style="margin: 0;">Edit</button>
                        <button onclick="deletePost(${p.id})" class="admin-action-btn admin-action-link" style="color: red; margin: 0;">Delete</button>
                    </div>
                </div>
                `;
            }).join('');

            document.getElementById('admin-page-info').innerText = `Page ${adminCurrentPage}`;
            document.getElementById('admin-prev-btn').style.visibility = adminCurrentPage > 1 ? 'visible' : 'hidden';
            document.getElementById('admin-next-btn').style.visibility = currentAdminPosts.length === adminPostsPerPage ? 'visible' : 'hidden';
            paginationControls.style.display = 'flex';
        }

        function startEdit(id) {
            const post = currentAdminPosts.find(p => p.id === id);
            if(!post) return;
            editingId = id;
            currentImageUrl = post.image_url || null;
            removeImageFlag = false; 

            document.getElementById('edit-title').value = post.title || "";
            document.getElementById('edit-text').value = post.text || "";
            document.getElementById('edit-image').value = ""; 
            
            document.getElementById('file-name-display').innerText = "(Optional)";
            document.getElementById('file-name-display').style.color = "var(--grey-50)";
            document.getElementById('clear-file-btn').style.display = "none";

            if (post.image_url) {
                document.getElementById('current-image-container').style.display = 'flex';
            } else {
                document.getElementById('current-image-container').style.display = 'none';
            }

            document.getElementById('publish-btn').innerText = "Save Changes";
            document.getElementById('cancel-btn-container').style.display = "block";
            
            switchAdminTab('editor');
        }

        function cancelEdit() {
            editingId = null;
            currentImageUrl = null;
            removeImageFlag = false;

            document.getElementById('edit-title').value = "";
            document.getElementById('edit-text').value = "";
            document.getElementById('edit-image').value = "";
            document.getElementById('current-image-container').style.display = 'none';
            
            document.getElementById('file-name-display').innerText = "(Optional)";
            document.getElementById('file-name-display').style.color = "var(--grey-50)";
            document.getElementById('clear-file-btn').style.display = "none";
            
            document.getElementById('publish-btn').innerText = "Publish";
            document.getElementById('cancel-btn-container').style.display = "none";
        }

        async function deletePost(id) {
            if(!confirm("Are you sure you want to delete this post?")) return;
            try {
                const res = await fetch(`${API_URL}/posts/${id}`, {
                    method: "DELETE",
                    headers: { "x-admin-password": secretKey }
                });
                
                if (res.status === 401) {
                    handleLogout();
                    document.getElementById('login-error').style.display = 'block';
                    return;
                }
                fetchStatuses(true); 
                fetchAdminPosts(adminCurrentPage); 
            } catch(e) {
                alert("Error deleting post.");
            }
        }

        // 🚨 ZMENA: Trojfázová logika tlačidla
        function resetDeleteButton() {
            const btn = document.getElementById('delete-all-btn');
            btn.dataset.state = "0";
            btn.innerText = "Delete All Posts";
            btn.style.opacity = "1";
            btn.disabled = false;
        }

        function handleDeleteAllClick() {
            const btn = document.getElementById('delete-all-btn');
            const state = btn.dataset.state || "0";

            if (state === "0") {
                // 1. KLIK: Pýta si potvrdenie
                btn.dataset.state = "1";
                btn.innerText = "Are you sure? Click to confirm";
                
                clearTimeout(deleteConfirmTimeout);
                deleteConfirmTimeout = setTimeout(() => {
                    resetDeleteButton();
                }, 3000);
                
            } else if (state === "1") {
                // 2. KLIK: Spúšťa odpočítavanie
                clearTimeout(deleteConfirmTimeout);
                btn.dataset.state = "2";
                countdownValue = 5;
                btn.innerText = `Deleting in ${countdownValue}... Click to cancel`;
                
                deleteCountdownInterval = setInterval(() => {
                    countdownValue--;
                    if (countdownValue > 0) {
                        btn.innerText = `Deleting in ${countdownValue}... Click to cancel`;
                    } else {
                        // ČAS VYPRŠAL: Spúšťa sa mazanie
                        clearInterval(deleteCountdownInterval);
                        btn.innerText = "Deleting everything...";
                        btn.style.opacity = "0.7";
                        btn.disabled = true;
                        executeDeleteAll();
                    }
                }, 1000);
                
            } else if (state === "2") {
                // 3. KLIK (počas odpočítavania): Ruší celú akciu
                clearInterval(deleteCountdownInterval);
                resetDeleteButton();
            }
        }

        async function executeDeleteAll() {
            try {
                let deleting = true;
                while(deleting) {
                    const res = await fetch(`${API_URL}/posts?skip=0&limit=50`);
                    const posts = await res.json();
                    
                    if (posts.length === 0) {
                        deleting = false;
                        break;
                    }
                    
                    for (const p of posts) {
                        await fetch(`${API_URL}/posts/${p.id}`, { 
                            method: "DELETE", 
                            headers: { "x-admin-password": secretKey } 
                        });
                    }
                }
                fetchStatuses(true);
                fetchAdminPosts(1);
            } catch(e) {
                alert("An error occurred while deleting all posts.");
            } finally {
                resetDeleteButton();
            }
        }

        fetchStatuses(true);
        
        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => { 
            if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu(); 
        });
    </script>
</body>
</html>
