<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            --black: #000000;
            --white: #ffffff;
            --grey-50: rgba(0, 0, 0, 0.5);
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            --border-radius: 0px; 
            --card-bg: transparent; 
            --card-border: var(--black);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-50: rgba(255, 255, 255, 0.5); 
                --glass-rgb: 0, 0, 0;   
                --card-bg: transparent;
                --card-border: var(--black);
            }
        }

        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        * { -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 400;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.5;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        header {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 50px;
            display: flex; justify-content: center;
            background: rgba(var(--glass-rgb), 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            height: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; box-sizing: border-box;
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { height: 24px; width: auto; display: block; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); letter-spacing: 0.05em; white-space: nowrap; }
        .logo-text span { font-weight: 700; }

        .menu-toggle { width: 24px; height: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; z-index: 2100; }
        .line { width: 24px; height: 1px; background-color: var(--black); transition: transform 0.3s ease, background-color 0.3s ease; }
        .menu-toggle.active .line:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(-5.5px) rotate(-45deg); }

        .nav-overlay {
            position: fixed; top: -100%; left: 0; width: 100%; 
            background: rgba(var(--glass-rgb), 0.3); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: top 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1500; padding: 80px 0 40px 0; display: flex; flex-direction: column; align-items: center;
        }
        .nav-overlay.active { top: 0; }
        
        .menu-items { 
            width: 100%; 
            max-width: var(--content-width); 
            display: flex; flex-direction: column; gap: 25px; padding: 0 20px; box-sizing: border-box; 
        }
        
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; letter-spacing: 0.02em; }

        main {
            padding: 65px 20px 0px; 
            width: 100%; max-width: var(--content-width); 
            box-sizing: border-box;
            flex-grow: 1;
        }

        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- STATUS FEED --- */
        .status-feed {
            max-width: 600px;
            margin: 0 auto; 
            padding: 10px 0;
        }

        .status-card {
            background: transparent; 
            border: none;
            border-bottom: 1px solid var(--black); /* Rám len zospodu */
            border-radius: 0; /* Bez zaoblenia */
            padding: 24px 0; /* Zmenšené vertikálne paddingy */
            margin-bottom: 0; 
            transition: none; /* Bez animácie */
        }

        .status-card:hover {
            transform: none; /* Zrušený pohyb */
        }

        .status-date {
            font-size: 1rem; 
            color: var(--grey-50);
            margin-bottom: 4px; /* Zmenšená medzera pod dátumom */
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-title {
            font-size: 2rem; 
            font-weight: 700;
            margin: 0 0 8px 0; /* Zmenšená medzera pod nadpisom */
            color: var(--black);
            line-height: 1.1;
        }

        .status-text {
            font-size: 1rem; 
            line-height: 1.5;
            color: var(--black);
            opacity: 0.8;
            white-space: pre-line; 
            text-align: justify;
        }

        .loading-text {
            text-align: center;
            color: var(--grey-50);
        }

        /* --- FORMULÁR --- */
        .contact-form { margin-top: 20px; max-width: 540px; width: 100%; }
        .form-group { margin-bottom: 25px; }
        .form-input, .form-textarea { 
            width: 100%; 
            border: none; 
            border-bottom: 1px solid var(--black); /* Len spodný rám */
            border-radius: 0; 
            background: transparent; 
            font-family: inherit; font-size: var(--size-small); 
            padding: 12px 0; /* Padding len vertikálne */
            outline: none; box-sizing: border-box; color: var(--black);
        }
        ::placeholder { color: var(--grey-50); opacity: 1; }
        .form-textarea { min-height: 100px; resize: vertical; }
        .submit-btn {
            width: 100%; background: var(--black); color: var(--white); border: none; padding: 16px 32px; 
            font-family: inherit; font-size: var(--size-small); text-transform: uppercase; font-weight: 600; 
            letter-spacing: 0.1em; cursor: pointer;
            margin-top: 10px;
        }

        footer {
            width: 100%; max-width: var(--content-width); padding: 40px 20px 30px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }
        .footer-info { font-size: var(--size-small); color: var(--grey-50); text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="showSection('feed')">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="935.31" height="810" viewBox="72.35 270 935.31 810"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="var(--black)" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle"><div class="line"></div><div class="line"></div></div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <a class="menu-link" onclick="showSection('feed')"><span>Feed</span></a>
            <a class="menu-link" onclick="showSection('contact')"><span>Contact</span></a>
        </div>
    </nav>

    <main>
        <div id="section-feed" class="content-section active">
            <div id="status-container" class="status-feed">
                <p class="loading-text">Loading thoughts...</p>
            </div>
        </div>

        <div id="section-contact" class="content-section">
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Contact.</h2>
            <form class="contact-form" action="https://formsubmit.co/martinvojtus@icloud.com" method="POST">
                <input type="hidden" name="_captcha" value="false">
                <div class="form-group"><input type="text" name="name" class="form-input" placeholder="Name" required></div>
                <div class="form-group"><input type="email" name="email" class="form-input" placeholder="Email" required></div>
                <div class="form-group"><textarea name="message" class="form-textarea" placeholder="Message" required></textarea></div>
                <button type="submit" class="submit-btn">Send message</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-info">build v1.8.0 • martin vojtus • 2026</div>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');
        
        function toggleMenu() { 
            menuToggle.classList.toggle('active'); 
            navOverlay.classList.toggle('active'); 
        }

        function closeMenu() { 
            menuToggle.classList.remove('active'); 
            navOverlay.classList.remove('active'); 
        }

        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + sectionId).classList.add('active');
            closeMenu(); 
            window.scrollTo(0, 0);
        }

        async function fetchStatuses() {
            const container = document.getElementById('status-container');
            const API_URL = "https://mv-backend-ak8l.onrender.com"; 

            try {
                const response = await fetch(`${API_URL}/posts`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<p class="loading-text">No posts yet.</p>';
                    return;
                }
                renderStatuses(data);
            } catch (error) {
                container.innerHTML = `<p style="color:red; text-align:center;">Failed to load data.</p>`;
            }
        }

        function renderStatuses(statuses) {
            const container = document.getElementById('status-container');
            container.innerHTML = statuses.map(s => {
                const dateObj = new Date(s.at);
                const date = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
                const time = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

                let editedHtml = '';
                if (s.updated_at) {
                    const updateObj = new Date(s.updated_at);
                    const updateDate = updateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                    const updateTime = updateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                    editedHtml = `<div style="font-size: 1rem; color: var(--grey-50); margin-top: 6px;">(Edited: ${updateDate} • ${updateTime})</div>`;
                }

                return `
                <div class="status-card">
                    <span class="status-date">${date} • ${time}</span>
                    <h3 class="status-title">${s.title}</h3>
                    <div class="status-text">${s.text}</div> 
                    ${editedHtml}
                </div>
                `;
            }).join('');
        }

        fetchStatuses();
        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => { 
            if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu(); 
        });
    </script>
</body>
</html>
