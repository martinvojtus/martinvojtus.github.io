<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>martinvojtus.space</title>

<style>
:root {
    --size-large: 2rem;
    --size-small: 1rem;
    --black: #000;
    --white: #fff;
    --grey-50: rgba(0,0,0,.5);
    --divider: rgba(0,0,0,.1);
    --border-radius: 16px;
    --gap-item: 16px;
}

body {
    margin:0;
    font-family: sans-serif;
    background:var(--white);
    color:var(--black);
    display:flex;
    justify-content:center;
}

main {
    width:100%;
    max-width:540px;
    padding:32px 16px;
}

.status-card {
    padding:16px 0;
    border-bottom:1px solid var(--divider);
    display:flex;
    flex-direction:column;
    gap:16px;
}

.status-title { font-size:var(--size-large); margin:0; }
.status-text { opacity:.8; white-space:pre-line; }
.status-date { font-size:var(--size-small); color:var(--grey-50); }
.status-image { width:100%; border-radius:var(--border-radius); }

button {
    height:48px;
    border-radius:var(--border-radius);
    border:1px solid var(--black);
    background:var(--black);
    color:var(--white);
    padding:0 16px;
    cursor:pointer;
}
</style>
</head>
<body>

<main>
    <div id="status-container"></div>
    <div id="loading-indicator">Loading...</div>
</main>

<script>
const API_URL = "https://mv-backend-ak8l.onrender.com";

let currentOffset = 0;
const postsLimit = 10;
let isLoading = false;
let hasMorePosts = true;

/* ===========================
   SECURITY HELPERS
=========================== */

function escapeHtml(text) {
    const div = document.createElement("div");
    div.innerText = text;
    return div.innerHTML;
}

function linkify(text) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    return text.replace(urlRegex, function(url) {
        const safeUrl = encodeURI(url);
        return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" style="opacity:.6;color:inherit;text-decoration:none">${safeUrl}</a>`;
    });
}

/* ===========================
   RENDER
=========================== */

function renderSinglePost(s) {
    const showDate = s.show_date !== false;
    let dateHtml = "";
    let editedHtml = "";

    if (showDate) {
        const d = new Date(s.at);
        const date = d.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"}).toUpperCase();
        const time = d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
        dateHtml = `<div class="status-date">${date} • ${time}</div>`;

        if (s.updated_at) {
            const u = new Date(s.updated_at);
            const ud = u.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"}).toUpperCase();
            const ut = u.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
            editedHtml = `<div class="status-date">EDITED: ${ud} • ${ut}</div>`;
        }
    }

    const safeTitle = s.title ? escapeHtml(s.title) : "";
    const safeText = s.text ? linkify(escapeHtml(s.text)) : "";

    return `
    <div class="status-card">
        ${dateHtml}
        ${safeTitle ? `<h3 class="status-title">${safeTitle}</h3>` : ""}
        ${s.image_url ? `<img src="${s.image_url}" class="status-image" loading="lazy">` : ""}
        ${safeText ? `<div class="status-text">${safeText}</div>` : ""}
        ${editedHtml}
    </div>
    `;
}

/* ===========================
   FETCH POSTS
=========================== */

async function fetchStatuses(reset=false) {
    if (reset) {
        currentOffset = 0;
        hasMorePosts = true;
        document.getElementById("status-container").innerHTML = "";
        document.getElementById("loading-indicator").style.display="block";
    }

    if (isLoading || !hasMorePosts) return;
    isLoading = true;

    try {
        const res = await fetch(`${API_URL}/posts?skip=${currentOffset}&limit=${postsLimit}`);
        if (!res.ok) throw new Error();

        const posts = await res.json();

        if (posts.length < postsLimit) {
            hasMorePosts = false;
            document.getElementById("loading-indicator").style.display="none";
        }

        currentOffset += posts.length;

        const container = document.getElementById("status-container");
        const temp = document.createElement("div");
        temp.innerHTML = posts.map(renderSinglePost).join("");
        while(temp.firstChild) container.appendChild(temp.firstChild);

    } catch {
        document.getElementById("loading-indicator").innerText="Failed to load.";
    }

    isLoading = false;
}

/* ===========================
   DELETE ALL (secure endpoint)
=========================== */

async function deleteAll(secretKey) {
    await fetch(`${API_URL}/posts`, {
        method:"DELETE",
        headers:{"x-admin-password":secretKey}
    });
    await fetchStatuses(true);
}

/* ===========================
   INFINITE SCROLL
=========================== */

window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        fetchStatuses();
    }
});

/* ===========================
   INIT
=========================== */

fetchStatuses(true);

</script>
</body>
</html>
