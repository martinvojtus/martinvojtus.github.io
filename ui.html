<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Jednotný font pre celý web */
            --font-main: 'Space Grotesk', sans-serif;
            --size-header: 1.8rem;
            --size-body: 1rem;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            font-weight: 400; /* Všetko v regular podľa požiadavky */
            background-color: #ffffff;
            color: #000000;
            line-height: 1.6;
        }

        /* 🧊 Ultra transparentný banner s matným sklom */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Ešte transparentnejšie pozadie */
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            /* Nenápadná linka na oddelenie */
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .logo {
            font-size: var(--size-header);
            /* Mierne hrubšie (600), aby vyniklo, ale nie príliš */
            font-weight: 600; 
            letter-spacing: -0.03em;
            margin: 0;
        }

        main {
            padding: 100px 20px 50px;
            max-width: 800px;
            margin: 0 auto;
        }

        p {
            font-size: var(--size-body);
            margin-bottom: 1.5rem;
            color: #333;
        }

        /* Demonštrácia obsahu pod bannerom */
        .spacer {
            height: 2000px;
            background: linear-gradient(180deg, #ffffff 0%, #f9f9f9 100%);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">martinvojtus.space</div>
    </header>

    <main>
        <p>
            Toto je tvoj nový vizuálny priestor. Použitý font Space Grotesk dodáva webu 
            charakter bez toho, aby uberal na čitateľnosti. 
        </p>
        <p>
            Banner hore je teraz ešte viac priehľadný, čo zvýrazňuje efekt rozmazania 
            textu, ktorý pod ním prechádza pri scrollovaní.
        </p>
        <div class="spacer"></div>
    </main>

</body>
</html>
