<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            
            --black: #000000;
            --white: #ffffff;
            --grey-50: rgba(0, 0, 0, 0.5);
            --divider: rgba(0, 0, 0, 0.12);
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            
            --border-radius: 12px; 
            --gap-item: 24px; 
            --input-padding: 16px; 

            --glass-opacity: 0.6; 
            --glass-blur: 25px;   
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-50: rgba(255, 255, 255, 0.5); 
                --divider: rgba(255, 255, 255, 0.12); 
                --glass-rgb: 0, 0, 0;   
            }
        }

        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 400;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.5;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        header {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 50px;
            display: flex; justify-content: center;
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            height: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; 
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { height: 24px; width: auto; display: block; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); letter-spacing: 0.05em; white-space: nowrap; }
        .logo-text span { font-weight: 700; }

        .menu-toggle { width: 24px; height: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; z-index: 2100; }
        .line { width: 24px; height: 1px; background-color: var(--black); transition: transform 0.3s ease, background-color 0.3s ease; }
        .menu-toggle.active .line:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(-5.5px) rotate(-45deg); }

        .nav-overlay {
            position: fixed; top: -100%; left: 0; width: 100%; 
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            transition: top 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1500; padding: 80px 0 40px 0; display: flex; flex-direction: column; align-items: center;
        }
        .nav-overlay.active { top: 0; }
        
        .menu-items { 
            width: 100%; 
            max-width: var(--content-width); 
            display: flex; flex-direction: column; padding: 0 20px; 
        }
        
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; letter-spacing: 0.02em; display: inline-block; padding: 10px 0; }

        main {
            padding: 70px 20px 0px; 
            width: 100%; max-width: var(--content-width); 
            flex-grow: 1;
        }

        /* --- STATUS FEED --- */
        .status-feed {
            max-width: 600px;
            margin: 0 auto; 
            padding: 0 0 var(--gap-item) 0; 
        }

        .status-card {
            background: transparent; 
            border: none;
            border-bottom: 1px solid var(--divider); 
            border-radius: 0; 
            padding: var(--gap-item) 0; 
            margin-bottom: 0; 
        }

        .status-card:first-child { padding-top: 0; }
        .status-card:last-child { border-bottom: none; }

        .status-date {
            font-size: var(--size-small); 
            color: var(--grey-50);
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-title {
            font-size: var(--size-large); 
            font-weight: 700;
            margin: 0 0 16px 0; 
            color: var(--black);
            line-height: 1.1;
        }

        .status-image {
            width: 100%;
            height: auto; 
            border-radius: var(--border-radius);
            display: block;
            margin: 0 0 16px 0;
            border: none;
        }

        .status-text {
            font-size: var(--size-small); 
            line-height: 1.5;
            color: var(--black);
            opacity: 0.8;
            white-space: pre-line; 
            text-align: justify;
            margin-bottom: 0;
            word-wrap: break-word;
        }

        .loading-text {
            text-align: center;
            font-size: var(--size-small);
            color: var(--grey-50);
            padding-top: 10px;
            margin-bottom: 30px;
        }

        /* --- FORMULÁRE --- */
        .form-group { margin-bottom: var(--gap-item); }
        
        .form-input, .form-textarea, .submit-btn { 
            width: 100%; 
            border: 1px solid var(--black); 
            border-radius: var(--border-radius); 
            background: transparent; 
            font-family: inherit; 
            font-size: var(--size-small); 
            padding: var(--input-padding); 
            outline: none; 
            color: var(--black);
            box-sizing: border-box;
            display: block;
            transition: all 0.3s ease; 
        }
        
        ::placeholder { color: var(--grey-50); opacity: 1; }
        .form-textarea { min-height: 120px; resize: vertical; }

        .submit-btn {
            background: var(--black); 
            color: var(--white); 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.1em; 
            cursor: pointer;
        }
        
        .secondary-btn {
            background: transparent; 
            color: var(--black); 
        }

        .admin-action-btn {
            background: transparent; border: none; font-family: inherit; 
            font-size: var(--size-small);
            color: var(--black); cursor: pointer; padding: 0; margin-right: 15px;
        }
        
        .admin-action-link {
            text-decoration: underline;
        }

        footer {
            width: 100%; max-width: var(--content-width); padding: 40px 20px 30px; 
            display: flex; flex-direction: column; align-items: center;
        }
        .footer-info { font-size: var(--size-small); color: var(--grey-50); text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="window.scrollTo(0,0)">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="935.31" height="810" viewBox="72.35 270 935.31 810"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="var(--black)" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle"><div class="line"></div><div class="line"></div></div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <a class="menu-link" onclick="window.scrollTo(0,0); closeMenu();"><span>Feed</span></a>
            
            <div style="width: 100%; height: 1px; background-color: var(--divider); margin: 10px 0 20px 0;"></div>
            
            <div id="menu-login-section">
                <form onsubmit="handleLogin(event)" style="display: flex; width: 100%; border: 1px solid var(--black); border-radius: var(--border-radius); overflow: hidden; background: transparent;">
                    <input type="password" id="admin-pass" placeholder="Password..." required style="flex-grow: 1; border: none; background: transparent; padding: var(--input-padding); color: var(--black); font-family: inherit; font-size: var(--size-small); outline: none;">
                    <button type="submit" id="login-btn" style="width: 120px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; background: var(--black); color: var(--white); font-family: inherit; font-size: var(--size-small); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; outline: none; transition: background-color 0.3s ease, color 0.3s ease;">Log In</button>
                </form>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 15px;">
                    <input type="checkbox" id="remember-me" style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--black);">
                    <label for="remember-me" style="font-size: var(--size-small); color: var(--black); cursor: pointer; user-select: none;">Stay logged in</label>
                </div>
            </div>

            <div id="menu-admin-section" style="display: none; flex-direction: column; gap: 15px;">
                <button type="button" id="delete-all-btn" data-state="0" class="submit-btn" style="margin-bottom: 0;" onclick="handleDeleteAllClick()">Delete All Posts</button>
                <div style="width: 100%; height: 1px; background-color: var(--divider); margin: 5px 0;"></div>
                <button onclick="handleLogout()" class="admin-action-btn admin-action-link" style="margin: 0; text-align: left; font-weight: 700;">Logout</button>
            </div>
        </div>
    </nav>

    <main>
        <div id="section-feed">
            <h2 style="font-size: var(--size-large); margin: 0 0 var(--gap-item) 0;">Feed.</h2>
            
            <div id="feed-admin-zone" style="display: none; margin-bottom: var(--gap-item); padding-bottom: var(--gap-item); border-bottom: 1px solid var(--divider);">
                
                <div id="quick-post-wrapper">
                    <form onsubmit="handleQuickPost(event)" style="display: flex; width: 100%; border: 1px solid var(--black); border-radius: var(--border-radius); overflow: hidden; background: transparent;">
                        <input type="text" id="quick-text" placeholder="Quick thought..." required style="flex-grow: 1; border: none; background: transparent; padding: var(--input-padding); color: var(--black); font-family: inherit; font-size: var(--size-small); outline: none;">
                        <button type="submit" id="quick-btn" style="width: 120px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; background: var(--black); color: var(--white); font-family: inherit; font-size: var(--size-small); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; outline: none; transition: background-color 0.3s ease, color 0.3s ease;">Post</button>
                    </form>
                    <div style="text-align: right; margin-top: 10px;">
                        <button type="button" class="admin-action-btn admin-action-link" style="margin: 0; color: var(--grey-50);" onclick="toggleAdvancedEditor(true)">+ Add image or title</button>
                    </div>
                </div>

                <div id="full-editor-wrapper" style="display: none;">
                    <form id="editor-form" onsubmit="handlePublish(event)" style="width: 100%;">
                        <div class="form-group"><input type="text" id="edit-title" class="form-input" placeholder="Title (Optional)"></div>
                        
                        <div id="current-image-container" style="display: none; margin-bottom: var(--gap-item); font-size: var(--size-small); align-items: center;">
                            <span style="color: var(--grey-50);">Attached image </span>
                            <button type="button" class="admin-action-btn admin-action-link" style="color: var(--black); font-weight: 700; margin-left: 15px;" onclick="flagImageForRemoval()">Remove</button>
                        </div>

                        <div class="form-group">
                            <input type="file" id="edit-image" accept="image/*" style="display: none;" onchange="updateFileName()">
                            <div class="form-input" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; overflow: hidden;" onclick="document.getElementById('edit-image').click()">
                                <div style="display: flex; align-items: center; overflow: hidden;">
                                    <span class="admin-action-btn admin-action-link" style="margin: 0 15px 0 0; pointer-events: none;">Upload image</span>
                                    <span id="file-name-display" style="color: var(--grey-50); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--size-small);">(Optional)</span>
                                </div>
                                <button type="button" id="clear-file-btn" class="admin-action-btn admin-action-link" style="color: var(--black); font-weight: 700; margin: 0; display: none; padding: 0;" onclick="clearSelectedFile(event)">Remove</button>
                            </div>
                        </div>

                        <div class="form-group"><textarea id="edit-text" class="form-textarea" placeholder="Content (Optional if image attached)"></textarea></div>
                        
                        <div class="form-group" style="margin-bottom: 12px;"><button type="submit" id="publish-btn" class="submit-btn">Publish</button></div>
                        <div class="form-group" style="margin-bottom: 0;"><button type="button" id="cancel-btn" class="submit-btn secondary-btn" onclick="toggleAdvancedEditor(false)">Cancel</button></div>
                    </form>
                </div>

            </div>

            <div id="status-container" class="status-feed"></div>
            <div id="loading-indicator" class="loading-text">Loading...</div>
        </div>
    </main>

    <footer>
        <div class="footer-info">build v2.9.0 • martin vojtus • 2026</div>
    </footer>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        let secretKey = ""; 
        let editingId = null;
        let globalPosts = [];
        let currentImageUrl = null; 
        let removeImageFlag = false; 

        let currentOffset = 0;
        const postsLimit = 10;
        let isLoading = false;
        let hasMorePosts = true;
        
        let deleteConfirmTimeout;
        let deleteCountdownInterval;
        let countdownValue = 5;

        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');
        
        function toggleMenu(forceOpen = false) { 
            if(forceOpen) {
                menuToggle.classList.add('active'); 
                navOverlay.classList.add('active');
            } else {
                menuToggle.classList.toggle('active'); 
                navOverlay.classList.toggle('active'); 
            }
        }
        function closeMenu() { 
            menuToggle.classList.remove('active'); 
            navOverlay.classList.remove('active'); 
        }

        // --- Bezpečnosť a UI prepínanie ---
        function checkSavedLogin() {
            const savedKey = localStorage.getItem('adminSecretKey');
            if (savedKey) {
                secretKey = savedKey;
                activateAdminUI();
            }
        }

        function activateAdminUI() {
            document.getElementById('menu-login-section').style.display = 'none';
            document.getElementById('menu-admin-section').style.display = 'flex';
            document.getElementById('feed-admin-zone').style.display = 'block';
            refreshFeedUI();
        }

        function handleLogin(e) {
            e.preventDefault();
            const passInput = document.getElementById('admin-pass');
            secretKey = passInput.value;
            const rememberMe = document.getElementById('remember-me').checked;
            
            if (rememberMe) localStorage.setItem('adminSecretKey', secretKey);
            
            passInput.value = ''; // vyčistíme po prihlásení
            activateAdminUI();
            closeMenu();
        }

        function handleLogout() {
            secretKey = "";
            localStorage.removeItem('adminSecretKey');

            document.getElementById('menu-admin-section').style.display = 'none';
            document.getElementById('menu-login-section').style.display = 'block';
            document.getElementById('feed-admin-zone').style.display = 'none';
            
            document.getElementById('remember-me').checked = false;
            
            toggleAdvancedEditor(false);
            resetDeleteButton(); 
            refreshFeedUI();
            closeMenu(); 
        }

        function handleUnauthorized() {
            handleLogout();
            toggleMenu(true); 
            const passInput = document.getElementById('admin-pass');
            passInput.placeholder = "Invalid password.";
            setTimeout(() => { passInput.placeholder = "Password..."; }, 3000);
        }

        function refreshFeedUI() {
            const container = document.getElementById('status-container');
            if (globalPosts.length > 0) {
                container.innerHTML = '';
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = globalPosts.map(s => renderSinglePost(s)).join('');
                while(tempDiv.firstChild) {
                    container.appendChild(tempDiv.firstChild);
                }
            }
        }

        // --- Nástroje ---
        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" style="color: inherit; text-decoration: underline;">' + url + '</a>';
            });
        }

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(blob => { resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() })); }, 'image/jpeg', quality);
                    };
                };
            });
        }

        // --- Načítanie Feedov ---
        async function fetchStatuses(reset = false) {
            if (reset) {
                currentOffset = 0;
                hasMorePosts = true;
                globalPosts = [];
                document.getElementById('status-container').innerHTML = '';
                document.getElementById('loading-indicator').style.display = 'block';
            }
            if (isLoading || !hasMorePosts) return;
            isLoading = true;
            const container = document.getElementById('status-container');
            const loader = document.getElementById('loading-indicator');

            try {
                const response = await fetch(`${API_URL}/posts?skip=${currentOffset}&limit=${postsLimit}`);
                if (!response.ok) throw new Error();
                const newPosts = await response.json();
                
                if (newPosts.length < postsLimit) { hasMorePosts = false; loader.style.display = 'none'; }
                currentOffset += newPosts.length;
                globalPosts = globalPosts.concat(newPosts);
                
                if (reset && globalPosts.length === 0) {
                    container.innerHTML = '<p class="loading-text">No posts yet.</p>';
                    loader.style.display = 'none';
                } else {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = newPosts.map(s => renderSinglePost(s)).join('');
                    while(tempDiv.firstChild) container.appendChild(tempDiv.firstChild);
                }
            } catch (error) {
                if (reset) container.innerHTML = `<p style="color:var(--black); font-weight:700; text-align:center;">Failed to load data.</p>`;
                loader.style.display = 'none';
            } finally {
                isLoading = false;
            }
        }

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) fetchStatuses();
        });

        function renderSinglePost(s) {
            const dateObj = new Date(s.at);
            const date = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
            const time = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            
            let editedHtml = '';
            if (s.updated_at) {
                const updateObj = new Date(s.updated_at);
                const updateDate = updateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                const updateTime = updateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                editedHtml = `<div style="font-size: var(--size-small); color: var(--grey-50); margin-top: 12px;">(Edited: ${updateDate} • ${updateTime})</div>`;
            }

            const titleHtml = (s.title && s.title.trim() !== "") ? `<h3 class="status-title">${s.title}</h3>` : '';
            const imageHtml = s.image_url ? `<img src="${s.image_url}" class="status-image" alt="Post image" loading="lazy">` : '';
            let textHtml = (s.text && s.text.trim() !== "") ? `<div class="status-text">${linkify(s.text)}</div>` : '';

            let adminActionsHtml = '';
            if (secretKey) {
                adminActionsHtml = `
                <div style="display: flex; gap: 15px; align-items: baseline;">
                    <button onclick="startEdit(${s.id});" class="admin-action-btn admin-action-link" style="margin: 0; padding: 0;">Edit</button>
                    <button id="feed-del-btn-${s.id}" onclick="handleDeleteFeed(${s.id})" class="admin-action-btn admin-action-link" style="color: var(--black); margin: 0; padding: 0;">Delete</button>
                </div>`;
            }

            return `
            <div class="status-card">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;">
                    <span class="status-date" style="margin-bottom: 0;">${date} • ${time}</span>
                    ${adminActionsHtml}
                </div>
                ${titleHtml}
                ${imageHtml}
                ${textHtml}
                ${editedHtml}
            </div>`;
        }

        // --- Logika Editora ---
        function toggleAdvancedEditor(show) {
            const qWrapper = document.getElementById('quick-post-wrapper');
            const fWrapper = document.getElementById('full-editor-wrapper');
            
            if (show) {
                qWrapper.style.display = 'none';
                fWrapper.style.display = 'block';
            } else {
                editingId = null;
                currentImageUrl = null;
                removeImageFlag = false;

                document.getElementById('edit-title').value = "";
                document.getElementById('edit-text').value = "";
                document.getElementById('edit-image').value = "";
                document.getElementById('current-image-container').style.display = 'none';
                document.getElementById('file-name-display').innerText = "(Optional)";
                document.getElementById('file-name-display').style.color = "var(--grey-50)";
                document.getElementById('clear-file-btn').style.display = "none";
                
                const publishBtn = document.getElementById('publish-btn');
                publishBtn.disabled = false;
                publishBtn.innerText = "Publish";

                qWrapper.style.display = 'block';
                fWrapper.style.display = 'none';
            }
        }

        function startEdit(id) {
            const post = globalPosts.find(p => p.id === id);
            if(!post) return;
            
            editingId = id;
            currentImageUrl = post.image_url || null;
            removeImageFlag = false; 

            document.getElementById('edit-title').value = post.title || "";
            document.getElementById('edit-text').value = post.text || "";
            document.getElementById('edit-image').value = ""; 
            
            document.getElementById('file-name-display').innerText = "(Optional)";
            document.getElementById('file-name-display').style.color = "var(--grey-50)";
            document.getElementById('clear-file-btn').style.display = "none";

            if (post.image_url) document.getElementById('current-image-container').style.display = 'flex';
            else document.getElementById('current-image-container').style.display = 'none';

            document.getElementById('publish-btn').innerText = "Save Changes";
            
            toggleAdvancedEditor(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function flagImageForRemoval() {
            removeImageFlag = true;
            currentImageUrl = null;
            document.getElementById('current-image-container').style.display = 'none';
        }

        function updateFileName() {
            const input = document.getElementById('edit-image');
            const display = document.getElementById('file-name-display');
            const clearBtn = document.getElementById('clear-file-btn');
            
            if (input.files && input.files.length > 0) {
                display.innerText = input.files[0].name;
                display.style.color = "var(--black)";
                clearBtn.style.display = "block"; 
            } else {
                display.innerText = "(Optional)";
                display.style.color = "var(--grey-50)";
                clearBtn.style.display = "none";  
            }
        }

        function clearSelectedFile(e) {
            e.stopPropagation(); 
            document.getElementById('edit-image').value = ""; 
            updateFileName(); 
        }

        async function handlePublish(e) {
            e.preventDefault();
            const title = document.getElementById('edit-title').value.trim();
            const text = document.getElementById('edit-text').value.trim();
            const imageFile = document.getElementById('edit-image').files[0];
            const publishBtn = document.getElementById('publish-btn');
            const originalBtnText = publishBtn.innerText;
            
            let hasImage = !!imageFile || (currentImageUrl && !removeImageFlag);
            
            if (!text && !hasImage) {
                publishBtn.innerText = "Add text or image.";
                publishBtn.disabled = true;
                setTimeout(() => { publishBtn.innerText = originalBtnText; publishBtn.disabled = false; }, 2000);
                return;
            }

            publishBtn.disabled = true;
            let finalImageUrl = currentImageUrl;
            if (removeImageFlag && !imageFile) finalImageUrl = null; 

            if (imageFile) {
                publishBtn.innerText = "Compressing...";
                const compressedFile = await compressImage(imageFile);
                const formData = new FormData();
                formData.append("file", compressedFile);

                try {
                    publishBtn.innerText = "Uploading...";
                    const uploadRes = await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": secretKey }, body: formData });
                    if (uploadRes.status === 401) throw new Error("Unauthorized");
                    if (!uploadRes.ok) throw new Error("Upload failed");
                    const uploadData = await uploadRes.json();
                    finalImageUrl = uploadData.image_url;
                    publishBtn.innerText = "Saving...";
                } catch (err) {
                    if (err.message === "Unauthorized") return handleUnauthorized();
                    publishBtn.innerText = "Upload Error!";
                    setTimeout(() => { publishBtn.innerText = originalBtnText; publishBtn.disabled = false; }, 2000);
                    return;
                }
            } else {
                publishBtn.innerText = "Saving...";
            }

            const method = editingId ? "PUT" : "POST";
            const endpoint = editingId ? `${API_URL}/posts/${editingId}` : `${API_URL}/posts`;

            try {
                const res = await fetch(endpoint, {
                    method: method,
                    headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                    body: JSON.stringify({ title: title, text: text, image_url: finalImageUrl })
                });

                if (res.status === 401) return handleUnauthorized();
                if (!res.ok) throw new Error();

                publishBtn.innerText = editingId ? "Updated." : "Published.";
                await fetchStatuses(true); 
                setTimeout(() => { document.activeElement.blur(); toggleAdvancedEditor(false); }, 1500);
            } catch (err) {
                publishBtn.innerText = "Connection Error!";
                setTimeout(() => { publishBtn.innerText = originalBtnText; publishBtn.disabled = false; }, 2000);
            }
        }

        async function handleQuickPost(e) {
            e.preventDefault();
            const inputField = document.getElementById('quick-text');
            const text = inputField.value.trim();
            const btn = document.getElementById('quick-btn');

            if(!text) return;
            btn.disabled = true;
            btn.innerText = "...";
            
            try {
                const res = await fetch(`${API_URL}/posts`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                    body: JSON.stringify({ title: "", text: text, image_url: null })
                });

                if (res.status === 401) return handleUnauthorized();
                if(!res.ok) throw new Error();

                inputField.value = "";
                btn.innerText = "Posted.";
                await fetchStatuses(true);
                
                setTimeout(() => { btn.innerText = "Post"; btn.disabled = false; document.activeElement.blur(); }, 1500);
            } catch(err) {
                btn.innerText = "Error.";
                setTimeout(() => { btn.innerText = "Post"; btn.disabled = false; }, 1500);
            }
        }

        async function handleDeleteFeed(id) {
            const btn = document.getElementById(`feed-del-btn-${id}`);
            if (btn.dataset.confirm === "true") {
                clearTimeout(btn.timeoutId);
                btn.innerText = "Deleting...";
                btn.disabled = true;
                try {
                    const res = await fetch(`${API_URL}/posts/${id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } });
                    if (res.status === 401) return handleUnauthorized();
                    fetchStatuses(true); 
                } catch(e) {
                    alert("Error deleting post.");
                    btn.innerText = "Delete"; btn.disabled = false; btn.dataset.confirm = "false";
                }
            } else {
                btn.dataset.confirm = "true"; btn.innerText = "Confirm"; btn.style.fontWeight = "400";
                btn.timeoutId = setTimeout(() => {
                    if (document.getElementById(`feed-del-btn-${id}`)) { btn.dataset.confirm = "false"; btn.innerText = "Delete"; }
                }, 3000);
            }
        }

        function resetDeleteButton() {
            const btn = document.getElementById('delete-all-btn');
            btn.dataset.state = "0"; btn.innerText = "Delete All Posts"; btn.disabled = false;
        }

        function handleDeleteAllClick() {
            const btn = document.getElementById('delete-all-btn');
            const state = btn.dataset.state || "0";

            if (state === "0") {
                btn.dataset.state = "1"; btn.innerText = "Are you sure? Click to confirm";
                clearTimeout(deleteConfirmTimeout);
                deleteConfirmTimeout = setTimeout(() => resetDeleteButton(), 3000);
            } else if (state === "1") {
                clearTimeout(deleteConfirmTimeout);
                btn.dataset.state = "2"; countdownValue = 5;
                btn.innerText = `Deleting in ${countdownValue}... Click to cancel`;
                deleteCountdownInterval = setInterval(() => {
                    countdownValue--;
                    if (countdownValue > 0) btn.innerText = `Deleting in ${countdownValue}... Click to cancel`;
                    else {
                        clearInterval(deleteCountdownInterval);
                        btn.innerText = "Deleting everything..."; btn.disabled = true;
                        executeDeleteAll();
                    }
                }, 1000);
            } else if (state === "2") {
                clearInterval(deleteCountdownInterval); resetDeleteButton();
            }
        }

        async function executeDeleteAll() {
            try {
                let deleting = true;
                while(deleting) {
                    const res = await fetch(`${API_URL}/posts?skip=0&limit=50`);
                    const posts = await res.json();
                    if (posts.length === 0) { deleting = false; break; }
                    for (const p of posts) {
                        await fetch(`${API_URL}/posts/${p.id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } });
                    }
                }
                fetchStatuses(true);
            } catch(e) {
                alert("An error occurred while deleting all posts.");
            } finally {
                resetDeleteButton(); closeMenu();
            }
        }

        fetchStatuses(true);
        checkSavedLogin(); 
        
        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => { 
            if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu(); 
        });
    </script>
</body>
</html>
