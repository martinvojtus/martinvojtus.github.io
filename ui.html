<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Martin Vojtuš — adaptive Landscape Build</title>
    <style>
        :root {
            --bg-start: #ffffff;
            --bg-end: #000000;
            --iphone-gray: #e0e0e0;
            --text-white: #ffffff;
            --radius-pill: 100px;
            --f-big: 1.85rem;
            --f-small: 0.65rem;
            --gap: 8px; /* Fixná medzera 8px */
        }

        /* 🛠️ Core Reset */
        * { box-sizing: border-box; font-weight: 400 !important; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; margin: 0;
            background-color: var(--bg-start);
            color: var(--text-white);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            animation: bodyDarken 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @keyframes bodyDarken { to { background-color: var(--bg-end); } }

        /* --- 📱 IPHONE RÁM (Portrait & Landscape) --- */
        .iphone-frame {
            position: absolute;
            background-color: var(--iphone-gray);
            z-index: 10;
            will-change: transform;
            /* Default Portrait */
            width: 50vw; 
            aspect-ratio: 1170 / 2532;
            border-radius: 8vw;
            animation: 
                flyIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                expandToBlack 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        /* Úprava pre Landscape (Na šírku) */
        @media (orientation: landscape) {
            .iphone-frame {
                width: auto;
                height: 50vh; /* Na šírku berieme výšku ako základ */
                aspect-ratio: 2532 / 1170; /* Preklopený pomer strán */
                border-radius: 4vh;
            }
        }

        @keyframes flyIn {
            0% { transform: translateY(110vh) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes expandToBlack {
            to { transform: scale(20); background-color: var(--bg-end); }
        }

        /* --- 🎨 LOGO (60px, 100% Fill) --- */
        .logo-svg {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            fill: #000;
            z-index: 40;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
            will-change: transform, opacity, fill;
            animation: 
                fadeInCenter 0.6s ease forwards 1.4s,
                moveLogo 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards,
                logoToWhite 1.2s ease 2.2s forwards;
        }

        @keyframes fadeInCenter { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes logoToWhite { to { fill: var(--text-white); } }

        @keyframes moveLogo {
            to { transform: translate(-50%, calc(-50% - 100px)) scale(1); }
        }

        /* --- 🏁 ELEMENTY WEBU (Staggered Fly-In) --- */
        .ui-element {
            position: absolute;
            left: 50%;
            z-index: 35;
            opacity: 0;
            will-change: transform, opacity;
        }

        @keyframes flyFromBottom {
            0% { transform: translate(-50%, 80px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        /* 1. Martin Vojtuš */
        .logo-text {
            bottom: calc(50% + 40px + var(--gap));
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            white-space: nowrap;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.8s forwards;
        }

        /* 2. COSMOS Pill (Anchor v strede) */
        .pill {
            top: 50%;
            width: 100%;
            max-width: 340px;
            height: 80px;
            border-radius: var(--radius-pill);
            display: flex; align-items: center; justify-content: center;
            background: var(--text-white); color: #000; border: none; cursor: pointer;
            animation: flyFromBottomCenter 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.95s forwards;
        }
        
        @keyframes flyFromBottomCenter {
            0% { transform: translate(-50%, 30px); opacity: 0; }
            100% { transform: translate(-50%, -50%); opacity: 1; }
        }

        .pill h1 { font-size: var(--f-big); margin: 0; letter-spacing: -0.02em; }

        /* 3. Footer (Čisto biely) */
        footer {
            top: calc(50% + 40px + var(--gap));
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #ffffff;
            white-space: nowrap;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 3.1s forwards;
        }

        /* --- 🌀 LOADING OVERLAY --- */
        #l-ov { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; 
        }
        .l-bar-bg { width: 180px; height: 1px; background: rgba(255,255,255,0.2); overflow: hidden; }
        .l-bar-fill { height: 100%; width: 0%; background: #fff; }
        @keyframes load { to { width: 100%; } }
    </style>
</head>
<body>

    <div class="iphone-frame"></div>

    <svg class="logo-svg" viewBox="-234 -135 468 405" preserveAspectRatio="xMidYMid meet">
        <path d="M 0,0 L 233.827, -135 L 233.827, 135 L 0, 270 L -233.827, 135 L -233.827, -135 Z" />
    </svg>

    <div class="ui-element logo-text">MARTINVOJTUS</div>
    
    <div class="ui-element pill" onclick="startLoading()">
        <h1>COSMOS</h1>
    </div>

    <footer class="ui-element">Martin Vojtuš • 2026</footer>

    <div id="l-ov">
        <div class="l-bar-bg"><div class="l-bar-fill" id="l-f"></div></div>
    </div>

    <script>
        function startLoading() {
            document.getElementById('l-ov').style.display = 'flex';
            document.getElementById('l-f').style.animation = "load 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards";
            setTimeout(() => { window.location.replace("https://www.cosmos.so/martinvojtus"); }, 2500);
        }
    </script>
</body>
</html>
