<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone iOS Status Bar</title>
    <style>
        /* 🎨 Základné centrovanie */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 📐 Telo iPhonu */
        .iphone-container {
            position: relative;
            width: 50vw; 
            max-height: 92vh;
            aspect-ratio: 1170 / 2532;
            background-color: #e0e0e0;
            border-radius: 8vw; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* 📶 Status Bar (Horná lišta) */
        .status-bar {
            position: absolute;
            top: 1.5vw;
            left: 0;
            right: 0;
            padding: 0 3.5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 3vw;
            color: #000;
        }

        .time {
            font-size: 1.6vw;
            font-weight: 400; /* Regular font podľa požiadavky */
            letter-spacing: -0.02em;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 0.8vw;
        }

        .icon {
            width: 1.8vw;
            height: auto;
            fill: black;
        }

        .battery-icon {
            width: 2.5vw;
        }
    </style>
</head>
<body>

    <div class="iphone-container">
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="status-icons">
                <svg class="icon" viewBox="0 0 18 12">
                    <path d="M1 12h2V8H1v4zm4 0h2V5H5v7zm4 0h2V2H9v10zm4 0h2V0h-2v12z"/>
                </svg>
                <svg class="icon" viewBox="0 0 20 14">
                    <path d="M10 14l10-10.3C19.3 3 15.5 1 10 1S.7 3 0 3.7L10 14z"/>
                </svg>
                <svg class="icon battery-icon" viewBox="0 0 26 12">
                    <path d="M22 2H2C0.9 2 0 2.9 0 4v4c0 1.1 0.9 2 2 2h20c1.1 0 2-0.9 2-2V4c0-1.1-0.9-2-2-2zM22 8.5H2v-5h20v5zM25 4v4h1V4h-1z" fill-opacity="0.4"/>
                    <rect x="2" y="4" width="16" height="4" rx="1" />
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
