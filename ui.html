<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Martin Vojtuš — Reset & Load Build</title>
    <style>
        :root {
            --bg-start: #ffffff;
            --bg-end: #000000;
            --iphone-gray: #e0e0e0;
            --text-white: #ffffff;
            --radius-pill: 100px;
            --f-big: 1.85rem;
            --f-small: 0.65rem;
            --gap: 8px;
        }

        * { box-sizing: border-box; font-weight: 400 !important; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; margin: 0;
            background-color: var(--bg-start);
            color: var(--text-white);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            /* Plynulý prechod farieb pozadia */
            transition: background-color 0.5s ease;
            animation: bodyDarken 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @keyframes bodyDarken { to { background-color: var(--bg-end); } }

        /* --- IPHONE RÁM --- */
        .iphone-frame {
            position: absolute;
            background-color: var(--iphone-gray);
            z-index: 10;
            width: 50vw; 
            aspect-ratio: 1170 / 2532;
            border-radius: 8vw;
            animation: 
                flyIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                expandToBlack 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @media (orientation: landscape) {
            .iphone-frame { width: auto; height: 50vh; aspect-ratio: 2532 / 1170; border-radius: 4vh; }
        }

        @keyframes flyIn {
            0% { transform: translateY(110vh) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes expandToBlack {
            to { transform: scale(20); background-color: var(--bg-end); }
        }

        /* --- LOGO (60px) --- */
        .logo-svg {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            fill: #000;
            z-index: 40;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
            transition: opacity 0.3s ease;
            animation: 
                fadeInCenter 0.6s ease forwards 1.4s,
                moveLogo 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards,
                logoToWhite 1.2s ease 2.2s forwards;
        }

        @keyframes fadeInCenter { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes logoToWhite { to { fill: var(--text-white); } }
        @keyframes moveLogo { to { transform: translate(-50%, calc(-50% - 100px)) scale(1); } }

        /* --- UI ELEMENTY --- */
        .ui-element {
            position: absolute;
            left: 50%;
            z-index: 35;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @keyframes flyFromBottom {
            0% { transform: translate(-50%, 80px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        .logo-text {
            bottom: calc(50% + 40px + var(--gap));
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.8s forwards;
        }

        /* --- TLAČIDLO S DYNAMICKÝM RESETOM --- */
        .pill {
            top: 50%;
            width: 340px;
            height: 80px;
            border-radius: var(--radius-pill);
            display: flex; align-items: center; justify-content: center;
            background: var(--text-white); 
            color: #000; 
            border: none; 
            cursor: pointer;
            overflow: hidden;
            position: absolute;
            left: 50%;
            transform: translate(-50%, 30px);
            animation: flyFromBottomCenter 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.95s forwards;
            /* Plynulá zmena farby tlačidla */
            transition: background-color 0.4s ease, opacity 0.3s ease;
        }
        
        @keyframes flyFromBottomCenter {
            0% { transform: translate(-50%, 30px); opacity: 0; }
            100% { transform: translate(-50%, -50%); opacity: 1; }
        }

        .pill h1 { 
            font-size: var(--f-big); margin: 0; letter-spacing: -0.02em; 
            transition: opacity 0.2s ease;
            z-index: 2;
        }

        .loading-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #000;
            z-index: 1;
        }

        /* TRIEDY PRE KLIK */
        body.white-reset { background-color: #ffffff !important; transition: background-color 0.4s ease; }
        .pill.gray-reset { background-color: var(--iphone-gray) !important; pointer-events: none; }
        .pill.loading-start .loading-fill { 
            width: 100%; 
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        footer {
            top: calc(50% + 40px + var(--gap));
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #ffffff;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 3.1s forwards;
        }

        .hide-now { opacity: 0 !important; }
    </style>
</head>
<body>

    <div class="iphone-frame"></div>

    <svg id="logo" class="logo-svg" viewBox="-234 -135 468 405" preserveAspectRatio="xMidYMid meet">
        <path d="M 0,0 L 233.827, -135 L 233.827, 135 L 0, 270 L -233.827, 135 L -233.827, -135 Z" />
    </svg>

    <div id="text" class="ui-element logo-text">MARTINVOJTUS</div>
    
    <button id="cosmos-btn" class="ui-element pill" onclick="handleTransition()">
        <div class="loading-fill" id="fill"></div>
        <h1>COSMOS</h1>
    </button>

    <footer id="footer" class="ui-element">Martin Vojtuš • 2026</footer>

    <script>
        function handleTransition() {
            const btn = document.getElementById('cosmos-btn');
            const body = document.body;
            const logo = document.getElementById('logo');
            const text = document.getElementById('text');
            const foot = document.getElementById('footer');

            // 1. Zmiznú texty a logo
            logo.classList.add('hide-now');
            text.classList.add('hide-now');
            foot.classList.add('hide-now');
            btn.querySelector('h1').style.opacity = '0';

            // 2. Reset farieb (Biele pozadie, sivý button)
            setTimeout(() => {
                body.classList.add('white-reset');
                btn.classList.add('gray-reset');
            }, 100);

            // 3. Spustenie loadingu až PO resete farieb
            setTimeout(() => {
                btn.classList.add('loading-start');
            }, 600); // 0.5s pauza na "vydýchnutie" v bielo-sivej

            // 4. Presmerovanie
            setTimeout(() => {
                window.location.replace("https://www.cosmos.so/martinvojtus");
            }, 2300);
        }
    </script>
</body>
</html>
