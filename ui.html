<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            --black: #000000;
            --white: #ffffff;
            --grey-50: rgba(0, 0, 0, 0.5);
            --divider: rgba(0, 0, 0, 0.1);
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            --border-radius: 1rem; 
            --gap-item: 1rem; 
            --letter-spacing: 0.05em;
            --glass-opacity: 0.6; 
            --glass-blur: 25px;   
            --danger: #ff4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-50: rgba(255, 255, 255, 0.5); 
                --divider: rgba(255, 255, 255, 0.1); 
                --glass-rgb: 0, 0, 0;   
            }
        }

        html { -webkit-text-size-adjust: 100%; }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-weight: 400; 
            font-family: 'Space Grotesk', sans-serif; 
            letter-spacing: var(--letter-spacing); 
            transition: none !important; 
            animation: none !important;
        }

        b, strong { font-weight: 700 !important; }

        body {
            margin: 0; padding: 0;
            background-color: var(--white); color: var(--black);
            line-height: 1.5; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .menu-link, .status-date, .status-edited, .status-author, .footer-info, .submit-btn, .form-input, .logo-text, .status-title {
            line-height: 1;
        }

        .divider { width: 100%; height: 1px; background-color: var(--divider); }

        header {
            position: fixed; top: 0; left: 0; width: 100%; 
            display: flex; justify-content: center; padding: var(--gap-item) 0; 
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            display: flex; justify-content: space-between; align-items: center; padding: 0 var(--gap-item); 
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { width: 1rem; height: 1rem; display: block; flex-shrink: 0; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); white-space: nowrap; margin: 0; }

        .menu-toggle { width: 1rem; height: 1rem; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 2100; position: relative; }
        /* 🛠️ OPRAVA: Zaoblenie a jemne prispôsobená hrúbka pre konzistentnosť so SVG */
        .line { width: 1rem; height: 1.5px; background-color: var(--black); position: absolute; border-radius: 2px; }
        .line:nth-child(1) { transform: translateY(-0.25rem); }
        .line:nth-child(2) { transform: translateY(0.25rem); }
        /* 🛠️ OPRAVA: ScaleX(1.4) zabezpečí, že X bude rovnako široké ako pôvodné rovnobežné čiary */
        .menu-toggle.active .line:nth-child(1) { transform: translateY(0) rotate(45deg) scaleX(1.4); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(0) rotate(-45deg) scaleX(1.4); }

        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: auto;
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 1500; 
            padding: calc(3rem + var(--gap-item)) 0 var(--gap-item) 0; 
            display: none; flex-direction: column; align-items: center;
        }
        .nav-overlay.active { display: flex; }
        
        .menu-items { width: 100%; max-width: var(--content-width); display: flex; flex-direction: column; gap: var(--gap-item); padding: 0 var(--gap-item); }
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; display: inline-block; padding: 0; border: none; background: transparent; text-align: left; margin: 0; }

        main {
            padding: calc(3rem + var(--gap-item)) var(--gap-item) var(--gap-item); 
            width: 100%; max-width: var(--content-width); 
            flex-grow: 1; display: flex; flex-direction: column; gap: var(--gap-item);
        }

        #section-feed { display: flex; flex-direction: column; gap: var(--gap-item); }
        body.is-logged-in #feed-admin-zone { display: flex; }
        #feed-admin-zone { display: none; flex-direction: column; gap: var(--gap-item); padding-bottom: var(--gap-item); border-bottom: 1px solid var(--divider); }

        #login-ui { display: flex; flex-direction: column; gap: var(--gap-item); }
        #logout-ui { display: none; }
        body.is-logged-in #login-ui { display: none; }
        body.is-logged-in #logout-ui { display: flex; flex-direction: column; gap: var(--gap-item); }

        .status-feed { max-width: 600px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 0; }
        .status-card { border-bottom: 1px solid var(--divider); padding: var(--gap-item) 0; display: flex; flex-direction: column; gap: var(--gap-item); }
        .status-card:first-child { padding-top: 0; }
        .status-card:last-child { border-bottom: none; }

        .status-date, .status-edited, .status-author { 
            font-size: var(--size-small); color: var(--grey-50); 
            background-color: var(--divider); padding: 0 var(--gap-item); height: 3rem; 
            border-radius: var(--border-radius); display: inline-flex; align-items: center; width: fit-content;
        }
        .status-date, .status-edited { text-transform: uppercase; }
        .status-author { font-weight: 400; }

        .admin-action-btn { 
            background-color: var(--divider); border: none; border-radius: var(--border-radius); 
            color: var(--black); cursor: pointer; 
            width: 3rem; height: 3rem; 
            display: inline-flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .admin-action-btn svg, .icon-btn svg { width: 1rem; height: 1rem; display: block; flex-shrink: 0; }

        .status-title { font-size: var(--size-large); margin: 0; color: var(--black); font-weight: 700 !important; }
        .status-image { width: 100%; height: auto; border-radius: var(--border-radius); display: block; }
        
        .status-text { font-size: var(--size-small); color: var(--black); opacity: 0.8; word-wrap: break-word; margin: 0; text-align: justify; -webkit-hyphens: auto; hyphens: auto; }
        .status-text b { font-weight: bold; }
        .status-text i { font-style: italic; }
        .status-text u { text-decoration: underline; }

        .loading-text { text-align: center; font-size: var(--size-small); color: var(--grey-50); padding: var(--gap-item) 0; }

        .form-input, .submit-btn { 
            height: 3rem; border: 1px solid var(--black); border-radius: var(--border-radius); 
            background: transparent; font-size: var(--size-small); padding: 0 var(--gap-item); 
            outline: none; color: var(--black); display: flex; align-items: center; gap: var(--gap-item); 
        }

        .solid-input { background-color: var(--divider) !important; border: none !important; }
        
        #edit-author { display: none; margin-bottom: var(--gap-item); }
        #editor-form.adv-open #edit-author { display: flex; }

        #edit-text {
            width: 100%; border: 1px solid var(--black); border-radius: var(--border-radius); 
            background: transparent; font-size: var(--size-small); padding: var(--gap-item); 
            outline: none; color: var(--black); min-height: 5rem; overflow-y: auto; word-wrap: break-word;
            text-align: justify; -webkit-hyphens: auto; hyphens: auto;
        }
        #edit-text:empty:before { content: attr(data-placeholder); color: var(--grey-50); pointer-events: none; display: block; }
        #edit-text.input-error:empty:before { color: var(--danger) !important; }

        .input-error { border-color: var(--danger) !important; }
        .input-error::placeholder { color: var(--danger) !important; opacity: 1; }

        .submit-btn { background: var(--black); color: var(--white); text-transform: uppercase; cursor: pointer; justify-content: center; white-space: nowrap; }
        .icon-btn { width: 3rem; height: 3rem; flex-shrink: 0; padding: 0; }
        .secondary-btn { background: transparent; color: var(--black); }
        .danger-btn { background: var(--danger) !important; color: #000000 !important; border: none !important; }

        #quick-buttons { display: flex; gap: var(--gap-item); width: calc(6rem + var(--gap-item)); margin-left: var(--gap-item); }
        #editor-form.adv-open #quick-buttons { display: none; }
        #advanced-section-wrapper { display: none; flex-direction: column; gap: var(--gap-item); padding-top: var(--gap-item); }
        #editor-form.adv-open #advanced-section-wrapper { display: flex; }
        
        #upload-container { display: flex; cursor: pointer; flex-grow: 1; overflow: hidden; }
        #file-name-display { color: var(--grey-50); text-align: right; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; font-size: var(--size-small); }
        
        #thumb-container { 
            width: 3rem; height: 3rem; flex-shrink: 0; display: flex; justify-content: center; align-items: center; 
            border-radius: var(--border-radius); overflow: hidden; position: relative; 
        }
        #upload-thumbnail { display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; border: none; }
        #placeholder-icon { display: block; color: var(--black); }

        #upload-ui-wrapper.has-image #upload-action-label { display: none; }
        #upload-ui-wrapper.has-image #file-name-display { color: var(--black); text-align: left; }
        #upload-ui-wrapper.has-image #upload-thumbnail { display: block; }
        #upload-ui-wrapper.has-image #placeholder-icon { display: none; }
        #upload-ui-wrapper.has-image #clear-file-btn { display: flex; }
        #clear-file-btn { display: none; }

        .custom-checkbox {
            appearance: none; width: 1rem; height: 1rem; border: 1px solid var(--black);
            border-radius: calc(var(--border-radius) / 3); cursor: pointer; display: grid; place-content: center;
        }
        .custom-checkbox::before { content: ""; width: 0.25rem; height: 0.5rem; border: solid var(--white); border-width: 0 1.2px 1.2px 0; transform: rotate(45deg); opacity: 0; margin-top: -0.125rem; }
        .custom-checkbox:checked { background-color: var(--black); }
        .custom-checkbox:checked::before { opacity: 1; }

        .footer-info { font-size: var(--size-small); color: var(--grey-50); text-transform: uppercase; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="window.scrollTo(0,0)">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1rem" height="1rem" viewBox="72.35 270 935.31 810" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="var(--black)" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle" onclick="toggleMenu()"><div class="line"></div><div class="line"></div></div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <a class="menu-link" onclick="window.scrollTo(0,0); closeMenu();"><span>Feed</span></a>
            <div class="divider"></div>
            <div id="login-ui">
                <form id="login-form" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; width: 100%; gap: var(--gap-item); margin: 0;">
                    <div style="display: flex; width: 100%; gap: var(--gap-item);">
                        <input type="password" id="admin-pass" class="form-input" placeholder="Password..." style="flex-grow: 1;">
                        <button type="submit" id="login-btn" class="submit-btn icon-btn">
                            <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                    </div>
                    <label class="form-input solid-input" style="cursor: pointer; justify-content: flex-start; user-select: none;">
                        <input type="checkbox" id="remember-login" class="custom-checkbox">
                        <span>Remember me</span>
                    </label>
                </form>
            </div>
            <div id="logout-ui">
                <button onclick="handleLogout()" class="submit-btn danger-btn" style="width: 100%;">LOGOUT</button>
            </div>
            <div class="divider"></div>
            <div class="footer-info">build v5.3.6 • 2026</div>
        </div>
    </nav>

    <main>
        <div id="section-feed">
            <div id="feed-admin-zone">
                <form id="editor-form" onsubmit="handleMainSubmit(event)" style="display: flex; flex-direction: column; width: 100%;">
                    
                    <input type="text" id="edit-author" class="form-input" placeholder="Author (optional)">

                    <div style="display: flex; width: 100%;">
                        <input type="text" id="edit-title" class="form-input" placeholder="Quick thought..." style="flex-grow: 1; min-width: 0;">
                        <div id="quick-buttons">
                            <button type="button" class="submit-btn icon-btn" onclick="toggleAdvancedEditor(true)"><svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
                            <button type="submit" id="quick-btn" class="submit-btn icon-btn"><svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        </div>
                    </div>
                    
                    <div id="advanced-section-wrapper">
                        
                        <div id="edit-text" contenteditable="true" data-placeholder="Content"></div>
                        
                        <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; width: 100%;">
                            <button type="button" class="admin-action-btn" style="width: 100%;" onmousedown="event.preventDefault(); formatText('bold')" title="Bold">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
                            </button>
                            <button type="button" class="admin-action-btn" style="width: 100%;" onmousedown="event.preventDefault(); formatText('italic')" title="Italic">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
                            </button>
                            <button type="button" class="admin-action-btn" style="width: 100%;" onmousedown="event.preventDefault(); formatText('underline')" title="Underline">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
                            </button>
                            <button type="button" class="admin-action-btn" style="width: 100%;" onmousedown="event.preventDefault(); formatText('justifyLeft')" title="Align Left">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>
                            </button>
                            <button type="button" class="admin-action-btn" style="width: 100%;" onmousedown="event.preventDefault(); formatText('justifyRight')" title="Align Right">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="7" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="7" y2="18"></line></svg>
                            </button>
                            <button type="button" class="admin-action-btn" style="width: 100%;" onmousedown="event.preventDefault(); formatText('justifyFull')" title="Align Justify">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
                            </button>
                        </div>

                        <div id="upload-ui-wrapper" style="display: flex; gap: var(--gap-item); width: 100%;">
                            <div id="thumb-container" class="solid-input">
                                <svg id="placeholder-icon" width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <img id="upload-thumbnail" src="" alt="">
                            </div>
                            
                            <input type="file" id="edit-image" accept="image/*" style="display: none;" onchange="updateImageUIState()">
                            
                            <div id="upload-container" class="form-input solid-input" onclick="document.getElementById('edit-image').click()">
                                <span id="upload-action-label" style="color: var(--black);">Upload image</span>
                                <span id="file-name-display"></span>
                            </div>
                            
                            <button type="button" id="clear-file-btn" data-confirm="false" class="submit-btn secondary-btn icon-btn solid-input" onclick="clearImageSelection(event)">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                        
                        <label class="form-input solid-input" style="cursor: pointer; justify-content: flex-start; user-select: none;">
                            <input type="checkbox" id="edit-show-date" class="custom-checkbox" checked>
                            <span>Show date & time post</span>
                        </label>
                        
                        <div class="divider"></div>
                        <div style="display: flex; gap: var(--gap-item);">
                            <button type="submit" id="publish-btn" class="submit-btn" style="flex-grow: 1;">PUBLISH</button>
                            <button type="button" class="submit-btn icon-btn" onclick="toggleAdvancedEditor(false)">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                        <div class="divider"></div>
                        <button type="button" id="delete-all-btn" data-state="0" class="submit-btn danger-btn" style="width: 100%;" onclick="handleDeleteAllClick()">DELETE ALL POSTS</button>
                    </div>
                </form>
            </div>
            <div id="status-container" class="status-feed"></div>
            <div id="loading-indicator" class="loading-text">Loading...</div>
        </div>
    </main>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        let secretKey = ""; let editingId = null; let globalPosts = []; let currentImageUrl = null; let removeImageFlag = false; 
        let currentOffset = 0; const postsLimit = 10; let isLoading = false; let hasMorePosts = true;
        let deleteTimer = null;

        const titleInput = document.getElementById('edit-title');
        const textInput = document.getElementById('edit-text');
        const passInput = document.getElementById('admin-pass');
        const authorInput = document.getElementById('edit-author');
        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');

        function formatText(command) {
            document.execCommand(command, false, null);
            textInput.focus();
        }

        [titleInput, passInput, authorInput].forEach(inp => {
            if(inp) inp.addEventListener('input', () => {
                inp.classList.remove('input-error');
                if(inp.id === 'edit-title') inp.placeholder = document.getElementById('editor-form').classList.contains('adv-open') ? 'Title' : 'Quick thought...';
                if(inp.id === 'admin-pass') inp.placeholder = 'Password...';
                if(inp.id === 'edit-author') inp.placeholder = 'Author (optional)';
            });
        });

        textInput.addEventListener('input', () => {
            textInput.classList.remove('input-error');
            textInput.setAttribute('data-placeholder', 'Content');
        });

        function toggleMenu() { menuToggle.classList.toggle('active'); navOverlay.classList.toggle('active'); }
        function closeMenu() { menuToggle.classList.remove('active'); navOverlay.classList.remove('active'); }

        async function checkRememberedLogin() {
            const savedKey = localStorage.getItem('mv_admin_key');
            if (savedKey) {
                try {
                    const res = await fetch(`${API_URL}/verify`, { method: 'GET', headers: { 'x-admin-password': savedKey } });
                    if (res.ok) { secretKey = savedKey; document.body.classList.add('is-logged-in'); refreshFeedUI(); } 
                    else { localStorage.removeItem('mv_admin_key'); }
                } catch (e) {}
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const tempKey = passInput.value;
            const rememberMe = document.getElementById('remember-login').checked;
            try {
                const res = await fetch(`${API_URL}/verify`, { method: 'GET', headers: { 'x-admin-password': tempKey } });
                if (res.ok) { 
                    secretKey = tempKey; document.body.classList.add('is-logged-in'); closeMenu(); refreshFeedUI(); passInput.value = ''; 
                    if (rememberMe) { localStorage.setItem('mv_admin_key', secretKey); } else { localStorage.removeItem('mv_admin_key'); }
                } else { passInput.classList.add('input-error'); passInput.value = ''; passInput.placeholder = 'Invalid password!'; }
            } catch (err) { passInput.classList.add('input-error'); }
        }

        function handleLogout() {
            secretKey = ""; passInput.value = ''; toggleAdvancedEditor(false);
            localStorage.removeItem('mv_admin_key');
            document.body.classList.remove('is-logged-in'); closeMenu();
            resetDeleteAllBtn(); refreshFeedUI();
        }

        function refreshFeedUI() { document.getElementById('status-container').innerHTML = globalPosts.map(s => renderSinglePost(s)).join(''); }
        function linkify(text) { 
            if (text.includes('<a href=')) return text; 
            return text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color: inherit; text-decoration: none; opacity: 0.6;">$1</a>'); 
        }

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const newName = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
                        canvas.toBlob(blob => { 
                            resolve(new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() })); 
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function fetchStatuses(reset = false) {
            if (reset) { currentOffset = 0; hasMorePosts = true; globalPosts = []; document.getElementById('status-container').innerHTML = ''; }
            if (isLoading || !hasMorePosts) return;
            isLoading = true;
            try {
                const response = await fetch(`${API_URL}/posts?skip=${currentOffset}&limit=${postsLimit}`);
                const newPosts = await response.json();
                if (newPosts.length < postsLimit) hasMorePosts = false;
                currentOffset += newPosts.length; globalPosts = globalPosts.concat(newPosts);
                document.getElementById('status-container').innerHTML += newPosts.map(s => renderSinglePost(s)).join('');
            } catch (error) {} finally { isLoading = false; document.getElementById('loading-indicator').style.display = hasMorePosts ? 'block' : 'none'; }
        }

        window.addEventListener('scroll', () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) fetchStatuses(); });

        function renderSinglePost(s) {
            const showDate = s.show_date !== false;
            let dateHtml = showDate ? `<span class="status-date">${new Date(s.at).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase()}</span>` : '';
            let idBadgeHtml = secretKey ? `<span class="status-date" style="margin-right: var(--gap-item);">#${s.id}</span>` : '';
            
            let editedHtml = (showDate && s.updated_at) ? `<div class="status-edited">EDITED: ${new Date(s.updated_at).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase()}</div>` : '';
            let authorHtml = (s.author && s.author.trim() !== "") ? `<div class="status-author">${s.author.trim()}</div>` : '';
            
            let bottomInfoHtml = '';
            if (editedHtml || authorHtml) {
                bottomInfoHtml = `<div style="display: flex; justify-content: space-between; width: 100%; gap: var(--gap-item);">
                    <div>${editedHtml}</div>
                    <div style="margin-left: auto;">${authorHtml}</div>
                </div>`;
            }

            const titleHtml = s.title ? `<h3 class="status-title">${s.title}</h3>` : '';
            const imageHtml = s.image_url ? `<img src="${s.image_url}" class="status-image" alt="image" loading="lazy">` : '';
            
            let textHtml = s.text ? `<div class="status-text">${linkify(s.text)}</div>` : '';
            
            // 🛠️ OPRAVA: Aj sem (delete tlačidlo feedu) išla zjednodušená ikona koša
            let adminActionsHtml = secretKey ? `<div style="display: flex; gap: var(--gap-item);"><button onclick="startEdit(${s.id})" class="admin-action-btn"><svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></button><button id="feed-del-btn-${s.id}" onclick="handleDeleteFeed(${s.id})" class="admin-action-btn"><svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button></div>` : '';

            let topRowHtml = `<div style="display: flex; justify-content: space-between; align-items: center;"><div>${idBadgeHtml}${dateHtml}</div>${adminActionsHtml}</div>`;
            
            return `<div class="status-card">${topRowHtml}${titleHtml}${imageHtml}${textHtml}${bottomInfoHtml}</div>`;
        }

        function toggleAdvancedEditor(show) {
            const form = document.getElementById('editor-form');
            titleInput.classList.remove('input-error'); textInput.classList.remove('input-error'); authorInput.classList.remove('input-error');
            if (show) { form.classList.add('adv-open'); titleInput.placeholder = "Title"; } 
            else { 
                form.classList.remove('adv-open'); editingId = null; titleInput.value = ""; textInput.innerHTML = ""; authorInput.value = ""; document.getElementById('edit-image').value = ""; 
                removeImageFlag = false; currentImageUrl = null; updateImageUIState(); titleInput.placeholder = "Quick thought..."; document.getElementById('publish-btn').innerText = "PUBLISH"; 
            }
        }

        function startEdit(id) {
            const post = globalPosts.find(p => p.id === id); if(!post) return;
            editingId = id; currentImageUrl = post.image_url; removeImageFlag = false;
            titleInput.value = post.title || ""; textInput.innerHTML = post.text || ""; authorInput.value = post.author || "";
            document.getElementById('edit-show-date').checked = post.show_date !== false;
            document.getElementById('publish-btn').innerText = "SAVE CHANGES";
            updateImageUIState(); toggleAdvancedEditor(true); window.scrollTo(0,0);
        }

        function updateImageUIState() {
            const wrapper = document.getElementById('upload-ui-wrapper');
            const input = document.getElementById('edit-image');
            const thumbnail = document.getElementById('upload-thumbnail');
            const hasNew = input.files.length > 0; const hasOld = currentImageUrl && !removeImageFlag;
            if (hasNew || hasOld) {
                wrapper.classList.add('has-image');
                thumbnail.src = hasNew ? URL.createObjectURL(input.files[0]) : currentImageUrl;
                document.getElementById('file-name-display').innerText = hasNew ? input.files[0].name : "image.jpg";
            } else { wrapper.classList.remove('has-image'); }
        }

        function clearImageSelection(e) {
            const btn = e.currentTarget;
            if (btn.dataset.confirm === "true") { document.getElementById('edit-image').value = ""; removeImageFlag = true; btn.classList.remove('danger-btn'); btn.dataset.confirm = "false"; updateImageUIState(); }
            else { btn.classList.add('danger-btn'); btn.dataset.confirm = "true"; setTimeout(() => { btn.classList.remove('danger-btn'); btn.dataset.confirm = "false"; }, 3000); }
        }

        async function handleMainSubmit(e) { 
            e.preventDefault(); 
            const isAdv = document.getElementById('editor-form').classList.contains('adv-open');
            if (isAdv) await handlePublish(); else await handleQuickPost(); 
        }

        async function handlePublish() {
            let textVal = textInput.innerHTML.trim();
            if (textVal === '<br>') textVal = ''; 

            const hasImg = document.getElementById('edit-image').files.length > 0 || (currentImageUrl && !removeImageFlag);
            if (!textVal && !hasImg) { 
                textInput.classList.add('input-error'); 
                textInput.setAttribute('data-placeholder', 'Content required!'); 
                return; 
            }
            
            const publishBtn = document.getElementById('publish-btn'); publishBtn.disabled = true;
            let finalImageUrl = currentImageUrl; if (removeImageFlag) finalImageUrl = null;
            const imageFile = document.getElementById('edit-image').files[0];
            
            if (imageFile) {
                publishBtn.innerText = "UPLOADING...";
                const compressedFile = await compressImage(imageFile);
                const formData = new FormData(); formData.append("file", compressedFile);
                const upRes = await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": secretKey }, body: formData });
                const upData = await upRes.json(); finalImageUrl = upData.image_url;
            }
            
            publishBtn.innerText = "SAVING...";
            const authorVal = authorInput.value.trim();
            const res = await fetch(editingId ? `${API_URL}/posts/${editingId}` : `${API_URL}/posts`, {
                method: editingId ? "PUT" : "POST",
                headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                body: JSON.stringify({ title: titleInput.value, text: textVal, image_url: finalImageUrl, show_date: document.getElementById('edit-show-date').checked, author: authorVal })
            });
            if (res.ok) { fetchStatuses(true); toggleAdvancedEditor(false); }
            publishBtn.disabled = false;
        }

        async function handleQuickPost() {
            if (!titleInput.value.trim()) { titleInput.classList.add('input-error'); titleInput.placeholder = "Required!"; return; }
            const btn = document.getElementById('quick-btn'); btn.disabled = true;
            const res = await fetch(`${API_URL}/posts`, {
                method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                body: JSON.stringify({ title: "", text: titleInput.value, image_url: null, show_date: true, author: null })
            });
            if (res.ok) { 
                titleInput.value = ""; 
                await fetchStatuses(true); 
                btn.innerHTML = '<svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'; 
                setTimeout(() => { btn.innerHTML = '<svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>'; }, 1000); 
            }
            btn.disabled = false;
        }

        async function handleDeleteFeed(id) {
            const btn = document.getElementById(`feed-del-btn-${id}`);
            if (btn.dataset.confirm === "true") { await fetch(`${API_URL}/posts/${id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } }); fetchStatuses(true); }
            else { btn.classList.add('danger-btn'); btn.dataset.confirm = "true"; setTimeout(() => { btn.classList.remove('danger-btn'); btn.dataset.confirm = "false"; }, 3000); }
        }

        function handleDeleteAllClick() {
            const btn = document.getElementById('delete-all-btn');
            if (btn.dataset.state === "0") { btn.dataset.state = "1"; btn.innerText = "CLICK TO CONFIRM"; setTimeout(() => { if(btn.dataset.state === "1") resetDeleteAllBtn(); }, 3000); }
            else if (btn.dataset.state === "1") { btn.dataset.state = "2"; startDeleteCountdown(5); }
            else if (btn.dataset.state === "2") { stopDeleteCountdown(); }
        }

        function startDeleteCountdown(seconds) {
            const btn = document.getElementById('delete-all-btn'); let left = seconds; btn.innerText = `CANCEL IN ${left}S`;
            deleteTimer = setInterval(() => { left--; if (left <= 0) { clearInterval(deleteTimer); btn.innerText = "DELETING..."; btn.disabled = true; executeDeleteAll(); } else { btn.innerText = `CANCEL IN ${left}S`; } }, 1000);
        }

        function stopDeleteCountdown() { clearInterval(deleteTimer); resetDeleteAllBtn(); }
        function resetDeleteAllBtn() { const btn = document.getElementById('delete-all-btn'); btn.dataset.state = "0"; btn.innerText = "DELETE ALL POSTS"; btn.disabled = false; }

        async function executeDeleteAll() {
            const res = await fetch(`${API_URL}/posts?skip=0&limit=100`);
            const posts = await res.json();
            for (const p of posts) { await fetch(`${API_URL}/posts/${p.id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } }); }
            fetchStatuses(true); resetDeleteAllBtn(); closeMenu();
        }

        checkRememberedLogin();
        fetchStatuses(true);
        document.addEventListener('click', (e) => { if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu(); });
    </script>
</body>
