<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Martin Vojtuš — Final Clean Transition</title>
    <style>
        :root {
            --bg-start: #ffffff;
            --bg-end: #000000;
            --iphone-gray: #e0e0e0;
            --text-white: #ffffff;
            --radius-pill: 100px;
            --f-big: 1.85rem;
            --f-small: 0.65rem;
            --gap: 8px;
        }

        /* 🛠️ Core Reset */
        * { box-sizing: border-box; font-weight: 400 !important; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; margin: 0;
            background-color: var(--bg-start);
            color: var(--text-white);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            animation: bodyDarken 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @keyframes bodyDarken { to { background-color: var(--bg-end); } }

        /* --- ⚪ BIELA PREKRÝVACIA VRSTVA (Nová) --- */
        #white-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            opacity: 0;
            z-index: 45; /* Medzi pôvodným webom a tlačidlom */
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- 📱 IPHONE RÁM --- */
        #frame {
            position: absolute;
            background-color: var(--iphone-gray);
            z-index: 10;
            width: 50vw; 
            aspect-ratio: 1170 / 2532;
            border-radius: 8vw;
            animation: 
                flyIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                expandToBlack 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @media (orientation: landscape) {
            #frame { width: auto; height: 50vh; aspect-ratio: 2532 / 1170; border-radius: 4vh; }
        }

        @keyframes flyIn {
            0% { transform: translateY(110vh) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes expandToBlack {
            to { transform: scale(30); background-color: var(--bg-end); }
        }

        /* --- 🎨 LOGO (60px, 100% Fill) --- */
        .logo-svg {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            fill: #000;
            z-index: 40;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
            transition: opacity 0.4s ease;
            animation: 
                fadeInCenter 0.6s ease forwards 1.4s,
                moveLogo 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards,
                logoToWhite 1.2s ease 2.2s forwards;
        }

        @keyframes fadeInCenter { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes logoToWhite { to { fill: var(--text-white); } }
        @keyframes moveLogo { to { transform: translate(-50%, calc(-50% - 98px)) scale(1); } }

        /* --- 🏁 UI ELEMENTY --- */
        .ui-element {
            position: absolute;
            left: 50%;
            z-index: 35;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        @keyframes flyFromBottom {
            0% { transform: translate(-50%, 80px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        .logo-text {
            bottom: calc(50% + 40px + var(--gap));
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            white-space: nowrap;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.8s forwards;
        }

        /* --- 📥 TLAČIDLO S VYSOKÝM Z-INDEXOM --- */
        .pill {
            top: 50%;
            width: 340px;
            height: 80px;
            border-radius: var(--radius-pill);
            display: flex; align-items: center; justify-content: center;
            background: var(--text-white); 
            color: #000; 
            border: none; 
            cursor: pointer;
            overflow: hidden;
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50; /* Vždy nad bielou vrstvou */
            animation: flyFromBottomCenter 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.95s forwards;
            transition: background-color 0.5s ease;
        }
        
        @keyframes flyFromBottomCenter {
            0% { transform: translate(-50%, 30px); opacity: 0; }
            100% { transform: translate(-50%, -50%); opacity: 1; }
        }

        .pill h1 { 
            font-size: var(--f-big); margin: 0; letter-spacing: -0.02em; 
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .loading-fill {
            position: absolute;
            top: 0; left: 0;
            width: 0%; height: 100%;
            background: #000;
            z-index: 1;
        }

        .loading-active .loading-fill { 
            width: 100%; 
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        footer {
            top: calc(50% + 40px + var(--gap));
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #ffffff;
            white-space: nowrap;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 3.1s forwards;
        }

        .hidden { opacity: 0 !important; }

        /* Focus styles for keyboard users */
        .pill:focus-visible {
            outline: none;
            box-shadow: 0 0 0 5px rgba(255,255,255,0.08), 0 0 0 8px rgba(0,0,0,0.08) inset;
        }

        /* --- COOKIE BANNER --- */
        #cookie-banner {
            position: fixed;
            left: 50%;
            bottom: 20px;
            /* start slightly off / below so it "flies in" from the bottom */
            transform: translateX(-50%) translateY(24px);
            /* slightly narrower max width to avoid overly wide banner on large displays */
            max-width: 720px;
            width: calc(100% - 40px);
            /* changed to site gray */
            background: var(--iphone-gray);
            color: #0b0b0b;
            /* Use the site's small font size to match typography */
            font-size: var(--f-small);
            /* Use padding derived from the site's gap variable so spacing matches */
            padding: calc(var(--gap) * 1.75) calc(var(--gap) * 2);
            /* visible rectangle with gentle rounded corners */
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            /* put above nearly everything to avoid stacking issues in Safari */
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.32s cubic-bezier(0.2,0,0,1), transform 0.36s cubic-bezier(0.2,0,0,1);
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            /* ensure rectangular appearance (not pill-like) */
            min-height: 56px;
            /* removed outer border as requested */
            font-weight: 400;
            font-family: inherit;
            /* allow content to wrap nicely */
            flex-wrap: nowrap;
            /* force GPU compositing in some Safari cases to avoid rendering bugs */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        /* when shown, slide up into view from bottom edge */
        #cookie-banner.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        #cookie-banner .cookie-text {
            flex: 1 1 auto;
            line-height: 1.35;
            color: inherit;
            /* better wrapping and hyphenation for narrow screens */
            text-align: left;
            hyphens: auto;
            word-break: break-word;
            min-width: 0; /* allow flex children to shrink properly */
        }

        #cookie-banner .cookie-text a {
            color: #0b0b0b;
            text-decoration: underline;
            margin-left: 8px;
        }

        #cookie-banner .cookie-actions {
            display: flex;
            gap: 8px;
            flex: 0 0 auto;
            align-items: center;
        }

        .cookie-btn {
            background: transparent;
            /* removed border */
            border: none;
            color: #0b0b0b;
            padding: 10px 14px;
            border-radius: 999px; /* pill-shaped */
            cursor: pointer;
            font-weight: 600;
            /* match button text sizing with site small font */
            font-size: var(--f-small);
            white-space: nowrap;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* inverted accept: dark button with white text (emphasized) */
        .cookie-btn.accept {
            background: #0b0b0b;
            color: #fff;
            border: none;
        }

        /* focus styling kept subtle for accessibility, no harsh rim */
        .cookie-btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(11,11,11,0.06);
        }

        /* Prefer reduced motion — stop most animations/transitions */
        @media (prefers-reduced-motion: reduce) {
            html, body { animation: none !important; }
            #frame, .logo-svg, .pill, .logo-text, footer { animation: none !important; transition: none !important; transform: none !important; }
            .loading-active .loading-fill { transition: none !important; width: 100% !important; }
            /* keep banner visible without motion */
            #cookie-banner { transition: none !important; opacity: 1 !important; pointer-events: auto !important; transform: translateX(-50%) translateY(0) !important; }
        }

        /* --- RESPONSIVE ADJUSTMENTS FOR COOKIE BANNER --- */
        /* On medium and small screens stack buttons under the text and improve wrapping */
        @media (max-width: 720px) {
            #cookie-banner {
                max-width: 620px;
            }
        }

        @media (max-width: 600px) {
            #cookie-banner {
                /* make banner more compact horizontally */
                width: calc(100% - 28px);
                padding: 12px 14px;
                gap: 10px;
            }
            #cookie-banner .cookie-text {
                font-size: 0.75rem;
            }
        }

        /* Mobile: stack content vertically, buttons full-width under the text */
        @media (max-width: 460px) {
            #cookie-banner {
                flex-direction: column;
                align-items: stretch;
                text-align: left;
                width: calc(100% - 20px);
                padding: 12px;
                gap: 10px;
                min-height: auto;
            }

            #cookie-banner .cookie-text {
                /* ensure the text takes its own line and wraps nicely */
                margin: 0;
            }

            #cookie-banner .cookie-actions {
                display: flex;
                width: 100%;
                gap: 8px;
                flex-direction: column;
                align-items: stretch;
                justify-content: center;
                margin-top: 2px;
            }

            /* make buttons full width and slightly taller for easy tapping */
            .cookie-btn {
                width: 100%;
                padding: 10px 12px;
                text-align: center;
                font-size: 0.85rem;
            }

            /* keep accept visually prominent but stacked below/after decline if desired */
            .cookie-btn.accept {
                order: 2;
            }
            .cookie-btn:not(.accept) {
                order: 1;
            }
        }
    </style>
</head>
<body>

    <div id="white-screen" aria-hidden="true"></div>

    <div id="frame" class="iphone-frame" aria-hidden="true"></div>

    <svg id="logo-main" class="logo-svg" viewBox="-234 -135 468 405" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path d="M 0,0 L 233.827, -135 L 233.827, 135 L 0, 270 L -233.827, 135 L -233.827, -135 Z" />
    </svg>

    <div id="text-main" class="ui-element logo-text" aria-hidden="true">MARTINVOJTUS</div>
    
    <button id="cosmos-btn" class="ui-element pill" aria-label="Open Cosmos" aria-busy="false" type="button">
        <div class="loading-fill" id="fill" aria-hidden="true"></div>
        <h1 role="presentation">COSMOS</h1>
    </button>

    <footer id="footer-main" class="ui-element" aria-hidden="true">Martin Vojtuš • 2026</footer>

    <!-- COOKIE / CONSENT BANNER -->
    <div id="cookie-banner" role="dialog" aria-live="polite" aria-label="Súhlas so spracovaním údajov" aria-hidden="true">
        <div class="cookie-text">
            Používame cookies. Pokračovaním súhlasíte.
            <a href="/privacy">Viac</a>
        </div>
        <div class="cookie-actions">
            <button class="cookie-btn accept" id="cookie-accept">Súhlasím</button>
            <button class="cookie-btn" id="cookie-decline">Nesúhlasím</button>
        </div>
    </div>

    <script>
        (function () {
            const btn = document.getElementById('cosmos-btn');
            const whiteScreen = document.getElementById('white-screen');
            const logo = document.getElementById('logo-main');
            const text = document.getElementById('text-main');
            const foot = document.getElementById('footer-main');
            const fill = document.getElementById('fill');

            // cookie banner elements
            const cookieBanner = document.getElementById('cookie-banner');
            const cookieAccept = document.getElementById('cookie-accept');
            const cookieDecline = document.getElementById('cookie-decline');

            // prevent double activation
            let triggered = false;
            let timeouts = [];

            function clearAllTimeouts() {
                timeouts.forEach(t => clearTimeout(t));
                timeouts = [];
            }

            function handleFinalTransition() {
                if (triggered) return;
                triggered = true;

                // 1. Ostatné prvky plynule zmiznú
                logo.classList.add('hidden');
                text.classList.add('hidden');
                foot.classList.add('hidden');
                btn.querySelector('h1').style.opacity = '0';

                // 2. BIELA VRSTVA PREKRYJE CELÝ WEB
                whiteScreen.style.opacity = "1";
                whiteScreen.setAttribute('aria-hidden', 'false');

                // 3. TLAČIDLO ZMENÍ FARBU NA SIVÚ
                btn.style.backgroundColor = "#e0e0e0";
                btn.style.pointerEvents = "none"; // disable further clicks
                btn.setAttribute('aria-busy', 'true');

                // 4. SPUSTENIE LOADING BARU PO RESETE
                timeouts.push(setTimeout(() => {
                    btn.classList.add('loading-active');
                }, 600));

                const redirectDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 600 : 2300;

                // 5. PRESMEROVANIE
                timeouts.push(setTimeout(() => {
                    window.location.replace("https://www.cosmos.so/martinvojtus");
                }, redirectDelay));
            }

            // Keyboard accessibility: Space or Enter triggers the button
            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleFinalTransition();
                }
            });

            // Also allow activation via click / pointer (debounced by the triggered guard)
            btn.addEventListener('click', handleFinalTransition);

            // Optional: if the user presses Escape before redirect, cancel the transition
            document.addEventListener('keydown', (e) => {
                if ((e.key === 'Escape' || e.key === 'Esc') && triggered) {
                    // Cancel transition (only if we haven't redirected yet)
                    clearAllTimeouts();
                    triggered = false;
                    // revert UI to previous state
                    logo.classList.remove('hidden');
                    text.classList.remove('hidden');
                    foot.classList.remove('hidden');
                    btn.querySelector('h1').style.opacity = '1';
                    whiteScreen.style.opacity = "0";
                    whiteScreen.setAttribute('aria-hidden', 'true');
                    btn.style.backgroundColor = "var(--text-white)";
                    btn.style.pointerEvents = "auto";
                    btn.classList.remove('loading-active');
                    btn.setAttribute('aria-busy', 'false');
                }
            });

            // Provide a small, safe fallback that cleans up timers if page is hidden / unloaded
            window.addEventListener('pagehide', () => clearAllTimeouts());
            window.addEventListener('beforeunload', () => clearAllTimeouts());

            // --- COOKIE BANNER LOGIC ---
            const CONSENT_KEY = 'cookieConsent';

            function setConsent(value) {
                try {
                    localStorage.setItem(CONSENT_KEY, value);
                } catch (e) {
                    // ignore storage errors
                }
                // also set a cookie as fallback
                try {
                    document.cookie = `cookieConsent=${value}; path=/; max-age=${60*60*24*365};`;
                } catch (e) {}
            }

            function hideCookieBanner() {
                cookieBanner.classList.remove('show');
                cookieBanner.setAttribute('aria-hidden', 'true');
            }

            function showCookieBanner() {
                // only show if not already decided
                const existing = (() => {
                    try { return localStorage.getItem(CONSENT_KEY); } catch (e) { return null; }
                })();
                if (existing) return;
                cookieBanner.classList.add('show');
                cookieBanner.setAttribute('aria-hidden', 'false');
                // move focus to Accept for keyboard users, but guard against focus exceptions (Safari)
                try {
                    cookieAccept.focus();
                } catch (e) {
                    // ignore focus errors (some Safari/private modes can throw)
                }
            }

            cookieAccept.addEventListener('click', () => {
                setConsent('accepted');
                hideCookieBanner();
            });

            cookieDecline.addEventListener('click', () => {
                setConsent('declined');
                hideCookieBanner();
            });

            // allow Escape to close banner without choosing (keeps no-consent state)
            cookieBanner.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    hideCookieBanner();
                }
            });

            // Show banner after animations settle (respect reduced motion)
            const bannerDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 600 : 3500;
            // But if user already has consent, don't show
            timeouts.push(setTimeout(showCookieBanner, bannerDelay));

            // Clean up if page hides
            window.addEventListener('pagehide', () => clearAllTimeouts());
        })();
    </script>
</body>
</html>
