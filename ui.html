<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Martin Vojtuš — Finálny Build</title>
    <style>
        :root {
            --bg-start: #ffffff;
            --bg-end: #000000;
            --iphone-gray: #e0e0e0;
            --text-white: #ffffff;
            --radius-pill: 100px;
            --f-big: 1.85rem;
            --f-small: 0.65rem;
            --gap-fix: 10px; /* Fixná medzera 10px všade */
        }

        * { box-sizing: border-box; font-weight: 400 !important; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; margin: 0;
            background-color: var(--bg-start);
            color: var(--text-white);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            animation: bodyDarken 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @keyframes bodyDarken { to { background-color: var(--bg-end); } }

        /* --- IPHONE RÁM --- */
        .iphone-frame {
            position: absolute;
            width: 50vw; 
            aspect-ratio: 1170 / 2532;
            background-color: var(--iphone-gray);
            border-radius: 8vw;
            z-index: 10;
            will-change: transform;
            animation: 
                flyIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                expandToBlack 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @media (orientation: landscape) { .iphone-frame { width: 18vw; border-radius: 2vw; } }

        @keyframes flyIn {
            0% { transform: translateY(110vh) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes expandToBlack {
            to { transform: scale(12); background-color: var(--bg-end); }
        }

        /* --- HLAVNÝ ANCHOR (TLAČIDLO V STREDE) --- */
        .ui-wrapper {
            position: relative;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            opacity: 0;
            animation: fadeInUI 1s ease forwards 2.6s;
        }

        @keyframes fadeInUI { to { opacity: 1; } }

        /* Logo skupina nad tlačidlom */
        .top-group {
            position: absolute;
            bottom: calc(100% + var(--gap-fix)); /* 10px nad tlačidlom */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap-fix); /* 10px medzi logom a textom */
            width: 100%;
        }

        .logo-svg { width: 80px; height: 80px; fill: var(--text-white); display: block; }
        .logo-text { font-size: var(--f-small); text-transform: uppercase; letter-spacing: 0.4em; white-space: nowrap; }

        /* Tlačidlo COSMOS (Presný stred) */
        .pill { 
            width: 100%; height: 80px; border-radius: var(--radius-pill); 
            display: flex; align-items: center; justify-content: center; 
            text-transform: uppercase; text-decoration: none;
            background: var(--text-white); color: #000; border: none; cursor: pointer;
        }
        .pill h1 { font-size: var(--f-big); margin: 0; letter-spacing: -0.02em; }

        /* Päta pod tlačidlom */
        footer {
            position: absolute;
            top: calc(100% + var(--gap-fix)); /* 10px pod tlačidlom */
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #ffffff; /* Čisto biela */
            opacity: 0.7;
            white-space: nowrap;
        }

        /* Prispôsobenie pre nízke displeje (Landscape) */
        @media (max-height: 450px) {
            .logo-svg { width: 50px; height: 50px; }
            .pill { height: 60px; }
            .pill h1 { font-size: 1.4rem; }
        }

        /* Loading Overlay */
        #l-ov { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; 
        }
        .l-bar-bg { width: 180px; height: 1px; background: rgba(255,255,255,0.2); overflow: hidden; }
        .l-bar-fill { height: 100%; width: 0%; background: #fff; }
        @keyframes load { to { width: 100%; } }
    </style>
</head>
<body>

    <div class="iphone-frame"></div>

    <div class="ui-wrapper">
        <div class="top-group">
            <svg class="logo-svg" viewBox="0 0 1080 1080">
                <g transform="translate(540, 540)">
                    <path d="M 0,0 L 233.827, -135 L 233.827, 135 L 0, 270 L -233.827, 135 L -233.827, -135 Z" />
                </g>
            </svg>
            <div class="logo-text">MARTINVOJTUS</div>
        </div>

        <div class="pill" onclick="startLoading()">
            <h1>COSMOS</h1>
        </div>

        <footer>Martin Vojtuš • 2026</footer>
    </div>

    <div id="l-ov">
        <div class="l-bar-bg"><div class="l-bar-fill" id="l-f"></div></div>
    </div>

    <script>
        function startLoading() {
            document.getElementById('l-ov').style.display = 'flex';
            document.getElementById('l-f').style.animation = "load 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards";
            setTimeout(() => { window.location.replace("https://www.cosmos.so/martinvojtus"); }, 2500);
        }
    </script>
</body>
</html>
