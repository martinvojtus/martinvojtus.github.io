<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Martin Vojtuš — Adaptive Build</title>
    <style>
        /* 🎨 DYNAMICKÉ PREMENNÉ */
        :root {
            --bg-initial: #ffffff;
            --bg-final: #000000;
            --iphone-gray: #e0e0e0;
            --logo-start: #000000;
            --text-final: #ffffff;
            --pill-bg: #ffffff;
            --pill-text: #000000;
            --loading-fill: #000000;
            --overlay-reset: #ffffff; /* Biela vrstva po kliku */
            
            --radius-pill: 100px;
            --f-big: 1.85rem;
            --f-small: 0.65rem;
            --gap: 8px;
        }

        /* 🌙 INVERZIA PRE TMAVÝ REŽIM */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-initial: #000000;
                --bg-final: #ffffff;
                --iphone-gray: #2a2a2a;
                --logo-start: #ffffff;
                --text-final: #000000;
                --pill-bg: #000000;
                --pill-text: #ffffff;
                --loading-fill: #ffffff;
                --overlay-reset: #000000; /* Čierna vrstva po kliku */
            }
        }

        * { box-sizing: border-box; font-weight: 400 !important; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; margin: 0;
            background-color: var(--bg-initial);
            color: var(--text-final);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            animation: bodyTransition 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @keyframes bodyTransition { to { background-color: var(--bg-final); } }

        /* --- ⚪ OVERLAY VRSTVA PO KLIKU --- */
        #reset-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--overlay-reset);
            opacity: 0;
            z-index: 45;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- 📱 IPHONE RÁM --- */
        #frame {
            position: absolute;
            background-color: var(--iphone-gray);
            z-index: 10;
            width: 50vw; 
            aspect-ratio: 1170 / 2532;
            border-radius: 8vw;
            animation: 
                flyIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                expandToBlack 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @media (orientation: landscape) {
            #frame { width: auto; height: 50vh; aspect-ratio: 2532 / 1170; border-radius: 4vh; }
        }

        @keyframes flyIn {
            0% { transform: translateY(110vh) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes expandToBlack {
            to { transform: scale(30); background-color: var(--bg-final); }
        }

        /* --- 🎨 LOGO (60px) --- */
        .logo-svg {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            fill: var(--logo-start);
            z-index: 40;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
            transition: opacity 0.4s ease;
            animation: 
                fadeInCenter 0.6s ease forwards 1.4s,
                moveLogo 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards,
                logoFinalColor 1.2s ease 2.2s forwards;
        }

        @keyframes fadeInCenter { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes logoFinalColor { to { fill: var(--text-final); } }
        @keyframes moveLogo { to { transform: translate(-50%, calc(-50% - 98px)) scale(1); } }

        /* --- 🏁 UI ELEMENTY --- */
        .ui-element {
            position: absolute;
            left: 50%;
            z-index: 35;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        @keyframes flyFromBottom {
            0% { transform: translate(-50%, 80px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        .logo-text {
            bottom: calc(50% + 40px + var(--gap));
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            white-space: nowrap;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.8s forwards;
        }

        /* --- 📥 TLAČIDLO --- */
        .pill {
            top: 50%;
            width: 340px;
            height: 80px;
            border-radius: var(--radius-pill);
            display: flex; align-items: center; justify-content: center;
            background: var(--pill-bg); 
            color: var(--pill-text); 
            border: none; 
            cursor: pointer;
            overflow: hidden;
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            animation: flyFromBottomCenter 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.95s forwards;
            transition: background-color 0.5s ease;
        }
        
        @keyframes flyFromBottomCenter {
            0% { transform: translate(-50%, 30px); opacity: 0; }
            100% { transform: translate(-50%, -50%); opacity: 1; }
        }

        .pill h1 { 
            font-size: var(--f-big); margin: 0; letter-spacing: -0.02em; 
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .loading-fill {
            position: absolute;
            top: 0; left: 0;
            width: 0%; height: 100%;
            background: var(--loading-fill);
            z-index: 1;
        }

        .loading-active .loading-fill { 
            width: 100%; 
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        footer {
            top: calc(50% + 40px + var(--gap));
            font-size: var(--f-small);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-final);
            white-space: nowrap;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 3.1s forwards;
        }

        .hidden { opacity: 0 !important; }
    </style>
</head>
<body>

    <div id="reset-screen"></div>
    <div id="frame"></div>

    <svg id="logo-main" class="logo-svg" viewBox="-234 -135 468 405" preserveAspectRatio="xMidYMid meet">
        <path d="M 0,0 L 233.827, -135 L 233.827, 135 L 0, 270 L -233.827, 135 L -233.827, -135 Z" />
    </svg>

    <div id="text-main" class="ui-element logo-text">MARTINVOJTUS</div>
    
    <button id="cosmos-btn" class="ui-element pill" onclick="handleFinalTransition()">
        <div class="loading-fill" id="fill"></div>
        <h1>COSMOS</h1>
    </button>

    <footer id="footer-main" class="ui-element">Martin Vojtuš • 2026</footer>

    <script>
        function handleFinalTransition() {
            const btn = document.getElementById('cosmos-btn');
            const resetScreen = document.getElementById('reset-screen');
            const logo = document.getElementById('logo-main');
            const text = document.getElementById('text-main');
            const foot = document.getElementById('footer-main');

            logo.classList.add('hidden');
            text.classList.add('hidden');
            foot.classList.add('hidden');
            btn.querySelector('h1').style.opacity = '0';

            resetScreen.style.opacity = "1";

            // Tlačidlo sa prefarbí na pôvodnú sivú (adaptívnu)
            btn.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--iphone-gray');
            btn.style.pointerEvents = "none";

            setTimeout(() => {
                btn.classList.add('loading-active');
            }, 600);

            setTimeout(() => {
                window.location.replace("https://www.cosmos.so/martinvojtus");
            }, 2300);
        }
    </script>
</body>
</html>
