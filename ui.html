<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            --black: #000000;
            --white: #ffffff;
            --grey-50: rgba(0, 0, 0, 0.5);
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            
            /* 📐 FIXNÉ MEDZERY */
            --gap-section: 40px; /* Medzera medzi hlavnými časťami */
            --gap-item: 30px;    /* Medzera medzi statusmi/prvkami */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-50: rgba(255, 255, 255, 0.5); 
                --glass-rgb: 0, 0, 0;   
            }
        }

        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 400;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.4;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 50px;
            display: flex; justify-content: center;
            background: rgba(var(--glass-rgb), 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            height: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px;
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); letter-spacing: 0.05em; white-space: nowrap; }
        .logo-text span { font-weight: 700; }

        .menu-toggle { width: 24px; height: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
        .line { width: 24px; height: 1px; background-color: var(--black); }

        /* --- MAIN LAYOUT --- */
        main {
            /* 50px (header) + gap-section */
            padding: calc(50px + var(--gap-section)) 20px 0; 
            width: 100%; max-width: var(--content-width); 
            flex-grow: 1;
        }

        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }

        /* --- STATUS FEED --- */
        .status-feed { padding: 0; }

        .status-card {
            border-bottom: 1px solid var(--black);
            padding: var(--gap-item) 0; /* Jednotná medzera zhora aj zdola */
        }

        .status-card:first-child { padding-top: 0; } /* Odstráni medzeru nad úplne prvým statusom */

        .status-date {
            font-size: 1rem; 
            color: var(--grey-50);
            margin-bottom: 4px; /* Tesný rozostup */
            display: block;
            text-transform: uppercase;
        }

        .status-title {
            font-size: 2rem; 
            font-weight: 700;
            margin: 0 0 10px 0; 
            line-height: 1.1;
        }

        .status-text {
            font-size: 1rem; 
            text-align: justify;
            opacity: 0.9;
        }

        /* --- CONTACT FORM --- */
        .contact-form { margin-top: var(--gap-item); }
        .form-group { margin-bottom: var(--gap-item); }
        .form-input, .form-textarea { 
            width: 100%; border: none; border-bottom: 1px solid var(--black); 
            background: transparent; font-family: inherit; font-size: 1rem; 
            padding: 10px 0; outline: none; color: var(--black);
        }
        .submit-btn {
            width: 100%; background: var(--black); color: var(--white); border: none; 
            padding: 16px; font-family: inherit; font-size: 1rem; font-weight: 700; 
            text-transform: uppercase; cursor: pointer;
        }

        footer {
            width: 100%; max-width: var(--content-width); 
            padding: var(--gap-section) 20px; 
            display: flex; flex-direction: column; align-items: center;
        }
        .footer-info { font-size: 1rem; color: var(--grey-50); text-transform: uppercase; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="showSection('feed')">
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle" onclick="toggleMenu()"><div class="line"></div><div class="line"></div></div>
        </div>
    </header>

    <main>
        <div id="section-feed" class="content-section active">
            <div id="status-container" class="status-feed">
                <p style="text-align: center; color: var(--grey-50);">Loading thoughts...</p>
            </div>
        </div>

        <div id="section-contact" class="content-section">
            <h2 style="font-size: 2rem; margin: 0 0 var(--gap-item) 0;">Contact.</h2>
            <form class="contact-form" action="https://formsubmit.co/martinvojtus@icloud.com" method="POST">
                <div class="form-group"><input type="text" name="name" class="form-input" placeholder="Name" required></div>
                <div class="form-group"><input type="email" name="email" class="form-input" placeholder="Email" required></div>
                <div class="form-group"><textarea name="message" class="form-textarea" placeholder="Message" required></textarea></div>
                <button type="submit" class="submit-btn">Send message</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-info">build v1.8.1 • 2026</div>
    </footer>

    <script>
        // Navigácia zostáva rovnaká
        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            window.scrollTo(0, 0);
        }

        async function fetchStatuses() {
            const container = document.getElementById('status-container');
            try {
                const response = await fetch("https://mv-backend-ak8l.onrender.com/posts");
                const data = await response.json();
                container.innerHTML = data.map(s => `
                    <div class="status-card">
                        <span class="status-date">${new Date(s.at).toLocaleDateString('en-US', {day:'numeric', month:'long', year:'numeric'}).toUpperCase()}</span>
                        <h3 class="status-title">${s.title}</h3>
                        <div class="status-text">${s.text}</div>
                        ${s.updated_at ? `<div style="font-size: 1rem; color: var(--grey-50); margin-top: 10px; font-style: italic;">(Edited)</div>` : ''}
                    </div>
                `).join('');
            } catch (e) { container.innerHTML = "Error loading feed."; }
        }
        fetchStatuses();
    </script>
</body>
</html>
