<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Modern Animation</title>
    <style>
        /* 🎨 Základné nastavenie */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Dôležité: Pozadie body sa tiež zmení na čierne, aby nevznikli biele okraje */
            background-color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            /* Dôležité: Skryje časti, ktoré "vylezú" mimo obrazovku pri zväčšení */
            overflow: hidden; 
            
            /* Animácia pozadia celej stránky */
            animation: bodyToBlack 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        /* 📐 iPhone Obdĺžnik */
        .iphone-container {
            /* Nastavíme fixné rozmery, aby sa pri škálovaní nemenil layout */
            width: 50vw;
            aspect-ratio: 1170 / 2532;
            background-color: #e0e0e0;
            border-radius: 8vw;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            
            /* Optimalizácia pre výkon (GPU akcelerácia) */
            will-change: transform, background-color;

            /* 🚀 Spustenie animácií */
            animation: 
                flyIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards, /* Pomalší, elegantnejší dojazd */
                massiveExpandAndDarken 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards; /* Rýchla expanzia po pauze */
        }

        /* 🏎️ Fáza 1: Prílet zospodu (Jemnejší) */
        @keyframes flyIn {
            0% {
                transform: translateY(110vh) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* 🌑 Fáza 2: Masívne zväčšenie a zmena farby */
        @keyframes massiveExpandAndDarken {
            to {
                /* Zväčšíme objekt 4.5-násobne. 
                   Tým sa zaoblené rohy dostanú bezpečne mimo obrazovku. */
                transform: scale(4.5); 
                background-color: #000000;
                /* Tieň počas zväčšovania zmizne */
                box-shadow: 0 0 0 rgba(0,0,0,0);
            }
        }
        
        /* Fáza 2b: Zmena pozadia stránky (poistka pre okraje) */
        @keyframes bodyToBlack {
            to {
                background-color: #000000;
            }
        }
    </style>
</head>
<body>

    <div class="iphone-container"></div>

</body>
</html>
