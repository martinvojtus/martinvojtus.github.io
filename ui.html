<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            --black: #000000;
            --white: #ffffff;
            --grey-50: rgba(0, 0, 0, 0.5);
            --divider: rgba(0, 0, 0, 0.1);
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            --border-radius: 1rem; 
            --gap-item: 1rem; 
            --letter-spacing: 0.05em;
            --glass-opacity: 0.6; 
            --glass-blur: 25px;   
            --danger: #ff4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-50: rgba(255, 255, 255, 0.5); 
                --divider: rgba(255, 255, 255, 0.1); 
                --glass-rgb: 0, 0, 0;   
            }
        }

        html { -webkit-text-size-adjust: 100%; }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-weight: 400; 
            font-family: 'Space Grotesk', sans-serif; 
            letter-spacing: var(--letter-spacing); 
            transition: none !important; 
            animation: none !important;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--white); color: var(--black);
            line-height: 1.5; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .menu-link, .status-date, .footer-info, .submit-btn, .form-input, .logo-text, .admin-bar-item {
            line-height: 1;
        }

        .divider { width: 100%; height: 1px; background-color: var(--divider); }

        header {
            position: fixed; top: 0; left: 0; width: 100%; 
            display: flex; justify-content: center; padding: var(--gap-item) 0; 
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            display: flex; justify-content: space-between; align-items: center; padding: 0 var(--gap-item); 
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { width: 1rem; height: 1rem; display: block; flex-shrink: 0; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); white-space: nowrap; margin: 0; }

        .menu-toggle { width: 1rem; height: 1rem; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 2100; position: relative; }
        .line { width: 1rem; height: 1px; background-color: var(--black); position: absolute; border-radius: 1px; }
        .line:nth-child(1) { transform: translateY(-0.25rem); }
        .line:nth-child(2) { transform: translateY(0.25rem); }
        .menu-toggle.active .line:nth-child(1) { transform: translateY(0) rotate(45deg) scaleX(1.4); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(0) rotate(-45deg) scaleX(1.4); }

        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: auto;
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 1500; 
            padding: calc(3rem + var(--gap-item)) 0 var(--gap-item) 0; 
            display: none; flex-direction: column; align-items: center;
        }
        .nav-overlay.active { display: flex; }
        
        .menu-items { width: 100%; max-width: var(--content-width); display: flex; flex-direction: column; gap: var(--gap-item); padding: 0 var(--gap-item); }
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; display: inline-block; padding: 0; border: none; background: transparent; text-align: left; margin: 0; }

        main {
            padding: calc(3rem + var(--gap-item)) var(--gap-item) var(--gap-item); 
            width: 100%; max-width: var(--content-width); 
            flex-grow: 1; display: block; 
        }

        #admin-upload-zone { display: none; flex-direction: column; gap: var(--gap-item); width: 100%; }
        body.is-logged-in #admin-upload-zone { display: flex; }

        .status-feed { max-width: 600px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: var(--gap-item); }
        .status-card { border-bottom: 1px solid var(--divider); padding-bottom: var(--gap-item); display: flex; flex-direction: column; }
        .status-card:last-child { border-bottom: none; padding-bottom: 0; }

        .status-image { width: 100%; height: auto; border-radius: var(--border-radius); display: block; }
        
        /* 🛠️ NOVÝ GLASS ADMIN BAR */
        .status-admin-bar {
            height: 3rem; width: 100%;
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--border-radius);
            margin-bottom: -3rem; /* Zasahuje cez obrazok */
            z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 var(--gap-item);
            position: relative;
        }

        .admin-bar-item { font-size: var(--size-small); color: var(--black); text-transform: uppercase; }
        .admin-delete-link { cursor: pointer; color: var(--black); text-decoration: none; }
        .admin-delete-link.confirm { color: var(--danger); font-weight: 700; }

        .status-date { 
            font-size: var(--size-small); color: var(--grey-50); 
            background-color: var(--divider); padding: 0 var(--gap-item); height: 3rem; 
            border-radius: var(--border-radius); display: inline-flex; align-items: center; width: fit-content;
            text-transform: uppercase; margin-top: var(--gap-item);
        }

        .loading-text { text-align: center; font-size: var(--size-small); color: var(--black); opacity: 0.5; padding: var(--gap-item) 0; }

        .form-input, .submit-btn { 
            height: 3rem; border: 1px solid var(--black); border-radius: var(--border-radius); 
            background: transparent; font-size: var(--size-small); padding: 0 var(--gap-item); 
            outline: none; color: var(--black); display: flex; align-items: center; gap: var(--gap-item); 
        }

        .solid-input { background-color: var(--divider) !important; border: none !important; }
        .submit-btn { background: var(--black); color: var(--white); text-transform: uppercase; cursor: pointer; justify-content: center; white-space: nowrap; }
        .icon-btn { width: 3rem; height: 3rem; flex-shrink: 0; padding: 0; }
        .danger-btn { background: var(--danger) !important; color: #000000 !important; border: none !important; }

        #upload-container { display: flex; cursor: pointer; flex-grow: 1; overflow: hidden; }
        #file-name-display { color: var(--grey-50); text-align: right; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--size-small); }
        #upload-thumbnail { display: none; width: 3rem; height: 3rem; flex-shrink: 0; border-radius: var(--border-radius); object-fit: cover; }

        #upload-ui-wrapper.has-image #upload-action-label { display: none; }
        #upload-ui-wrapper.has-image #file-name-display { color: var(--black); text-align: left; }
        #upload-ui-wrapper.has-image #upload-thumbnail { display: block; }
        #upload-ui-wrapper.has-image #clear-file-btn { display: flex; }
        #clear-file-btn { display: none; }

        .custom-checkbox {
            appearance: none; width: 1rem; height: 1rem; border: 1px solid var(--black);
            border-radius: calc(var(--border-radius) / 3); cursor: pointer; display: grid; place-content: center;
        }
        .custom-checkbox::before { content: ""; width: 0.25rem; height: 0.5rem; border: solid var(--white); border-width: 0 1px 1px 0; transform: rotate(45deg); opacity: 0; margin-top: -0.125rem; }
        .custom-checkbox:checked { background-color: var(--black); }
        .custom-checkbox:checked::before { opacity: 1; }

        .footer-info { font-size: var(--size-small); color: var(--grey-50); text-transform: uppercase; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="window.scrollTo(0,0)">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1rem" height="1rem" viewBox="72.35 270 935.31 810" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="var(--black)" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle" onclick="toggleMenu()"><div class="line"></div><div class="line"></div></div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <div id="login-ui">
                <form id="login-form" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; width: 100%; gap: var(--gap-item); margin: 0;">
                    <div style="display: flex; width: 100%; gap: var(--gap-item);">
                        <input type="password" id="admin-pass" class="form-input" placeholder="Password..." style="flex-grow: 1;">
                        <button type="submit" id="login-btn" class="submit-btn icon-btn">
                            <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 22 17 12 7 2"></polyline></svg>
                        </button>
                    </div>
                    <label class="form-input solid-input" style="cursor: pointer; justify-content: flex-start; user-select: none;">
                        <input type="checkbox" id="remember-login" class="custom-checkbox">
                        <span>Remember me</span>
                    </label>
                </form>
            </div>

            <div id="admin-upload-zone">
                <form id="editor-form" onsubmit="handleMainSubmit(event)" style="display: flex; flex-direction: column; width: 100%; gap: var(--gap-item); margin: 0;">
                    <div style="display: flex; gap: var(--gap-item); width: 100%;">
                        <div id="upload-ui-wrapper" style="display: flex; gap: var(--gap-item); flex-grow: 1; min-width: 0;">
                            <img id="upload-thumbnail" src="" alt="">
                            <input type="file" id="edit-image" accept="image/*" style="display: none;" onchange="updateImageUIState()">
                            <div id="upload-container" class="form-input solid-input" onclick="document.getElementById('edit-image').click()">
                                <span id="upload-action-label" style="color: var(--black);">Upload image</span>
                                <span id="file-name-display"></span>
                            </div>
                            <button type="button" id="clear-file-btn" data-confirm="false" class="submit-btn secondary-btn icon-btn solid-input" onclick="clearImageSelection(event)">
                                <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h20M19 5v15a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5M9 5V3a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                        <button type="submit" id="publish-btn" class="submit-btn icon-btn">
                            <svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 22 17 12 7 2"></polyline></svg>
                        </button>
                    </div>
                    <label class="form-input solid-input" style="cursor: pointer; justify-content: flex-start; user-select: none;">
                        <input type="checkbox" id="edit-show-date" class="custom-checkbox" checked>
                        <span>Date & time</span>
                    </label>
                    <div class="divider"></div>
                    <button type="button" id="delete-all-btn" data-state="0" class="submit-btn danger-btn" style="width: 100%;" onclick="handleDeleteAllClick()">DELETE ALL POSTS</button>
                </form>
            </div>

            <div id="logout-ui" style="display: none;">
                <div class="divider" style="margin-bottom: var(--gap-item);"></div>
                <button onclick="handleLogout()" class="submit-btn" style="width: 100%;">LOGOUT</button>
            </div>
            
            <div class="divider"></div>
            <div class="footer-info">build v5.5.2 • 2026</div>
        </div>
    </nav>

    <main>
        <div id="section-feed">
            <div id="status-container" class="status-feed"></div>
            <div id="loading-indicator" class="loading-text">Loading...</div>
        </div>
    </main>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        let secretKey = ""; let globalPosts = []; 
        let currentOffset = 0; const postsLimit = 10; let isLoading = false; let hasMorePosts = true;
        let deleteTimer = null;

        const passInput = document.getElementById('admin-pass');
        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');

        if(passInput) {
            passInput.addEventListener('input', () => {
                passInput.classList.remove('input-error');
                passInput.placeholder = 'Password...';
            });
        }

        function toggleMenu() { menuToggle.classList.toggle('active'); navOverlay.classList.toggle('active'); }
        function closeMenu() { 
            menuToggle.classList.remove('active'); 
            navOverlay.classList.remove('active'); 
            resetEditor(); 
        }

        async function checkRememberedLogin() {
            const savedKey = localStorage.getItem('mv_admin_key');
            if (savedKey) {
                try {
                    const res = await fetch(`${API_URL}/verify`, { method: 'GET', headers: { 'x-admin-password': savedKey } });
                    if (res.ok) { 
                        secretKey = savedKey; 
                        document.body.classList.add('is-logged-in'); 
                        document.getElementById('logout-ui').style.display = 'block';
                        refreshFeedUI(); 
                    } 
                    else { localStorage.removeItem('mv_admin_key'); }
                } catch (e) {}
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const tempKey = passInput.value;
            const rememberMe = document.getElementById('remember-login').checked;
            try {
                const res = await fetch(`${API_URL}/verify`, { method: 'GET', headers: { 'x-admin-password': tempKey } });
                if (res.ok) { 
                    secretKey = tempKey; 
                    document.body.classList.add('is-logged-in'); 
                    document.getElementById('logout-ui').style.display = 'block';
                    closeMenu(); 
                    refreshFeedUI(); 
                    passInput.value = ''; 
                    if (rememberMe) { localStorage.setItem('mv_admin_key', secretKey); } else { localStorage.removeItem('mv_admin_key'); }
                } else { passInput.classList.add('input-error'); passInput.value = ''; passInput.placeholder = 'Invalid password!'; }
            } catch (err) { passInput.classList.add('input-error'); }
        }

        function handleLogout() {
            secretKey = ""; passInput.value = ''; 
            localStorage.removeItem('mv_admin_key');
            document.body.classList.remove('is-logged-in'); 
            document.getElementById('logout-ui').style.display = 'none';
            closeMenu();
            resetDeleteAllBtn(); 
            refreshFeedUI();
        }

        function refreshFeedUI() { 
            if (globalPosts.length === 0) {
                if (!isLoading) {
                    document.getElementById('status-container').innerHTML = '<div class="loading-text">Nothing here yet.</div>';
                }
            } else {
                document.getElementById('status-container').innerHTML = globalPosts.map(s => renderSinglePost(s)).join(''); 
            }
        }

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const newName = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
                        canvas.toBlob(blob => { 
                            resolve(new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() })); 
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function fetchStatuses(reset = false) {
            if (reset) { currentOffset = 0; hasMorePosts = true; globalPosts = []; document.getElementById('status-container').innerHTML = ''; }
            if (isLoading || !hasMorePosts) return;
            isLoading = true;
            try {
                const response = await fetch(`${API_URL}/posts?skip=${currentOffset}&limit=${postsLimit}`);
                const newPosts = await response.json();
                if (newPosts.length < postsLimit) hasMorePosts = false;
                currentOffset += newPosts.length; globalPosts = globalPosts.concat(newPosts);
                
                if (globalPosts.length === 0) {
                    document.getElementById('status-container').innerHTML = '<div class="loading-text">Nothing here yet.</div>';
                } else if (reset) {
                    document.getElementById('status-container').innerHTML = globalPosts.map(s => renderSinglePost(s)).join('');
                } else {
                    document.getElementById('status-container').innerHTML += newPosts.map(s => renderSinglePost(s)).join('');
                }
            } catch (error) {} finally { 
                isLoading = false; 
                document.getElementById('loading-indicator').style.display = (hasMorePosts && globalPosts.length > 0) ? 'block' : 'none'; 
            }
        }

        window.addEventListener('scroll', () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) fetchStatuses(); });

        function renderSinglePost(s) {
            const showDate = s.show_date !== false;
            const formattedDate = new Date(s.at).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
            
            // 🛠️ ADMIN BAR NAD FOTKOU (iba ak prihlásený)
            let adminBarHtml = '';
            if (secretKey) {
                adminBarHtml = `
                <div class="status-admin-bar">
                    <span class="admin-bar-item">#${s.id}</span>
                    <span class="admin-bar-item" style="position: absolute; left: 50%; transform: translateX(-50%);">${formattedDate}</span>
                    <span id="del-link-${s.id}" onclick="handleDeleteFeed(${s.id})" class="admin-bar-item admin-delete-link">DELETE</span>
                </div>`;
            }

            const imageHtml = s.image_url ? `<img src="${s.image_url}" class="status-image" alt="image" loading="lazy">` : '';
            
            // 🛠️ DÁTUM POD FOTKOU (iba ak nie je admin bar a je zapnutý showDate)
            let publicDateHtml = (!secretKey && showDate) ? `<div class="status-date">${formattedDate}</div>` : '';
            
            return `<div class="status-card">${adminBarHtml}${imageHtml}${publicDateHtml}</div>`;
        }

        function resetEditor() {
            document.getElementById('edit-image').value = ""; 
            updateImageUIState(); 
            const pubBtn = document.getElementById('publish-btn');
            pubBtn.innerHTML = '<svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 22 17 12 7 2"></polyline></svg>';
            document.getElementById('edit-show-date').checked = true;
        }

        function updateImageUIState() {
            const wrapper = document.getElementById('upload-ui-wrapper');
            const input = document.getElementById('edit-image');
            const thumbnail = document.getElementById('upload-thumbnail');
            if (input.files.length > 0) {
                wrapper.classList.add('has-image');
                thumbnail.src = URL.createObjectURL(input.files[0]);
                let fileName = input.files[0].name;
                if (fileName.length > 22) fileName = fileName.substring(0, 10) + "..." + fileName.substring(fileName.length - 9);
                document.getElementById('file-name-display').innerText = fileName;
            } else { 
                wrapper.classList.remove('has-image'); 
                thumbnail.src = "";
                document.getElementById('file-name-display').innerText = "";
            }
        }

        function clearImageSelection(e) {
            e.stopPropagation();
            const btn = e.currentTarget;
            if (btn.dataset.confirm === "true") { document.getElementById('edit-image').value = ""; btn.classList.remove('danger-btn'); btn.dataset.confirm = "false"; updateImageUIState(); }
            else { btn.classList.add('danger-btn'); btn.dataset.confirm = "true"; setTimeout(() => { btn.classList.remove('danger-btn'); btn.dataset.confirm = "false"; }, 3000); }
        }

        async function handleMainSubmit(e) { 
            e.preventDefault(); 
            const imageFile = document.getElementById('edit-image').files[0];
            if (!imageFile) { 
                const uc = document.getElementById('upload-container'); uc.classList.add('input-error');
                setTimeout(() => uc.classList.remove('input-error'), 2000); return; 
            }
            const publishBtn = document.getElementById('publish-btn'); 
            publishBtn.disabled = true; publishBtn.style.opacity = '0.5';
            const compressedFile = await compressImage(imageFile);
            const formData = new FormData(); formData.append("file", compressedFile);
            const upRes = await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": secretKey }, body: formData });
            const upData = await upRes.json();
            const res = await fetch(`${API_URL}/posts`, {
                method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                body: JSON.stringify({ title: null, text: null, image_url: upData.image_url, show_date: document.getElementById('edit-show-date').checked, author: null })
            });
            if (res.ok) { 
                fetchStatuses(true); 
                publishBtn.innerHTML = '<svg width="1rem" height="1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 4 9 20 2 13"></polyline></svg>'; 
                setTimeout(() => { resetEditor(); closeMenu(); publishBtn.disabled = false; publishBtn.style.opacity = '1'; }, 1000);
            } else { publishBtn.disabled = false; publishBtn.style.opacity = '1'; }
        }

        async function handleDeleteFeed(id) {
            const link = document.getElementById(`del-link-${id}`);
            if (link.dataset.confirm === "true") { await fetch(`${API_URL}/posts/${id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } }); fetchStatuses(true); }
            else { link.classList.add('confirm'); link.innerText = "CONFIRM?"; link.dataset.confirm = "true"; setTimeout(() => { link.classList.remove('confirm'); link.innerText = "DELETE"; link.dataset.confirm = "false"; }, 3000); }
        }

        function handleDeleteAllClick() {
            const btn = document.getElementById('delete-all-btn');
            if (btn.dataset.state === "0") { btn.dataset.state = "1"; btn.innerText = "CLICK TO CONFIRM"; setTimeout(() => { if(btn.dataset.state === "1") resetDeleteAllBtn(); }, 3000); }
            else if (btn.dataset.state === "1") { btn.dataset.state = "2"; startDeleteCountdown(5); }
            else if (btn.dataset.state === "2") { stopDeleteCountdown(); }
        }

        function startDeleteCountdown(seconds) {
            const btn = document.getElementById('delete-all-btn'); let left = seconds; btn.innerText = `CANCEL IN ${left}S`;
            deleteTimer = setInterval(() => { left--; if (left <= 0) { clearInterval(deleteTimer); btn.innerText = "DELETING..."; btn.disabled = true; executeDeleteAll(); } else { btn.innerText = `CANCEL IN ${left}S`; } }, 1000);
        }

        function stopDeleteCountdown() { clearInterval(deleteTimer); resetDeleteAllBtn(); }
        function resetDeleteAllBtn() { const btn = document.getElementById('delete-all-btn'); btn.dataset.state = "0"; btn.innerText = "DELETE ALL POSTS"; btn.disabled = false; }

        async function executeDeleteAll() {
            const res = await fetch(`${API_URL}/posts?skip=0&limit=100`);
            const posts = await res.json();
            for (const p of posts) { await fetch(`${API_URL}/posts/${p.id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } }); }
            fetchStatuses(true); resetDeleteAllBtn(); closeMenu();
        }

        checkRememberedLogin();
        fetchStatuses(true);
        document.addEventListener('click', (e) => { if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu(); });
    </script>
</body>
</html>
