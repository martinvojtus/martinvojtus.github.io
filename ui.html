<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Mockup - Výrazný tieň</title>
    <style>
        /* 🎨 Vycentrovanie na stred (nezmenené) */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* 📐 Geometria obdĺžnika */
        .iphone-container {
            width: 50vw; /* 1/2 šírky displeja (nezmenené) */
            max-height: 95vh;
            aspect-ratio: 1170 / 2532; /* Pomer strán (nezmenené) */
            background-color: #e0e0e0; /* Farba (nezmenené) */
            
            /* 🌀 Zaoblenie rohov (nezmenené - vizuálna aproximácia) */
            border-radius: 8vw; 
            
            /* 🌑 NOVÝ, VÝRAZNEJŠÍ TIEŇ */
            /* Zvýšil som rozostrenie (60px) a opacitu farby (0.25) */
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            
            transition: all 0.3s ease;
        }

        /* Prispôsobenie pre veľmi úzke okná (nezmenené) */
        @media (max-aspect-ratio: 1170/2532) {
            .iphone-container {
                width: 40vw;
            }
        }
    </style>
</head>
<body>

    <div class="iphone-container"></div>

</body>
</html>
