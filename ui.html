<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-footer-height: 50px;
            --size-large: 2.0rem;
            --size-small: 1rem;
            --black: #000000;
            --white: #ffffff;
            --content-width: 540px;
        }

        /* 🚫 Zákaz scrollovania */
        html, body {
            height: 100%; width: 100%;
            margin: 0; padding: 0;
            overflow: hidden; 
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--white);
            color: var(--black);
        }

        /* 🧊 Bannery (Solid biela, bez priehľadnosti) */
        header, footer {
            position: fixed; left: 0;
            width: 100%; height: var(--header-footer-height);
            display: flex; justify-content: center;
            background: var(--white);
            z-index: 2000; /* Nad menu */
        }

        header { top: 0; }
        footer { bottom: 0; }

        .banner-content {
            width: 100%; max-width: var(--content-width);
            height: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; box-sizing: border-box;
            position: relative;
        }

        .logo-link {
            display: flex; align-items: center;
            text-decoration: none; color: inherit;
            cursor: pointer;
        }

        .header-left svg { height: 24px; width: auto; display: block; }

        .logo-text {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: var(--size-small); letter-spacing: 0.05em;
            white-space: nowrap;
        }
        .logo-text span { font-weight: 700; }

        /* ☰ Menu Toggle */
        .menu-toggle {
            width: 24px; height: 12px;
            display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; z-index: 2100;
        }
        .line { width: 24px; height: 1px; background-color: var(--black); transition: 0.3s; }
        .menu-toggle.active .line:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(-5.5px) rotate(-45deg); }

        /* 📜 Menu (Upravené vysúvanie a výška) */
        .nav-overlay {
            position: fixed; 
            top: -110%; /* Posunuté viac nahor, aby netrčalo */
            left: 0;
            width: 100%; 
            /* Výška vypočítaná tak, aby nezakrývala spodný banner */
            height: calc(100% - 100px); 
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: top 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1500; /* Pod bannermi */
            display: flex; flex-direction: column; align-items: center;
            justify-content: center;
        }
        /* Otvorené menu začína pod horným bannerom */
        .nav-overlay.active { top: var(--header-footer-height); }

        .menu-items {
            width: 100%; max-width: var(--content-width);
            display: flex; flex-direction: column; gap: 25px; padding: 0 20px; box-sizing: border-box;
        }
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; }

        /* 📏 Hlavný blok */
        main {
            position: absolute;
            top: var(--header-footer-height);
            bottom: var(--header-footer-height);
            left: 0; width: 100%;
            display: flex; justify-content: center;
        }

        .content-section {
            display: none; width: 100%; height: 100%;
            max-width: var(--content-width);
            animation: fadeIn 0.4s ease;
        }
        .content-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 🖼️ Full-screen blok */
        .block-full {
            position: relative; width: 100%; height: 100%;
            background-color: var(--black);
            overflow: hidden;
        }

        .block-full img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
        }

        .block-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 40px 20px; box-sizing: border-box;
            color: var(--white);
        }

        .block-title { font-size: var(--size-large); font-weight: 700; margin-bottom: 12px; }
        .block-text { font-size: var(--size-small); opacity: 0.95; }

        /* ✉️ Kontakt */
        .contact-container {
            padding: 40px 20px; color: var(--black); height: 100%; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center;
        }
        .form-group { margin-bottom: 20px; }
        .form-input, .form-textarea {
            width: 100%; border: none; border-bottom: 1px solid var(--black);
            background: transparent; font-family: inherit; font-size: var(--size-small);
            padding: 10px 0; outline: none; border-radius: 0;
        }
        .submit-btn {
            width: 100%; background: var(--black); color: var(--white);
            border: none; padding: 18px; font-weight: 600; cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .submit-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <header>
        <div class="banner-content">
            <div class="logo-link" onclick="showSection('about')">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="#000000" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle">
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <a class="menu-link" onclick="showSection('about')">About</a>
            <a class="menu-link" onclick="closeMenu()">Work</a>
            <a class="menu-link" onclick="showSection('photography')">iPhone photography</a>
            <a class="menu-link" onclick="showSection('contact')">Contact</a>
        </div>
    </nav>

    <main>
        <div id="section-about" class="content-section active">
            <div class="block-full">
                <img src="about.jpeg" alt="Portrait" onerror="this.style.display='none';">
                <div class="block-overlay">
                    <div class="block-title">My vision.</div>
                    <div class="block-text">A minimalist focused on a functional, beautiful and clean look for your website.</div>
                </div>
            </div>
        </div>

        <div id="section-photography" class="content-section">
            <div class="block-full">
                <a href="#" style="text-decoration: none; color: inherit; width: 100%; height: 100%;">
                    <img src="IMG_4850.jpeg" alt="iPhone Photography" onerror="this.style.display='none';">
                    <div class="block-overlay" style="align-items: center; text-align: center;">
                        <div class="block-title">Gallery.</div>
                        <div class="block-text">World through my eyes.</div>
                    </div>
                </a>
            </div>
        </div>

        <div id="section-contact" class="content-section">
            <div class="contact-container">
                <div class="block-title" style="color: var(--black);">Let's work together.</div>
                <div class="contact-form">
                    <div class="form-group"><input type="text" id="contact-name" class="form-input" placeholder="Name"></div>
                    <div class="form-group"><input type="email" id="contact-email" class="form-input" placeholder="Email"></div>
                    <div class="form-group"><textarea id="contact-message" class="form-textarea" placeholder="Message"></textarea></div>
                    <button type="button" class="submit-btn" onclick="sendMail()">Send message</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="banner-content">
            <div class="footer-info">build v1.1.9 • martin vojtus • 2026</div>
        </div>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');

        function toggleMenu() { menuToggle.classList.toggle('active'); navOverlay.classList.toggle('active'); }
        function closeMenu() { menuToggle.classList.remove('active'); navOverlay.classList.remove('active'); }

        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + sectionId).classList.add('active');
            closeMenu();
        }

        function sendMail() {
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const message = document.getElementById('contact-message').value;
            const subject = encodeURIComponent("Contact from " + name);
            const body = encodeURIComponent("Name: " + name + "\nEmail: " + email + "\n\nMessage:\n" + message);
            window.location.href = `mailto:martinvojtus@icloud.com?subject=${subject}&body=${body}`;
        }

        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => {
            if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu();
        });
    </script>

</body>
</html>
