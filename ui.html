<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Mockup - Jemný tieň</title>
    <style>
        /* 🎨 Vycentrovanie */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* 📐 Geometria obdĺžnika */
        .iphone-container {
            width: 50vw; /* 1/2 šírky displeja */
            max-height: 90vh; /* Ochrana pred pretečením */
            aspect-ratio: 1170 / 2532;
            background-color: #e0e0e0; /* Pôvodná svetlosivá */
            
            /* 🌀 Zaoblenie rohov (Aproximácia iPhone 14/16e) */
            border-radius: 8vw; 
            
            /* 🌑 REDUKOVANÝ TIEŇ */
            /* Znížená opacita na 0.1 pre čistý vzhľad */
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            
            transition: all 0.3s ease;
        }

        /* Responzivita pre úzke zobrazenia */
        @media (max-aspect-ratio: 1170/2532) {
            .iphone-container {
                width: 45vw;
            }
        }
    </style>
</head>
<body>

    <div class="iphone-container"></div>

</body>
</html>
