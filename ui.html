<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --size-large: 2.0rem;
            --size-small: 1.0rem;
            
            --black: #000000;
            --white: #ffffff;
            
            --grey-50: rgba(0, 0, 0, 0.5);
            --divider: rgba(0, 0, 0, 0.1);
            
            --glass-rgb: 255, 255, 255; 
            --content-width: 540px; 
            
            --border-radius: 16px; 
            --gap-item: 16px; 

            --glass-opacity: 0.6; 
            --glass-blur: 25px;   
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --black: #ffffff;       
                --white: #000000;       
                --grey-50: rgba(255, 255, 255, 0.5); 
                --divider: rgba(255, 255, 255, 0.1); 
                --glass-rgb: 0, 0, 0;   
            }
        }

        html { -webkit-text-size-adjust: 100%; }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-weight: 400; 
            font-family: 'Manrope', sans-serif; 
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--white); color: var(--black);
            line-height: 1.5; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .menu-link, .status-date, .admin-action-btn, .footer-info, .submit-btn, .form-input, .logo-text, .status-title {
            line-height: 1;
        }

        .divider { width: 100%; height: 1px; background-color: var(--divider); }

        header {
            position: fixed; top: 0; left: 0; width: 100%; 
            display: flex; justify-content: center; padding: var(--gap-item) 0; 
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 2000;
        }

        .header-content {
            width: 100%; max-width: var(--content-width);
            display: flex; justify-content: space-between; align-items: center; padding: 0 var(--gap-item); 
        }

        .logo-link { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
        .header-left svg { height: 24px; width: auto; display: block; }
        .logo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: var(--size-small); white-space: nowrap; margin: 0; }

        .menu-toggle { width: 24px; height: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; z-index: 2100; }
        .line { width: 24px; height: 1px; background-color: var(--black); }
        .menu-toggle.active .line:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
        .menu-toggle.active .line:nth-child(2) { transform: translateY(-5.5px) rotate(-45deg); }

        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: auto;
            background: rgba(var(--glass-rgb), var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 1500; 
            padding: calc(56px + var(--gap-item)) 0 var(--gap-item) 0; 
            display: none; flex-direction: column; align-items: center;
        }
        .nav-overlay.active { display: flex; }
        
        .menu-items { width: 100%; max-width: var(--content-width); display: flex; flex-direction: column; gap: var(--gap-item); padding: 0 var(--gap-item); }
        .menu-link { text-decoration: none; color: var(--black); font-size: var(--size-small); cursor: pointer; display: inline-block; padding: 0; border: none; background: transparent; text-align: left; margin: 0; }

        main {
            padding: calc(56px + var(--gap-item)) var(--gap-item) var(--gap-item); 
            width: 100%; max-width: var(--content-width); 
            flex-grow: 1; display: flex; flex-direction: column; gap: var(--gap-item);
        }

        #section-feed { display: flex; flex-direction: column; gap: var(--gap-item); }
        
        #feed-admin-zone { display: none; flex-direction: column; gap: var(--gap-item); padding-bottom: var(--gap-item); border-bottom: 1px solid var(--divider); }
        body.is-logged-in #feed-admin-zone { display: flex; }

        #login-ui { display: flex; flex-direction: column; gap: var(--gap-item); }
        #logout-ui { display: none; }
        body.is-logged-in #login-ui { display: none; }
        body.is-logged-in #logout-ui { display: flex; }

        .status-feed { max-width: 600px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 0; }

        .status-card { background: transparent; border: none; border-bottom: 1px solid var(--divider); border-radius: 0; padding: var(--gap-item) 0; margin: 0; display: flex; flex-direction: column; gap: var(--gap-item); }
        .status-card:first-child { padding-top: 0; }
        .status-card:last-child { border-bottom: none; }

        .status-date { font-size: var(--size-small); color: var(--grey-50); display: block; text-transform: uppercase; margin: 0; }
        .status-title { font-size: var(--size-large); margin: 0; color: var(--black); }
        .status-image { width: 100%; height: auto; border-radius: var(--border-radius); display: block; margin: 0; border: none; }
        .status-text { font-size: var(--size-small); color: var(--black); opacity: 0.8; white-space: pre-line; text-align: justify; margin: 0; word-wrap: break-word; }
        .loading-text { text-align: center; font-size: var(--size-small); color: var(--grey-50); margin: 0; padding: var(--gap-item) 0; line-height: 1; }

        .form-input, .submit-btn { 
            height: 48px; border: 1px solid var(--black); border-radius: var(--border-radius); 
            background: transparent; font-size: var(--size-small); padding: 0 var(--gap-item); 
            outline: none; color: var(--black); display: flex; margin: 0; align-items: center; gap: var(--gap-item); 
        }
        
        .form-textarea { 
            width: 100%; border: 1px solid var(--black); border-radius: var(--border-radius); 
            background: transparent; font-size: var(--size-small); padding: var(--gap-item); 
            outline: none; color: var(--black); display: block; min-height: 80px; resize: vertical; margin: 0;
        }

        .form-input::placeholder, .form-textarea::placeholder { color: var(--grey-50); opacity: 1; }

        .input-error { border-color: #ff4444 !important; }
        .input-error::placeholder { color: #ff4444 !important; opacity: 1 !important; }

        .submit-btn { background: var(--black); color: var(--white); text-transform: uppercase; cursor: pointer; justify-content: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .icon-btn { width: 48px; height: 48px; flex-shrink: 0; padding: 0; margin: 0; }
        .secondary-btn { background: transparent; color: var(--black); }
        .danger-btn { background: #ff4444 !important; color: #000000 !important; border: none !important; }

        .admin-action-btn { background: transparent; border: none; font-size: var(--size-small); color: var(--black); cursor: pointer; padding: 0; margin: 0; display: inline-flex; align-items: center; }
        .admin-action-link { text-decoration: none; } 

        #quick-buttons { display: flex; gap: var(--gap-item); flex-shrink: 0; width: 112px; margin-left: var(--gap-item); }
        #editor-form.adv-open #quick-buttons { display: none; }
        
        #advanced-section-wrapper { display: none; flex-direction: column; gap: var(--gap-item); padding-top: var(--gap-item); }
        #editor-form.adv-open #advanced-section-wrapper { display: flex; }
        
        #upload-container { display: flex; cursor: pointer; flex-grow: 1; min-width: 0; overflow: hidden; }
        #upload-action-label { display: inline; color: var(--black); flex-shrink: 0; white-space: nowrap; pointer-events: none; }
        #file-name-display { color: var(--grey-50); text-align: right; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--size-small); pointer-events: none; }
        #upload-thumbnail { display: none; width: 48px; height: 48px; border-radius: var(--border-radius); object-fit: cover; flex-shrink: 0; margin: 0; border: 1px solid var(--black); }

        #upload-ui-wrapper.has-image #upload-container { cursor: default; }
        #upload-ui-wrapper.has-image #upload-action-label { display: none; }
        #upload-ui-wrapper.has-image #file-name-display { color: var(--black); text-align: left; }
        #upload-ui-wrapper.has-image #upload-thumbnail { display: block; }
        #upload-ui-wrapper.has-image #clear-file-btn { display: flex; }
        #clear-file-btn { display: none; }

        .footer-info { font-size: var(--size-small); color: var(--grey-50); text-transform: uppercase; text-align: left; margin: 0; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-link" onclick="window.scrollTo(0,0)">
                <div class="header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="935.31" height="810" viewBox="72.35 270 935.31 810"><g transform="translate(540, 540)"><path d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z" fill="var(--black)" /></g></svg>
                </div>
                <div class="logo-text"><span>martinvojtus</span> • space</div>
            </div>
            <div class="menu-toggle" id="menuToggle" onclick="toggleMenu()"><div class="line"></div><div class="line"></div></div>
        </div>
    </header>

    <nav class="nav-overlay" id="navOverlay">
        <div class="menu-items">
            <a class="menu-link" onclick="window.scrollTo(0,0); closeMenu();"><span>Feed</span></a>
            <div class="divider"></div>
            
            <div id="login-ui">
                <form onsubmit="handleLogin(event)" style="display: flex; width: 100%; gap: var(--gap-item); margin: 0;">
                    <input type="password" id="admin-pass" class="form-input" placeholder="Password..." style="flex-grow: 1; margin: 0;">
                    <button type="submit" class="submit-btn icon-btn" aria-label="Log In">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </form>
            </div>
            <div id="logout-ui">
                <button onclick="handleLogout()" class="submit-btn" style="width: 100%; margin: 0;">LOGOUT</button>
            </div>
            
            <div class="divider"></div>
            <div class="footer-info">build v5.0.5 • 2026</div>
        </div>
    </nav>

    <main>
        <div id="section-feed">
            <h2 style="font-size: var(--size-large); margin: 0; line-height: 1;">Feed.</h2>
            <div class="divider"></div>
            
            <div id="feed-admin-zone">
                <form id="editor-form" onsubmit="handleMainSubmit(event)" style="display: flex; flex-direction: column; width: 100%; margin: 0;">
                    <div style="display: flex; width: 100%;">
                        <input type="text" id="edit-title" class="form-input" placeholder="Quick thought..." style="flex-grow: 1; margin: 0; min-width: 0;">
                        
                        <div id="quick-buttons">
                            <button type="button" class="submit-btn icon-btn" onclick="toggleAdvancedEditor(true)" title="Advanced Editor" aria-label="Advanced Editor">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                            <button type="submit" id="quick-btn" class="submit-btn icon-btn" aria-label="Post">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                        </div>
                    </div>

                    <div id="advanced-section-wrapper">
                        <textarea id="edit-text" class="form-textarea" placeholder="Content"></textarea>

                        <div id="upload-ui-wrapper" style="display: flex; gap: var(--gap-item); width: 100%;">
                            <img id="upload-thumbnail" src="" alt="">
                            <input type="file" id="edit-image" accept="image/*" style="display: none;" onchange="updateImageUIState()">
                            
                            <div id="upload-container" class="form-input" onclick="document.getElementById('edit-image').click()">
                                <span id="upload-action-label">Upload image</span>
                                <span id="file-name-display"></span>
                            </div>

                            <button type="button" id="clear-file-btn" class="submit-btn secondary-btn icon-btn" aria-label="Remove Image" onclick="clearImageSelection(event)">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                        
                        <div class="divider"></div>
                        
                        <div style="display: flex; gap: var(--gap-item);">
                            <button type="submit" id="publish-btn" class="submit-btn" style="flex-grow: 1;">PUBLISH</button>
                            <button type="button" class="submit-btn icon-btn" onclick="toggleAdvancedEditor(false)" aria-label="Cancel">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                        
                        <div class="divider"></div>
                        <button type="button" id="delete-all-btn" data-state="0" class="submit-btn danger-btn" style="width: 100%; margin: 0;" onclick="handleDeleteAllClick()">DELETE ALL POSTS</button>
                    </div>
                </form>
            </div>

            <div id="status-container" class="status-feed"></div>
            <div id="loading-indicator" class="loading-text">Loading...</div>
        </div>
    </main>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        let secretKey = ""; 
        let editingId = null;
        let globalPosts = [];
        let currentImageUrl = null; 
        let removeImageFlag = false; 

        let currentOffset = 0;
        const postsLimit = 10;
        let isLoading = false;
        let hasMorePosts = true;

        const menuToggle = document.getElementById('menuToggle');
        const navOverlay = document.getElementById('navOverlay');
        const passInput = document.getElementById('admin-pass');
        const titleInput = document.getElementById('edit-title');
        const textInput = document.getElementById('edit-text');

        const svgNormal = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><polyline points="9 18 15 12 9 6"></polyline></svg>';
        const svgSuccess = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><polyline points="20 6 9 17 4 12"></polyline></svg>';

        [passInput, titleInput, textInput].forEach(input => {
            if(input) input.addEventListener('input', function() {
                this.classList.remove('input-error');
                if (this.id === 'admin-pass') this.placeholder = 'Password...';
                if (this.id === 'edit-title' && document.getElementById('editor-form').classList.contains('adv-open')) this.placeholder = 'Title';
                else if (this.id === 'edit-title') this.placeholder = 'Quick thought...';
                if (this.id === 'edit-text') this.placeholder = 'Content';
            });
        });

        function toggleMenu() { menuToggle.classList.toggle('active'); navOverlay.classList.toggle('active'); }
        function closeMenu() { menuToggle.classList.remove('active'); navOverlay.classList.remove('active'); }

        function handleLogin(e) {
            e.preventDefault();
            if (!passInput.value.trim()) { passInput.classList.add('input-error'); passInput.placeholder = 'Required!'; return; }
            secretKey = passInput.value;
            document.body.classList.add('is-logged-in');
            closeMenu();
            refreshFeedUI();
        }

        function handleLogout() {
            secretKey = ""; passInput.value = ''; 
            toggleAdvancedEditor(false);
            document.body.classList.remove('is-logged-in'); 
            closeMenu();
            document.getElementById('delete-all-btn').dataset.state = "0"; 
            document.getElementById('delete-all-btn').innerText = "DELETE ALL POSTS";
            refreshFeedUI();
        }

        function handleUnauthorized() {
            handleLogout(); toggleMenu(); 
            passInput.classList.add('input-error'); passInput.placeholder = 'Invalid password!';
        }

        function refreshFeedUI() {
            const container = document.getElementById('status-container');
            if (globalPosts.length > 0) {
                container.innerHTML = '';
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = globalPosts.map(s => renderSinglePost(s)).join('');
                while(tempDiv.firstChild) container.appendChild(tempDiv.firstChild);
            }
        }

        function linkify(text) {
            return text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: inherit; text-decoration: none; opacity: 0.6;">$1</a>');
        }

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => { resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() })); }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function fetchStatuses(reset = false) {
            if (reset) {
                currentOffset = 0; hasMorePosts = true; globalPosts = [];
                document.getElementById('status-container').innerHTML = '';
                document.getElementById('loading-indicator').style.display = 'block';
                document.getElementById('loading-indicator').innerText = 'Loading...';
            }
            if (isLoading || !hasMorePosts) return;
            isLoading = true;
            const container = document.getElementById('status-container');
            const loader = document.getElementById('loading-indicator');
            try {
                const response = await fetch(`${API_URL}/posts?skip=${currentOffset}&limit=${postsLimit}`);
                if (!response.ok) throw new Error();
                const newPosts = await response.json();
                if (newPosts.length < postsLimit) { hasMorePosts = false; loader.style.display = 'none'; }
                currentOffset += newPosts.length;
                globalPosts = globalPosts.concat(newPosts);
                if (reset && globalPosts.length === 0) {
                    container.innerHTML = '<p class="loading-text">Nothing there.</p>'; loader.style.display = 'none';
                } else {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = newPosts.map(s => renderSinglePost(s)).join('');
                    while(tempDiv.firstChild) container.appendChild(tempDiv.firstChild);
                }
            } catch (error) {
                if (reset) container.innerHTML = `<p class="loading-text">Failed to load data.</p>`;
                loader.style.display = 'none';
            } finally { isLoading = false; }
        }

        window.addEventListener('scroll', () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) fetchStatuses(); });

        function renderSinglePost(s) {
            const dateObj = new Date(s.at);
            const date = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
            const time = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            let editedHtml = '';
            if (s.updated_at) {
                const updateObj = new Date(s.updated_at);
                const updateDate = updateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
                const updateTime = updateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                editedHtml = `<div style="font-size: var(--size-small); color: var(--grey-50); margin: 0; line-height: 1;">EDITED: ${updateDate.toUpperCase()} • ${updateTime}</div>`;
            }
            const titleHtml = (s.title && s.title.trim() !== "") ? `<h3 class="status-title">${s.title}</h3>` : '';
            const imageHtml = s.image_url ? `<img src="${s.image_url}" class="status-image" alt="Post image" loading="lazy">` : '';
            let textHtml = (s.text && s.text.trim() !== "") ? `<div class="status-text">${linkify(s.text)}</div>` : '';
            let adminActionsHtml = '';
            if (secretKey) {
                adminActionsHtml = `
                <div style="display: flex; gap: var(--gap-item); align-items: center; margin: 0;">
                    <button onclick="startEdit(${s.id});" class="admin-action-btn admin-action-link">Edit</button>
                    <button id="feed-del-btn-${s.id}" onclick="handleDeleteFeed(${s.id})" data-confirm="false" class="admin-action-btn admin-action-link">Delete</button>
                </div>`;
            }
            return `
            <div class="status-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin: 0; gap: var(--gap-item);">
                    <span class="status-date">${date} • ${time}</span>
                    ${adminActionsHtml}
                </div>
                ${titleHtml}
                ${imageHtml}
                ${textHtml}
                ${editedHtml}
            </div>`;
        }

        function toggleAdvancedEditor(show) {
            const form = document.getElementById('editor-form');
            titleInput.classList.remove('input-error'); textInput.classList.remove('input-error');

            if (show) {
                titleInput.placeholder = "Title"; textInput.placeholder = "Content";
                form.classList.add('adv-open'); updateImageUIState();
            } else {
                form.classList.remove('adv-open'); titleInput.placeholder = "Quick thought...";
                editingId = null; titleInput.value = ""; textInput.value = ""; document.getElementById('edit-image').value = "";
                removeImageFlag = false; currentImageUrl = null;
                updateImageUIState();
                document.getElementById('delete-all-btn').dataset.state = "0"; 
                document.getElementById('delete-all-btn').innerText = "DELETE ALL POSTS";
                document.getElementById('publish-btn').innerText = "PUBLISH";
            }
        }

        function startEdit(id) {
            const post = globalPosts.find(p => p.id === id);
            if(!post) return;
            
            titleInput.classList.remove('input-error'); textInput.classList.remove('input-error');
            editingId = id; currentImageUrl = post.image_url || null; removeImageFlag = false; 
            titleInput.value = post.title || ""; textInput.value = post.text || "";
            document.getElementById('edit-image').value = ""; titleInput.placeholder = "Title";
            document.getElementById('publish-btn').innerText = "SAVE CHANGES";
            
            updateImageUIState(); 
            document.getElementById('editor-form').classList.add('adv-open');
            window.scrollTo({ top: 0, behavior: 'auto' });
        }

        function updateImageUIState() {
            const wrapper = document.getElementById('upload-ui-wrapper');
            const input = document.getElementById('edit-image');
            const nameDisplay = document.getElementById('file-name-display');
            const thumbnail = document.getElementById('upload-thumbnail');

            const hasNewFile = input.files && input.files.length > 0;
            const hasExistingImage = currentImageUrl && !removeImageFlag;

            if (hasNewFile || hasExistingImage) {
                wrapper.classList.add('has-image'); 
                if (hasNewFile) {
                     const file = input.files[0]; nameDisplay.innerText = file.name; thumbnail.src = URL.createObjectURL(file);
                } else {
                     let fileName = currentImageUrl.split('/').pop().split('?')[0]; nameDisplay.innerText = fileName; thumbnail.src = currentImageUrl;
                }
            } else {
                wrapper.classList.remove('has-image'); thumbnail.src = ''; nameDisplay.innerText = "";
            }
        }
        
        function clearImageSelection(e) {
            e.stopPropagation();
            const input = document.getElementById('edit-image');
            if (input.files && input.files.length > 0) input.value = ""; else removeImageFlag = true;
            updateImageUIState();
        }

        async function handleMainSubmit(e) {
            e.preventDefault();
            const isAdvanced = document.getElementById('editor-form').classList.contains('adv-open');
            if (isAdvanced) await handlePublish(); else await handleQuickPost();
        }

        async function handlePublish() {
            const title = titleInput.value.trim();
            const text = textInput.value.trim();
            const imageFile = document.getElementById('edit-image').files[0];
            const publishBtn = document.getElementById('publish-btn');
            const originalBtnText = editingId ? "SAVE CHANGES" : "PUBLISH";
            let hasImage = !!imageFile || (currentImageUrl && !removeImageFlag);
            
            if (!text && !hasImage) { textInput.classList.add('input-error'); textInput.placeholder = 'Content required!'; return; }
            
            publishBtn.disabled = true; let finalImageUrl = currentImageUrl;
            if (removeImageFlag && !imageFile) finalImageUrl = null; 
            
            if (imageFile) {
                publishBtn.innerText = "UPLOADING...";
                const compressedFile = await compressImage(imageFile);
                const formData = new FormData(); formData.append("file", compressedFile);
                try {
                    const uploadRes = await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": secretKey }, body: formData });
                    if (uploadRes.status === 401) return handleUnauthorized();
                    if (!uploadRes.ok) throw new Error();
                    const uploadData = await uploadRes.json(); finalImageUrl = uploadData.image_url;
                } catch (err) {
                    publishBtn.innerText = "ERROR!"; setTimeout(() => { publishBtn.innerText = originalBtnText; publishBtn.disabled = false; }, 1500); return;
                }
            }
            
            publishBtn.innerText = "SAVING...";
            const method = editingId ? "PUT" : "POST";
            const endpoint = editingId ? `${API_URL}/posts/${editingId}` : `${API_URL}/posts`;
            try {
                const res = await fetch(endpoint, {
                    method: method, headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                    body: JSON.stringify({ title: title, text: text, image_url: finalImageUrl })
                });
                if (res.status === 401) return handleUnauthorized();
                if (!res.ok) throw new Error();
                
                publishBtn.innerText = editingId ? "UPDATED." : "PUBLISHED.";
                await fetchStatuses(true); toggleAdvancedEditor(false); publishBtn.disabled = false;
            } catch (err) {
                publishBtn.innerText = "ERROR!"; setTimeout(() => { publishBtn.innerText = originalBtnText; publishBtn.disabled = false; }, 1500);
            }
        }

        async function handleQuickPost() {
            const text = titleInput.value.trim();
            const btn = document.getElementById('quick-btn');
            
            if(!text) { titleInput.classList.add('input-error'); titleInput.placeholder = 'Required!'; return; }
            
            btn.disabled = true; btn.innerHTML = "...";
            try {
                const res = await fetch(`${API_URL}/posts`, {
                    method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": secretKey },
                    body: JSON.stringify({ title: "", text: text, image_url: null })
                });
                if (res.status === 401) return handleUnauthorized();
                if(!res.ok) throw new Error();
                
                titleInput.value = ""; btn.innerHTML = svgSuccess;
                await fetchStatuses(true);
                setTimeout(() => { btn.innerHTML = svgNormal; btn.disabled = false; }, 1000);
            } catch(err) {
                btn.innerHTML = "!"; setTimeout(() => { btn.innerHTML = svgNormal; btn.disabled = false; }, 1000);
            }
        }

        async function handleDeleteFeed(id) {
            const btn = document.getElementById(`feed-del-btn-${id}`);
            if (btn.dataset.confirm === "true") {
                btn.innerText = "Deleting..."; btn.disabled = true;
                try {
                    const res = await fetch(`${API_URL}/posts/${id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } });
                    if (res.status === 401) return handleUnauthorized();
                    fetchStatuses(true); 
                } catch(e) {
                    btn.innerText = "Error"; setTimeout(() => { btn.innerText = "Delete"; btn.disabled = false; btn.dataset.confirm = "false"; }, 1500);
                }
            } else {
                btn.dataset.confirm = "true"; btn.innerText = "Confirm"; btn.style.color = "#ff4444";
                setTimeout(() => {
                    if (btn.dataset.confirm === "true") { btn.dataset.confirm = "false"; btn.innerText = "Delete"; btn.style.color = ""; }
                }, 3000);
            }
        }

        function handleDeleteAllClick() {
            const btn = document.getElementById('delete-all-btn');
            const state = btn.dataset.state || "0";
            if (state === "0") {
                btn.dataset.state = "1"; btn.innerText = "CLICK TO CONFIRM";
                setTimeout(() => { if(btn.dataset.state === "1") { btn.dataset.state = "0"; btn.innerText = "DELETE ALL POSTS"; } }, 3000);
            } else if (state === "1") {
                btn.dataset.state = "2"; btn.innerText = "DELETING..."; btn.disabled = true;
                executeDeleteAll(btn);
            }
        }

        async function executeDeleteAll(btn) {
            try {
                let deleting = true;
                while(deleting) {
                    const res = await fetch(`${API_URL}/posts?skip=0&limit=50`);
                    const posts = await res.json();
                    if (posts.length === 0) { deleting = false; break; }
                    for (const p of posts) {
                        await fetch(`${API_URL}/posts/${p.id}`, { method: "DELETE", headers: { "x-admin-password": secretKey } });
                    }
                }
                fetchStatuses(true);
            } catch(e) { btn.innerText = "ERROR!"; } 
            finally { setTimeout(() => { btn.dataset.state = "0"; btn.innerText = "DELETE ALL POSTS"; btn.disabled = false; closeMenu(); }, 1000); }
        }

        fetchStatuses(true);
        document.addEventListener('click', (e) => { 
            if (!navOverlay.contains(e.target) && !menuToggle.contains(e.target) && navOverlay.classList.contains('active')) closeMenu(); 
        });
    </script>
</body>
</html>
