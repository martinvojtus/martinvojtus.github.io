<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>martinvojtus.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Space Grotesk', sans-serif;
            --size-header: 1.5rem;
            --size-title: 2.2rem;
            --size-body: 1rem;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            font-weight: 400;
            background-color: #ffffff; /* Čisto biele pozadie */
            color: #000000;
            line-height: 1.4;
        }

        /* 🧊 Banner bez rámečkov s matným sklom */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .logo {
            font-size: var(--size-header);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* 📏 Hlavný obsah s upraveným odsadením */
        main {
            padding: 90px 20px 50px; /* Znížené horné odsadenie */
            max-width: 800px;
            margin: 0 auto;
        }

        h2 {
            font-size: var(--size-title);
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.03em;
        }

        .content-text {
            font-size: var(--size-body);
            max-width: 500px;
            margin-bottom: 40px;
        }

        /* 🖼️ Foto placeholder 3:4 s jediným povoleným rámčekom */
        .photo-container {
            width: 100%;
            max-width: 400px; /* Šírka podľa potreby */
        }

        .photo-frame {
            width: 100%;
            aspect-ratio: 3 / 4; /* Formát na výšku */
            border: 1px solid #000000; /* Jediný povolený rámček */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
        }

        .photo-label {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">martinvojtus.space</div>
    </header>

    <main>
        <h2>Vybrané práce</h2>
        <div class="content-text">
            Zameriavam sa na vizuálnu tvorbu a priestorový dizajn. Tu nájdeš ukážky mojich najnovších projektov a experimentov.
        </div>

        <div class="photo-container">
            <div class="photo-frame">
                <span class="photo-label">foto_01.jpg [3:4]</span>
            </div>
        </div>
    </main>

</body>
</html>
