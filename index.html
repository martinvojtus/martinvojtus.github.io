<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>martinvojtus • space</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { black: '#000000', white: '#ffffff', gray: { 50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e7eb', 400: '#9ca3af', 500: '#6b7280', 900: '#111827' } }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer components {
            .btn-dark { @apply flex items-center justify-center h-12 px-6 rounded-full font-bold text-xs uppercase tracking-widest bg-black text-white hover:bg-gray-800 transition-colors disabled:opacity-50 cursor-pointer whitespace-nowrap; }
            .btn-light { @apply flex items-center justify-center h-12 px-6 rounded-full font-bold text-xs uppercase tracking-widest bg-transparent text-black border border-gray-200 hover:bg-gray-50 transition-colors disabled:opacity-50 cursor-pointer whitespace-nowrap; }
            .btn-danger { @apply flex items-center justify-center h-12 px-6 rounded-full font-bold text-xs uppercase tracking-widest bg-red-600 text-white hover:bg-red-700 transition-colors disabled:opacity-50 cursor-pointer whitespace-nowrap; }
            
            .input { @apply w-full px-4 py-3 bg-gray-50 border border-gray-200 text-black rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition-colors; }
            .label { @apply text-xs font-bold text-gray-400 uppercase tracking-widest block mb-2; }
            
            .card { @apply bg-white border border-gray-200 rounded-xl p-6 md:p-8 w-full flex flex-col gap-6; }
        }

        html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        body { background-color: #ffffff; color: #000000; overflow-x: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #000; border-radius: 50%; width: 1.5rem; height: 1.5rem; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .masonry { column-count: 1; column-gap: 1.5rem; }
        @media (min-width: 640px) { .masonry { column-count: 2; } }
        @media (min-width: 1024px) { .masonry { column-count: 3; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; display: block; width: 100%; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col selection:bg-black selection:text-white">

    <div id="app-root" class="flex flex-col min-h-screen w-full"></div>
    <div id="modal-root" class="fixed inset-0 bg-white/95 backdrop-blur-sm z-[9999] hidden flex-col justify-center items-center px-4"></div>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        
        const DEFAULT_CONFIG = {
            siteTitle: "martinvojtus • space",
            footerText: "build v1.0.0 • 2026",
            pages: [
                { id: "grid", title: "Grid", type: "gallery" },
                { id: "about", title: "About", type: "profile" },
                { id: "contact", title: "Contact", type: "contact" }
            ]
        };

        const App = {
            token: localStorage.getItem('mv_admin_key') || "",
            posts: [],
            config: JSON.parse(JSON.stringify(DEFAULT_CONFIG)),
            configPostId: null,
            route: "grid",
            dashTab: "settings",
            isMenuOpen: false,
            isLoading: true
        };

        async function init() {
            App.isLoading = true;
            render();

            try {
                const res = await fetch(`${API_URL}/posts?skip=0&limit=1000`);
                App.posts = await res.json();
                
                const configPost = App.posts.find(p => p.author === "_system_config");
                if (configPost) {
                    App.configPostId = configPost.id;
                    try { App.config = JSON.parse(configPost.text); } catch(e) {}
                }
                document.title = App.config.siteTitle;

                if (App.config.pages.length > 0 && !App.config.pages.find(p => p.id === App.route) && App.route !== 'dashboard') {
                    App.route = App.config.pages[0].id;
                }

                if (App.token) {
                    const authRes = await fetch(`${API_URL}/verify`, { headers: { 'x-admin-password': App.token } });
                    if (!authRes.ok) throw new Error();
                }
            } catch (e) {
                App.token = ""; localStorage.removeItem('mv_admin_key');
            }

            App.isLoading = false;
            render();
        }

        // --- RENDER PIPELINE ---
        function render() {
            const root = document.getElementById('app-root');
            root.innerHTML = `
                ${renderHeader()}
                ${App.isMenuOpen ? renderMobileMenu() : ''}
                <main class="w-full max-w-3xl mx-auto pt-28 pb-12 px-4 flex flex-col flex-grow items-center">
                    ${App.isLoading ? `<div class="mt-32"><div class="spinner"></div></div>` : renderMainContent()}
                </main>
                ${renderFooter()}
            `;
        }

        function renderHeader() {
            const icon = App.isMenuOpen 
                ? `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`
                : `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>`;

            let desktopLinks = App.config.pages.map(p => `
                <button onclick="navigate('${p.id}')" class="text-sm font-semibold tracking-wide transition-colors ${App.route === p.id ? 'text-black' : 'text-gray-400 hover:text-black'}">${p.title}</button>
            `).join('');

            desktopLinks += `<div class="w-px h-4 bg-gray-200 mx-2"></div>`;

            if (App.token) {
                desktopLinks += `<button onclick="navigate('dashboard')" class="text-sm font-bold tracking-wide transition-colors ${App.route === 'dashboard' ? 'text-black' : 'text-gray-400 hover:text-black'}">Dashboard</button>`;
                desktopLinks += `<button onclick="logout()" class="text-sm font-bold tracking-wide text-red-500 hover:text-red-700 transition-colors ml-2">Logout</button>`;
            } else {
                desktopLinks += `<button onclick="openLoginModal()" class="text-sm font-bold tracking-wide text-gray-400 hover:text-black transition-colors">Login</button>`;
            }

            return `
            <header class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur-md border-b border-gray-100 z-50">
                <div class="max-w-3xl mx-auto px-4 py-5 flex justify-between items-center w-full">
                    <div class="flex items-center gap-3 cursor-pointer hover:opacity-70 transition-opacity" onclick="navigate('${App.config.pages[0]?.id || ''}')">
                        <svg class="w-4 h-4 text-black" viewBox="72.35 270 935.31 810"><g transform="translate(540, 540)"><path fill="currentColor" d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z"/></g></svg>
                        <div class="font-bold text-sm tracking-widest lowercase">${App.config.siteTitle}</div>
                    </div>
                    <button class="md:hidden text-black p-1" onclick="toggleMenu()">${icon}</button>
                    <nav class="hidden md:flex items-center gap-6">${desktopLinks}</nav>
                </div>
            </header>
            `;
        }

        function renderMobileMenu() {
            let links = App.config.pages.map(p => `
                <button onclick="navigate('${p.id}')" class="text-3xl font-bold text-left tracking-tight ${App.route === p.id ? 'text-black' : 'text-gray-400'}">${p.title}</button>
            `).join('');

            links += `<div class="w-full h-px bg-gray-200 my-4"></div>`;

            if (App.token) {
                links += `<button onclick="navigate('dashboard')" class="text-3xl font-bold text-left tracking-tight ${App.route === 'dashboard' ? 'text-black' : 'text-gray-400'}">Dashboard</button>`;
                links += `<button onclick="logout()" class="text-3xl font-bold text-left tracking-tight text-red-500 mt-4">Logout</button>`;
            } else {
                links += `<button onclick="openLoginModal()" class="text-xl font-bold text-left text-gray-400 hover:text-black">Login</button>`;
            }

            return `
            <div class="fixed inset-0 bg-white z-40 flex flex-col px-6 pt-32 pb-12 overflow-y-auto">
                <div class="flex flex-col gap-6 w-full max-w-3xl mx-auto">${links}</div>
            </div>
            `;
        }

        function renderFooter() {
            return `
            <footer class="w-full mt-24 mb-12 flex flex-col items-center gap-6">
                <div class="w-12 h-px bg-gray-200"></div>
                <div class="text-xs font-bold text-gray-400 tracking-widest uppercase text-center">${App.config.footerText}</div>
            </footer>
            `;
        }

        function renderMainContent() {
            if (App.route === 'dashboard') {
                if (!App.token) { navigate(App.config.pages[0]?.id); return ''; }
                return renderDashboard();
            }

            const pageConfig = App.config.pages.find(p => p.id === App.route);
            if (!pageConfig) return `<div class="text-gray-400 mt-20">Page not found.</div>`;

            if (pageConfig.type === 'gallery') return renderGallery(pageConfig.id);
            if (pageConfig.type === 'profile') return renderProfile(pageConfig.id);
            if (pageConfig.type === 'contact') return renderContact(pageConfig.id);

            return `<div>Unknown page type.</div>`;
        }

        // --- COMPONENT ARCHITECTURE: PUBLIC VIEWS ---
        function renderGallery(pageId) {
            const posts = App.posts.filter(p => p.author === pageId).sort((a,b) => new Date(b.at) - new Date(a.at));
            if (posts.length === 0) return `<div class="w-full py-20 border border-dashed border-gray-200 rounded-xl text-center text-gray-400 font-bold text-sm tracking-widest uppercase">No content yet.</div>`;

            const itemsHtml = posts.map(p => `
                <div class="masonry-item relative group">
                    <img src="${p.image_url}" class="w-full h-auto rounded-xl bg-gray-50 border border-gray-100" loading="lazy">
                </div>
            `).join('');

            return `<div class="w-full masonry">${itemsHtml}</div>`;
        }

        function renderProfile(pageId) {
            const post = App.posts.find(p => p.author === pageId);
            if (!post) return `<div class="text-gray-400">Content pending.</div>`;
            
            let data = {};
            try { data = JSON.parse(post.text); } catch(e) {}

            let expsHtml = '';
            if (data.exps && data.exps.length > 0) {
                expsHtml = `<div class="text-2xl font-bold tracking-tight mt-16 mb-8">Experience</div>` + 
                data.exps.map((e, i) => `
                    <div class="flex flex-col items-start w-full">
                        <div class="text-lg font-bold">${e.title}</div>
                        <div class="text-gray-500 mb-2">${e.company}</div>
                        <div class="px-3 py-1 bg-gray-100 rounded-md text-xs font-bold text-gray-500 tracking-widest uppercase">${e.date}</div>
                        ${i < data.exps.length - 1 ? `<div class="w-full h-px bg-gray-100 my-8"></div>` : ''}
                    </div>
                `).join('');
            }

            return `
            <div class="flex flex-col w-full">
                <h1 class="text-4xl font-bold tracking-tight mb-12">About</h1>
                ${post.image_url ? `<img src="${post.image_url}" class="w-full h-auto rounded-xl mb-12 object-cover border border-gray-100">` : ''}
                ${data.intro ? `<div class="text-xl text-gray-500 leading-relaxed mb-12 font-medium">${data.intro}</div>` : ''}
                ${data.text ? `<div class="text-lg leading-relaxed text-black mb-12 whitespace-pre-wrap">${data.text}</div>` : ''}
                ${expsHtml}
            </div>`;
        }

        function renderContact(pageId) {
            const post = App.posts.find(p => p.author === pageId);
            if (!post) return `<div class="text-gray-400">Content pending.</div>`;
            
            return `
            <div class="flex flex-col w-full gap-8">
                ${post.image_url ? `<img src="${post.image_url}" class="w-full h-auto rounded-xl object-cover border border-gray-100 mb-4">` : ''}
                ${post.title ? `<div class="text-4xl font-bold tracking-tight">${post.title}</div>` : ''}
                ${post.text ? `<div class="text-lg text-gray-500 leading-relaxed whitespace-pre-wrap">${post.text}</div>` : ''}
            </div>`;
        }

        // --- COMPONENT ARCHITECTURE: DASHBOARD ---
        function renderDashboard() {
            const tabs = [
                { id: 'settings', label: 'Settings' },
                ...App.config.pages.map(p => ({ id: `page_${p.id}`, label: `${p.title}` }))
            ];

            const tabsHtml = tabs.map(t => `
                <button onclick="App.dashTab = '${t.id}'; render();" class="h-10 px-4 rounded-full font-bold text-xs uppercase tracking-widest whitespace-nowrap transition-colors ${App.dashTab === t.id ? 'bg-black text-white' : 'bg-gray-50 text-gray-500 hover:bg-gray-100 border border-gray-200'}">${t.label}</button>
            `).join('');

            let activeContent = '';
            if (App.dashTab === 'settings') activeContent = renderDashSettings();
            else if (App.dashTab.startsWith('page_')) {
                const pageId = App.dashTab.replace('page_', '');
                const pageConfig = App.config.pages.find(p => p.id === pageId);
                if (pageConfig) {
                    if (pageConfig.type === 'gallery') activeContent = renderDashGallery(pageConfig);
                    if (pageConfig.type === 'profile') activeContent = renderDashProfile(pageConfig);
                    if (pageConfig.type === 'contact') activeContent = renderDashContact(pageConfig);
                }
            }

            return `
            <div class="w-full flex flex-col gap-8">
                <div class="flex flex-col gap-2">
                    <h1 class="text-3xl font-bold tracking-tight">Dashboard</h1>
                </div>
                
                <div class="flex gap-2 overflow-x-auto hide-scroll pb-2 w-full border-b border-gray-100">
                    ${tabsHtml}
                </div>

                <div class="w-full flex flex-col gap-8">
                    ${activeContent}
                </div>
            </div>
            `;
        }

        function renderDashSettings() {
            const pagesList = App.config.pages.map((p, i) => `
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="flex flex-col">
                        <span class="font-bold">${p.title}</span>
                        <span class="text-xs text-gray-400 font-mono mt-1">${p.type} | /${p.id}</span>
                    </div>
                    <button onclick="removePage(${i})" class="text-red-500 hover:text-red-700 p-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                </div>
            `).join('');

            return `
                <div class="card">
                    <div class="text-xl font-bold tracking-tight border-b border-gray-100 pb-4">General Configuration</div>
                    <div>
                        <label class="label">Site Title</label>
                        <input type="text" id="cfg-title" class="input font-bold" value="${App.config.siteTitle}">
                    </div>
                    <div>
                        <label class="label">Footer Text</label>
                        <input type="text" id="cfg-footer" class="input" value="${App.config.footerText}">
                    </div>
                    <button onclick="saveGlobalConfig()" id="btn-save-cfg" class="btn-dark w-full mt-4">Save Configuration</button>
                </div>

                <div class="card">
                    <div class="text-xl font-bold tracking-tight border-b border-gray-100 pb-4">Menu Architecture</div>
                    <div class="flex flex-col gap-3">${pagesList}</div>
                    
                    <div class="flex flex-col md:flex-row gap-4 p-4 bg-gray-50 rounded-lg border border-gray-200 border-dashed mt-4 items-end">
                        <div class="flex flex-col gap-2 w-full">
                            <label class="label !mb-0">Slug</label>
                            <input type="text" id="new-page-id" class="input font-mono !h-10 !py-0" placeholder="e.g. info">
                        </div>
                        <div class="flex flex-col gap-2 w-full">
                            <label class="label !mb-0">Title</label>
                            <input type="text" id="new-page-title" class="input !h-10 !py-0" placeholder="e.g. Info">
                        </div>
                        <div class="flex flex-col gap-2 w-full">
                            <label class="label !mb-0">Type</label>
                            <select id="new-page-type" class="input !h-10 !py-0 !px-2 bg-white">
                                <option value="gallery">Gallery</option>
                                <option value="profile">Profile / Resume</option>
                                <option value="contact">Contact</option>
                            </select>
                        </div>
                        <button onclick="addPage()" class="btn-dark w-full md:w-auto !h-10 px-4">+ Add</button>
                    </div>
                </div>
            `;
        }

        function renderDashGallery(pageConfig) {
            const items = App.posts.filter(p => p.author === pageConfig.id).sort((a,b) => new Date(b.at) - new Date(a.at));
            const listHtml = items.map(p => `
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <img src="${p.image_url}" class="w-12 h-12 rounded bg-gray-200 object-cover">
                    <button onclick="confirmDelete(${p.id})" class="text-red-500 hover:text-red-700 p-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                </div>
            `).join('');

            return `
                <div class="card">
                    <div class="text-xl font-bold tracking-tight border-b border-gray-100 pb-4">Manage: ${pageConfig.title}</div>
                    <input type="file" id="gal-upload" accept="image/*" class="hidden" onchange="uploadGalleryImage('${pageConfig.id}')">
                    <button id="btn-upload-gal" onclick="document.getElementById('gal-upload').click()" class="h-14 rounded-lg border-2 border-dashed border-gray-300 text-gray-500 font-bold text-xs uppercase tracking-widest hover:bg-gray-50 transition-colors w-full">+ Upload Photo</button>
                    <div class="flex flex-col gap-3 mt-4">${listHtml.length > 0 ? listHtml : '<div class="text-gray-400 text-sm">No photos yet.</div>'}</div>
                </div>
            `;
        }

        function renderDashProfile(pageConfig) {
            const post = App.posts.find(p => p.author === pageConfig.id);
            let data = { intro: '', text: '', exps: [] };
            if(post) { try { data = JSON.parse(post.text); } catch(e){} }
            
            window.tempExps = data.exps || [];

            return `
                <div class="card">
                    <div class="text-xl font-bold tracking-tight border-b border-gray-100 pb-4">Editor: ${pageConfig.title}</div>
                    
                    <div>
                        <label class="label">Profile Image</label>
                        <input type="file" id="prf-img-upload" accept="image/*" class="hidden" onchange="uploadProfileImage('${pageConfig.id}', ${post ? post.id : null})">
                        ${post && post.image_url ? `<img src="${post.image_url}" class="w-full h-48 object-cover rounded-lg border border-gray-200 cursor-pointer" onclick="document.getElementById('prf-img-upload').click()">` : `<button onclick="document.getElementById('prf-img-upload').click()" class="h-16 rounded-lg border-2 border-dashed border-gray-300 text-gray-500 font-bold text-xs uppercase tracking-widest hover:bg-gray-50 transition-colors w-full">+ Select Image</button>`}
                    </div>

                    <div>
                        <label class="label">Intro Subtitle</label>
                        <textarea id="prf-intro" class="input" rows="2">${data.intro || ''}</textarea>
                    </div>

                    <div>
                        <label class="label">Main Text</label>
                        <textarea id="prf-text" class="input" rows="6">${data.text || ''}</textarea>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-4"><label class="label !mb-0">Experience Timeline</label><button type="button" onclick="addExpRowToDOM()" class="btn-light !h-8 !px-3 !text-[10px]">+ Add Row</button></div>
                        <div id="prf-exp-container" class="flex flex-col gap-3">
                            ${window.tempExps.map((e) => buildExpRowHtml(e.title, e.company, e.date)).join('')}
                        </div>
                    </div>

                    <button onclick="saveProfileConfig('${pageConfig.id}', ${post ? post.id : null}, '${post ? post.image_url : ''}')" id="btn-save-prf" class="btn-dark w-full mt-4">Save Changes</button>
                </div>
            `;
        }

        function renderDashContact(pageConfig) {
            const post = App.posts.find(p => p.author === pageConfig.id);
            return `
                <div class="card">
                    <div class="text-xl font-bold tracking-tight border-b border-gray-100 pb-4">Editor: ${pageConfig.title}</div>
                    
                    <div>
                        <label class="label">Header Image</label>
                        <input type="file" id="cnt-img-upload" accept="image/*" class="hidden" onchange="uploadContactImage('${pageConfig.id}', ${post ? post.id : null})">
                        ${post && post.image_url ? `<img src="${post.image_url}" class="w-full h-48 object-cover rounded-lg border border-gray-200 cursor-pointer" onclick="document.getElementById('cnt-img-upload').click()">` : `<button onclick="document.getElementById('cnt-img-upload').click()" class="h-16 rounded-lg border-2 border-dashed border-gray-300 text-gray-500 font-bold text-xs uppercase tracking-widest hover:bg-gray-50 transition-colors w-full">+ Select Image</button>`}
                    </div>

                    <div>
                        <label class="label">Headline</label>
                        <input type="text" id="cnt-title" class="input font-bold" value="${post ? post.title : ''}">
                    </div>

                    <div>
                        <label class="label">Text content</label>
                        <textarea id="cnt-text" class="input" rows="6">${post ? post.text : ''}</textarea>
                    </div>

                    <button onclick="saveContactConfig('${pageConfig.id}', ${post ? post.id : null}, '${post ? post.image_url : ''}')" id="btn-save-cnt" class="btn-dark w-full mt-4">Save Changes</button>
                </div>
            `;
        }

        // --- DASHBOARD ACTIONS ---
        
        async function saveGlobalConfig() {
            const btn = document.getElementById('btn-save-cfg'); btn.innerText = "SAVING..."; btn.disabled = true;
            App.config.siteTitle = document.getElementById('cfg-title').value.trim();
            App.config.footerText = document.getElementById('cfg-footer').value.trim();
            
            const payload = { title: "", text: JSON.stringify(App.config), image_url: "", show_date: false, author: "_system_config" };
            const method = App.configPostId ? "PUT" : "POST";
            const url = App.configPostId ? `${API_URL}/posts/${App.configPostId}` : `${API_URL}/posts`;

            try { await fetch(url, { method, headers: { "Content-Type": "application/json", "x-admin-password": App.token }, body: JSON.stringify(payload) }); await init(); } 
            catch(e) { btn.innerText = "Error"; btn.disabled = false; }
        }

        function addPage() {
            const id = document.getElementById('new-page-id').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const title = document.getElementById('new-page-title').value.trim();
            const type = document.getElementById('new-page-type').value;
            if(!id || !title) return alert('Fill ID and Title');
            if(App.config.pages.find(p => p.id === id)) return alert('Slug must be unique');
            App.config.pages.push({id, title, type}); saveGlobalConfig();
        }

        function removePage(index) {
            if(confirm("Remove this page from menu?")) { App.config.pages.splice(index, 1); saveGlobalConfig(); }
        }

        const compressImage = (f, max=1600, q=0.8) => new Promise(res => { const r=new FileReader(); r.readAsDataURL(f); r.onload=e=>{ const i=new Image(); i.src=e.target.result; i.onload=()=>{ const c=document.createElement('canvas'); let w=i.width, h=i.height; if(w>max){h=Math.round(h*max/w); w=max;} c.width=w; c.height=h; c.getContext('2d').drawImage(i,0,0,w,h); c.toBlob(b=>res(new File([b],f.name.replace(/\.[^/.]+$/,"")+".jpg",{type:'image/jpeg'})),'image/jpeg',q); };};});

        async function uploadGalleryImage(authorSlug) {
            const file = document.getElementById('gal-upload').files[0]; if(!file) return;
            const btn = document.getElementById('btn-upload-gal'); btn.innerText = "UPLOADING..."; btn.disabled = true;
            try {
                const formData = new FormData(); formData.append("file", await compressImage(file));
                const finalImageUrl = (await (await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": App.token }, body: formData })).json()).image_url;
                await fetch(`${API_URL}/posts`, { method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": App.token }, body: JSON.stringify({ title: "", text: "", image_url: finalImageUrl, show_date: true, author: authorSlug }) });
                await init();
            } catch(e) { btn.innerText = "+ Upload Photo"; btn.disabled = false; }
        }

        function buildExpRowHtml(t='', c='', d='') {
            return `
            <div class="flex flex-col gap-3 p-4 bg-gray-50 rounded-lg border border-gray-200 relative exp-row-item">
                <input type="text" class="w-full h-10 px-3 bg-white border border-gray-200 rounded-md text-sm font-bold exp-t" placeholder="Job Title" value="${t}">
                <input type="text" class="w-full h-10 px-3 bg-white border border-gray-200 rounded-md text-sm exp-c" placeholder="Company" value="${c}">
                <input type="text" class="w-full h-10 px-3 bg-white border border-gray-200 rounded-md text-sm exp-d" placeholder="Date" value="${d}">
                <button type="button" onclick="this.parentElement.remove()" class="absolute top-4 right-4 text-red-500 text-xs font-bold uppercase">X</button>
            </div>`;
        }
        function addExpRowToDOM() { document.getElementById('prf-exp-container').insertAdjacentHTML('beforeend', buildExpRowHtml()); }

        async function uploadProfileImage(authorSlug, postId) {
            const file = document.getElementById('prf-img-upload').files[0]; if(!file) return;
            try {
                const f = new FormData(); f.append("file", await compressImage(file));
                const img = (await (await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": App.token }, body: f })).json()).image_url;
                saveProfileConfig(authorSlug, postId, img);
            } catch(e) {}
        }

        async function saveProfileConfig(authorSlug, postId, imageUrl) {
            const btn = document.getElementById('btn-save-prf'); if(btn) { btn.innerText = "SAVING..."; btn.disabled = true; }
            const exps = [];
            document.querySelectorAll('.exp-row-item').forEach(el => { exps.push({ title: el.querySelector('.exp-t').value, company: el.querySelector('.exp-c').value, date: el.querySelector('.exp-d').value }); });
            
            const data = { v: 2, intro: document.getElementById('prf-intro').value, text: document.getElementById('prf-text').value, exps: exps };
            
            const payload = { title: "", text: JSON.stringify(data), image_url: imageUrl || "", show_date: false, author: authorSlug };
            const method = postId ? "PUT" : "POST"; const url = postId ? `${API_URL}/posts/${postId}` : `${API_URL}/posts`;
            try { await fetch(url, { method, headers: { "Content-Type": "application/json", "x-admin-password": App.token }, body: JSON.stringify(payload) }); await init(); } 
            catch(e) { if(btn){btn.innerText = "Save Changes"; btn.disabled = false;} }
        }

        async function uploadContactImage(authorSlug, postId) {
            const file = document.getElementById('cnt-img-upload').files[0]; if(!file) return;
            try {
                const f = new FormData(); f.append("file", await compressImage(file));
                const img = (await (await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": App.token }, body: f })).json()).image_url;
                saveContactConfig(authorSlug, postId, img);
            } catch(e) {}
        }

        async function saveContactConfig(authorSlug, postId, imageUrl) {
            const btn = document.getElementById('btn-save-cnt'); if(btn) { btn.innerText = "SAVING..."; btn.disabled = true; }
            const payload = { title: document.getElementById('cnt-title').value, text: document.getElementById('cnt-text').value, image_url: imageUrl || "", show_date: false, author: authorSlug };
            const method = postId ? "PUT" : "POST"; const url = postId ? `${API_URL}/posts/${postId}` : `${API_URL}/posts`;
            try { await fetch(url, { method, headers: { "Content-Type": "application/json", "x-admin-password": App.token }, body: JSON.stringify(payload) }); await init(); } 
            catch(e) { if(btn){btn.innerText = "Save Changes"; btn.disabled = false;} }
        }

        // --- GLOBAL ACTIONS ---
        function navigate(id) { if(!id) return; App.route = id; App.isMenuOpen = false; render(); window.scrollTo(0,0); }
        function toggleMenu() { App.isMenuOpen = !App.isMenuOpen; render(); }
        
        function openLoginModal() {
            App.isMenuOpen = false; render();
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="w-full max-w-sm bg-white border border-gray-200 rounded-2xl p-8 flex flex-col gap-6">
                    <div class="text-xl font-bold text-center">Admin Access</div>
                    <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                        <input type="password" id="admin-pass" class="input" placeholder="Password...">
                        <label class="flex items-center gap-3 text-sm text-gray-600 font-bold cursor-pointer">
                            <input type="checkbox" id="remember-login" class="w-5 h-5 rounded border-gray-300"> Remember me
                        </label>
                        <div class="flex gap-4 mt-4">
                            <button type="button" class="btn-light flex-1" onclick="closeModalRoot()">Cancel</button>
                            <button type="submit" id="login-btn" class="btn-dark flex-1">Login</button>
                        </div>
                    </form>
                </div>
            `;
            root.classList.remove('hidden'); root.classList.add('flex');
        }
        function closeModalRoot() { document.getElementById('modal-root').classList.add('hidden'); document.getElementById('modal-root').classList.remove('flex'); document.getElementById('modal-root').innerHTML = ''; }

        function confirmDelete(id) {
            deleteActionType = id;
            document.getElementById('modal-root').innerHTML = `
                <div class="max-w-sm w-full bg-white border border-gray-200 rounded-2xl p-8 flex flex-col gap-6 items-center text-center">
                    <div class="text-2xl font-bold">Delete Item?</div>
                    <p class="text-gray-500 text-sm">This cannot be undone.</p>
                    <div id="m-actions" class="flex gap-4 w-full mt-2"><button class="btn-light flex-1" onclick="closeModalRoot()">Cancel</button><button class="btn-danger flex-1" onclick="executeDelete()">Delete</button></div>
                    <div id="m-loading" class="btn-light w-full hidden border-dashed">Deleting...</div>
                </div>`;
            document.getElementById('modal-root').classList.remove('hidden'); document.getElementById('modal-root').classList.add('flex');
        }

        async function executeDelete() {
            document.getElementById('m-actions').classList.add('hidden'); document.getElementById('m-loading').classList.remove('hidden'); document.getElementById('m-loading').classList.add('flex');
            try { await fetch(`${API_URL}/posts/${deleteActionType}`,{method:"DELETE",headers:{"x-admin-password":App.token}}); await init(); closeModalRoot(); } catch(e){}
        }

        // Start App
        init();
    </script>
</body>
</html>
