<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex justify-center min-h-screen items-start pt-10 font-sans">

<div class="w-full max-w-xl p-5 space-y-4">

<h1 class="text-2xl text-center font-bold mb-6 tracking-wide">AI Crypto Analyst</h1>

<select id="coin" class="w-full h-14 bg-neutral-900 border border-neutral-800 rounded-xl px-4 outline-none focus:border-purple-600 transition appearance-none">
  <option value="BTC">Bitcoin (BTC)</option>
  <option value="ETH">Ethereum (ETH)</option>
  <option value="SOL">Solana (SOL)</option>
</select>

<select id="timeframe" class="w-full h-14 bg-neutral-900 border border-neutral-800 rounded-xl px-4 outline-none focus:border-purple-600 transition appearance-none">
  <option value="Short-term">Short-term (Daily/Weekly)</option>
  <option value="Long-term">Long-term (Cycle/Macro)</option>
</select>

<button onclick="analyze()" id="btn" class="w-full h-14 bg-purple-700 rounded-xl font-bold text-lg hover:bg-purple-600 transition active:scale-95 shadow-lg">
  Analyze Market
</button>

<div id="spinner" class="hidden text-center text-purple-500 font-medium mt-6">Scanning market data...</div>

<div id="output" class="hidden bg-neutral-900 p-6 rounded-2xl border border-neutral-800 mt-4">
  </div>

</div>

<script>
async function analyze() {
  const coin = document.getElementById("coin").value;
  const timeframe = document.getElementById("timeframe").value;
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const btn = document.getElementById("btn");

  spinner.classList.remove("hidden");
  output.classList.add("hidden");
  btn.disabled = true;
  btn.classList.add("opacity-50");

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ coin, timeframe })
    });

    const data = await res.json();

    const colorClass = data.change > 0 ? "text-green-500" : (data.change < 0 ? "text-red-500" : "text-neutral-400");
    const sign = data.change > 0 ? "+" : "";
    
    // Cena striktne na 2 desatinné miesta s čiarkami
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Prepis AI odpovede na striktný Tailwind (oddeľovače + nadpisy + odrážky)
    let styledAnalysis = data.analysis
      .replace(/\*\*(.*?)\*\*/g, (match, title, offset) => {
        // Pridá oddeľovač (hr) pred každý nadpis okrem úplne prvého
        const divider = offset > 0 ? '<div class="border-b border-neutral-800 my-5"></div>' : '';
        return `${divider}<div class="text-purple-400 text-lg font-bold mb-3">${title}</div>`;
      })
      .replace(/- /g, '<span class="text-purple-600 mr-2 font-black">•</span>')
      .replace(/\n/g, '<br>');

    // Odstránenie prebytočných <br> hneď za nadpismi (aby tam nebola zbytočná medzera)
    styledAnalysis = styledAnalysis.replace(/<\/div><br>/g, '</div>');

    output.innerHTML = `
      <div class="border-b border-neutral-800 pb-5 mb-5">
        <div class="text-neutral-400 text-sm font-bold uppercase tracking-widest mb-1">${data.name} (${data.ticker})</div>
        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
          <span class="text-4xl sm:text-5xl font-bold tracking-tight">$${formattedPrice}</span>
          <span class="${colorClass} text-xl font-semibold">${sign}${data.change.toFixed(2)}%</span>
        </div>
      </div>
      <div class="text-neutral-300 text-sm leading-relaxed">
        ${styledAnalysis}
      </div>
    `;
  } catch (error) {
    output.innerHTML = `<span class="text-red-500 font-bold block text-center">❌ Connection Error. Backend might be waking up, try again in 10 seconds.</span>`;
  }

  spinner.classList.add("hidden");
  output.classList.remove("hidden");
  btn.disabled = false;
  btn.classList.remove("opacity-50");
}
</script>

</body>
</html>
