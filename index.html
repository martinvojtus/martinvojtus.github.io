<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Vojtus — Všetky práva vyhradené</title>
    
    <style>
        /* Globálne nastavenia */
        :root {
            --gradient: linear-gradient(45deg, #00FFA3, #DC1FFF);
            --bg-color: #000;
            --text-color: #fff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif; /* Všetky fonty sú Regular */
            font-weight: 400;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Horná časť: MagPulsor & Martin Vojtus */
        header {
            text-align: center;
            width: 100%;
        }

        .brand-name {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .sub-name {
            font-size: 0.85rem; /* Zväčšené z 0.55rem */
            opacity: 0.6;
        }

        /* Hlavná časť: Enter Portfolio (namiesto Documentation) */
        .main-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .enter-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .enter-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        /* Solana Donate Button (tvoja verzia s gradientom) */
        .solana-btn {
            position: relative;
            padding: 12px 28px;
            background: #111;
            color: #fff;
            font-size: 0.85rem;
            text-decoration: none;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            
            /* Gradientný rám */
            border: 2px solid transparent;
            background-image: linear-gradient(#111, #111), var(--gradient);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            
            transition: transform 0.1s ease;
        }

        .solana-btn:active {
            transform: scale(0.96); /* Pressed verzia */
            filter: brightness(1.2);
        }

        /* Päta */
        footer {
            font-size: 0.85rem;
            opacity: 0.4;
            text-align: center;
        }

        /* Responzivita pre logo v titulku */
        @media (max-width: 600px) {
            .brand-name { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">MagPulsor</div>
        <div class="sub-name">Martin Vojtus</div>
    </header>

    <main class="main-action">
        <a href="https://www.cosmos.so/martinvojtus" class="enter-btn">
            ENTER PORTFOLIO 🎨
        </a>

        <a href="#" class="solana-btn">
            <span>DONATE SOLANA</span>
            <span style="font-size: 1.1rem;">⚡</span>
        </a>
    </main>

    <footer>
        Martin Vojtus — Všetky práva vyhradené
    </footer>

</body>
</html>
