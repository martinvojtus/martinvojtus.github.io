<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Animácia pre pulzovanie pripojenia */
        .glow-purple { box-shadow: 0 0 15px rgba(171, 159, 242, 0.4); }
    </style>    
</head>
<body class="font-['Inter'] bg-black text-white flex justify-center min-h-screen items-start pt-4 pb-10 overflow-x-hidden">

<div class="w-full max-w-xl p-5 relative">

    <div class="absolute top-[-10px] right-5 flex items-center gap-2">
        <div id="wallet-status-top" onclick="connectPhantom()" class="cursor-pointer bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-full text-[0.55rem] font-bold uppercase tracking-widest text-neutral-500 hover:text-white transition-all flex items-center gap-2">
            <div id="status-dot" class="w-1.5 h-1.5 rounded-full bg-neutral-700"></div>
            <span id="status-text">Wallet Offline</span>
        </div>
    </div>

    <div class="flex gap-2 sm:gap-3 mb-6 w-full h-[34px] mt-6">
        <div class="bg-neutral-900 border border-neutral-800 p-1 rounded-lg flex flex-1 text-[0.55rem] sm:text-[0.6rem] uppercase tracking-widest text-center">
            <button onclick="toggleAsset('BTC')" id="toggle-asset-btc" class="flex-1 rounded-md bg-neutral-700 text-white transition-all h-full">Bitcoin</button>
            <button onclick="toggleAsset('SOL')" id="toggle-asset-sol" class="flex-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all h-full">Solana</button>
        </div>
        <div class="bg-neutral-900 border border-neutral-800 p-1 rounded-lg flex flex-1 text-[0.55rem] sm:text-[0.6rem] uppercase tracking-widest text-center">
            <button onclick="toggleMode('MACRO')" id="toggle-mode-macro" class="flex-1 rounded-md bg-neutral-700 text-white transition-all h-full">Macro</button>
            <button onclick="toggleMode('TRADING')" id="toggle-mode-trading" class="flex-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all h-full">Trading</button>
        </div>
        <button onclick="triggerAnalysis()" class="bg-neutral-900 border border-neutral-800 rounded-lg w-[34px] flex items-center justify-center text-neutral-500 hover:text-white transition-all shrink-0 h-full">
            <svg id="btn-refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
    </div>

    <div class="flex justify-between items-center px-1 mb-4 text-[0.6rem] uppercase tracking-widest relative h-[24px]">
        <div class="w-16 text-left"><div id="dynamic-title" class="text-neutral-600 transition-colors">SCORE</div></div>
        <div id="macro-buttons" class="flex gap-1 absolute left-1/2 -translate-x-1/2">
            <button onclick="updateChart('1Y')" id="btn-1Y" class="px-3 py-1 rounded-md text-neutral-500 transition-all">1Y</button>
            <button onclick="updateChart('2Y')" id="btn-2Y" class="px-3 py-1 rounded-md text-neutral-500 transition-all">2Y</button>
            <button onclick="updateChart('4Y')" id="btn-4Y" class="px-3 py-1 rounded-md text-neutral-500 transition-all">4Y</button>
            <button onclick="updateChart('ALL')" id="btn-ALL" class="px-3 py-1 rounded-md text-neutral-500 transition-all">ALL</button>
        </div>
        <div id="trading-buttons" class="hidden flex gap-1 absolute left-1/2 -translate-x-1/2">
            <button onclick="changeTradingInterval('1d')" id="btn-1d" class="px-3 py-1 rounded-md text-neutral-500 transition-all">1D</button>
            <button onclick="changeTradingInterval('4h')" id="btn-4h" class="px-3 py-1 rounded-md text-neutral-500 transition-all">4H</button>
            <button onclick="changeTradingInterval('2h')" id="btn-2h" class="px-3 py-1 rounded-md text-neutral-500 transition-all">2H</button>
            <button onclick="changeTradingInterval('1h')" id="btn-1h" class="px-3 py-1 rounded-md text-neutral-500 transition-all">1H</button>
        </div>
        <div class="w-16 flex justify-end">
            <div id="dynamic-score" class="transition-colors flex items-center h-full"><span class="bg-neutral-800 text-transparent animate-pulse rounded px-0.5">00.0%</span></div>
        </div>
    </div>

    <div class="h-60 w-full relative mb-4">
        <div id="chart-skeleton" class="absolute inset-0 pt-[5px] pb-[28px] flex flex-col justify-between transition-opacity duration-1000">
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-50" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-50" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
        </div>
        <div class="absolute top-0 bottom-0 -left-[8px] w-[calc(100%+16px)]">
            <canvas id="scoreChart" class="opacity-0 transition-opacity duration-1000"></canvas>
        </div>
    </div>

    <div id="main-card" class="p-6 rounded-3xl bg-neutral-900/40 border border-neutral-800 shadow-2xl transition-colors duration-1000">
        <div class="flex justify-between items-center mb-4 text-[0.6rem] uppercase tracking-widest">
            <div id="badge-name" class="border border-neutral-600/50 px-3 py-1.5 rounded-md text-neutral-400">Bitcoin (BTC)</div>
            <div id="badge-phase" class="border border-neutral-800 px-3 py-1.5 rounded-md transition-colors text-transparent bg-neutral-800 animate-pulse uppercase">LOADING ZONE</div>
        </div>
        <div class="flex justify-between items-start mb-4 gap-4 px-1">
            <div>
                <div id="val-price" class="text-[1.8rem] font-bold tracking-tight text-white"><span class="bg-neutral-800 text-transparent animate-pulse rounded">$00,000.00</span></div>
                <div id="val-change" class="text-[0.6rem] uppercase tracking-widest mt-2 flex items-center gap-1.5"><span class="bg-neutral-800 text-transparent animate-pulse rounded px-1">+0.00%</span></div>
            </div>
            <div class="text-right flex flex-col items-end">
                <div id="val-score-large" class="text-[1.8rem] font-bold"><span class="bg-neutral-800 text-transparent animate-pulse rounded px-1">00.0%</span></div>
                <div class="text-[0.6rem] text-neutral-500 uppercase tracking-widest mt-2">SCORE</div>
            </div>
        </div>
        <div class="w-full bg-neutral-800 h-1.5 rounded-full overflow-hidden mb-4 relative">
            <div id="animated-score-bar" class="h-full transition-all duration-[1500ms]" style="width: 0%;"></div>
        </div>
        <table class="w-full text-left text-[0.6rem] text-neutral-400 uppercase tracking-widest border border-neutral-800 rounded-lg border-separate [border-spacing:0]">
            <tbody>
                <tr><td class="py-2.5 border-b border-neutral-800 text-center"><div class="w-2 h-2 rounded-full bg-[#22c55e] inline-block"></div></td><td class="py-2.5 border-b border-l border-neutral-800 text-white font-medium text-center">0 – 20 (%)</td><td id="legend-low" class="py-2.5 pl-5 border-b border-l border-neutral-800">VALUE ZONE (DCA IN)</td></tr>
                <tr><td class="py-2.5 border-b border-neutral-800 text-center"><div class="w-2 h-2 rounded-full bg-[#FFFF00] inline-block"></div></td><td class="py-2.5 border-b border-l border-neutral-800 text-white font-medium text-center">21 – 79 (%)</td><td id="legend-mid" class="py-2.5 pl-5 border-b border-l border-neutral-800">NEUTRAL ZONE (HODL)</td></tr>
                <tr><td class="py-2.5 text-center"><div class="w-2 h-2 rounded-full bg-[#EC4899] inline-block"></div></td><td class="py-2.5 border-l border-neutral-800 text-white font-medium text-center">80 – 100 (%)</td><td id="legend-high" class="py-2.5 pl-5 border-l border-neutral-800">EXIT ZONE (DCA OUT)</td></tr>
            </tbody>
        </table>
    </div>

    <div id="execution-desk" class="mt-4 p-5 rounded-3xl bg-neutral-900/60 border border-neutral-800 shadow-xl transition-all">
        <div id="exec-btc-overlay" class="hidden flex flex-col items-center justify-center py-4 text-center">
            <div class="text-[0.65rem] text-neutral-500 uppercase tracking-widest font-semibold">Phantom Desk dostupný len pre SOL</div>
        </div>
        <div id="exec-sol-ui">
            <div id="view-disconnected" class="flex">
                <button onclick="connectPhantom()" class="w-full py-3 rounded-xl bg-[#ab9ff2]/10 border border-[#ab9ff2]/30 text-[#ab9ff2] font-bold text-[0.7rem] uppercase tracking-widest hover:bg-[#ab9ff2]/20 transition-all">Connect Phantom Wallet</button>
            </div>
            <div id="view-connected" class="hidden flex-col gap-3">
                <div class="flex justify-between px-2 text-[0.55rem] text-neutral-500 font-bold uppercase tracking-widest">
                    <div id="bal-sol">SOL: --</div><div id="bal-usdc">USDC: --</div>
                </div>
                <div class="flex gap-2">
                    <input type="number" id="trade-amount" placeholder="Suma..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-white text-sm outline-none focus:border-[#ab9ff2]/50 transition-colors">
                    <select id="trade-token" class="bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 text-white text-xs outline-none uppercase font-bold">
                        <option value="USDC">USDC</option><option value="SOL">SOL</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button onclick="executeTrade('BUY')" class="flex-1 py-3 rounded-xl bg-[#22c55e]/10 border border-[#22c55e]/30 text-[#22c55e] font-bold text-[0.7rem] uppercase tracking-widest hover:bg-[#22c55e]/20 transition-all">BUY SOL</button>
                    <button onclick="executeTrade('SELL')" class="flex-1 py-3 rounded-xl bg-[#EC4899]/10 border border-[#EC4899]/30 text-[#EC4899] font-bold text-[0.7rem] uppercase tracking-widest hover:bg-[#EC4899]/20 transition-all">SELL SOL</button>
                </div>
                <div id="trade-status" class="text-center text-[0.6rem] uppercase tracking-widest text-neutral-500 mt-1 h-3"></div>
            </div>
        </div>
    </div>

    <div id="error-box" class="hidden mt-4 bg-pink-900/20 border border-pink-900 p-4 rounded-xl text-pink-500 text-[0.6rem] tracking-widest uppercase text-center"></div>
</div>

<script>
// --- GLOBALS ---
let scoreChartInstance = null;
window.fullData = null; 
let userWallet = null;

// State recovery
window.currentAsset = localStorage.getItem('vbsx_asset') || 'BTC'; 
window.currentMode = localStorage.getItem('vbsx_mode') || 'MACRO';
window.currentInterval = localStorage.getItem('vbsx_interval') || '1w'; 
window.currentMacroView = localStorage.getItem('vbsx_macro_view') || '4Y';

// --- UI INIT ---
function initUI() {
    document.getElementById('toggle-asset-btc').className = window.currentAsset === 'BTC' ? "flex-1 rounded-md bg-neutral-700 text-white transition-all h-full" : "flex-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all h-full";
    document.getElementById('toggle-asset-sol').className = window.currentAsset === 'SOL' ? "flex-1 rounded-md bg-neutral-700 text-white transition-all h-full" : "flex-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all h-full";
    document.getElementById('toggle-mode-macro').className = window.currentMode === 'MACRO' ? "flex-1 rounded-md bg-neutral-700 text-white transition-all h-full" : "flex-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all h-full";
    document.getElementById('toggle-mode-trading').className = window.currentMode === 'TRADING' ? "flex-1 rounded-md bg-neutral-700 text-white transition-all h-full" : "flex-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all h-full";

    if (window.currentMode === 'MACRO') {
        document.getElementById('macro-buttons').classList.remove('hidden');
        document.getElementById('trading-buttons').classList.add('hidden');
        document.getElementById('legend-low').innerText = "VALUE ZONE (DCA IN)";
        document.getElementById('legend-high').innerText = "EXIT ZONE (DCA OUT)";
        window.currentInterval = '1w';
    } else {
        document.getElementById('macro-buttons').classList.add('hidden');
        document.getElementById('trading-buttons').classList.remove('hidden');
        document.getElementById('legend-low').innerText = "VALUE ZONE (LONG)";
        document.getElementById('legend-high').innerText = "EXIT ZONE (SHORT)";
        if (window.currentInterval === '1w') window.currentInterval = '1d';
        highlightTradingButton(window.currentInterval);
    }
    
    // Desk Visibility
    document.getElementById('exec-btc-overlay').classList.toggle('hidden', window.currentAsset !== 'BTC');
    document.getElementById('exec-sol-ui').classList.toggle('hidden', window.currentAsset === 'BTC');
}

function toggleAsset(asset) {
    if (window.currentAsset === asset) return;
    window.currentAsset = asset;
    localStorage.setItem('vbsx_asset', asset);
    initUI(); triggerAnalysis();
}

function toggleMode(mode) {
    if (window.currentMode === mode) return;
    window.currentMode = mode;
    localStorage.setItem('vbsx_mode', mode);
    initUI(); triggerAnalysis();
}

function changeTradingInterval(interval) {
    if (window.currentInterval === interval) return;
    window.currentInterval = interval;
    localStorage.setItem('vbsx_interval', interval);
    highlightTradingButton(interval);
    triggerAnalysis();
}

function highlightTradingButton(interval) {
    ['1d', '4h', '2h', '1h'].forEach(p => {
        const btn = document.getElementById(`btn-${p}`);
        if(btn) btn.className = p === interval ? "px-3 py-1 rounded-md text-white bg-neutral-800 transition-all" : "px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all";
    });
}

function triggerAnalysis() {
    const refBtn = document.getElementById('btn-refresh-icon');
    if (refBtn) refBtn.classList.add('animate-spin');
    document.getElementById("scoreChart").classList.add("opacity-0");
    document.getElementById("chart-skeleton").classList.remove("opacity-0");
    analyze();
}

// --- WEB3 PHANTOM & JUPITER ---
async function fetchBalances(pubKeyStr) {
    try {
        const connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
        const pubKey = new solanaWeb3.PublicKey(pubKeyStr);
        const solBal = await connection.getBalance(pubKey);
        document.getElementById('bal-sol').innerText = `SOL: ${(solBal / 1e9).toFixed(4)}`;
        const usdcMint = new solanaWeb3.PublicKey("EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v");
        const tokenAccounts = await connection.getParsedTokenAccountsByOwner(pubKey, { mint: usdcMint });
        let usdcBal = 0; if (tokenAccounts.value.length > 0) usdcBal = tokenAccounts.value[0].account.data.parsed.info.tokenAmount.uiAmount;
        document.getElementById('bal-usdc').innerText = `USDC: ${usdcBal.toFixed(2)}`;
    } catch (e) { console.error(e); }
}

async function connectPhantom(onlyIfTrusted = false) {
    const provider = window.phantom?.solana;
    if (!provider?.isPhantom) {
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            window.location.href = `https://phantom.app/ul/browse/${encodeURIComponent(window.location.href)}?ref=${encodeURIComponent(window.location.href)}`;
        }
        return;
    }
    try {
        const resp = await provider.connect({ onlyIfTrusted });
        userWallet = resp.publicKey.toString();
        
        // Update Top Header UI
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const statusWrap = document.getElementById('wallet-status-top');
        statusText.innerText = userWallet.slice(0, 4) + "..." + userWallet.slice(-4);
        statusDot.classList.replace('bg-neutral-700', 'bg-[#ab9ff2]');
        statusWrap.classList.replace('text-neutral-500', 'text-[#ab9ff2]');
        statusWrap.classList.add('glow-purple');

        // Update Desk UI
        document.getElementById('view-disconnected').classList.add('hidden');
        document.getElementById('view-connected').classList.remove('hidden');
        document.getElementById('view-connected').classList.add('flex');
        fetchBalances(userWallet);
    } catch (err) { console.error(err); }
}

async function executeTrade(action) {
    if (!userWallet) return;
    const provider = window.phantom?.solana;
    const amountInput = document.getElementById('trade-amount').value;
    const tokenInput = document.getElementById('trade-token').value;
    const statusDiv = document.getElementById('trade-status');
    if (!amountInput || amountInput <= 0) return;

    statusDiv.innerHTML = `<span class="text-[#ab9ff2]">Routing via Jupiter...</span>`;
    const USDC = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
    const SOL = "So11111111111111111111111111111111111111112";
    let inputMint, outputMint, decimals;
    if (action === 'BUY') { inputMint = USDC; outputMint = SOL; decimals = 6; }
    else { inputMint = SOL; outputMint = USDC; decimals = 9; }

    const amountInLamports = Math.floor(parseFloat(amountInput) * (10 ** decimals));

    try {
        const quote = await (await fetch(`https://quote-api.jup.ag/v6/quote?inputMint=${inputMint}&outputMint=${outputMint}&amount=${amountInLamports}&slippageBps=50`)).json();
        const { swapTransaction } = await (await fetch('https://quote-api.jup.ag/v6/swap', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quoteResponse: quote, userPublicKey: userWallet, wrapAndUnwrapSol: true })
        })).json();

        const transaction = solanaWeb3.VersionedTransaction.deserialize(Uint8Array.from(atob(swapTransaction), c => c.charCodeAt(0)));
        const { signature } = await provider.signAndSendTransaction(transaction);
        statusDiv.innerHTML = `<span class="text-[#22c55e]">TX SENT!</span>`;
        setTimeout(() => fetchBalances(userWallet), 3000);
    } catch (error) { statusDiv.innerHTML = `<span class="text-pink-500">TX FAILED</span>`; }
}

// --- CHART & DATA ---
function updateChart(period) {
    if (!window.fullData) return;
    if (window.currentMode === 'MACRO') { window.currentMacroView = period; localStorage.setItem('vbsx_macro_view', period); }
    let points = 208;
    if (window.currentMode === 'MACRO') {
        if (period === '1Y') points = 52; else if (period === '2Y') points = 104; else if (period === '4Y') points = 208; else points = window.fullData.chart_dates.length;
    }
    const chartDates = window.fullData.chart_dates.slice(-points);
    const chartScoreRaw = window.fullData.chart_score.slice(-points);
    if (scoreChartInstance) scoreChartInstance.destroy();
    
    let ctx = document.getElementById('scoreChart').getContext('2d');
    scoreChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartDates,
            datasets: [{ 
                data: chartScoreRaw, fill: false, borderWidth: 1.5, tension: 0.5, pointRadius: 0,
                borderColor: function(c) {
                    const {ctx, chartArea} = c.chart; if (!chartArea) return;
                    const g = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                    g.addColorStop(0, '#22c55e'); g.addColorStop(0.3, '#FFFF00'); g.addColorStop(1, '#EC4899'); return g;
                }
            }]
        },
        options: { 
            responsive: true, maintainAspectRatio: false, animation: { duration: 1000 },
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } } 
        }
    });
}

async function analyze() {
  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", { 
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ asset: window.currentAsset, mode: window.currentMode, interval: window.currentInterval })
    });
    const data = await res.json();
    window.fullData = data; 
    const score = data.cycle_score || 0;
    let hex = score <= 20 ? "#22c55e" : (score >= 80 ? "#EC4899" : "#FFFF00");

    document.getElementById("badge-name").innerText = `${data.name} (${data.ticker})`;
    document.getElementById("badge-phase").innerText = (window.currentMode === 'TRADING') ? (score <= 20 ? "LONG" : (score >= 80 ? "SHORT" : "HODL")) : data.phase;
    document.getElementById("badge-phase").className = `border px-3 py-1.5 rounded-md transition-colors text-${score <= 20 ? '[#22c55e]' : (score >= 80 ? 'pink-500' : 'yellow-400')} border-${score <= 20 ? '[#22c55e]' : (score >= 80 ? 'pink-500' : 'yellow-400')}/50`;
    
    document.getElementById("val-price").innerText = `$${Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
    document.getElementById("val-score-large").innerText = `${score.toFixed(1)}%`;
    document.getElementById("val-score-large").style.color = hex;
    document.getElementById("dynamic-score").innerText = `${score.toFixed(1)}%`;
    document.getElementById("dynamic-score").style.color = hex;

    document.getElementById("animated-score-bar").style.width = `${score}%`;
    document.getElementById("animated-score-bar").style.backgroundColor = hex;
    document.getElementById("scoreChart").classList.remove("opacity-0");
    document.getElementById("chart-skeleton").classList.add("opacity-0");
    updateChart(window.currentMode === 'MACRO' ? window.currentMacroView : null);
  } catch (e) { console.error(e); } finally { document.getElementById('btn-refresh-icon').classList.remove('animate-spin'); }
}

window.addEventListener('DOMContentLoaded', () => {
    initUI(); 
    triggerAnalysis();
    // Auto-connect check
    connectPhantom(true); 
});
</script>
</body>
</html>
