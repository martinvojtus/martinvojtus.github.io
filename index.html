<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-black text-white flex justify-center min-h-screen items-start pt-6 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <header class="flex justify-between items-center w-full mb-6">
        <h1 id="main-title" class="text-xl sm:text-2xl font-extrabold tracking-wide text-[#F7931A] flex items-center gap-2 whitespace-nowrap">
            <span class="text-3xl">₿</span> V-ndx <span class="text-sm text-neutral-500 font-bold ml-1">(btc char)</span>
        </h1>
        <div class="bg-neutral-900 rounded-lg p-1 border border-neutral-800 flex gap-1 shrink-0">
            <button id="lang-en" onclick="setLang('EN')" class="px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition">EN</button>
            <button id="lang-sk" onclick="setLang('SK')" class="px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition">SK</button>
        </div>
    </header>

    <button onclick="analyze()" id="btn" class="w-full h-14 bg-[#F7931A] rounded-xl text-black font-bold text-lg hover:bg-orange-500 transition active:scale-95 shadow-lg shadow-orange-900/20">
      Analyze Cycle
    </button>

    <div id="spinner" class="hidden text-center text-[#F7931A] font-medium mt-6 h-6 text-sm"></div>
    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-4 text-sm"></div>

    <div id="divider" class="hidden border-b border-neutral-800 my-6"></div>

    <div id="output" class="hidden flex flex-col gap-5"></div>

</div>

<script>
let priceChartInstance = null;
let rsiChartInstance = null;
let scoreChartInstance = null;

let spinnerInterval = null;
let currentLang = 'EN';

const i18n = {
    EN: {
        btn: 'Analyze Cycle',
        loading: ["Extracting On-Chain Metrics...", "Calculating Regression...", "Evaluating Algorithms...", "Generating Strategy..."],
        bottom: "0% (BUY)",
        top: "100% (SELL)",
        score: "Score",
        error: "❌ Connection Error. Backend waking up. Try again in 15s."
    },
    SK: {
        btn: 'Analyzovať Cyklus',
        loading: ["Získavam historické dáta...", "Počítam regresné priemery...", "Vyhodnocujem algoritmy...", "Generujem stratégiu..."],
        bottom: "0% (NÁKUP)",
        top: "100% (PREDAJ)",
        score: "Skóre",
        error: "❌ Chyba pripojenia. Backend sa prebúdza. Skúste znova o 15s."
    }
};

function setLang(lang) {
    currentLang = lang;
    
    if (lang === 'EN') {
        document.getElementById('lang-en').className = "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition";
        document.getElementById('lang-sk').className = "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    } else {
        document.getElementById('lang-sk').className = "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition";
        document.getElementById('lang-en').className = "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    }
    
    document.getElementById('btn').innerText = i18n[lang].btn;
    
    if (!document.getElementById('output').classList.contains('hidden')) {
        analyze();
    }
}

// Skrytie tooltipov na touch zariadeniach
function hideTooltips() {
    [priceChartInstance, rsiChartInstance, scoreChartInstance].forEach(chart => {
        if (chart) { chart.tooltip.setActiveElements([], {x:0,y:0}); chart.update(); }
    });
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

async function analyze() {
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const divider = document.getElementById("divider");
  const btn = document.getElementById("btn");
  const errorBox = document.getElementById("error-box");

  output.classList.add("hidden");
  divider.classList.add("hidden");
  errorBox.classList.add("hidden");
  btn.disabled = true;
  btn.classList.add("opacity-50");
  
  spinner.classList.remove("hidden");
  let msgIndex = 0;
  spinner.innerText = i18n[currentLang].loading[0];
  
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= i18n[currentLang].loading.length) msgIndex = 0;
      spinner.innerText = i18n[currentLang].loading[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ language: currentLang }) 
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const colorClass = data.change > 0 ? "text-green-500" : (data.change < 0 ? "text-red-500" : "text-neutral-400");
    const sign = data.change > 0 ? "+" : "";
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let rawAnalysis = data.analysis;
    let phaseTextInternal = data.phase || "BULL MARKET"; 
    
    let phaseMatch = rawAnalysis.match(/PHASE:\s*(.*)/i);
    if (phaseMatch) {
        phaseTextInternal = phaseMatch[1].trim().toUpperCase();
        rawAnalysis = rawAnalysis.replace(phaseMatch[0], '').trim(); 
    }

    // Preklad Fázy
    let displayPhaseText = phaseTextInternal;
    if (currentLang === 'SK') {
        if (phaseTextInternal.includes("BOTTOM") || phaseTextInternal.includes("ACCUMULATION")) displayPhaseText = "DNO / AKUMULÁCIA";
        else if (phaseTextInternal.includes("TOP") || phaseTextInternal.includes("DISTRIBUTION")) displayPhaseText = "VRCHOL / DISTRIBÚCIA";
        else if (phaseTextInternal.includes("LATE")) displayPhaseText = "POKROČILÝ BÝČÍ TRH";
        else displayPhaseText = "SKORÝ BÝČÍ TRH";
    }

    const score = data.cycle_score || 0;
    
    // Logika farieb podľa skóre (0-20 = Zelená, 75-100 = Červená)
    let scoreColor = "bg-[#F7931A]";
    let scoreTextColor = "text-[#F7931A]";
    let phaseBadgeColor = "bg-orange-900/20 text-[#F7931A] border-[#F7931A]/30";
    
    if (score <= 20) {
        scoreColor = "bg-green-500";
        scoreTextColor = "text-green-500";
        phaseBadgeColor = "bg-green-900/20 text-green-400 border-green-800/30";
    } else if (score >= 75) {
        scoreColor = "bg-red-500";
        scoreTextColor = "text-red-500";
        phaseBadgeColor = "bg-red-900/20 text-red-400 border-red-800/30";
    }

    let finalHTML = `
      <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-xl">
        
        <div class="flex justify-between items-center mb-6">
            <div class="text-neutral-500 text-xs font-bold uppercase tracking-widest">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md border uppercase tracking-wide">${displayPhaseText}</div>
        </div>
        
        <div class="flex justify-between items-center mb-8 whitespace-nowrap">
            <div>
                <div class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-xs sm:text-sm font-semibold mt-1">${sign}${data.change.toFixed(2)}%</div>
            </div>
            <div class="text-right">
                <div class="text-3xl sm:text-4xl font-black ${scoreTextColor}">${score}%</div>
                <div class="text-[10px] text-neutral-500 uppercase font-bold tracking-widest mt-1">${i18n[currentLang].score}</div>
            </div>
        </div>
        
        <div class="mb-8">
            <div class="flex justify-between text-[10px] text-neutral-500 font-bold uppercase tracking-widest mb-3">
                <span>${i18n[currentLang].bottom}</span>
                <span>${i18n[currentLang].top}</span>
            </div>
            <div class="w-full bg-neutral-800 h-3 rounded-full overflow-hidden">
                <div class="h-full ${scoreColor} transition-all duration-1000 ease-out" style="width: ${score}%"></div>
            </div>
        </div>
        
        <div class="space-y-6">
            <div style="height: 220px; position: relative; border-top: 1px solid #262626; padding-top: 2.5rem;">
                <div style="position: absolute; top: 16px; left: 0; font-size: 0.75rem; color: #a3a3a3; font-weight: bold; text-transform: uppercase;">Price & MAs (50W, 200W)</div>
                <canvas id="priceChart"></canvas>
            </div>
            
            <div style="height: 140px; position: relative; border-top: 1px solid #262626; padding-top: 2.5rem;">
                <div style="position: absolute; top: 16px; left: 0; font-size: 0.75rem; color: #a3a3a3; font-weight: bold; text-transform: uppercase;">Weekly RSI (14)</div>
                <canvas id="rsiChart"></canvas>
            </div>
            
            <div style="height: 140px; position: relative; border-top: 1px solid #262626; padding-top: 2.5rem;">
                <div style="position: absolute; top: 16px; left: 0; font-size: 0.75rem; color: #a3a3a3; font-weight: bold; text-transform: uppercase;">Cycle Score (0-100%)</div>
                <canvas id="scoreChart"></canvas>
            </div>
        </div>
      </div>
    `;

    // Parsovanie textu od algoritmu
    const parts = rawAnalysis.split('**');
    for (let i = 1; i < parts.length; i += 2) {
      if (parts[i] && parts[i + 1]) {
        const title = parts[i].trim();
        let content = parts[i + 1].trim().replace(/\n/g, '<br>');

        let boxStyle = "bg-neutral-900 border-neutral-800";
        let titleStyle = "text-white"; 
        
        let c = content.toUpperCase();
        if (title.toUpperCase().includes("VERDICT") || title.toUpperCase().includes("VERDIKT") || title.toUpperCase().includes("STRATÉGIA") || title.toUpperCase().includes("STRATEGY")) {
            if (c.includes("BUY") || c.includes("KÚPIŤ") || c.includes("NÁKUP") || c.includes("ACCUMULATE") || c.includes("AKUMULÁCIA") || score <= 20) {
                boxStyle = "bg-green-900/10 border-green-800/30"; titleStyle = "text-green-500";
            } else if (c.includes("SELL") || c.includes("PREDAŤ") || c.includes("PREDAJ") || c.includes("DISTRIBUTION") || score >= 75) {
                boxStyle = "bg-red-900/10 border-red-800/30"; titleStyle = "text-red-500";
            } else {
                boxStyle = "bg-orange-900/10 border-orange-800/30"; titleStyle = "text-[#F7931A]";
            }
        }

        finalHTML += `
          <div class="${boxStyle} p-6 rounded-3xl border shadow-xl">
            <h2 class="${titleStyle} text-sm font-bold mb-4 uppercase tracking-widest">${title}</h2>
            <div class="text-neutral-300 text-sm leading-loose">${content}</div>
          </div>
        `;
      }
    }

    output.innerHTML = finalHTML;
    divider.classList.remove("hidden");
    output.classList.remove("hidden");
    
    // Vykreslenie ZAOBlených a TENŠÍCH grafov
    if (data.chart_dates.length > 0 && data.chart_prices.length > 0) {
        Chart.defaults.color = '#737373';
        Chart.defaults.font.size = 10;
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { displayColors: false, backgroundColor: '#1a1a1a', borderColor: '#333', borderWidth: 1, padding: 10 } },
            scales: { x: { display: false }, y: { display: false } }, layout: { padding: 0 },
            interaction: { mode: 'index', intersect: false }
        };

        if (priceChartInstance) priceChartInstance.destroy();
        priceChartInstance = new Chart(document.getElementById('priceChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'Price', data: data.chart_prices, borderColor: '#ffffff', borderWidth: 1.5, tension: 0.4, pointRadius: 0 },
                    { label: '50W MA', data: data.chart_ma50, borderColor: '#06b6d4', borderWidth: 1, tension: 0.4, pointRadius: 0 },
                    { label: '200W MA', data: data.chart_ma200, borderColor: '#a855f7', borderWidth: 1, tension: 0.4, pointRadius: 0 }
                ]
            },
            options: { ...commonOptions, scales: { x: { display: false }, y: { display: false, type: 'logarithmic' } } }
        });

        if (rsiChartInstance) rsiChartInstance.destroy();
        rsiChartInstance = new Chart(document.getElementById('rsiChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'RSI', data: data.chart_rsi, borderColor: '#06b6d4', borderWidth: 1.5, tension: 0.4, pointRadius: 0 },
                    { label: 'O/B (85)', data: new Array(data.chart_dates.length).fill(85), borderColor: '#ef4444', borderWidth: 1, borderDash: [5, 5], pointRadius: 0 },
                    { label: 'O/S (35)', data: new Array(data.chart_dates.length).fill(35), borderColor: '#22c55e', borderWidth: 1, borderDash: [5, 5], pointRadius: 0 }
                ]
            },
            options: { ...commonOptions, scales: { x: { display: false }, y: { display: false, min: 20, max: 100 } } }
        });

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(document.getElementById('scoreChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'Cycle Score %', data: data.chart_score, borderColor: '#F7931A', backgroundColor: 'rgba(247, 147, 26, 0.1)', fill: true, borderWidth: 1.5, tension: 0.4, pointRadius: 0 }
                ]
            },
            options: { ...commonOptions, scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } } }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = i18n[currentLang].error;
    errorBox.classList.remove("hidden");
  }

  btn.disabled = false;
  btn.classList.remove("opacity-50");
}
</script>

</body>
</html>
