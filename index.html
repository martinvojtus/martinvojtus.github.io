<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-black text-white flex justify-center min-h-screen items-start pt-6 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <header class="flex justify-between items-center w-full mb-6">
        <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tighter text-white flex items-center gap-1">
                V<span class="text-[#F7931A]">₿</span><span class="text-[#22c55e]">$</span>X
            </h1>
            <p class="text-[9px] text-neutral-500 font-bold tracking-[0.2em] uppercase mt-1">Value Bitcoin Dollar Index</p>
        </div>
        <div class="bg-neutral-900 rounded-lg p-1 border border-neutral-800 flex gap-1 shrink-0 h-fit">
            <button id="lang-en" onclick="setLang('EN')" class="px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition">EN</button>
            <button id="lang-sk" onclick="setLang('SK')" class="px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition">SK</button>
        </div>
    </header>

    <button onclick="analyze()" id="btn" class="w-full h-14 bg-[#F7931A] rounded-xl text-black font-black text-lg hover:bg-orange-500 transition active:scale-95 shadow-[0_0_20px_rgba(247,147,26,0.2)] tracking-wide">
      ANALYZE V₿<span class="text-[#22c55e]">$</span>X
    </button>

    <div id="spinner" class="hidden text-center text-[#F7931A] font-bold mt-6 h-6 text-xs tracking-widest uppercase"></div>
    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-4 text-xs"></div>
    <div id="divider" class="hidden border-b border-neutral-800 my-8"></div>

    <div id="output" class="hidden flex flex-col gap-6"></div>

</div>

<script>
let priceChartInstance = null;
let rsiChartInstance = null;
let scoreChartInstance = null;

let spinnerInterval = null;
let currentLang = 'EN';

const i18n = {
    EN: {
        btn: 'ANALYZE V₿$X',
        loading: ["Accessing Liquidity...", "Calculating Log-Reg...", "Mapping Cycles...", "Generating Flow Strategy..."],
        score: "Score",
        error: "❌ Connection Error. Backend waking up. Try again in 15s.",
        legAcc: "VALUE ZÓNA (DCA IN)",
        legHold: "GROWTH ZÓNA (HODL)",
        legDist: "EXIT ZÓNA (DCA OUT)"
    },
    SK: {
        btn: 'ANALÝZA V₿$X',
        loading: ["Sťahujem dáta...", "Počítam regresiu...", "Mapujem cykly...", "Generujem stratégiu..."],
        score: "Skóre",
        error: "❌ Chyba pripojenia. Backend sa prebúdza. Skúste znova o 15s.",
        legAcc: "VALUE ZÓNA (DCA IN)",
        legHold: "GROWTH ZÓNA (HODL)",
        legDist: "EXIT ZÓNA (DCA OUT)"
    }
};

function setLang(lang) {
    currentLang = lang;
    document.getElementById('lang-en').className = lang === 'EN' ? "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition" : "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    document.getElementById('lang-sk').className = lang === 'SK' ? "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition" : "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    document.getElementById('btn').innerText = i18n[lang].btn;
    if (!document.getElementById('output').classList.contains('hidden')) analyze();
}

function hideTooltips() {
    [priceChartInstance, rsiChartInstance, scoreChartInstance].forEach(chart => {
        if (chart) { chart.tooltip.setActiveElements([], {x:0,y:0}); chart.update(); }
    });
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

async function analyze() {
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const btn = document.getElementById("btn");
  const errorBox = document.getElementById("error-box");

  output.classList.add("hidden");
  errorBox.classList.add("hidden");
  btn.disabled = true;
  btn.classList.add("opacity-50");
  
  spinner.classList.remove("hidden");
  let msgIndex = 0;
  spinner.innerText = i18n[currentLang].loading[0];
  
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= i18n[currentLang].loading.length) msgIndex = 0;
      spinner.innerText = i18n[currentLang].loading[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ language: currentLang }) 
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const colorClass = data.change > 0 ? "text-[#22c55e]" : (data.change < 0 ? "text-red-500" : "text-neutral-400");
    const sign = data.change > 0 ? "+" : "";
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const score = data.cycle_score || 0;
    let scoreColor = score <= 20 ? "text-[#22c55e]" : (score >= 75 ? "text-red-500" : "text-[#F7931A]");
    let phaseBadgeColor = score <= 20 ? "bg-[#030a05] text-[#22c55e] border border-[#22c55e]/60" : (score >= 75 ? "bg-red-900/30 text-red-400 border border-red-500/60" : "bg-orange-900/30 text-[#F7931A] border border-[#F7931A]/60");

    output.innerHTML = `
      <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-2xl">
        
        <div class="flex justify-between items-center mb-6">
            <div class="text-neutral-500 text-[10px] font-bold uppercase tracking-[0.15em]">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md border uppercase tracking-wide">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-center mb-8 whitespace-nowrap">
            <div>
                <div class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-xs sm:text-sm font-semibold mt-1 flex items-center gap-1">
                    ${sign}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded text-[9px] uppercase tracking-wider ml-1">24H</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-3xl sm:text-4xl font-black ${scoreColor}">${score}%</div>
                <div class="text-[10px] text-neutral-500 uppercase font-bold tracking-widest mt-1">${i18n[currentLang].score}</div>
            </div>
        </div>
        
        <div class="mb-10">
            <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden mb-3">
                <div class="h-full ${score <= 20 ? 'bg-[#22c55e]' : (score >= 75 ? 'bg-red-500' : 'bg-[#F7931A]')} transition-all duration-1000 ease-out" style="width: ${score}%"></div>
            </div>
            <div class="flex flex-col gap-2 text-[10px] sm:text-xs text-neutral-500 font-bold tracking-wider px-1">
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#22c55e] shrink-0"></div><span>0% - 20% &bull; ${i18n[currentLang].legAcc}</span></div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#F7931A] shrink-0"></div><span>21% - 74% &bull; ${i18n[currentLang].legHold}</span></div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-red-500 shrink-0"></div><span>75% - 100% &bull; ${i18n[currentLang].legDist}</span></div>
            </div>
        </div>
        
        <div class="space-y-4">
            <div style="height: 180px; position: relative;" class="border-t border-neutral-800 pt-6">
                <div style="position: absolute; top: 12px; left: 0; font-size: 0.65rem; color: #a3a3a3; font-bold; text-transform: uppercase; letter-spacing: 0.1em;">V₿$X CYCLE SCORE (0-100%)</div>
                <canvas id="scoreChart"></canvas>
            </div>

            <div style="height: 240px; position: relative;" class="border-t border-neutral-800 pt-6">
                <div style="position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: #a3a3a3; font-bold; text-transform: uppercase; letter-spacing: 0.1em;">
                    <div>PRICE & MAs (50W, 200W)</div>
                    <div style="display: flex; gap: 8px; color: #525252;">
                        $${(curr_price/1000).toFixed(1)}k &bull; 
                        <span style="color: #06b6d4;">$${(data.chart_ma50[data.chart_ma50.length - 1]/1000).toFixed(1)}k</span> &bull; 
                        <span style="color: #a855f7;">$${(data.chart_ma200[data.chart_ma200.length - 1]/1000).toFixed(1)}k</span>
                    </div>
                </div>
                <canvas id="priceChart"></canvas>
            </div>

            <div style="height: 160px; position: relative;" class="border-t border-neutral-800 pt-6">
                <div style="position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: #a3a3a3; font-bold; text-transform: uppercase; letter-spacing: 0.1em;">
                    <div>WEEKLY RSI (14) + SMA</div>
                    <div style="display: flex; gap: 8px; color: #525252;">
                        ${curr_rsi.toFixed(1)} &bull; 
                        <span style="color: #eab308;">${data.chart_rsi_sma[data.chart_rsi_sma.length - 1].toFixed(1)}</span>
                    </div>
                </div>
                <canvas id="rsiChart"></canvas>
            </div>
        </div>

        <div style="font-size: 0.55rem; color: #404040; font-weight: bold; text-align: center; margin-top: 2rem; border-top: 1px solid #1c1c1c; pt-3;">
            ${data.footer_date}
        </div>
      </div>
    `;

    document.getElementById('divider').classList.remove("hidden");
    output.classList.remove("hidden");
    renderCharts(data);

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = i18n[currentLang].error;
    errorBox.classList.remove("hidden");
  }

  btn.disabled = false;
  btn.classList.remove("opacity-50");
}

function renderCharts(data) {
    Chart.defaults.color = '#525252'; 
    Chart.defaults.font.size = 9;
    
    // LIMIT DÁT NA POSLEDNÝCH 1000 DNÍ (cca 143 týždňov)
    const limit = -143;
    const chartDates = data.chart_dates.slice(limit);
    const chartPrices = data.chart_prices.slice(limit);
    const chartMa50 = data.chart_ma50.slice(limit);
    const chartMa200 = data.chart_ma200.slice(limit);
    const chartRsi = data.chart_rsi.slice(limit);
    const chartRsiSma = data.chart_rsi_sma.slice(limit);
    const chartScore = data.chart_score.slice(limit);

    const commonOptions = {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        layout: { padding: 0 }, // ZMAZANÝ padding - grafy sú maximalizované na doraz
        interaction: { mode: 'index', intersect: false }
    };

    const xAxisConfig = {
        display: false, // ZMAZANÉ defaultné osi
        grid: { display: false } 
    };

    const yAxisConfig = {
        display: false, // ZMAZANÉ defaultné osi
        grid: { display: false } 
    };

    // PRICE GRAF
    if (priceChartInstance) priceChartInstance.destroy();
    priceChartInstance = new Chart(document.getElementById('priceChart').getContext('2d'), {
        type: 'line',
        data: {
            labels: chartDates,
            datasets: [
                { data: chartPrices, borderColor: '#fff', borderWidth: 0.8, tension: 0.6, pointRadius: 0, pointHitRadius: 5 },
                { data: chartMa50, borderColor: '#06b6d4', borderWidth: 0.4, tension: 0.6, pointRadius: 0, pointHitRadius: 0 },
                { data: chartMa200, borderColor: '#a855f7', borderWidth: 0.4, tension: 0.6, pointRadius: 0, pointHitRadius: 0 }
            ]
        },
        options: { 
            ...commonOptions, 
            scales: { x: xAxisConfig, y: { ...yAxisConfig, type: 'logarithmic' } }
        }
    });

    // RSI GRAF
    if (rsiChartInstance) rsiChartInstance.destroy();
    rsiChartInstance = new Chart(document.getElementById('rsiChart').getContext('2d'), {
        type: 'line',
        data: {
            labels: chartDates,
            datasets: [
                { data: chartRsi, borderColor: '#8b5cf6', borderWidth: 0.8, tension: 0.6, pointRadius: 0, pointHitRadius: 5 },
                { data: chartRsiSma, borderColor: '#eab308', borderWidth: 0.8, tension: 0.6, pointRadius: 0, pointHitRadius: 0 },
                { data: new Array(chartDates.length).fill(70), borderColor: '#525252', borderWidth: 0.4, borderDash: [5, 5], pointRadius: 0 },
                { data: new Array(chartDates.length).fill(30), borderColor: '#525252', borderWidth: 0.4, borderDash: [5, 5], pointRadius: 0 }
            ]
        },
        options: { 
            ...commonOptions, 
            scales: { x: xAxisConfig, y: { ...yAxisConfig, min: 20, max: 100 } }
        }
    });

    // SCORE GRAF
    let ctxScore = document.getElementById('scoreChart').getContext('2d');
    let gradientStroke = ctxScore.createLinearGradient(0, 180, 0, 0); 
    gradientStroke.addColorStop(0, '#22c55e');    
    gradientStroke.addColorStop(0.3, '#22c55e');  
    gradientStroke.addColorStop(0.6, '#F7931A');  
    gradientStroke.addColorStop(1, '#ef4444');    

    let gradFill = ctxScore.createLinearGradient(0, 180, 0, 0);
    gradFill.addColorStop(0, 'rgba(34, 197, 94, 0.1)');
    gradFill.addColorStop(0.5, 'rgba(247, 147, 26, 0.05)');
    gradFill.addColorStop(1, 'rgba(239, 68, 68, 0.1)');

    if (scoreChartInstance) scoreChartInstance.destroy();
    scoreChartInstance = new Chart(ctxScore, {
        type: 'line',
        data: {
            labels: chartDates,
            datasets: [
                { data: chartScore, borderColor: gradientStroke, backgroundColor: gradFill, fill: true, borderWidth: 0.8, tension: 0.6, pointRadius: 0, pointHitRadius: 5 }
            ]
        },
        options: { 
            ...commonOptions, 
            scales: { x: xAxisConfig, y: { ...yAxisConfig, min: 0, max: 100 } }
        }
    });

    // Aplikovanie Vlastného Pluginu po vykreslení (Fade-in vykreslenie + Zakončenie guľôčkou)
    priceChartInstance.options.plugins.crosshair = crosshairPlugin; priceChartInstance.update();
    rsiChartInstance.options.plugins.crosshair = crosshairPlugin; rsiChartInstance.update();
    scoreChartInstance.options.plugins.crosshair = crosshairPlugin; scoreChartInstance.update();
}

const crosshairPlugin = {
  id: 'crosshair',
  beforeDraw: chart => {
      // 1. Fade-in vykreslenie od priesvitná (ľavý kraj) do plnej viditeľnosti (pravý kraj)
      const ctx = chart.ctx; ctx.save();
      const grad = ctx.createLinearGradient(chart.scales.x.left, 0, chart.scales.x.right, 0);
      grad.addColorStop(0, 'rgba(255,255,255,0.1)');
      grad.addColorStop(0.2, 'rgba(255,255,255,1)');
      ctx.globalCompositeOperation = 'destination-in'; ctx.fillStyle = grad; ctx.fillRect(0, 0, chart.width, chart.height); ctx.restore();

      // 2. Zakončenie pravého konca kriviek plnou guľôčkou
      chart.data.datasets.forEach(d => {
          const val = d.data[d.data.length - 1]; if (val === undefined || d.pointHitRadius === 0) return;
          const x = chart.scales.x.right; const y = chart.scales.y.getPixelForValue(val); ctx.save(); ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = d.borderColor || '#525252'; ctx.fill(); ctx.restore();
      });
  },
  afterDraw: chart => {
    // 3. TradingView Zameriavač (Hodnoty priamo vnútri na hrane grafu, len pri dotyku)
    const activeElements = chart.getActiveElements(); if (activeElements.length > 0) {
      let activePoint = activeElements[0];
      let x = activePoint.element.x; let y = activePoint.element.y;
      let yAxis = chart.scales.y; let xAxis = chart.scales.x;
      let ctx = chart.ctx; ctx.save();
      
      ctx.beginPath(); ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xAxis.left, y); ctx.lineTo(xAxis.right, y); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();

      // Štítok na X osi (ukotvený na spodnú hranu vnútri grafu)
      let xLabel = chart.data.labels[activePoint.index]; if (xLabel) {
          ctx.fillStyle = '#171717'; ctx.font = 'bold 9px sans-serif';
          let textWidth = ctx.measureText(xLabel).width; let boxY = yAxis.bottom - 18; let boxX = x - (textWidth + 16)/2;
          if (boxX < xAxis.left) boxX = xAxis.left; if (boxX + textWidth + 16 > xAxis.right) boxX = xAxis.right - textWidth - 16;
          ctx.fillRect(boxX, boxY, textWidth + 16, 18); ctx.strokeStyle = '#525252'; ctx.strokeRect(boxX, boxY, textWidth + 16, 18);
          ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(xLabel, boxX + (textWidth + 16)/2, boxY + 9);
      }

      // Štítok na Y osi (ukotvený na pravú hranu vnútri grafu)
      let val = activePoint.element.$context.parsed.y; let yLabel = val.toFixed(1);
      if (chart.canvas.id === 'priceChart') { yLabel = '$' + (val/1000).toFixed(1) + 'k'; } else if (chart.canvas.id === 'scoreChart') { yLabel = val.toFixed(0) + '%'; }
      ctx.fillStyle = '#171717'; ctx.font = 'bold 9px sans-serif';
      let yTextWidth = ctx.measureText(yLabel).width; let yBoxX = xAxis.right - yTextWidth - 16;
      ctx.fillRect(yBoxX, y - 9, yTextWidth + 16, 18); ctx.strokeStyle = '#525252'; ctx.strokeRect(yBoxX, y - 9, yTextWidth + 16, 18);
      ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(yLabel, yBoxX + (yTextWidth + 16)/2, y); ctx.restore();
    }
  }
};
</script>

</body>
</html>
