<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBS Terminal v1.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-black text-white flex justify-center min-h-screen pt-6 pb-10">

<div class="w-full max-w-xl p-5 space-y-4">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-extrabold text-[#F7931A] flex items-center gap-2">
            <span class="text-3xl">₿</span> CBS TERMINAL v1.9
        </h1>
        <div class="bg-neutral-900 rounded-lg p-1 flex gap-1 border border-neutral-800">
            <button onclick="setLang('EN')" id="l-en" class="px-2 py-1 rounded bg-[#F7931A] text-black font-bold text-xs">EN</button>
            <button onclick="setLang('SK')" id="l-sk" class="px-2 py-1 rounded text-neutral-400 font-bold text-xs">SK</button>
        </div>
    </header>

    <button onclick="analyze()" id="btn" class="w-full h-14 bg-[#F7931A] rounded-xl text-black font-bold text-lg hover:bg-orange-500 transition active:scale-95">
      Analyze Macro Cycle
    </button>

    <div id="spinner" class="hidden text-center text-[#F7931A] mt-6 text-sm">Analyzing market signals...</div>

    <div id="output" class="hidden space-y-4">
        <div id="dashboard" class="grid grid-cols-2 gap-3"></div>
        <div class="bg-neutral-900 p-5 rounded-2xl border border-neutral-800">
            <div id="price-area" class="mb-4"></div>
            <div class="space-y-6">
                <canvas id="pChart" class="h-48"></canvas>
                <canvas id="rChart" class="h-32"></canvas>
            </div>
        </div>
        <div id="ai-area" class="space-y-4"></div>
    </div>
</div>

<script>
let pChart = null, rChart = null;
let currentLang = 'EN';

async function analyze() {
    const btn = document.getElementById("btn"), spinner = document.getElementById("spinner"), output = document.getElementById("output");
    btn.disabled = true; spinner.classList.remove("hidden"); output.classList.add("hidden");

    try {
        const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ language: currentLang })
        });
        const data = await res.json();
        
        spinner.classList.add("hidden"); output.classList.remove("hidden");

        document.getElementById("dashboard").innerHTML = `
            <div class="bg-neutral-900 p-3 rounded-xl border border-neutral-800">
                <div class="text-[10px] text-neutral-500 uppercase">Support 8W</div>
                <div class="text-white font-bold">$${data.support_8w.toLocaleString()}</div>
            </div>
            <div class="bg-neutral-900 p-3 rounded-xl border border-neutral-800">
                <div class="text-[10px] text-neutral-500 uppercase">Target Bottom</div>
                <div class="text-red-500 font-bold">$${data.target_dno.toLocaleString()}</div>
            </div>
        `;

        document.getElementById("price-area").innerHTML = `
            <div class="flex justify-between items-center">
                <div>
                    <div class="text-4xl font-bold">$${data.price.toLocaleString()}</div>
                    <div class="${data.change > 0 ? 'text-green-500' : 'text-red-500'} font-bold">${data.change}%</div>
                </div>
                <div class="text-right">
                    <div class="text-[#F7931A] text-2xl font-black">${data.cbs_now}%</div>
                    <div class="text-[10px] text-neutral-500 uppercase">Score</div>
                </div>
            </div>
        `;

        renderCharts(data);
        renderAI(data.analysis);
    } catch (e) {
        spinner.innerText = "❌ Connection Error. Backend might be waking up.";
    }
    btn.disabled = false;
}

function renderCharts(data) {
    const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }, pointRadius: 0 };
    if (pChart) pChart.destroy();
    pChart = new Chart(document.getElementById('pChart'), {
        type: 'line',
        data: { labels: data.chart_dates, datasets: [
            { data: data.chart_prices, borderColor: '#F7931A', borderWidth: 2 },
            { data: data.chart_ma200, borderColor: '#737373', borderWidth: 1, borderDash: [5,5] }
        ]},
        options: { ...opts, scales: { y: { type: 'logarithmic', display: false } } }
    });
}

function renderAI(text) {
    const area = document.getElementById("ai-area"); area.innerHTML = "";
    text.split('**').forEach((part, i) => {
        if (i % 2 === 1) {
            const div = document.createElement("div");
            div.className = "bg-neutral-900 p-5 rounded-2xl border border-neutral-800";
            div.innerHTML = `<h2 class="text-[#F7931A] text-xs font-bold uppercase mb-2">${part}</h2><div class="text-sm text-neutral-300">${text.split('**')[i+1]}</div>`;
            area.appendChild(div);
        }
    });
}

function setLang(l) { currentLang = l; analyze(); }
</script>
</body>
</html>
