<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex justify-center">

<div class="w-full max-w-xl p-5 space-y-4">

<h1 class="text-2xl text-center font-bold">📈 AI Crypto Analyst</h1>

<select id="coin" class="w-full h-12 bg-neutral-800 rounded-xl px-3">
  <option value="BTC">BTC</option>
  <option value="ETH">ETH</option>
  <option value="SOL">SOL</option>
</select>

<select id="timeframe" class="w-full h-12 bg-neutral-800 rounded-xl px-3">
  <option value="Short-term">Short-term</option>
  <option value="Long-term">Long-term</option>
</select>

<button onclick="analyze()" class="w-full h-12 bg-purple-600 rounded-xl hover:bg-purple-500 transition">
Analyze
</button>

<div id="spinner" class="hidden text-center text-purple-400">Loading...</div>

<div id="output" class="hidden bg-neutral-900 p-4 rounded-xl whitespace-pre-wrap"></div>

</div>

<script>
async function analyze() {

  const coin = document.getElementById("coin").value;
  const timeframe = document.getElementById("timeframe").value;

  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");

  spinner.classList.remove("hidden");
  output.classList.add("hidden");
  output.innerText = ""; // Vyčistenie predchádzajúceho výsledku

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ coin, timeframe })
    });

    const data = await res.json();

    output.innerText =
      `Price: $${data.price}\n24h: ${data.change}%\n\n${data.analysis}`;
  } catch (error) {
    output.innerText = `❌ Error connecting to backend: ${error.message}`;
  }

  spinner.classList.add("hidden");
  output.classList.remove("hidden");
}
</script>

</body>
</html>
