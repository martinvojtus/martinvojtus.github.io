<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-black text-white flex justify-center min-h-screen items-start pt-6 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <header class="w-full mb-6">
        <div class="flex justify-between items-center w-full mb-1">
            <h1 class="text-3xl font-extrabold tracking-tighter text-white flex items-center gap-1">
                V<span class="text-[#F7931A]">₿</span><span class="text-[#22c55e]">$</span>X
            </h1>
            <div class="bg-neutral-900 rounded-lg p-1 border border-neutral-800 flex gap-1 shrink-0 h-fit">
                <button id="lang-en" onclick="setLang('EN')" class="px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition">EN</button>
                <button id="lang-sk" onclick="setLang('SK')" class="px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition">SK</button>
            </div>
        </div>
        <div class="w-full text-[9px] text-neutral-500 font-bold tracking-[0.25em] uppercase mt-1 text-left">
            Value Bitcoin Dollar Index
        </div>
    </header>

    <button onclick="analyze()" id="btn" class="w-full h-14 bg-[#F7931A] rounded-xl text-black font-black text-lg hover:bg-orange-500 transition active:scale-95 shadow-[0_0_20px_rgba(247,147,26,0.2)] tracking-wide">
      ANALYZE
    </button>

    <div id="spinner" class="hidden text-center text-[#F7931A] font-bold mt-6 h-6 text-xs tracking-widest uppercase"></div>
    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-4 text-xs"></div>
    <div id="divider" class="hidden border-b border-neutral-800 my-8"></div>

    <div id="output" class="hidden flex flex-col gap-6"></div>

    <footer id="footer" class="text-center text-[9px] text-neutral-500 font-bold mt-12 border-t border-neutral-900 pt-6 tracking-[0.25em] whitespace-nowrap uppercase">
        MARTIN VOJTUŠ &copy; 2026 &bull; BUILD V1.0.0
    </footer>

</div>

<script>
let priceChartInstance = null;
let rsiChartInstance = null;
let scoreChartInstance = null;

let spinnerInterval = null;
let currentLang = 'EN';

const i18n = {
    EN: {
        btn: 'ANALYZE',
        loading: ["Accessing Liquidity...", "Calculating Log-Reg...", "Mapping Cycles...", "Generating Strategy..."],
        score: "Score",
        error: "❌ Connection Error. Backend waking up. Try again in 15s.",
        legAcc: "VALUE ZONE (DCA IN)",
        legHold: "GROWTH ZONE (HODL)",
        legDist: "EXIT ZONE (DCA OUT)"
    },
    SK: {
        btn: 'ANALÝZA',
        loading: ["Získavam dáta...", "Počítam regresiu...", "Mapujem cykly...", "Generujem stratégiu..."],
        score: "Skóre",
        error: "❌ Chyba pripojenia. Backend sa prebúdza. Skúste znova o 15s.",
        legAcc: "NÁKUPNÁ ZÓNA (DCA IN)",
        legHold: "ZDRAVÝ RAST (HODL)",
        legDist: "VÝSTUPNÁ ZÓNA (DCA OUT)"
    }
};

function setLang(lang) {
    currentLang = lang;
    document.getElementById('lang-en').className = lang === 'EN' ? "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition" : "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    document.getElementById('lang-sk').className = lang === 'SK' ? "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition" : "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    document.getElementById('btn').innerText = i18n[lang].btn;
    if (!document.getElementById('output').classList.contains('hidden')) analyze();
}

function hideTooltips() {
    [priceChartInstance, rsiChartInstance, scoreChartInstance].forEach(chart => {
        if (chart) { 
            chart.setActiveElements([]); 
            chart.update(); 
        }
    });
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

// Vylepšený zameriavač (Hodnoty vycentrované mimo mriežky, žiadne prekrývanie)
const crosshairPlugin = {
  id: 'crosshair',
  afterDraw: chart => {
    const activeElements = chart.getActiveElements();
    if (activeElements.length > 0) {
      let activePoint = activeElements[0];
      let x = activePoint.element.x;
      let y = activePoint.element.y;
      let yAxis = chart.scales.y;
      let xAxis = chart.scales.x;
      let ctx = chart.ctx;
      
      ctx.save();
      
      // Vertikálna čiara
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top);
      ctx.lineTo(x, yAxis.bottom);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.stroke();

      // Horizontálna čiara
      ctx.beginPath();
      ctx.moveTo(xAxis.left, y);
      ctx.lineTo(xAxis.right, y);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.stroke();

      // Štítok na X osi (Dátum) ukotvený dole MIMO grafu
      let xLabel = chart.data.labels[activePoint.index];
      if (xLabel) {
          ctx.fillStyle = '#171717'; 
          ctx.font = 'bold 9px sans-serif';
          let textWidth = ctx.measureText(xLabel).width;
          let boxY = yAxis.bottom + 4; // Kreslíme pod mriežku
          let boxX = x - (textWidth + 16)/2;
          
          // Ochrana aby text nevyšiel mimo celého canvasu (plátna)
          if (boxX < 0) boxX = 0;
          if (boxX + textWidth + 16 > chart.width) boxX = chart.width - textWidth - 16;
          
          ctx.fillRect(boxX, boxY, textWidth + 16, 18);
          ctx.strokeStyle = '#525252';
          ctx.strokeRect(boxX, boxY, textWidth + 16, 18);
          ctx.fillStyle = '#a3a3a3';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(xLabel, boxX + (textWidth + 16)/2, boxY + 9);
      }

      // Štítok na Y osi (Hodnota) ukotvený vpravo MIMO grafu
      let val = activePoint.element.$context.parsed.y;
      let yLabel = val.toFixed(1);
      if (chart.canvas.id === 'priceChart') {
          yLabel = '$' + (val/1000).toFixed(1) + 'k';
      } else if (chart.canvas.id === 'scoreChart') {
          yLabel = val.toFixed(0) + '%';
      }

      ctx.fillStyle = '#171717';
      ctx.font = 'bold 9px sans-serif';
      let yTextWidth = ctx.measureText(yLabel).width;
      let yBoxX = xAxis.right + 4; // Kreslíme vpravo od mriežky
      
      ctx.fillRect(yBoxX, y - 9, yTextWidth + 16, 18);
      ctx.strokeStyle = '#525252';
      ctx.strokeRect(yBoxX, y - 9, yTextWidth + 16, 18);
      ctx.fillStyle = '#a3a3a3';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(yLabel, yBoxX + (yTextWidth + 16)/2, y);

      ctx.restore();
    }
  }
};

// Vlastný plugin pre fialové pozadie v RSI (70 a 30)
const rsiBackgroundPlugin = {
    id: 'rsiBackground',
    beforeDraw: (chart) => {
        if (chart.canvas.id !== 'rsiChart') return;
        const ctx = chart.ctx;
        const yAxis = chart.scales.y;
        const xAxis = chart.scales.x;
        const y70 = yAxis.getPixelForValue(70);
        const y30 = yAxis.getPixelForValue(30);
        ctx.save();
        ctx.fillStyle = 'rgba(139, 92, 246, 0.06)'; // Fialová výplň TradingView štýl
        ctx.fillRect(xAxis.left, y70, xAxis.right - xAxis.left, y30 - y70);
        ctx.restore();
    }
};

Chart.register(crosshairPlugin, rsiBackgroundPlugin);

async function analyze() {
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const divider = document.getElementById("divider");
  const btn = document.getElementById("btn");
  const errorBox = document.getElementById("error-box");
  const footer = document.getElementById("footer");

  output.classList.add("hidden");
  divider.classList.add("hidden");
  errorBox.classList.add("hidden");
  footer.classList.add("hidden");
  btn.disabled = true;
  btn.classList.add("opacity-50");
  
  spinner.classList.remove("hidden");
  let msgIndex = 0;
  spinner.innerText = i18n[currentLang].loading[0];
  
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= i18n[currentLang].loading.length) msgIndex = 0;
      spinner.innerText = i18n[currentLang].loading[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ language: currentLang }) 
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const colorClass = data.change > 0 ? "text-green-500" : (data.change < 0 ? "text-red-500" : "text-neutral-400");
    const sign = data.change > 0 ? "+" : "";
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const score = data.cycle_score || 0;
    
    let scoreColor = score <= 20 ? "bg-green-500" : (score >= 75 ? "bg-red-500" : "bg-[#F7931A]");
    let scoreTextColor = score <= 20 ? "text-green-500" : (score >= 75 ? "text-red-500" : "text-[#F7931A]");
    
    let phaseBadgeColor = score <= 20 ? "bg-[#030a05] text-[#22c55e] border border-[#22c55e]/60 shadow-[0_0_15px_rgba(34,197,94,0.25)]" : (score >= 75 ? "bg-red-900/30 text-red-400 border border-red-500/60 shadow-[0_0_15px_rgba(239,68,68,0.25)]" : "bg-orange-900/30 text-[#F7931A] border border-[#F7931A]/60 shadow-[0_0_15px_rgba(247,147,26,0.25)]");

    let finalHTML = `
      <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-2xl">
        
        <div class="flex justify-between items-center mb-6">
            <div class="text-neutral-500 text-[10px] font-bold uppercase tracking-[0.15em]">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md uppercase tracking-wide">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-center mb-8 whitespace-nowrap">
            <div>
                <div class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-xs sm:text-sm font-semibold mt-1 flex items-center gap-1">
                    ${sign}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded text-[9px] uppercase tracking-wider ml-1">24H</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-3xl sm:text-4xl font-black ${scoreTextColor}">${score}%</div>
                <div class="text-[10px] text-neutral-500 uppercase font-bold tracking-widest mt-1">${i18n[currentLang].score}</div>
            </div>
        </div>
        
        <div>
            <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden mb-3">
                <div class="h-full ${scoreColor} transition-all duration-1000 ease-out" style="width: ${score}%"></div>
            </div>
            <div class="flex flex-col gap-2 text-[10px] sm:text-xs text-neutral-500 font-bold tracking-wider px-1">
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-green-500 shrink-0"></div><span>0% - 20% &bull; ${i18n[currentLang].legAcc}</span></div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#F7931A] shrink-0"></div><span>21% - 74% &bull; ${i18n[currentLang].legHold}</span></div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-red-500 shrink-0"></div><span>75% - 100% &bull; ${i18n[currentLang].legDist}</span></div>
            </div>
        </div>
      </div>

      <div class="bg-[#1c120a] border border-[#F7931A]/40 rounded-3xl p-6 shadow-[0_0_20px_rgba(247,147,26,0.15)] relative">
          <div class="absolute top-4 left-4 text-[10px] font-bold text-[#F7931A] uppercase tracking-widest">V₿$X Cycle Score (0-100%)</div>
          <div class="h-[180px] pt-6">
              <canvas id="scoreChart"></canvas>
          </div>
      </div>

      <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-xl space-y-8">
        <div class="h-[240px] relative">
            <div class="absolute top-0 left-0 text-[10px] font-bold text-[#a3a3a3] uppercase tracking-widest">Price & MAs (50W, 200W)</div>
            <div class="h-full pt-6"><canvas id="priceChart"></canvas></div>
        </div>
        <div class="h-[160px] relative border-t border-neutral-800 pt-6">
            <div class="absolute top-3 left-0 text-[10px] font-bold text-[#a3a3a3] uppercase tracking-widest">Weekly RSI (14) + SMA</div>
            <div class="h-full"><canvas id="rsiChart"></canvas></div>
        </div>
      </div>
    `;

    const parts = data.analysis.split('**');
    for (let i = 1; i < parts.length; i += 2) {
      if (parts[i] && parts[i + 1]) {
        const title = parts[i].trim();
        let content = parts[i + 1].trim().replace(/\n/g, '<br>');

        let boxStyle = "bg-neutral-900 border-neutral-800 p-6 rounded-3xl border shadow-lg";
        let titleStyle = "text-white"; 
        
        let c = title.toUpperCase();
        if (c.includes("VERDICT") || c.includes("VERDIKT") || c.includes("STRATÉGIA") || c.includes("STRATEGY")) {
            if (score <= 20) {
                boxStyle = "bg-[#030a05] border-[#22c55e]/60 shadow-[0_0_25px_rgba(34,197,94,0.25)] p-6 rounded-3xl border transition-all duration-500"; titleStyle = "text-[#22c55e]";
            } else if (score >= 75) {
                boxStyle = "bg-red-900/30 border-red-500/60 shadow-[0_0_25px_rgba(239,68,68,0.25)] p-6 rounded-3xl border transition-all duration-500"; titleStyle = "text-red-400";
            } else {
                boxStyle = "bg-orange-900/30 border-[#F7931A]/60 shadow-[0_0_25px_rgba(247,147,26,0.25)] p-6 rounded-3xl border transition-all duration-500"; titleStyle = "text-[#F7931A]";
            }
        }

        finalHTML += `
          <div class="${boxStyle}">
            <h2 class="${titleStyle} text-xs font-bold mb-4 uppercase tracking-[0.15em]">${title}</h2>
            <div class="text-neutral-300 text-sm leading-loose">${content}</div>
          </div>
        `;
      }
    }

    output.innerHTML = finalHTML;
    divider.classList.remove("hidden");
    output.classList.remove("hidden");
    footer.classList.remove("hidden");
    
    // LIMIT DÁT NA POSLEDNÝCH 1000 DNÍ (cca 143 týždňov)
    const limit = -143;
    const chartDates = data.chart_dates.slice(limit);
    const chartPrices = data.chart_prices.slice(limit);
    const chartMa50 = data.chart_ma50.slice(limit);
    const chartMa200 = data.chart_ma200.slice(limit);
    const chartRsi = data.chart_rsi.slice(limit);
    const chartRsiSma = data.chart_rsi_sma.slice(limit);
    const chartScore = data.chart_score.slice(limit);

    if (chartDates.length > 0 && chartPrices.length > 0) {
        Chart.defaults.color = '#525252'; 
        Chart.defaults.font.size = 9;
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            // Natívny šedý tooltip je úplne vypnutý
            plugins: { 
                legend: { display: false }, 
                tooltip: { enabled: false } 
            },
            // Pridávame presný padding doprava (pre cenu) a dole (pre dátum), 
            // aby sa náš vlastný zameriavač mal kde bezpečne vykresliť
            layout: { padding: { left: 0, right: 45, top: 10, bottom: 25 } },
            interaction: { mode: 'index', intersect: false }
        };

        const xAxisConfig = {
            display: true,
            grid: { display: false, drawBorder: false },
            ticks: { display: false } // Vypnuté statické osi
        };

        if (priceChartInstance) priceChartInstance.destroy();
        priceChartInstance = new Chart(document.getElementById('priceChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: chartDates,
                datasets: [
                    { label: 'Price ($)', data: chartPrices, borderColor: '#ffffff', borderWidth: 1.0, tension: 0.6, pointRadius: 0 },
                    { label: '50W MA', data: chartMa50, borderColor: '#06b6d4', borderWidth: 0.6, tension: 0.6, pointRadius: 0 },
                    { label: '200W MA', data: chartMa200, borderColor: '#a855f7', borderWidth: 0.6, tension: 0.6, pointRadius: 0 }
                ]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', type: 'logarithmic', 
                        grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false, tickLength: 0 },
                        ticks: { display: false } 
                    } 
                } 
            }
        });

        if (rsiChartInstance) rsiChartInstance.destroy();
        rsiChartInstance = new Chart(document.getElementById('rsiChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: chartDates,
                datasets: [
                    { label: 'RSI', data: chartRsi, borderColor: '#8b5cf6', borderWidth: 1.0, tension: 0.6, pointRadius: 0, fill: { target: {value: 70}, above: 'rgba(34, 197, 94, 0.4)', below: 'transparent' } },
                    { label: 'RSI Drop', data: chartRsi, borderColor: 'transparent', borderWidth: 0, tension: 0.6, pointRadius: 0, fill: { target: {value: 30}, below: 'rgba(239, 68, 68, 0.4)', above: 'transparent' } },
                    { label: 'RSI SMA', data: chartRsiSma, borderColor: '#eab308', borderWidth: 1.0, tension: 0.6, pointRadius: 0 },
                    { label: 'Overbought', data: new Array(chartDates.length).fill(70), borderColor: '#525252', borderWidth: 0.6, borderDash: [5, 5], pointRadius: 0 },
                    { label: 'Oversold', data: new Array(chartDates.length).fill(30), borderColor: '#525252', borderWidth: 0.6, borderDash: [5, 5], pointRadius: 0 }
                ]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', min: 20, max: 100, 
                        grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false, tickLength: 0 },
                        ticks: { display: false } 
                    } 
                } 
            }
        });

        let ctxScore = document.getElementById('scoreChart').getContext('2d');
        let gradientStroke = ctxScore.createLinearGradient(0, 180, 0, 0); 
        gradientStroke.addColorStop(0, '#22c55e');    
        gradientStroke.addColorStop(0.3, '#22c55e');  
        gradientStroke.addColorStop(0.6, '#F7931A');  
        gradientStroke.addColorStop(0.8, '#ef4444');  
        gradientStroke.addColorStop(1, '#ef4444');    

        let gradientFill = ctxScore.createLinearGradient(0, 180, 0, 0);
        gradientFill.addColorStop(0, 'rgba(34, 197, 94, 0.15)');
        gradientFill.addColorStop(0.5, 'rgba(247, 147, 26, 0.1)');
        gradientFill.addColorStop(1, 'rgba(239, 68, 68, 0.15)');

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(ctxScore, {
            type: 'line',
            data: {
                labels: chartDates,
                datasets: [
                    { label: 'Score %', data: chartScore, borderColor: gradientStroke, backgroundColor: gradientFill, fill: true, borderWidth: 1.0, tension: 0.6, pointRadius: 0 }
                ]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', min: 0, max: 100, 
                        grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false, tickLength: 0 },
                        ticks: { display: false } 
                    } 
                } 
            }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = i18n[currentLang].error;
    errorBox.classList.remove("hidden");
  }

  btn.disabled = false;
  btn.classList.remove("opacity-50");
}
</script>

</body>
</html>
