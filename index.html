<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Zlepšenie čitateľnosti AI textu */
  .analysis-text b, .analysis-text strong { color: #a855f7; display: block; margin-top: 15px; font-size: 1.1em; }
</style>
</head>

<body class="bg-black text-white flex justify-center">

<div class="w-full max-w-xl p-5 space-y-4">

<h1 class="text-2xl text-center font-bold mb-6">📈 AI Crypto Analyst</h1>

<select id="coin" class="w-full h-14 bg-neutral-900 border border-neutral-800 rounded-2xl px-4 outline-none focus:border-purple-600 transition">
  <option value="BTC">Bitcoin (BTC)</option>
  <option value="ETH">Ethereum (ETH)</option>
  <option value="SOL">Solana (SOL)</option>
</select>

<select id="timeframe" class="w-full h-14 bg-neutral-900 border border-neutral-800 rounded-2xl px-4 outline-none focus:border-purple-600 transition">
  <option value="Short-term">Short-term (Daily/Weekly)</option>
  <option value="Long-term">Long-term (Cycle/Macro)</option>
</select>

<button onclick="analyze()" id="btn" class="w-full h-14 bg-purple-600 rounded-2xl font-bold text-lg hover:bg-purple-500 transition active:scale-95 shadow-lg shadow-purple-900/20">
  Analyze Market
</button>

<div id="spinner" class="hidden text-center text-purple-400 animate-pulse font-medium">Scanning blockchain data...</div>

<div id="output" class="hidden bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-2xl">
  </div>

</div>

<script>
async function analyze() {
  const coin = document.getElementById("coin").value;
  const timeframe = document.getElementById("timeframe").value;
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const btn = document.getElementById("btn");

  spinner.classList.remove("hidden");
  output.classList.add("hidden");
  btn.disabled = true;
  btn.classList.add("opacity-50");

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ coin, timeframe })
    });

    const data = await res.json();

    const colorClass = data.change > 0 ? "text-green-400" : (data.change < 0 ? "text-red-400" : "text-gray-400");
    const sign = data.change > 0 ? "+" : "";
    
    // Formátovanie ceny na 2 desatinné miesta s oddelením tisícok
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    output.innerHTML = `
      <div class="border-b border-neutral-800 pb-5 mb-5">
        <div class="text-neutral-500 text-sm font-bold uppercase tracking-widest mb-1">${data.name}</div>
        <div class="flex items-baseline gap-3">
          <span class="text-5xl font-black tracking-tighter">$${formattedPrice}</span>
          <span class="${colorClass} text-xl font-bold">${sign}${data.change}%</span>
        </div>
      </div>
      <div class="analysis-text text-neutral-300 text-sm leading-relaxed">
        ${data.analysis.replace(/\n/g, '<br>')}
      </div>
    `;
  } catch (error) {
    output.innerHTML = `<span class="text-red-500 font-bold text-center block">❌ Connection Error. Backend might be waking up...</span>`;
  }

  spinner.classList.add("hidden");
  output.classList.remove("hidden");
  btn.disabled = false;
  btn.classList.remove("opacity-50");
}
</script>

</body>
</html>
