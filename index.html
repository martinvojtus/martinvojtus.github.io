<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .animate-pulse-soft { animation: pulse-soft 2s infinite ease-in-out; }
        @keyframes spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        .animate-spin-reverse { animation: spin-reverse 1s linear infinite; }
    </style>    
</head>
<body class="font-['Inter'] bg-black text-white flex justify-center min-h-screen items-start pt-6 pb-10 overflow-x-hidden">

<div class="w-full max-w-xl p-5 relative">

    <!-- DASHBOARD HEADER -->
    <div id="dashboard-controls" class="flex flex-col items-center justify-center mb-8">
        <svg class="w-10 h-auto" xmlns="http://www.w3.org/2000/svg" viewBox="72.35 270 935.31 810">
          <g transform="translate(540, 540)">
            <path d="
              M 0,0 
              L 467.654, -270 
              L 467.654, 270 
              L 0, 540 
              L -467.654, 270 
              L -467.654, -270 
              Z" 
              fill="white" />
          </g>
        </svg>
        <div class="w-10 flex justify-between text-[0.6rem] uppercase text-white font-medium mt-3 tracking-normal leading-none select-none">
            <span>S</span><span>P</span><span>A</span><span>C</span><span>E</span>
        </div>
    </div>

    <!-- VIEW: DASHBOARD -->
    <div id="view-dashboard-container" class="animate-fade-in">
        <div class="flex justify-between items-center px-1 mb-4 text-[0.6rem] uppercase tracking-widest relative h-[24px]">
            <div class="w-16 text-left">
                <div id="dynamic-title" class="text-neutral-600 transition-colors duration-500">SCORE</div>
            </div>
            
            <div id="macro-buttons" class="flex gap-1 absolute left-1/2 -translate-x-1/2">
                <button onclick="updateChart('1Y')" id="btn-1Y" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">1Y</button>
                <button onclick="updateChart('2Y')" id="btn-2Y" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">2Y</button>
                <button onclick="updateChart('4Y')" id="btn-4Y" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">4Y</button>
                <button onclick="updateChart('ALL')" id="btn-ALL" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">ALL</button>
            </div>

            <div class="w-16 flex justify-end">
                <div id="dynamic-score" class="transition-colors duration-500 flex items-center justify-end h-full w-16">
                    <span class="bg-neutral-800 text-transparent animate-pulse rounded px-0.5">00.0%</span>
                </div>
            </div>
        </div>

        <div class="h-48 w-full relative mb-4">
            <div id="chart-skeleton" class="absolute inset-0 pt-[5px] pb-[28px] flex flex-col justify-between transition-opacity duration-1000 pointer-events-none">
                <div class="w-full h-[1px] opacity-5"></div><div class="w-full h-[1px] opacity-10"></div><div class="w-full h-[1px] opacity-50"></div><div class="w-full h-[1px] opacity-10"></div><div class="w-full h-[1px] opacity-10"></div><div class="w-full h-[1px] opacity-10"></div><div class="w-full h-[1px] opacity-10"></div><div class="w-full h-[1px] opacity-10"></div><div class="w-full h-[1px] opacity-50"></div><div class="w-full h-[1px] opacity-10"></div><div class="w-full h-[1px] opacity-5"></div>
            </div>
            
            <div class="absolute top-0 bottom-0 -left-[8px] w-[calc(100%+16px)] pointer-events-none">
                <canvas id="scoreChart" class="opacity-0 transition-opacity duration-1000 pointer-events-auto"></canvas>
            </div>
        </div>

        <div id="main-card" class="p-6 rounded-3xl bg-neutral-900/40 border border-neutral-800/50 shadow-2xl shadow-black/50 transition-colors duration-1000">
            
            <div class="flex justify-between items-center mb-4 text-[0.6rem] uppercase tracking-widest">
                <div id="badge-name" class="border border-neutral-600/50 px-3 h-8 flex items-center rounded-md text-neutral-400">
                    Načítavam...
                </div>
                <div id="badge-phase" class="border border-neutral-800 bg-neutral-800 w-20 h-8 flex items-center justify-center rounded-md transition-all duration-1000 text-transparent animate-pulse">
                    HODL
                </div>
            </div>
            
            <div class="flex justify-between items-start mb-4 gap-4 px-1">
                <div>
                    <div id="val-price" class="text-[1.8rem] font-bold h-9 flex items-center leading-none tracking-tight text-white transition-all duration-1000">
                        <span class="bg-neutral-800 text-transparent animate-pulse rounded">$00,000.00</span>
                    </div>
                    <div id="val-change" class="text-[0.6rem] uppercase tracking-widest mt-2 flex items-center gap-1.5 h-4">
                        <span class="bg-neutral-800 text-transparent animate-pulse rounded px-1 inline-block h-3">+0.00%</span> 
                        <span class="bg-neutral-800 text-transparent animate-pulse rounded px-1.5 h-4 flex items-center">24H</span>
                    </div>
                </div>
                <div class="text-right flex flex-col items-end">
                    <div id="val-score-large" class="text-[1.8rem] font-bold h-9 flex items-center justify-end leading-none w-24 transition-all duration-1000">
                        <span class="bg-neutral-800 text-transparent animate-pulse rounded px-1">00.0%</span>
                    </div>
                    <div class="text-[0.6rem] text-neutral-500 uppercase tracking-widest mt-2">SCORE</div>
                </div>
            </div>
            
            <div>
                <div class="w-full bg-neutral-800 h-1.5 rounded-full overflow-hidden relative">
                    <div id="animated-score-bar" class="h-full transition-all duration-[1500ms] ease-out" style="width: 0%; background-color: transparent;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="error-box" class="hidden mt-4 bg-pink-900/20 border border-pink-900 p-4 rounded-xl text-pink-500 text-[0.6rem] tracking-widest uppercase text-center">❌ CONNECTION FAILED. PLEASE TRY AGAIN.</div>

    <!-- BOTTOM FULL-WIDTH REFRESH BUTTON -->
    <button onclick="triggerAnalysis()" class="w-full mt-6 py-3.5 bg-neutral-900/60 hover:bg-neutral-800/80 border border-neutral-800 hover:border-neutral-700 rounded-2xl flex items-center justify-center gap-2 text-neutral-400 hover:text-white text-[0.6rem] uppercase tracking-widest font-medium transition-all duration-300 active:scale-[0.99] shadow-lg shadow-black/40">
        <svg id="btn-refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>REFRESH</span>
    </button>

</div>

<script>
// --- GLOBALS & STATE ---
let scoreChartInstance = null;
window.currentScoreData = { score: 0, colorClass: "" };
window.fullData = null; 
window.currentMacroView = localStorage.getItem('trading_macro_view') || '4Y';

function getTheme() {
    return {
        low: '#A88468', lowRgb: '168, 132, 104',
        mid: '#F7931A', midRgb: '247, 147, 26',
        high: '#FF4500', highRgb: '255, 69, 0'
    };
}

// --- DASHBOARD LOGIC ---
function initUI() {
    updateMacroButtonsUI(window.currentMacroView);
}

function updateMacroButtonsUI(period) {
    ['1Y', '2Y', '4Y', 'ALL'].forEach(p => {
        const btn = document.getElementById(`btn-${p}`);
        if(btn) btn.className = p === period ? "px-3 py-1 rounded-md text-white bg-neutral-800 transition-all" : "px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all";
    });
}

function triggerAnalysis() {
    window.isAnalyzing = true;
    const refBtn = document.getElementById('btn-refresh-icon');
    if (refBtn) refBtn.classList.add('animate-spin-reverse');
    document.getElementById("scoreChart").classList.add("opacity-0");
    document.getElementById("chart-skeleton").classList.remove("opacity-0");
    
    // Set Skeletons
    const dScore = document.getElementById("dynamic-score");
    dScore.style.transition = "none";
    dScore.innerHTML = '<span class="bg-neutral-800 text-transparent animate-pulse rounded px-0.5">88.8%</span>';
    
    let badgeName = document.getElementById("badge-name");
    badgeName.className = "border border-neutral-600/50 px-3 h-8 flex items-center rounded-md text-neutral-400";
    badgeName.innerText = "Bitcoin (BTC)";

    let pBadge = document.getElementById("badge-phase");
    pBadge.className = 'border border-neutral-800 bg-neutral-800 w-20 h-8 flex items-center justify-center rounded-md transition-all duration-1000 text-transparent animate-pulse';
    pBadge.innerHTML = 'HODL';

    document.getElementById("val-price").innerHTML = '<span class="bg-neutral-800 text-transparent animate-pulse rounded">88,888.88</span>';
    document.getElementById("val-change").innerHTML = '<span class="bg-neutral-800 text-transparent animate-pulse rounded px-1 inline-block h-3">+0.00%</span> <span class="bg-neutral-800 text-transparent animate-pulse rounded px-1.5 h-4 flex items-center">24H</span>';
    
    const vScoreLarge = document.getElementById("val-score-large");
    vScoreLarge.style.transition = "none";
    vScoreLarge.innerHTML = '<span class="bg-neutral-800 text-transparent animate-pulse rounded px-1">88.8%</span>';
    vScoreLarge.style.color = "inherit";
    vScoreLarge.style.textShadow = "none";
    
    // Reset main card to neutral
    document.getElementById("main-card").className = "p-6 rounded-3xl bg-neutral-900/40 border border-neutral-800/50 shadow-2xl shadow-black/50 transition-colors duration-1000";
    
    // Reset score bar
    const bar = document.getElementById("animated-score-bar");
    if(bar) { bar.style.width = "0%"; bar.style.backgroundColor = "transparent"; bar.style.boxShadow = "none"; }

    // Reset dynamic colors
    const dTitle = document.getElementById("dynamic-title");
    dTitle.style.transition = "none";
    dTitle.style.color = "#525252";
    dTitle.style.textShadow = "none";
    dScore.style.color = "#525252";
    dScore.style.textShadow = "none";
    
    // Force reflow and restore transitions
    void dScore.offsetWidth;
    dScore.style.transition = "";
    vScoreLarge.style.transition = "";
    dTitle.style.transition = "";
    
    // Hide error box when refreshing
    document.getElementById("error-box").classList.add("hidden");

    analyze();
}

function updateSkeletonGrid() {
    const skeleton = document.getElementById('chart-skeleton'); if (!skeleton) return;
    const width = skeleton.clientWidth; if (width === 0) return;
    const targetDash = 4; const numDashes = Math.round((width / targetDash + 1) / 2); const exactDash = width / (2 * numDashes - 1);
    const grad = `repeating-linear-gradient(to right, #525252 0, #525252 ${exactDash}px, transparent ${exactDash}px, transparent ${exactDash * 2}px)`;
    const lines = skeleton.children;
    for (let i = 0; i < lines.length; i++) lines[i].style.backgroundImage = grad;
}
window.addEventListener('resize', updateSkeletonGrid);

// --- CHART PLUGIN ---
const customChartPlugin = {
  id: 'customChart',
  afterDraw: chart => {
    const ctx = chart.ctx; if (!chart.chartArea) return; 
    const { chartArea: {top, bottom, left, right}, scales: {y} } = chart;
    const theme = getTheme();
    ctx.save(); ctx.lineWidth = 1;
    const gridWidth = right - left;
    const exactDash = gridWidth / (2 * Math.round(((gridWidth / 4) + 1) / 2) - 1);
    ctx.setLineDash([exactDash, exactDash]);
    for (let v = 0; v <= 100; v += 10) {
        const yPos = y.getPixelForValue(v);
        let op = 0.1; if (v === 0 || v === 100) op = 0.05; else if (v === 20 || v === 80) op = 0.5; 
        ctx.strokeStyle = v <= 20 ? `rgba(${theme.lowRgb}, ${op})` : (v < 80 ? `rgba(${theme.midRgb}, ${op})` : `rgba(${theme.highRgb}, ${op})`);
        ctx.beginPath(); ctx.moveTo(left, yPos); ctx.lineTo(right, yPos); ctx.stroke();
    }
    ctx.restore();

    const activeElements = chart.getActiveElements();
    if (activeElements.length > 0) {
      let activePoint = activeElements[0]; let xPos = activePoint.element.x;
      ctx.save(); ctx.beginPath(); ctx.moveTo(xPos, top); ctx.lineTo(xPos, bottom);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();
      let xLabel = chart.data.labels[activePoint.index];
      if (xLabel) {
          ctx.fillStyle = '#171717'; ctx.font = 'normal 9.6px sans-serif'; 
          let tw = ctx.measureText(xLabel).width;
          let bx = Math.max(left, Math.min(right - tw - 16, xPos - (tw + 16)/2));
          ctx.fillRect(bx, bottom + 4, tw + 16, 20);
          ctx.strokeStyle = '#525252'; ctx.strokeRect(bx, bottom + 4, tw + 16, 20);
          ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(xLabel, bx + (tw + 16)/2, bottom + 14);
      }
      let val = Math.max(0, Math.min(100, activePoint.element.$context.parsed.y));
      let sHex = val <= 20 ? theme.low : (val >= 80 ? theme.high : theme.mid);
      document.getElementById('dynamic-score').innerText = val.toFixed(1) + '%';
      document.getElementById('dynamic-score').style.color = sHex;
      document.getElementById('dynamic-score').style.textShadow = `0 0 10px ${sHex}80`;
      document.getElementById('dynamic-title').style.color = sHex;
      document.getElementById('dynamic-title').style.textShadow = `0 0 10px ${sHex}80`;
      ctx.restore();
    }
    const meta = chart.getDatasetMeta(0);
    if (meta.data && meta.data.length > 0) {
        const lastP = meta.data[meta.data.length - 1];
        const lastV = chart.data.datasets[0].data[meta.data.length - 1];
        let dotC = lastV <= 20 ? theme.low : (lastV >= 80 ? theme.high : theme.mid);
        ctx.save(); ctx.beginPath(); ctx.arc(lastP.x, lastP.y, 4, 0, 2 * Math.PI); ctx.fillStyle = dotC; ctx.fill(); ctx.restore();
    }
  }
};
Chart.register(customChartPlugin);

function updateChart(period) {
    if (!window.fullData) return;
    if (period) {
        window.currentMacroView = period;
        localStorage.setItem('trading_macro_view', period);
        updateMacroButtonsUI(period);
    }
    let pts = 208;
    if (window.currentMacroView === '1Y') pts = 52;
    else if (window.currentMacroView === '2Y') pts = 104;
    else if (window.currentMacroView === 'ALL') pts = window.fullData.chart_dates.length;
    
    // Format raw timestamps to local date strings
    const dts = window.fullData.chart_dates.slice(-pts).map(ts => {
        const d = new Date(ts);
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    });
    
    const scr = window.fullData.chart_score.slice(-pts);
    if (scoreChartInstance) scoreChartInstance.destroy();
    Chart.defaults.color = '#525252'; Chart.defaults.font.family = "'Inter', sans-serif"; Chart.defaults.font.size = 9.6;
    const theme = getTheme();
    scoreChartInstance = new Chart(document.getElementById('scoreChart').getContext('2d'), {
        type: 'line',
        data: { labels: dts, datasets: [{ data: scr, fill: false, borderWidth: 1.5, tension: 0.5, pointRadius: 0, 
            borderColor: function(c) {
                const {ctx, chartArea} = c.chart; if (!chartArea) return;
                const g = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                g.addColorStop(0, theme.low); g.addColorStop(0.2, theme.low);
                g.addColorStop(0.3, theme.mid); g.addColorStop(0.7, theme.mid);
                g.addColorStop(0.8, theme.high); g.addColorStop(1, theme.high);    
                return g;
            }
        }]},
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } },
            layout: { padding: { left: 8, right: 8, top: 5, bottom: 28 } }, interaction: { mode: 'index', intersect: false },
            scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } },
            events: ['mousemove', 'mouseout', 'click', 'touchstart', 'touchmove'],
            onHover: (event, activeElements) => {
                if (window.isAnalyzing) return;
                if (!activeElements.length) {
                    if (scoreChartInstance) scoreChartInstance.update();
                    const s = window.fullData ? window.fullData.cycle_score : 0;
                    document.getElementById('dynamic-score').innerText = s.toFixed(1) + '%';
                    document.getElementById('dynamic-score').style.color = "#525252";
                    document.getElementById('dynamic-score').style.textShadow = "none";
                    document.getElementById('dynamic-title').style.color = "#525252";
                    document.getElementById('dynamic-title').style.textShadow = "none";
                }
            }
        }
    });
    document.getElementById("chart-skeleton").classList.add("opacity-0");
    document.getElementById("scoreChart").classList.remove("opacity-0");
}

async function analyze() {
  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", { 
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ mode: "MACRO", interval: "1w" })
    });
    const data = await res.json(); 
    console.log("Data from backend:", data);
    window.fullData = data; 
    if (data.error) {
        console.error("Backend error:", data.error);
        document.getElementById("error-box").innerText = "❌ " + data.error;
        document.getElementById("error-box").classList.remove("hidden");
        return;
    }
    const s = data.cycle_score || 0;
    const theme = getTheme();
    let sHex = s <= 20 ? theme.low : (s >= 80 ? theme.high : theme.mid);
    
    if (data.name && data.ticker) {
        document.getElementById("badge-name").innerText = `${data.name} (${data.ticker})`;
    } else {
        document.getElementById("badge-name").innerText = "Bitcoin (BTC)";
    }
    
    let badgeBgColor, badgeBorderColor, badgeTextColor, mcBg, mcBorder;
    if (s <= 20) { badgeBgColor="bg-[#A88468]/10"; badgeBorderColor="border-[#A88468]/40"; badgeTextColor="text-[#A88468]"; mcBg="bg-[#A88468]/5"; mcBorder="border-[#A88468]/30"; }
    else if (s >= 80) { badgeBgColor="bg-[#FF4500]/10"; badgeBorderColor="border-[#FF4500]/40"; badgeTextColor="text-[#FF4500]"; mcBg="bg-[#FF4500]/5"; mcBorder="border-[#FF4500]/30"; }
    else { badgeBgColor="bg-[#F7931A]/10"; badgeBorderColor="border-[#F7931A]/40"; badgeTextColor="text-[#F7931A]"; mcBg="bg-[#F7931A]/5"; mcBorder="border-[#F7931A]/30"; }

    let pBadge = document.getElementById("badge-phase");
    pBadge.className = `border w-20 h-8 flex items-center justify-center rounded-md transition-all duration-1000 ${badgeBgColor} ${badgeBorderColor} ${badgeTextColor}`;
    pBadge.innerText = data.phase || "HODL";

    document.getElementById("val-price").innerText = `$${Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

    let vCh = document.getElementById("val-change");
    vCh.className = `text-[0.6rem] uppercase tracking-widest mt-2 flex items-center h-4 gap-1.5 ${data.change >= 0 ? 'text-[#22c55e]' : 'text-pink-500'}`;
    vCh.innerHTML = `${data.change >= 0 ? '+':''}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded font-normal">24H</span>`;

    document.getElementById("val-score-large").innerText = `${s.toFixed(1)}%`;
    document.getElementById("val-score-large").style.color = sHex;
    document.getElementById("val-score-large").style.textShadow = `0 0 15px ${sHex}80`;

    const dScore = document.getElementById("dynamic-score");
    dScore.innerText = `${s.toFixed(1)}%`;
    dScore.style.color = sHex;
    dScore.style.textShadow = `0 0 10px ${sHex}80`;
    document.getElementById("dynamic-title").style.color = sHex;
    document.getElementById("dynamic-title").style.textShadow = `0 0 10px ${sHex}80`;

    document.getElementById("main-card").className = `p-6 rounded-3xl border shadow-2xl transition-colors duration-1000 ${mcBg} ${mcBorder}`;

    updateChart(window.currentMacroView);
    setTimeout(() => {
        const bar = document.getElementById("animated-score-bar");
        if(bar) { bar.style.width = `${s}%`; bar.style.backgroundColor = sHex; bar.style.boxShadow = `0 0 10px ${sHex}`; }
    }, 50);
  } catch (e) { document.getElementById("error-box").classList.remove("hidden"); }
  finally { 
    window.isAnalyzing = false;
    const icon = document.getElementById('btn-refresh-icon'); 
    if (icon) icon.classList.remove('animate-spin-reverse'); 
  }
}

['click', 'touchstart'].forEach(evt => {
    window.addEventListener(evt, (e) => {
        if (window.isAnalyzing) return;
        if (scoreChartInstance && !e.target.closest('#scoreChart')) {
            scoreChartInstance.setActiveElements([]);
            scoreChartInstance.update();
            const s = window.fullData ? window.fullData.cycle_score : 0;
            const theme = getTheme();
            let sHex = s <= 20 ? theme.low : (s >= 80 ? theme.high : theme.mid);
            document.getElementById('dynamic-score').innerText = s.toFixed(1) + '%';
            document.getElementById('dynamic-score').style.color = sHex;
            document.getElementById('dynamic-score').style.textShadow = `0 0 10px ${sHex}80`;
            document.getElementById('dynamic-title').style.color = sHex;
            document.getElementById('dynamic-title').style.textShadow = `0 0 10px ${sHex}80`;
        }
    }, { passive: true });
});

window.addEventListener('DOMContentLoaded', () => { updateSkeletonGrid(); initUI(); triggerAnalysis(); });
</script>
</body>
</html>
