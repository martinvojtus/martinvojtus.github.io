<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .bg-orange-btc { background-color: #F7931A; }
  .text-orange-btc { color: #F7931A; }
  .border-orange-btc { border-color: #F7931A; }
</style>
</head>

<body class="bg-black text-white flex justify-center min-h-screen items-start pt-10 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

<h1 class="text-3xl text-center font-extrabold mb-8 tracking-wide text-orange-btc">
  <span class="text-4xl">₿</span>itcoin Macro Analyst
</h1>

<button onclick="analyze()" id="btn" class="w-full h-14 bg-orange-btc rounded-xl font-bold text-lg hover:bg-orange-500 transition active:scale-95 shadow-lg shadow-orange-900/20 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 focus:ring-offset-black">
  Analyze Macro Cycle
</button>

<div id="spinner" class="hidden text-center text-orange-400 font-medium mt-6 h-6 text-sm"></div>

<div id="divider" class="hidden border-b border-neutral-800 my-6"></div>

<div id="output" class="hidden flex flex-col gap-4">
  </div>

</div>

<script>
let priceChartInstance = null;
let spinnerInterval = null;

async function analyze() {
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const divider = document.getElementById("divider");
  const btn = document.getElementById("btn");

  output.classList.add("hidden");
  divider.classList.add("hidden");
  btn.disabled = true;
  btn.classList.add("opacity-50");
  
  spinner.classList.remove("hidden");
  
  const loadingMessages = [
      "Fetching ₿/XAU prices...",
      "Mapping cycle fractals...",
      "Calculating 200W MA...",
      "AI is analyzing flows...",
      "Generating report..."
  ];
  let msgIndex = 0;
  spinner.innerText = loadingMessages[0];
  
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= loadingMessages.length) msgIndex = loadingMessages.length - 1;
      spinner.innerText = loadingMessages[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST"
    });

    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    const colorClass = data.change > 0 ? "text-orange-300" : (data.change < 0 ? "text-red-500" : "text-neutral-400");
    const sign = data.change > 0 ? "+" : "";
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let rawAnalysis = data.analysis;
    let phaseText = "ANALYZING...";
    
    let phaseMatch = rawAnalysis.match(/PHASE:\s*([a-zA-Z\s]+)/i);
    if (phaseMatch) {
        phaseText = phaseMatch[1].trim().toUpperCase();
        rawAnalysis = rawAnalysis.replace(phaseMatch[0], '').trim(); 
    }

    let phaseBadgeColor = "bg-orange-900/30 border-orange-700/50 text-orange-300"; 
    if (phaseText.includes("BULL")) {
        phaseBadgeColor = "bg-orange-btc/20 border-orange-btc/50 text-orange-btc"; 
    } else if (phaseText.includes("BEAR")) {
        phaseBadgeColor = "bg-red-900/30 border-red-700/50 text-red-400"; 
    }

    const score = data.cycle_score || 0;
    let scoreColor = "bg-orange-900"; 
    if (score > 30 && score <= 70) scoreColor = "bg-orange-btc";
    if (score > 70) scoreColor = "bg-orange-300";

    let finalHTML = `
      <div class="bg-neutral-900 p-5 rounded-2xl border border-neutral-800 shadow-md">
        <div class="flex justify-between items-start mb-2">
            <div class="text-neutral-400 text-sm font-bold uppercase tracking-widest">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} text-xs font-bold px-3 py-1 rounded-lg border uppercase text-right leading-tight max-w-[50%]">${phaseText}</div>
        </div>
        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-5">
          <span class="text-4xl sm:text-5xl font-bold tracking-tight text-white">$${formattedPrice}</span>
          <span class="${colorClass} text-xl font-semibold">${sign}${data.change.toFixed(2)}%</span>
        </div>
        
        <div class="mb-5">
            <div class="flex justify-between text-xs text-neutral-400 font-bold uppercase tracking-wider mb-1">
                <span>Cycle Bottom</span>
                <span class="text-orange-300">Score: ${score}%</span>
                <span>Cycle Top</span>
            </div>
            <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden">
                <div class="h-full ${scoreColor} transition-all duration-1000" style="width: ${score}%"></div>
            </div>
        </div>
        
        <div class="w-full h-40 relative border-t border-neutral-800 pt-3">
          <canvas id="priceChart"></canvas>
        </div>
      </div>
    `;

    const parts = rawAnalysis.split('**');
    for (let i = 1; i < parts.length; i += 2) {
      if (parts[i] && parts[i + 1]) {
        const title = parts[i].trim();
        let content = parts[i + 1].trim().replace(/^- /gm, '').replace(/\n/g, '<br><br>');
        content = content.replace(/(<br>\s*){3,}/g, '<br><br>'); 

        let boxStyle = "bg-neutral-900 border-neutral-800";
        let titleStyle = "text-orange-400"; 
        
        if (title.toUpperCase().includes("TARGET")) {
            boxStyle = "bg-orange-900/10 border-orange-800/50";
            titleStyle = "text-orange-300 font-black uppercase tracking-wider";
        }
        
        if (title.toUpperCase().includes("VERDICT")) {
            if (content.toUpperCase().includes("BUY") || content.toUpperCase().includes("DCA") || phaseText.toUpperCase().includes("BULL") || phaseText.toUpperCase().includes("ACCUMULATION")) {
                boxStyle = "bg-orange-900/20 border-orange-500/50"; 
                titleStyle = "text-orange-btc font-black uppercase tracking-wider";
            } else if (content.toUpperCase().includes("SELL") || phaseText.toUpperCase().includes("BEAR") || content.toUpperCase().includes("DISTRIBUTION")) {
                boxStyle = "bg-red-900/10 border-red-800/50"; 
                titleStyle = "text-red-400 font-black uppercase tracking-wider";
            } else {
                boxStyle = "bg-orange-900/10 border-orange-800/50";
                titleStyle = "text-orange-300 font-black uppercase tracking-wider";
            }
        }

        finalHTML += `
          <div class="${boxStyle} p-5 rounded-2xl border shadow-md">
            <h2 class="${titleStyle} text-lg font-bold mb-3">${title}</h2>
            <div class="text-neutral-300 text-sm leading-relaxed">${content}</div>
          </div>
        `;
      }
    }

    output.innerHTML = finalHTML;
    divider.classList.remove("hidden");
    output.classList.remove("hidden");
    
    if (data.chart_dates.length > 0 && data.chart_prices.length > 0) {
        if (priceChartInstance) { priceChartInstance.destroy(); }
        
        const ctx = document.getElementById('priceChart').getContext('2d');
        const chartColor = '#F7931A'; 

        priceChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [{
                    label: '₿ Price',
                    data: data.chart_prices,
                    borderColor: chartColor,
                    borderWidth: 2,
                    tension: 0.2,
                    pointRadius: 0,
                    pointHitRadius: 10
                    // Odstránená výplň grafu (fill parameter)
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { display: false },
                    tooltip: {
                        displayColors: false,
                        backgroundColor: '#1a1a1a',
                        borderColor: '#333',
                        borderWidth: 1,
                        titleColor: '#888',
                        bodyColor: '#fff',
                        callbacks: {
                            label: function(context) {
                                return 'Price: $' + context.parsed.y.toLocaleString('en-US', {minimumFractionDigits: 2});
                            }
                        }
                    }
                },
                scales: {
                    x: { display: false },
                    y: { display: false, min: Math.min(...data.chart_prices) * 0.95, max: Math.max(...data.chart_prices) * 1.05 }
                },
                layout: { padding: 0 }
            }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    output.classList.remove("hidden");
    output.innerHTML = `
      <div class="bg-neutral-900 p-5 rounded-2xl border border-red-900/50">
        <span class="text-red-500 font-bold block text-center">❌ Connection Error. Backend waking up or resolving API IPs. Try again in 10s.</span>
      </div>`;
  }

  btn.disabled = false;
  btn.classList.remove("opacity-50");
}
</script>

</body>
</html>
