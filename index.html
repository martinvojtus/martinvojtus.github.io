<!DOCTYPE html>
<html>
<head>
  <title>AI Video Analyzer</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: auto; }
    textarea { width: 100%; height: 300px; }
  </style>
</head>

<body>

<h2>🎥 AI Video Analyzer</h2>

<input id="url" placeholder="Paste YouTube link" style="width:100%" />

<select id="mode">
  <option value="business">💰 Business</option>
  <option value="coding">💻 Coding</option>
  <option value="self">🧠 Self</option>
</select>

<button onclick="analyze()">Analyze</button>

<h3>Output:</h3>
<textarea id="output"></textarea>

<script>
async function analyze() {
  const url = document.getElementById("url").value;
  const mode = document.getElementById("mode").value;

  const res = await fetch("YOUR_RENDER_URL/analyze", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({url, mode})
  });

  const data = await res.json();
  document.getElementById("output").value = data.analysis;
}
</script>

</body>
</html>
