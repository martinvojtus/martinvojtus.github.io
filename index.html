<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-black text-white flex justify-center min-h-screen items-start pt-6 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">
    <header class="w-full mb-8">
        <div class="flex justify-between items-center w-full mb-2">
            <h1 class="text-3xl font-extrabold tracking-tighter text-white flex items-center gap-1">
                V<span class="text-[#F7931A]">₿</span><span class="text-[#a3e635]">$</span>X
            </h1>
            <div class="bg-neutral-900 rounded-lg p-1 border border-neutral-800 flex gap-1 shrink-0 h-fit">
                <button id="lang-en" onclick="setLang('EN')" class="px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition">EN</button>
                <button id="lang-sk" onclick="setLang('SK')" class="px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition">SK</button>
            </div>
        </div>
        <p class="text-[10px] text-neutral-500 font-bold tracking-[0.25em] uppercase w-full">Value Bitcoin Dollar Index</p>
    </header>

    <button onclick="analyze()" id="btn" class="w-full h-14 bg-white text-black font-black text-lg hover:bg-neutral-200 transition active:scale-95 rounded-2xl shadow-[0_0_20px_rgba(255,255,255,0.1)]">
      ANALYZE V₿<span class="text-[#a3e635]">$</span>X
    </button>

    <div id="spinner" class="hidden text-center text-neutral-500 font-bold mt-6 h-6 text-[10px] tracking-widest uppercase"></div>
    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-4 text-xs"></div>
    <div id="divider" class="hidden border-b border-neutral-800 my-8"></div>
    <div id="output" class="hidden flex flex-col gap-6"></div>
    <footer id="footer" class="hidden text-center text-[9px] text-neutral-600 font-bold mt-12 border-t border-neutral-900 pt-8 tracking-[0.3em] uppercase"></footer>
</div>

<script>
let priceChartInstance = null, rsiChartInstance = null, scoreChartInstance = null, spinnerInterval = null, currentLang = 'EN';
const i18n = {
    EN: { btn: 'ANALYZE V₿$X', loading: ["Accessing Liquidity...", "Calculating Log-Reg...", "Mapping Cycles..."], legAcc: "VALUE ZONE (DCA IN)", legHold: "GROWTH ZONE (HODL)", legDist: "EXIT ZONE (DCA OUT)" },
    SK: { btn: 'ANALÝZA V₿$X', loading: ["Sťahujem dáta...", "Počítam regresiu...", "Mapujem cykly..."], legAcc: "NÁKUPNÁ ZÓNA (IN)", legHold: "ZDRAVÝ RAST (HODL)", legDist: "VÝSTUPNÁ ZÓNA (OUT)" }
};

function setLang(lang) {
    currentLang = lang;
    document.getElementById('lang-en').className = lang === 'EN' ? "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition" : "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    document.getElementById('lang-sk').className = lang === 'SK' ? "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition" : "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    
    // Dynamická zmena nadpisu tlačidla so zachovaním zelenej dolárovej značky
    const btn = document.getElementById('btn');
    if (lang === 'EN') {
        btn.innerHTML = `ANALYZE V₿<span class="text-[#a3e635]">$</span>X`;
    } else {
        btn.innerHTML = `ANALÝZA V₿<span class="text-[#a3e635]">$</span>X`;
    }

    if (!document.getElementById('output').classList.contains('hidden')) analyze();
}

async function analyze() {
  const spinner = document.getElementById("spinner"), output = document.getElementById("output"), btn = document.getElementById("btn"), footer = document.getElementById("footer");
  output.classList.add("hidden"); btn.disabled = true; btn.classList.add("opacity-50");
  spinner.classList.remove("hidden"); let msgIndex = 0; spinner.innerText = i18n[currentLang].loading[0];
  spinnerInterval = setInterval(() => { msgIndex = (msgIndex + 1) % i18n[currentLang].loading.length; spinner.innerText = i18n[currentLang].loading[msgIndex]; }, 1500);

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ language: currentLang }) });
    const data = await res.json();
    clearInterval(spinnerInterval); spinner.classList.add("hidden");
    if(data.error) throw new Error(data.error);

    const score = data.cycle_score;
    let scoreColor = score <= 20 ? "text-[#a3e635]" : (score >= 75 ? "text-red-500" : "text-[#F7931A]");
    let badgeStyle = score <= 20 ? "bg-[#a3e635]/20 text-[#a3e635] border-[#a3e635]/40" : (score >= 75 ? "bg-red-900/20 text-red-400 border-red-800/30" : "bg-orange-900/20 text-[#F7931A] border-[#F7931A]/30");

    output.innerHTML = `
      <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <div class="text-[10px] text-neutral-500 font-bold tracking-widest uppercase">BTC Terminal</div>
            <div class="${badgeStyle} text-[9px] font-black px-3 py-1 rounded-lg border uppercase">${data.phase}</div>
        </div>
        <div class="flex justify-between items-end mb-10">
            <div><div class="text-4xl sm:text-5xl font-black tracking-tighter text-white">$${data.price.toLocaleString()}</div><div class="${data.change > 0 ? 'text-[#a3e635]':'text-red-500'} text-xs font-bold mt-1">${data.change > 0 ? '+':''}${data.change}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded text-[9px] ml-1">24H</span></div></div>
            <div class="text-right"><div class="text-4xl sm:text-5xl font-black ${scoreColor}">${score}%</div><div class="text-[9px] text-neutral-500 font-bold tracking-widest mt-1 uppercase">Cycle Score</div></div>
        </div>
        <div class="mb-10">
            <div class="w-full bg-neutral-800 h-1.5 rounded-full overflow-hidden mb-5"><div class="h-full ${score <= 20 ? 'bg-[#a3e635]':(score >= 75 ? 'bg-red-500':'bg-orange-500')} transition-all duration-1000" style="width: ${score}%"></div></div>
            <div class="flex flex-col gap-3 text-[10px] text-neutral-500 font-bold tracking-wider">
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#a3e635]"></div>${i18n[currentLang].legAcc}</div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-orange-500"></div>${i18n[currentLang].legHold}</div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-red-500"></div>${i18n[currentLang].legDist}</div>
            </div>
        </div>
        
        <div class="space-y-6">
            <div class="bg-[#1c120a] border border-[#F7931A]/40 rounded-2xl p-4 shadow-[0_0_20px_rgba(247,147,26,0.2)] relative">
                <div style="position: absolute; top: 16px; left: 16px; font-size: 0.70rem; color: #F7931A; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em;">V₿$X Flow (Cycle Score)</div>
                <div style="height: 180px; padding-top: 1.5rem;">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>

            <div class="h-[260px] relative border-t border-neutral-800 pt-6"><div class="absolute top-0 right-0 text-[8px] text-neutral-600 font-bold uppercase mt-2">Log Price & MAs</div><canvas id="priceChart"></canvas></div>
            <div class="h-[180px] relative border-t border-neutral-800 pt-6"><div class="absolute top-0 right-0 text-[8px] text-neutral-600 font-bold uppercase mt-2">RSI + SMA 14</div><canvas id="rsiChart"></canvas></div>
        </div>
      </div>
    `;

    const parts = data.analysis.split('**');
    for (let i = 1; i < parts.length; i += 2) {
      const title = parts[i].trim();
      const content = parts[i + 1].trim().replace(/\n/g, '<br>');
      let boxStyle = "bg-neutral-900 border-neutral-800 p-7 rounded-3xl border shadow-xl";
      if (title.toUpperCase().includes("VERDIKT") || title.toUpperCase().includes("STRATEGY")) {
          boxStyle = score <= 20 ? "bg-[#a3e635]/10 border-[#a3e635]/50 shadow-[0_0_25px_rgba(163,230,53,0.2)] p-7 rounded-3xl border transition-all duration-500" : (score >= 75 ? "bg-red-900/25 border-red-500/50 shadow-[0_0_30px_rgba(239,68,68,0.15)] p-7 rounded-3xl border" : "bg-orange-900/25 border-[#F7931A]/50 shadow-[0_0_30px_rgba(247,147,26,0.15)] p-7 rounded-3xl border");
      }
      output.innerHTML += `<div class="${boxStyle}"><h2 class="text-[10px] font-black mb-4 uppercase tracking-[0.2em] text-neutral-400">${title}</h2><div class="text-neutral-200 text-sm leading-relaxed">${content}</div></div>`;
    }

    output.classList.remove("hidden");
    footer.innerHTML = `MARTIN VOJTUŠ &copy; 2026 &bull; V₿<span class="text-[#a3e635]">$</span>X PROTOCOL v2.0.0`;
    footer.classList.remove("hidden");
    renderCharts(data);
  } catch (e) { spinner.classList.add("hidden"); document.getElementById("error-box").classList.remove("hidden"); }
  btn.disabled = false; btn.classList.remove("opacity-50");
}

function renderCharts(data) {
    Chart.defaults.color = '#404040'; Chart.defaults.font.size = 9;
    const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(10,10,10,0.9)', yAlign: 'bottom', caretPadding: 15 } }, scales: { x: { grid: { display: false } }, y: { position: 'right', grid: { color: 'rgba(255,255,255,0.02)' } } }, interaction: { mode: 'index', intersect: false } };

    new Chart(document.getElementById('priceChart'), { type: 'line', data: { labels: data.chart_dates, datasets: [{ data: data.chart_prices, borderColor: '#fff', borderWidth: 0.8, tension: 0.8, pointRadius: 0 }, { data: data.chart_ma50, borderColor: '#06b6d4', borderWidth: 0.4, pointRadius: 0 }, { data: data.chart_ma200, borderColor: '#a855f7', borderWidth: 0.4, pointRadius: 0 }] }, options: { ...opts, scales: { x: { ticks: { maxTicksLimit: 5 } }, y: { ...opts.scales.y, type: 'logarithmic' } } } });
    new Chart(document.getElementById('rsiChart'), { type: 'line', data: { labels: data.chart_dates, datasets: [{ data: data.chart_rsi, borderColor: '#8b5cf6', borderWidth: 0.8, tension: 0.8, pointRadius: 0 }, { data: data.chart_rsi_sma, borderColor: '#eab308', borderWidth: 0.8, tension: 0.8, pointRadius: 0 }, { data: new Array(data.chart_dates.length).fill(85), borderColor: '#404040', borderWidth: 0.4, borderDash: [5,5], pointRadius: 0 }, { data: new Array(data.chart_dates.length).fill(40), borderColor: '#404040', borderWidth: 0.4, borderDash: [5,5], pointRadius: 0 }] }, options: { ...opts, scales: { x: { ticks: { maxTicksLimit: 5 } }, y: { ...opts.scales.y, min: 20, max: 100 } } } });
    
    let ctxS = document.getElementById('scoreChart').getContext('2d'), gS = ctxS.createLinearGradient(0, 180, 0, 0);
    gS.addColorStop(0, '#a3e635'); // Neónová zeleno-žltá
    gS.addColorStop(0.3, '#a3e635'); 
    gS.addColorStop(0.6, '#F7931A'); 
    gS.addColorStop(1, '#ef4444');
    
    let gradFill = ctxS.createLinearGradient(0, 180, 0, 0);
    gradFill.addColorStop(0, 'rgba(163, 230, 53, 0.1)'); // Jemný Lime fill
    gradFill.addColorStop(0.5, 'rgba(247, 147, 26, 0.05)'); // Jemný Orange fill
    gradFill.addColorStop(1, 'rgba(239, 68, 68, 0.1)'); // Jemný Red fill

    new Chart(ctxS, { type: 'line', data: { labels: data.chart_dates, datasets: [{ data: data.chart_score, borderColor: gS, fill: true, backgroundColor: gradFill, borderWidth: 0.8, tension: 0.8, pointRadius: 0 }] }, options: { ...opts, scales: { x: { ticks: { maxTicksLimit: 5 } }, y: { position: 'right', min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.02)' }, ticks: { stepSize: 25 } } } } });
}
</script>
</body>
</html>
