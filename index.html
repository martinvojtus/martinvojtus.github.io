<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: black; color: white; }
    </style>
</head>
<body class="flex justify-center min-h-screen items-start pt-6 pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <div id="spinner" class="flex flex-col items-center justify-center mt-32 space-y-4">
        <div class="w-8 h-8 border-4 border-[#F7931A]/20 border-t-[#F7931A] rounded-full animate-spin"></div>
        <div id="loading-text" class="text-center text-[#F7931A] text-[0.72rem] font-bold tracking-widest uppercase">ANALYZING MACRO CYCLES...</div>
    </div>

    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 text-[0.72rem] font-bold tracking-widest uppercase text-center mt-10"></div>

    <div id="output" class="hidden flex flex-col gap-4 pt-1"></div>

    <footer id="footer" class="hidden text-center text-[0.72rem] text-neutral-500 font-bold mt-12 tracking-[0.25em] uppercase">
        MARTIN VOJTUŠ &copy; 2026 &bull; BUILD V1.0.0
    </footer>

</div>

<script>
let scoreChartInstance = null;
let spinnerInterval = null;
window.currentScoreData = { score: 0, colorClass: "" };

const loadingMsgs = [
    "ACCESSING LIQUIDITY...", 
    "CALCULATING LOG-REG...", 
    "MAPPING CYCLES...", 
    "GENERATING STRATEGY..."
];

// 1. Zameriavač (Prispôsobený pre 0.72rem / 11.5px)
const crosshairPlugin = {
  id: 'crosshair',
  afterDraw: chart => {
    const activeElements = chart.getActiveElements();
    if (activeElements.length > 0) {
      let activePoint = activeElements[0];
      let x = activePoint.element.x;
      let yAxis = chart.scales.y;
      let xAxis = chart.scales.x;
      let ctx = chart.ctx;
      
      ctx.save();
      
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();

      let xLabel = chart.data.labels[activePoint.index];
      if (xLabel) {
          ctx.fillStyle = '#171717'; 
          ctx.font = 'bold 11.5px sans-serif'; 
          let textWidth = ctx.measureText(xLabel).width;
          let boxY = yAxis.bottom + 4; // Pod osou, nadväzuje bez hluchého miesta vďaka odstránenému marginu
          let boxX = x - (textWidth + 16)/2;
          
          if (boxX < xAxis.left) boxX = xAxis.left;
          if (boxX + textWidth + 16 > xAxis.right) boxX = xAxis.right - textWidth - 16;
          
          ctx.fillRect(boxX, boxY, textWidth + 16, 20);
          ctx.strokeStyle = '#525252'; ctx.strokeRect(boxX, boxY, textWidth + 16, 20);
          ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(xLabel, boxX + (textWidth + 16)/2, boxY + 10);
      }

      let val = activePoint.element.$context.parsed.y;
      let scoreDiv = document.getElementById('dynamic-score');
      let titleDiv = document.getElementById('dynamic-title');
      
      if (scoreDiv) {
          let scoreHex = val <= 20 ? "#22c55e" : (val >= 75 ? "#ef4444" : "#F7931A");
          scoreDiv.innerText = val.toFixed(1) + '%';
          scoreDiv.style.color = scoreHex;
          if (titleDiv) titleDiv.style.color = scoreHex;
      }

      ctx.restore();
    }
  }
};

// 2. Efekty: Gulička na konci
const visualsPlugin = {
    id: 'visualsPlugin',
    afterDatasetsDraw: chart => {
        const ctx = chart.ctx;
        const meta = chart.getDatasetMeta(0);
        if (!meta.data || meta.data.length === 0) return;
        
        const lastPoint = meta.data[meta.data.length - 1];
        const val = chart.data.datasets[0].data[chart.data.datasets[0].data.length - 1];
        let dotColor = val <= 20 ? '#22c55e' : (val >= 75 ? '#ef4444' : '#F7931A');
        
        ctx.save();
        ctx.beginPath();
        ctx.arc(lastPoint.x, lastPoint.y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = dotColor;
        ctx.fill();
        ctx.restore();
    }
};

Chart.register(crosshairPlugin, visualsPlugin);

function hideTooltips() {
    if (scoreChartInstance) { 
        scoreChartInstance.setActiveElements([]); 
        scoreChartInstance.update(); 
        let scoreDiv = document.getElementById('dynamic-score');
        let titleDiv = document.getElementById('dynamic-title');
        
        if (scoreDiv && window.currentScoreData) {
            scoreDiv.innerText = window.currentScoreData.score + '%';
            scoreDiv.style.color = window.currentScoreData.rawColor;
            if (titleDiv) titleDiv.style.color = window.currentScoreData.rawColor;
        }
    }
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

async function analyze() {
  const spinner = document.getElementById("spinner");
  const loadingText = document.getElementById("loading-text");
  const output = document.getElementById("output");
  const errorBox = document.getElementById("error-box");
  const footer = document.getElementById("footer");

  let msgIndex = 0;
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= loadingMsgs.length) msgIndex = 0;
      loadingText.innerText = loadingMsgs[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"}
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const sign = data.change > 0 ? "+" : "";
    const colorClass = data.change > 0 ? "text-[#22c55e]" : (data.change < 0 ? "text-red-500" : "text-neutral-500");
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const score = data.cycle_score || 0;
    
    let scoreHex = score <= 20 ? "#22c55e" : (score >= 75 ? "#ef4444" : "#F7931A");

    let dashboardStyle = "bg-neutral-900 border-neutral-800"; 
    if (score <= 20) dashboardStyle = "bg-[#030a05] border border-[#22c55e]/30"; 
    else if (score >= 75) dashboardStyle = "bg-[#ef4444]/5 border border-[#ef4444]/30"; 
    else dashboardStyle = "bg-[#F7931A]/5 border border-[#F7931A]/30"; 
    
    let phaseBadgeColor = "text-white border border-white/20"; 
    if (score <= 20) phaseBadgeColor = "bg-[#030a05] text-[#22c55e] border border-[#22c55e]/50"; 
    else if (score >= 75) phaseBadgeColor = "bg-[#ef4444]/10 text-[#ef4444] border border-[#ef4444]/50"; 
    else phaseBadgeColor = "bg-[#F7931A]/10 text-[#F7931A] border border-[#F7931A]/50"; 

    window.currentScoreData = { score: score, rawColor: scoreHex };

    let formattedContent = data.analysis
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/\n/g, '<br>');

    let boxStyle = "bg-neutral-900 border-neutral-800";
    let titleStyle = "text-white"; 
    if (score <= 20) {
        boxStyle = "bg-[#030a05] border border-[#22c55e]/40"; titleStyle = "text-[#22c55e]";
    } else if (score >= 75) {
        boxStyle = "bg-[#ef4444]/5 border border-[#ef4444]/40"; titleStyle = "text-[#ef4444]";
    } else {
        boxStyle = "bg-[#F7931A]/5 border border-[#F7931A]/40"; titleStyle = "text-[#F7931A]";
    }

    let finalHTML = `
      <div class="relative w-full">
          <div class="flex justify-between items-center px-1 mb-2 text-[0.72rem] font-bold uppercase tracking-widest">
              <div id="dynamic-title" style="color: ${scoreHex}" class="transition-colors duration-150">CYCLE SCORE</div>
              <div id="dynamic-score" style="color: ${scoreHex}" class="transition-colors duration-150">${score}%</div>
          </div>
          <div class="h-44 w-full relative">
              <canvas id="scoreChart"></canvas>
          </div>
      </div>

      <div class="p-6 rounded-3xl ${dashboardStyle}">
          
        <div class="flex justify-between items-center mb-6 text-[0.72rem] font-bold uppercase tracking-widest">
            <div class="text-neutral-500">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} px-3 py-1.5 rounded-md">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-start mb-8 gap-4">
            <div>
                <div class="text-[2.16rem] leading-none font-bold tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-[0.72rem] font-bold uppercase tracking-widest mt-2 flex items-center gap-1.5">
                    ${sign}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded">24H</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[2.16rem] leading-none font-bold" style="color: ${scoreHex}">${score}%</div>
                <div class="text-[0.72rem] text-neutral-500 font-bold uppercase tracking-widest mt-2">SCORE</div>
            </div>
        </div>
        
        <div>
            <div class="w-full bg-neutral-800 h-1.5 rounded-full overflow-hidden mb-5">
                <div class="h-full transition-all duration-1000 ease-out" style="width: ${score}%; background-color: ${scoreHex}"></div>
            </div>
            <div class="flex flex-col gap-3 text-[0.72rem] text-neutral-400 font-bold uppercase tracking-widest px-1">
                <div class="flex items-center gap-2.5"><div class="w-2 h-2 rounded-full bg-[#22c55e] shrink-0"></div><span class="text-white">0% - 20%</span> &bull; VALUE ZONE (DCA IN)</div>
                <div class="flex items-center gap-2.5"><div class="w-2 h-2 rounded-full bg-[#F7931A] shrink-0"></div><span class="text-white">21% - 74%</span> &bull; NEUTRAL ZONE (HODL)</div>
                <div class="flex items-center gap-2.5"><div class="w-2 h-2 rounded-full bg-[#ef4444] shrink-0"></div><span class="text-white">75% - 100%</span> &bull; EXIT ZONE (DCA OUT)</div>
            </div>
        </div>
      </div>

      <div class="p-6 rounded-3xl border transition-all duration-500 ${boxStyle}">
        <h2 class="${titleStyle} text-[0.72rem] font-bold mb-4 uppercase tracking-widest">VERDICT & STRATEGY</h2>
        <div class="space-y-3 text-[0.72rem] leading-loose text-neutral-300">${formattedContent}</div>
      </div>
    `;

    output.innerHTML = finalHTML;
    output.classList.remove("hidden");
    footer.classList.remove("hidden");
    
    const limit = -143;
    const chartDates = data.chart_dates.slice(limit);
    const chartScore = data.chart_score.slice(limit);

    if (chartDates.length > 0 && chartScore.length > 0) {
        Chart.defaults.color = '#525252'; 
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.font.size = 11.5; // Zjednotené pre Chart.js na cca 0.72rem
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            // Zachovaný priestor iba na dátum
            layout: { padding: { left: 0, right: 0, top: 5, bottom: 28 } },
            interaction: { mode: 'index', intersect: false }
        };

        const xAxisConfig = { display: true, grid: { display: false, drawBorder: false }, ticks: { display: false } };

        let ctxScore = document.getElementById('scoreChart').getContext('2d');

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(ctxScore, {
            type: 'line',
            data: {
                labels: chartDates,
                datasets: [{ 
                    data: chartScore, 
                    fill: false,
                    borderWidth: 0.75, 
                    tension: 0.6, 
                    pointRadius: 0,
                    borderColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return;
                        const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                        gradient.addColorStop(0, '#22c55e'); 
                        gradient.addColorStop(0.20, '#22c55e'); 
                        gradient.addColorStop(0.40, '#F7931A'); 
                        gradient.addColorStop(0.70, '#F7931A'); 
                        gradient.addColorStop(0.85, '#ef4444'); 
                        gradient.addColorStop(1, '#ef4444');    
                        return gradient;
                    }
                }]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', min: 0, max: 100, 
                        grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false, tickLength: 0 }, 
                        ticks: { display: false } 
                    } 
                } 
            }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = "❌ CONNECTION ERROR. PLEASE REFRESH THE PAGE.";
    errorBox.classList.remove("hidden");
  }
}

window.addEventListener('DOMContentLoaded', analyze);
</script>
</body>
</html>
