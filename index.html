<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crypto Trading Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0a0c',
                            card: '#121216',
                            border: '#2a2a35',
                            accent: '#00ffcc',
                            danger: '#ff2a6d',
                            success: '#05d590'
                        }
                    },
                    fontFamily: {
                        mono: ['"Fira Code"', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0c; color: #e2e8f0; }
        .terminal-log { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121216; }
        ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f50; }
        .glass-panel { background: rgba(18, 18, 22, 0.7); backdrop-filter: blur(10px); border: 1px solid #2a2a35; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="glass-panel h-16 flex items-center justify-between px-6 shrink-0 z-10 relative">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-cyber-accent animate-pulse"></div>
                <h1 class="text-xl font-semibold tracking-tight text-white">AI<span class="text-cyber-accent">TERMINAL</span></h1>
            </div>
            <div class="h-6 w-px bg-cyber-border mx-2"></div>
            <div class="flex gap-3 text-xs font-mono">
                <span class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-cyber-success"></div>EXCHANGE</span>
                <span class="flex items-center gap-1" id="wallet-status"><div class="w-2 h-2 rounded-full bg-cyber-danger"></div>WALLET</span>
                <span class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-cyber-success"></div>GEMINI AI</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="px-3 py-1.5 rounded bg-cyber-card border border-cyber-border text-xs font-mono text-cyber-accent flex items-center gap-2">
                <span id="mode-indicator" class="uppercase">PAPER TRADING</span>
            </div>
            
            <button id="btn-start" onclick="startBot()" class="px-4 py-2 bg-cyber-accent text-black font-semibold rounded text-sm hover:bg-teal-400 transition-colors">START BOT</button>
            <button id="btn-stop" onclick="stopBot()" class="px-4 py-2 bg-cyber-card border border-cyber-danger text-cyber-danger font-semibold rounded text-sm hover:bg-cyber-danger/10 transition-colors hidden">STOP BOT</button>
            <button class="px-4 py-2 bg-cyber-card border border-cyber-border text-white rounded text-sm hover:bg-white/5 transition-colors">Connect Wallet</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex gap-4 p-4 overflow-hidden relative z-0">
        
        <!-- Left Column: Chart & Positions -->
        <div class="flex-1 flex flex-col gap-4 min-w-0">
            
            <!-- KPI Cards -->
            <div class="grid grid-cols-4 gap-4 shrink-0">
                <div class="glass-panel rounded-xl p-4 flex flex-col justify-center">
                    <span class="text-xs text-gray-400 uppercase tracking-wider mb-1 font-semibold">Total Balance</span>
                    <div class="text-2xl font-bold text-white font-mono" id="kpi-balance">$0.00</div>
                </div>
                <div class="glass-panel rounded-xl p-4 flex flex-col justify-center">
                    <span class="text-xs text-gray-400 uppercase tracking-wider mb-1 font-semibold">Open P&L</span>
                    <div class="text-2xl font-bold font-mono text-cyber-success" id="kpi-pnl">$0.00</div>
                </div>
                <div class="glass-panel rounded-xl p-4 flex flex-col justify-center">
                    <span class="text-xs text-gray-400 uppercase tracking-wider mb-1 font-semibold">Total P&L</span>
                    <div class="text-2xl font-bold text-white font-mono" id="kpi-total-pnl">$0.00</div>
                </div>
                <div class="glass-panel rounded-xl p-4 flex flex-col justify-center">
                    <span class="text-xs text-gray-400 uppercase tracking-wider mb-1 font-semibold">Active Positions</span>
                    <div class="text-2xl font-bold text-white font-mono" id="kpi-positions">0</div>
                </div>
            </div>

            <!-- Chart Area -->
            <div class="glass-panel rounded-xl flex-1 flex flex-col min-h-0 relative">
                <div class="p-4 border-b border-cyber-border flex justify-between items-center shrink-0">
                    <h2 class="text-sm font-semibold text-white">BTC/USDT <span class="text-xs text-gray-400 font-mono ml-2">1M Timeframe</span></h2>
                    <div class="text-lg font-mono font-bold text-white" id="current-price">Loading...</div>
                </div>
                <div id="chart-container" class="flex-1 w-full relative"></div>
            </div>

            <!-- Positions Table -->
            <div class="glass-panel rounded-xl h-48 shrink-0 flex flex-col overflow-hidden">
                <div class="p-3 border-b border-cyber-border flex justify-between items-center bg-cyber-card/50">
                    <h2 class="text-sm font-semibold text-white">Active Positions</h2>
                    <button onclick="closeAll()" class="text-xs text-cyber-danger hover:underline">Close All</button>
                </div>
                <div class="flex-1 overflow-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="text-gray-400 font-mono sticky top-0 bg-cyber-card border-b border-cyber-border">
                            <tr>
                                <th class="p-3">Pair</th>
                                <th class="p-3">Type</th>
                                <th class="p-3">Entry</th>
                                <th class="p-3">Size</th>
                                <th class="p-3">P&L</th>
                                <th class="p-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="positions-tbody" class="font-mono divide-y divide-cyber-border/50">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Column: AI Terminal Log -->
        <div class="w-96 flex flex-col shrink-0">
            <div class="glass-panel rounded-xl flex-1 flex flex-col overflow-hidden border-t-2 border-t-cyber-accent">
                <div class="p-3 border-b border-cyber-border bg-[#050505] flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-cyber-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M4 17h16a2 2 0 002-2V5a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <h2 class="text-sm font-semibold text-white font-mono tracking-wider">AI-CORE TERMINAL</h2>
                    </div>
                    <div class="flex gap-1.5">
                        <div class="w-2.5 h-2.5 rounded-full bg-cyber-border"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-cyber-border"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-cyber-accent animate-pulse"></div>
                    </div>
                </div>
                <div id="ai-logs" class="flex-1 p-4 overflow-y-auto bg-[#000000] text-gray-300 text-[11px] leading-relaxed terminal-log space-y-1">
                    <div class="text-gray-500">Initializing Gemini Trading Protocol...</div>
                    <div class="text-gray-500">Waiting for connection...</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Chart Initialization
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { color: 'transparent' }, textColor: '#A3A3A3', fontFamily: 'Inter' },
            grid: { vertLines: { color: 'rgba(42, 42, 53, 0.5)' }, horzLines: { color: 'rgba(42, 42, 53, 0.5)' } },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2a35' },
            rightPriceScale: { borderColor: '#2a2a35' },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
        });

        const lineSeries = chart.addLineSeries({
            color: '#00ffcc',
            lineWidth: 2,
            crosshairMarkerRadius: 4,
        });

        new ResizeObserver(() => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        }).observe(chartContainer);

        // WebSocket & App Logic
        let ws;
        
        // Use relative path matching FastAPI setup
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
            
        function connectWS() {
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                appendLog("WebSocket connection established.", "text-cyber-success");
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.type === 'log') {
                    appendLog(msg.data);
                } else if (msg.type === 'init') {
                    updateStatusUI(msg.data.is_running);
                    document.getElementById('mode-indicator').innerText = msg.data.mode + ' TRADING';
                } else if (msg.type === 'state') {
                    updateDashboard(msg.data);
                }
            };
            
            ws.onclose = () => {
                appendLog("WebSocket connection lost. Reconnecting...", "text-cyber-danger");
                setTimeout(connectWS, 3000);
            };
        }

        function appendLog(text, colorClass = "") {
            const logs = document.getElementById('ai-logs');
            const div = document.createElement('div');
            
            let formattedText = text;
            if (text.includes("BUY")) formattedText = text.replace("BUY", "<span class='text-cyber-success font-bold'>BUY</span>");
            if (text.includes("SELL")) formattedText = text.replace("SELL", "<span class='text-cyber-danger font-bold'>SELL</span>");
            
            div.innerHTML = `<span class="${colorClass}">${formattedText}</span>`;
            logs.appendChild(div);
            
            if (logs.children.length > 200) logs.removeChild(logs.firstChild);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateDashboard(data) {
            document.getElementById('kpi-balance').innerText = '$' + data.total_balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits:2});
            document.getElementById('kpi-total-pnl').innerText = '$' + data.total_pnl.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits:2});
            document.getElementById('kpi-positions').innerText = data.open_positions;
            document.getElementById('current-price').innerText = '$' + data.price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits:2});
            
            const pnlEl = document.getElementById('kpi-pnl');
            pnlEl.innerText = '$' + data.open_pnl.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits:2});
            pnlEl.className = `text-2xl font-bold font-mono ${data.open_pnl >= 0 ? 'text-cyber-success' : 'text-cyber-danger'}`;

            const totalPnlEl = document.getElementById('kpi-total-pnl');
            totalPnlEl.className = `text-2xl font-bold font-mono ${data.total_pnl >= 0 ? 'text-cyber-success' : 'text-cyber-danger'}`;

            if (data.chart_data && data.chart_data.length > 0) {
                const formatted = data.chart_data.map(d => ({
                    time: d.timestamp / 1000,
                    value: d.close
                }));
                lineSeries.setData(formatted);
            } else {
                lineSeries.update({
                    time: Math.floor(Date.now() / 1000),
                    value: data.price
                });
            }

            const tbody = document.getElementById('positions-tbody');
            tbody.innerHTML = '';
            
            if (data.positions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">No active positions</td></tr>';
            } else {
                data.positions.forEach(p => {
                    const pnlClass = p.current_pnl >= 0 ? 'text-cyber-success' : 'text-cyber-danger';
                    const pnlText = (p.current_pnl >= 0 ? '+' : '') + '$' + p.current_pnl.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits:2});
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-cyber-card transition-colors';
                    tr.innerHTML = `
                        <td class="p-3 text-white">${p.pair}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded bg-cyber-success/10 text-cyber-success">${p.type}</span></td>
                        <td class="p-3 text-gray-300">$${p.entry_price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits:2})}</td>
                        <td class="p-3 text-gray-300">$${p.cost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits:2})}</td>
                        <td class="p-3 font-bold ${pnlClass}">${pnlText}</td>
                        <td class="p-3 text-right">
                            <button onclick="closeAll()" class="text-xs px-2 py-1 border border-cyber-danger text-cyber-danger hover:bg-cyber-danger/20 rounded transition-colors">Close</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function updateStatusUI(isRunning) {
            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');
            if (isRunning) {
                btnStart.classList.add('hidden');
                btnStop.classList.remove('hidden');
            } else {
                btnStart.classList.remove('hidden');
                btnStop.classList.add('hidden');
            }
        }

        async function startBot() {
            try {
                const res = await fetch('/bot/start', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'started' || data.status === 'already running') {
                    updateStatusUI(true);
                }
            } catch (e) {
                appendLog("Failed to start bot: " + e.message, "text-cyber-danger");
            }
        }

        async function stopBot() {
            try {
                const res = await fetch('/bot/stop', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'stopped') {
                    updateStatusUI(false);
                }
            } catch (e) {
                appendLog("Failed to stop bot: " + e.message, "text-cyber-danger");
            }
        }

        async function closeAll() {
            try {
                await fetch('/bot/close_all', { method: 'POST' });
                appendLog("Requesting close all positions...", "text-yellow-400");
            } catch (e) {
                appendLog("Failed to close positions: " + e.message, "text-cyber-danger");
            }
        }

        connectWS();
        fetch('/bot/status').then(r=>r.json()).then(d => {
            updateStatusUI(d.is_running);
            document.getElementById('mode-indicator').innerText = d.mode + ' TRADING';
        }).catch(e => console.warn('Could not fetch initial status.'));
    </script>
</body>
</html>
