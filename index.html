<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>martinvojtus • space</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { black: '#000000', white: '#ffffff' }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer components {
            .btn-dark { @apply flex items-center justify-center h-12 px-6 rounded-full font-bold text-xs uppercase tracking-widest bg-black text-white hover:bg-neutral-800 transition-colors disabled:opacity-50 cursor-pointer whitespace-nowrap; }
            .btn-light { @apply flex items-center justify-center h-12 px-6 rounded-full font-bold text-xs uppercase tracking-widest bg-transparent text-black border border-neutral-200 hover:bg-neutral-50 transition-colors disabled:opacity-50 cursor-pointer whitespace-nowrap; }
            .btn-danger { @apply flex items-center justify-center h-12 px-6 rounded-full font-bold text-xs uppercase tracking-widest bg-red-600 text-white hover:bg-red-700 transition-colors disabled:opacity-50 cursor-pointer whitespace-nowrap; }
            
            .input { @apply w-full px-4 py-3 bg-neutral-50 border border-neutral-200 text-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black transition-colors; }
            .label { @apply text-xs font-bold text-black uppercase tracking-widest block mb-2; }
            .hint { @apply text-xs text-neutral-400 mb-3 block leading-relaxed; }
            
            .card { @apply flex flex-col gap-6 bg-white border border-gray-200 rounded-2xl p-6 md:p-8 w-full; }
            .editorial-dropcap > div:first-child::first-letter { @apply text-7xl font-bold float-left mr-4 leading-[0.8] mt-2; }

            /* Fixed rounded corners on mobile */
            .img-container { @apply relative overflow-hidden rounded-[1.5rem] bg-neutral-50 border border-neutral-100; -webkit-mask-image: -webkit-radial-gradient(white, black); }
        }

        html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        body { background-color: #ffffff; color: #000000; overflow-x: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #000; border-radius: 50%; width: 1.5rem; height: 1.5rem; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col selection:bg-black selection:text-white">

    <div id="app-root" class="flex flex-col min-h-screen w-full"></div>
    <div id="modal-root" class="fixed inset-0 bg-white/95 backdrop-blur-sm z-[9999] hidden flex-col justify-center items-center px-4 transition-opacity"></div>

    <script>
        const API_URL = "https://mv-backend-ak8l.onrender.com";
        
        const DEFAULT_CONFIG = {
            siteTitle: "martinvojtus • space",
            footerText: "build v1.4.2 • 2026",
            pages: [
                { id: "grid", title: "Gallery", type: "gallery" },
                { id: "about", title: "About", type: "profile" },
                { id: "contact", title: "Contact", type: "contact" }
            ]
        };

        const App = {
            token: localStorage.getItem('mv_admin_key') || "",
            posts: [],
            config: JSON.parse(JSON.stringify(DEFAULT_CONFIG)),
            configPostId: null,
            route: "grid",
            dashTab: "settings",
            isMenuOpen: false,
            isLoading: true
        };

        let dragStartIndex = null;

        async function init() {
            App.isLoading = true; render();
            try {
                const headers = App.token ? { 'x-admin-password': App.token } : {};
                const res = await fetch(`${API_URL}/posts?skip=0&limit=1000`, { headers });
                App.posts = await res.json();
                const configPost = App.posts.find(p => p.author === "_system_config");
                if (configPost) {
                    App.configPostId = configPost.id;
                    try { App.config = JSON.parse(configPost.text); } catch(e) {}
                }
                document.title = App.config.siteTitle;
                if (App.config.pages.length > 0 && !App.config.pages.find(p => p.id === App.route) && App.route !== 'dashboard') {
                    App.route = App.config.pages[0].id;
                }
                if (App.token) {
                    const authRes = await fetch(`${API_URL}/verify`, { headers: { 'x-admin-password': App.token } });
                    if (!authRes.ok) throw new Error();
                }
            } catch (e) { App.token = ""; localStorage.removeItem('mv_admin_key'); }
            App.isLoading = false; render();
        }

        function render() {
            const root = document.getElementById('app-root');
            root.innerHTML = `
                ${renderHeader()}
                ${App.isMenuOpen ? renderMobileMenu() : ''}
                <main class="w-full max-w-5xl mx-auto pt-28 pb-12 px-6 flex flex-col flex-grow items-center">
                    ${App.isLoading ? `<div class="mt-32"><div class="spinner"></div></div>` : renderMainContent()}
                </main>
                ${renderFooter()}
            `;
        }

        function renderHeader() {
            const icon = App.isMenuOpen 
                ? `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>`
                : `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>`;

            let desktopLinks = App.config.pages.map(p => `<button onclick="navigate('${p.id}')" class="text-sm font-semibold tracking-wide transition-colors ${App.route === p.id ? 'text-black' : 'text-neutral-400 hover:text-black'}">${p.title}</button>`).join('');
            desktopLinks += `<div class="w-px h-4 bg-neutral-200 mx-2"></div>`;
            
            if (App.token) {
                desktopLinks += `<button onclick="navigate('dashboard')" class="text-sm font-bold transition-colors ${App.route === 'dashboard' ? 'text-black' : 'text-neutral-400 hover:text-black'}">Dashboard</button>`;
                desktopLinks += `<button onclick="logout()" class="text-sm font-bold text-red-500 hover:text-red-700 transition-colors ml-2">Logout</button>`;
            } else {
                desktopLinks += `<button onclick="openLoginModal()" class="text-sm font-bold text-neutral-400 hover:text-black transition-colors">Login</button>`;
            }

            return `
            <header class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur-md border-b border-neutral-100 z-50">
                <div class="max-w-5xl mx-auto px-6 py-5 flex justify-between items-center w-full">
                    <div class="flex items-center gap-3 cursor-pointer group" onclick="navigate('${App.config.pages[0]?.id || ''}')">
                        <svg class="w-4 h-4 text-black group-hover:opacity-70 transition-opacity" viewBox="72.35 270 935.31 810"><g transform="translate(540, 540)"><path fill="currentColor" d="M 0,0 L 467.654, -270 L 467.654, 270 L 0, 540 L -467.654, 270 L -467.654, -270 Z"/></g></svg>
                        <div class="font-bold text-sm tracking-widest lowercase">${App.config.siteTitle}</div>
                    </div>
                    <button class="md:hidden text-black p-1" onclick="toggleMenu()">${icon}</button>
                    <nav class="hidden md:flex items-center gap-6">${desktopLinks}</nav>
                </div>
            </header>
            `;
        }

        function renderMobileMenu() {
            let links = App.config.pages.map(p => `<button onclick="navigate('${p.id}')" class="text-4xl font-bold text-left tracking-tight ${App.route === p.id ? 'text-black' : 'text-neutral-300'}">${p.title}</button>`).join('');
            links += `<div class="w-full h-px bg-neutral-100 my-6"></div>`;
            if (App.token) {
                links += `<button onclick="navigate('dashboard')" class="text-2xl font-bold text-left tracking-tight ${App.route === 'dashboard' ? 'text-black' : 'text-neutral-400'}">Dashboard</button>`;
                links += `<button onclick="logout()" class="text-2xl font-bold text-left tracking-tight text-red-500 mt-4">Logout</button>`;
            } else {
                links += `<button onclick="openLoginModal()" class="text-xl font-bold text-left text-neutral-400 hover:text-black">Admin Login</button>`;
            }
            return `<div class="fixed inset-0 bg-white z-40 flex flex-col px-8 pt-32 pb-12 overflow-y-auto"><div class="flex flex-col gap-6 w-full max-w-4xl mx-auto">${links}</div></div>`;
        }

        function renderFooter() {
            return `<footer class="w-full mt-32 mb-12 flex flex-col items-center gap-6"><div class="w-12 h-px bg-neutral-200"></div><div class="text-[10px] font-bold text-neutral-400 tracking-widest uppercase text-center">${App.config.footerText}</div></footer>`;
        }

        function renderMainContent() {
            if (App.route === 'dashboard') { if (!App.token) { navigate(App.config.pages[0]?.id); return ''; } return renderDashboard(); }
            const pageConfig = App.config.pages.find(p => p.id === App.route);
            if (!pageConfig) return `<div class="text-neutral-400 mt-20 text-sm font-bold tracking-widest uppercase text-center">Select a page</div>`;
            if (pageConfig.type === 'gallery') return renderPublicGallery(pageConfig);
            if (pageConfig.type === 'profile') return renderPublicProfile(pageConfig);
            if (pageConfig.type === 'contact') return renderPublicContact(pageConfig);
            if (pageConfig.type === 'article') return renderPublicArticle(pageConfig);
            if (pageConfig.type === 'links') return renderPublicLinks(pageConfig);
            return `<div>Unknown page.</div>`;
        }

        // --- PUBLIC ---
        function renderPublicGallery(page) {
            const posts = App.posts.filter(p => p.author === page.id).sort((a,b) => new Date(b.at) - new Date(a.at));
            if (posts.length === 0) return `<div class="w-full py-32 text-center text-neutral-300 font-bold text-sm uppercase">Empty Gallery.</div>`;
            
            // Fix: Manual Column separation to prevent offset issues
            let col1 = [], col2 = [], col3 = [];
            posts.forEach((p, i) => {
                if (window.innerWidth < 640) col1.push(p);
                else if (window.innerWidth < 1024) { if(i%2===0) col1.push(p); else col2.push(p); }
                else { if(i%3===0) col1.push(p); else if(i%3===1) col2.push(p); else col3.push(p); }
            });

            const renderCol = (arr) => arr.map(p => `
                <div class="img-container mb-6 group cursor-pointer">
                    <img src="${p.image_url}" class="w-full h-auto grayscale group-hover:grayscale-0 transition-all duration-500 hover:scale-[1.03]" loading="lazy">
                    <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-[10px] font-bold text-black uppercase opacity-0 group-hover:opacity-100 transition-opacity">
                        ${new Date(p.at).toLocaleDateString('en-US', {month:'short', year:'numeric'})}
                    </div>
                </div>`).join('');

            return `<div class="flex flex-row gap-6 w-full items-start animate-fade-in">
                <div class="flex flex-col flex-1">${renderCol(col1)}</div>
                ${col2.length ? `<div class="flex flex-col flex-1">${renderCol(col2)}</div>` : ''}
                ${col3.length ? `<div class="flex flex-col flex-1">${renderCol(col3)}</div>` : ''}
            </div>`;
        }

        function renderPublicProfile(page) {
            const post = App.posts.find(p => p.author === page.id);
            let data = { intro: '', text: '', exps: [] }; try { data = JSON.parse(post?.text || "{}"); } catch(e) {}
            let expsHtml = (data.exps || []).map((e) => `<div class="flex flex-col items-start w-full leading-relaxed"><div class="text-xl font-bold mb-1">${e.title}</div><div class="text-neutral-500 mb-2">${e.company}</div><div class="text-xs font-bold text-neutral-400 uppercase mb-8">${e.date}</div></div>`).join('');
            return `<div class="flex flex-col lg:flex-row gap-12 lg:gap-24 w-full animate-fade-in items-start mt-8"><div class="w-full lg:w-1/3 flex flex-col lg:sticky lg:top-32 h-fit">${post?.image_url ? `<img src="${post.image_url}" class="w-48 lg:w-full aspect-square rounded-full lg:rounded-3xl object-cover grayscale mb-8 border border-neutral-100">` : ''}<h1 class="text-4xl lg:text-5xl font-bold tracking-tight mb-4">${page.title}</h1>${data.intro ? `<p class="text-lg text-neutral-500 leading-relaxed font-medium">${data.intro}</p>` : ''}</div><div class="w-full lg:w-2/3 flex flex-col pt-2">${data.text ? `<div><div class="text-xs font-bold text-neutral-400 uppercase mb-6">About</div><div class="text-lg leading-relaxed text-black whitespace-pre-wrap">${data.text}</div></div>` : ''}${expsHtml ? `<div class="text-xs font-bold text-neutral-400 uppercase mb-8 mt-16">Experience</div>${expsHtml}` : ''}</div></div>`;
        }

        function renderPublicContact(page) {
            const post = App.posts.find(p => p.author === page.id);
            return `<div class="flex flex-col md:flex-row w-full gap-12 items-center md:items-start min-h-[50vh] mt-12 animate-fade-in"><div class="w-full md:w-1/2 flex items-center md:pt-10">${post?.title ? `<h1 class="text-6xl lg:text-8xl font-bold tracking-tighter leading-none">${post.title}</h1>` : '<h1 class="text-6xl font-bold text-neutral-300">Hello.</h1>'}</div><div class="w-full md:w-1/2 flex flex-col gap-8 md:pt-12">${post?.image_url ? `<div class="w-24 h-24 img-container"><img src="${post.image_url}" class="w-full h-full object-cover grayscale"></div>` : ''}${post?.text ? `<div class="text-xl lg:text-2xl text-neutral-500 leading-relaxed whitespace-pre-wrap">${post.text}</div>` : ''}</div></div>`;
        }

        function renderPublicArticle(page) {
            const post = App.posts.find(p => p.author === page.id);
            return `<article class="flex flex-col w-full max-w-2xl mx-auto animate-fade-in mt-8">${post?.title ? `<h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-10 leading-tight">${post.title}</h1>` : ''}${post?.image_url ? `<div class="img-container mb-12"><img src="${post.image_url}" class="w-full h-auto"></div>` : ''}${post?.text ? `<div class="editorial-dropcap text-lg md:text-xl leading-relaxed text-neutral-800 whitespace-pre-wrap"><div>${post.text}</div></div>` : ''}</article>`;
        }

        function renderPublicLinks(page) {
            const post = App.posts.find(p => p.author === page.id);
            let data = { desc: '', links: [] }; try { data = JSON.parse(post?.text || "{}"); } catch(e) {}
            let linksHtml = (data.links || []).map(l => `<a href="${l.url}" target="_blank" class="flex items-center justify-center w-full h-16 bg-neutral-50 hover:bg-black hover:text-white border border-neutral-200 rounded-full font-bold text-sm uppercase transition-all duration-300 px-6 text-center">${l.title}</a>`).join('');
            return `<div class="flex flex-col items-center w-full max-w-lg mx-auto animate-fade-in mt-12">${post?.image_url ? `<div class="w-32 h-32 img-container !rounded-full mb-6"><img src="${post.image_url}" class="w-full h-full object-cover"></div>` : ''}${post?.title ? `<div class="text-2xl font-bold mb-2">${post.title}</div>` : ''}${data.desc ? `<p class="text-base text-neutral-500 mb-10 text-center">${data.desc}</p>` : ''}<div class="flex flex-col gap-4 w-full">${linksHtml}</div></div>`;
        }

        // --- DASHBOARD ---
        function navigate(id) { if(!id) return; App.route = id; App.isMenuOpen = false; render(); window.scrollTo(0,0); }
        function toggleMenu(e) { if(e) e.stopPropagation(); App.isMenuOpen = !App.isMenuOpen; render(); }
        function closeMenu() { App.isMenuOpen = false; render(); }

        async function handleLogin(e) {
            e.preventDefault(); const pass = document.getElementById('admin-pass').value;
            try {
                const res = await fetch(`${API_URL}/verify`, { headers: { 'x-admin-password': pass } });
                if (res.ok) { App.token = pass; if(document.getElementById('remember-login').checked) localStorage.setItem('mv_admin_key', pass); closeModal(); await init(); navigate('dashboard'); }
                else throw new Error();
            } catch (err) { alert('Invalid password'); }
        }
        function logout() { App.token = ""; localStorage.removeItem('mv_admin_key'); init(); navigate(App.config.pages[0]?.id || 'grid'); }

        function renderDashboard() {
            let checkId = App.dashTab.startsWith('page_') ? App.dashTab.replace('page_', '') : null;
            if (App.dashTab !== 'settings' && (!checkId || !App.config.pages.find(p => p.id === checkId))) App.dashTab = 'settings';
            const tabs = [{ id: 'settings', label: 'Settings' }, ...App.config.pages.map(p => ({ id: `page_${p.id}`, label: p.title }))];
            const tabsHtml = tabs.map(t => `<button onclick="App.dashTab='${t.id}'; render();" class="h-10 px-4 rounded-full font-bold text-xs uppercase tracking-widest whitespace-nowrap transition-colors ${App.dashTab===t.id ? 'bg-black text-white' : 'bg-neutral-50 text-neutral-500 hover:bg-neutral-100 border border-neutral-200'}">${t.label}</button>`).join('');
            let content = App.dashTab==='settings' ? renderDashSettings() : renderActivePageEditor();
            return `<div class="w-full flex flex-col gap-8 animate-fade-in"><h1 class="text-3xl font-bold tracking-tight">Dashboard</h1><div class="flex gap-2 overflow-x-auto hide-scroll pb-2 w-full border-b border-neutral-100">${tabsHtml}</div><div class="w-full flex flex-col gap-8">${content}</div></div>`;
        }

        function renderActivePageEditor() {
            const pageId = App.dashTab.replace('page_', ''); const page = App.config.pages.find(p => p.id === pageId);
            if (!page) return '';
            if (page.type === 'gallery') return renderDashGallery(page);
            if (page.type === 'profile') return renderDashProfile(page);
            if (page.type === 'contact') return renderDashContact(page);
            if (page.type === 'article') return renderDashArticle(page);
            if (page.type === 'links') return renderDashLinks(page);
        }

        function renderDashSettings() {
            const list = App.config.pages.map((p, i) => `
                <div class="flex items-center justify-between p-4 bg-neutral-50 rounded-xl border border-neutral-200 select-none group"
                     draggable="true" ondragstart="handleDragStart(event, ${i})" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${i})" ondragend="handleDragEnd(event)">
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col gap-1">
                            <button onclick="movePageUp(${i})" class="text-neutral-300 hover:text-black leading-none text-[10px]">▲</button>
                            <button onclick="movePageDown(${i})" class="text-neutral-300 hover:text-black leading-none text-[10px]">▼</button>
                        </div>
                        <div class="flex flex-col"><span class="font-bold text-sm">${p.title}</span><span class="text-[10px] text-neutral-400 font-mono">/${p.id}</span></div>
                    </div>
                    <button onclick="removePage(${i})" class="text-red-300 hover:text-red-600 p-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                </div>`).join('');
            return `<div class="card"><div class="text-xl font-bold border-b pb-4">General</div><div><label class="label">Site Title</label><input type="text" id="cfg-title" class="input font-bold" value="${App.config.siteTitle}"></div><div><label class="label">Footer Text</label><input type="text" id="cfg-footer" class="input" value="${App.config.footerText}"></div><button onclick="saveGlobalConfig()" class="btn-dark w-full">Save Changes</button></div>
            <div class="card"><div class="text-xl font-bold border-b pb-4">Menu Structure</div><div class="flex flex-col gap-3">${list}</div><div class="flex flex-col md:flex-row gap-4 p-4 bg-neutral-50 rounded-xl border-dashed border-2 mt-4 items-end"><div class="flex flex-col gap-2 w-full"><label class="label !mb-0">Slug</label><input type="text" id="new-page-id" class="input !h-10 !py-0 font-mono" placeholder="e.g. bio"></div><div class="flex flex-col gap-2 w-full"><label class="label !mb-0">Title</label><input type="text" id="new-page-title" class="input !h-10 !py-0" placeholder="e.g. Bio"></div><div class="flex flex-col gap-2 w-full"><label class="label !mb-0">Type</label><select id="new-page-type" class="input !h-10 !py-0 !px-2 bg-white"><option value="gallery">Gallery</option><option value="profile">Profile</option><option value="contact">Contact</option><option value="article">Article</option><option value="links">Links</option></select></div><button onclick="addPage()" class="btn-dark w-full md:w-auto !h-10 px-6">+ Add</button></div></div>`;
        }

        function handleDragStart(e, i) { dragStartIndex = i; e.dataTransfer.effectAllowed = 'move'; e.currentTarget.classList.add('opacity-40'); }
        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
        function handleDrop(e, dropIndex) { e.stopPropagation(); if (dragStartIndex === null || dragStartIndex === dropIndex) return false; const item = App.config.pages.splice(dragStartIndex, 1)[0]; App.config.pages.splice(dropIndex, 0, item); saveGlobalConfig(); return false; }
        function handleDragEnd(e) { e.currentTarget.classList.remove('opacity-40'); dragStartIndex = null; }
        function movePageUp(i) { if(i>0) { const itm = App.config.pages.splice(i,1)[0]; App.config.pages.splice(i-1,0,itm); saveGlobalConfig(); } }
        function movePageDown(i) { if(i<App.config.pages.length-1) { const itm = App.config.pages.splice(i,1)[0]; App.config.pages.splice(i+1,0,itm); saveGlobalConfig(); } }

        function renderDashGallery(p) {
            const items = App.posts.filter(x => x.author === p.id).sort((a,b) => new Date(b.at) - new Date(a.at));
            const list = items.map(x => `<div class="flex items-center justify-between p-4 bg-neutral-50 rounded-xl border border-neutral-100"><img src="${x.image_url}" class="w-12 h-12 rounded bg-neutral-200 object-cover"><button onclick="confirmDelete(${x.id})" class="text-red-400 p-2 hover:text-red-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button></div>`).join('');
            return `<div class="card"><div class="text-xl font-bold border-b pb-4">Gallery: ${p.title}</div><input type="file" id="gal-upload" accept="image/*" class="hidden" onchange="uploadGenericImage('${p.id}', null, 'gallery')"><button onclick="document.getElementById('gal-upload').click()" class="h-14 rounded-xl border-dashed border-2 text-neutral-400 font-bold text-xs uppercase w-full">+ Upload Photo</button><div class="flex flex-col gap-3 mt-4">${list}</div></div>`;
        }

        function renderDashProfile(p) {
            const post = App.posts.find(x => x.author === p.id); let data = { intro: '', text: '', exps: [] }; try { data = JSON.parse(post.text); } catch(e){}
            return `<div class="card"><div class="text-xl font-bold border-b pb-4">Editor: ${p.title}</div><div><label class="label">1. Picture</label><input type="file" id="prf-img-upload" accept="image/*" class="hidden" onchange="uploadGenericImage('${p.id}', ${post?post.id:null}, 'profile')">${post && post.image_url ? `<div class="relative w-max group"><img src="${post.image_url}" class="w-32 h-32 object-cover rounded-full border cursor-pointer" onclick="document.getElementById('prf-img-upload').click()"><button type="button" onclick="removePageImage(${post.id})" class="absolute top-0 right-0 bg-white border rounded-full p-1.5 text-red-500 shadow-sm opacity-0 group-hover:opacity-100">X</button></div>` : `<button onclick="document.getElementById('prf-img-upload').click()" class="h-16 rounded-xl border-dashed border-2 text-neutral-400 font-bold text-xs w-full">+ Select Image</button>`}</div><div><label class="label">2. Tagline</label><textarea id="prf-intro" class="input" rows="2" oninput="autoResizeTextarea(this)">${data.intro || ''}</textarea></div><div><label class="label">3. Bio</label><textarea id="prf-text" class="input" rows="6" oninput="autoResizeTextarea(this)">${data.text || ''}</textarea></div><div><div class="flex justify-between items-center mb-2"><label class="label !mb-0">4. Timeline</label><button type="button" onclick="addExpRowToDOM()" class="btn-light !h-8 !px-3 !text-[10px]">+ Add</button></div><div id="prf-exp-container" class="flex flex-col gap-3">${(data.exps||[]).map(e => buildExpRowHtml(e.title, e.company, e.date)).join('')}</div></div><button onclick="saveProfileConfig('${p.id}', ${post?post.id:null}, '${post?.image_url || ''}')" class="btn-dark w-full mt-4">Save Changes</button></div>`;
        }

        function renderDashContact(p) {
            const post = App.posts.find(x => x.author === p.id);
            return `<div class="card"><div class="text-xl font-bold border-b pb-4">Editor: ${p.title}</div><div><label class="label">1. Image</label><input type="file" id="cnt-img-upload" accept="image/*" class="hidden" onchange="uploadGenericImage('${p.id}', ${post?post.id:null}, 'contact')">${post && post.image_url ? `<div class="relative w-max group"><img src="${post.image_url}" class="w-24 h-24 object-cover rounded-full border cursor-pointer" onclick="document.getElementById('cnt-img-upload').click()"><button type="button" onclick="removePageImage(${post.id})" class="absolute top-0 right-0 bg-white border rounded-full p-1.5 text-red-500 shadow-sm">X</button></div>` : `<button onclick="document.getElementById('cnt-img-upload').click()" class="h-16 rounded-xl border-dashed border-2 text-neutral-400 font-bold text-xs w-full">+ Select Image</button>`}</div><div><label class="label">2. Headline</label><input type="text" id="cnt-title" class="input font-bold" value="${post?post.title:''}"></div><div><label class="label">3. Details</label><textarea id="cnt-text" class="input" rows="6" oninput="autoResizeTextarea(this)">${post?post.text:''}</textarea></div><button onclick="saveContactConfig('${p.id}', ${post?post.id:null}, '${post?.image_url || ''}')" class="btn-dark w-full mt-4">Save Changes</button></div>`;
        }

        function renderDashArticle(p) {
            const post = App.posts.find(x => x.author === p.id);
            return `<div class="card"><div class="text-xl font-bold border-b pb-4">Editor: ${p.title}</div><div><label class="label">1. Cover</label><input type="file" id="art-img-upload" accept="image/*" class="hidden" onchange="uploadGenericImage('${p.id}', ${post?post.id:null}, 'article')">${post && post.image_url ? `<div class="relative w-full group"><img src="${post.image_url}" class="w-full h-48 object-cover rounded-xl border cursor-pointer" onclick="document.getElementById('art-img-upload').click()"><button type="button" onclick="removePageImage(${post.id})" class="absolute top-2 right-2 bg-white border rounded-full p-1.5 text-red-500">X</button></div>` : `<button onclick="document.getElementById('art-img-upload').click()" class="h-16 rounded-xl border-dashed border-2 text-neutral-400 font-bold text-xs w-full">+ Select Cover</button>`}</div><div><label class="label">2. Title</label><input type="text" id="art-title" class="input font-bold" value="${post?post.title:''}"></div><div><label class="label">3. Content</label><textarea id="art-text" class="input" rows="12" oninput="autoResizeTextarea(this)">${post?post.text:''}</textarea></div><button onclick="saveArticleConfig('${p.id}', ${post?post.id:null}, '${post?.image_url || ''}')" class="btn-dark w-full mt-4">Save Changes</button></div>`;
        }

        function renderDashLinks(p) {
            const post = App.posts.find(x => x.author === p.id); let data = { desc: '', links: [] }; try { data = JSON.parse(post.text); } catch(e){}
            return `<div class="card"><div class="text-xl font-bold border-b pb-4">Editor: ${p.title}</div><div><label class="label">1. Avatar</label><input type="file" id="lnk-img-upload" accept="image/*" class="hidden" onchange="uploadGenericImage('${p.id}', ${post?post.id:null}, 'links')">${post && post.image_url ? `<div class="relative w-max group"><img src="${post.image_url}" class="w-24 h-24 object-cover rounded-full border cursor-pointer" onclick="document.getElementById('lnk-img-upload').click()"><button type="button" onclick="removePageImage(${post.id})" class="absolute top-0 right-0 bg-white border rounded-full p-1.5 text-red-500 shadow-sm">X</button></div>` : `<button onclick="document.getElementById('lnk-img-upload').click()" class="h-16 rounded-xl border-dashed border-2 text-neutral-400 font-bold text-xs w-full">+ Select Avatar</button>`}</div><div><label class="label">2. Name</label><input type="text" id="lnk-title" class="input font-bold" value="${post?post.title:''}"></div><div><label class="label">3. Bio</label><textarea id="lnk-desc" class="input" rows="2" oninput="autoResizeTextarea(this)">${data.desc || ''}</textarea></div><div><div class="flex justify-between items-center mb-2"><label class="label !mb-0">4. Links</label><button type="button" onclick="addLinkRowToDOM()" class="btn-light !h-8 !px-3 !text-[10px]">+ Add</button></div><div id="lnk-exp-container" class="flex flex-col gap-3">${(data.links||[]).map(l => buildLinkRowHtml(l.title, l.url)).join('')}</div></div><button onclick="saveLinksConfig('${p.id}', ${post?post.id:null}, '${post?.image_url || ''}')" id="btn-save-lnk" class="btn-dark w-full mt-4">Save Changes</button></div>`;
        }

        // --- API HELPERS ---
        async function uploadGenericImage(slug, id, type) {
            let inId = type==='gallery'?'gal-upload':type==='profile'?'prf-img-upload':type==='contact'?'cnt-img-upload':type==='article'?'art-img-upload':'lnk-img-upload';
            const f = document.getElementById(inId).files[0]; if(!f) return;
            document.body.style.cursor='wait';
            try {
                const fd = new FormData(); fd.append("file", await compressImage(f));
                const img = (await (await fetch(`${API_URL}/upload-image`, { method: "POST", headers: { "x-admin-password": App.token }, body: fd })).json()).image_url;
                if(type === 'gallery') { await fetch(`${API_URL}/posts`, { method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": App.token }, body: JSON.stringify({ title: "", text: "", image_url: img, show_date: true, author: slug }) }); await init(); } 
                else if(type === 'profile') saveProfileConfig(slug, id, img); else if(type === 'contact') saveContactConfig(slug, id, img); else if(type === 'article') saveArticleConfig(slug, id, img); else if(type === 'links') saveLinksConfig(slug, id, img);
            } catch(e){} document.body.style.cursor='default';
        }

        async function removePageImage(pid) { if(!confirm('Delete image?')) return; const p = App.posts.find(x=>x.id===pid); if(p){ p.image_url=""; await fetch(`${API_URL}/posts/${pid}`,{method:"PUT",headers:{"Content-Type":"application/json","x-admin-password":App.token},body:JSON.stringify(p)}); await init(); } }

        async function savePageData(slug, id, payload, btnId) {
            const btn = document.getElementById(btnId); btn.innerText="SAVING..."; btn.disabled=true;
            const method = id ? "PUT" : "POST"; const url = id ? `${API_URL}/posts/${id}` : `${API_URL}/posts`;
            try { await fetch(url, { method, headers: { "Content-Type": "application/json", "x-admin-password": App.token }, body: JSON.stringify(payload) }); await init(); } catch(e){ btn.innerText="Error"; btn.disabled=false; }
        }

        function saveProfileConfig(s,id,img) { const ex = []; document.querySelectorAll('.exp-row-item').forEach(el=>{ ex.push({title:el.querySelector('.exp-t').value,company:el.querySelector('.exp-c').value,date:el.querySelector('.exp-d').value}); }); savePageData(s,id,{title:"",text:JSON.stringify({v:2,intro:document.getElementById('prf-intro').value,text:document.getElementById('prf-text').value,exps:ex}),image_url:img,show_date:false,author:s},'btn-save-prf'); }
        function saveContactConfig(s,id,img) { savePageData(s,id,{title:document.getElementById('cnt-title').value,text:document.getElementById('cnt-text').value,image_url:img,show_date:false,author:s},'btn-save-cnt'); }
        function saveArticleConfig(s,id,img) { savePageData(s,id,{title:document.getElementById('art-title').value,text:document.getElementById('art-text').value,image_url:img,show_date:false,author:s},'btn-save-art'); }
        function saveLinksConfig(s,id,img) { const ln = []; document.querySelectorAll('.link-row-item').forEach(el=>{ ln.push({title:el.querySelector('.lnk-t').value,url:el.querySelector('.lnk-u').value}); }); savePageData(s,id,{title:document.getElementById('lnk-title').value,text:JSON.stringify({desc:document.getElementById('lnk-desc').value,links:ln}),image_url:img,show_date:false,author:s},'btn-save-lnk'); }

        async function saveGlobalConfig() { const btn=document.getElementById('btn-save-cfg'); if(btn){btn.innerText="SAVING..."; btn.disabled=true;} App.config.siteTitle=document.getElementById('cfg-title').value.trim(); App.config.footerText=document.getElementById('cfg-footer').value.trim(); const method=App.configPostId?"PUT":"POST"; const url=App.configPostId?`${API_URL}/posts/${App.configPostId}`:`${API_URL}/posts`; try{ await fetch(url,{method,headers:{"Content-Type":"application/json","x-admin-password":App.token},body:JSON.stringify({title:"",text:JSON.stringify(App.config),image_url:"",show_date:false,author:"_system_config"})}); await init(); }catch(e){if(btn){btn.innerText="Error"; btn.disabled=false;}} }
        function addPage() { const id=document.getElementById('new-page-id').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,''); const title=document.getElementById('new-page-title').value.trim(); const type=document.getElementById('new-page-type').value; if(!id||!title) return; if(App.config.pages.find(p=>p.id===id)) return; App.config.pages.push({id,title,type}); saveGlobalConfig(); }
        async function removePage(i) { if(confirm("Delete page and ALL its data?")){ const pid=App.config.pages[i].id; const del=App.posts.filter(p=>p.author===pid); for(let x of del) await fetch(`${API_URL}/posts/${x.id}`,{method:"DELETE",headers:{"x-admin-password":App.token}}); App.config.pages.splice(i,1); await saveGlobalConfig(); } }

        function buildExpRowHtml(t='',c='',d='') { return `<div class="flex flex-col gap-3 p-4 bg-neutral-50 rounded-xl border border-neutral-200 relative exp-row-item"><input type="text" class="input !h-10 !py-2 !bg-white exp-t font-bold" placeholder="Title" value="${t}"><input type="text" class="input !h-10 !py-2 !bg-white exp-c" placeholder="Company" value="${c}"><input type="text" class="input !h-10 !py-2 !bg-white exp-d" placeholder="Date" value="${d}"><button type="button" onclick="this.parentElement.remove()" class="absolute top-4 right-4 text-red-500">X</button></div>`; }
        function addExpRowToDOM() { document.getElementById('prf-exp-container').insertAdjacentHTML('beforeend', buildExpRowHtml()); }
        function buildLinkRowHtml(t='',u='') { return `<div class="flex flex-col gap-3 p-4 bg-neutral-50 rounded-xl border border-neutral-200 relative link-row-item"><input type="text" class="input !h-10 !py-2 !bg-white lnk-t font-bold" placeholder="Label" value="${t}"><input type="text" class="input !h-10 !py-2 !bg-white lnk-u" placeholder="URL" value="${u}"><button type="button" onclick="this.parentElement.remove()" class="absolute top-4 right-4 text-red-500">X</button></div>`; }
        function addLinkRowToDOM() { document.getElementById('lnk-exp-container').insertAdjacentHTML('beforeend', buildLinkRowHtml()); }

        function openLoginModal() { closeMenu(); const r=document.getElementById('modal-root'); r.innerHTML=`<div class="w-full max-w-sm bg-white border rounded-2xl p-8 flex flex-col gap-6 shadow-2xl"><div class="text-xl font-bold text-center">Admin Access</div><form onsubmit="handleLogin(event)" class="flex flex-col gap-4"><input type="password" id="admin-pass" class="input" placeholder="Password..."><label class="flex items-center gap-3 text-sm text-gray-600 font-bold cursor-pointer"><input type="checkbox" id="remember-login" class="w-5 h-5 rounded border-gray-300 text-black focus:ring-black"> Remember me</label><div class="flex gap-4 mt-4"><button type="button" class="btn-light flex-1" onclick="closeModal()">Cancel</button><button type="submit" id="login-btn" class="btn-dark flex-1">Login</button></div></form></div>`; r.classList.remove('hidden'); r.classList.add('flex'); }
        function closeModal() { document.getElementById('modal-root').classList.add('hidden'); document.getElementById('modal-root').classList.remove('flex'); }
        function confirmDelete(id) { const r=document.getElementById('modal-root'); r.innerHTML=`<div class="max-w-sm w-full bg-white border rounded-2xl p-8 flex flex-col gap-6 items-center text-center shadow-2xl"><div class="text-2xl font-bold">Delete Item?</div><p class="text-gray-500 text-sm">Cannot be undone.</p><div id="m-actions" class="flex gap-4 w-full mt-2"><button class="btn-light flex-1" onclick="closeModal()">Cancel</button><button class="btn-danger flex-1" onclick="executeDelete(${id})">Delete</button></div><div id="m-loading" class="btn-light w-full hidden border-dashed">Deleting...</div></div>`; r.classList.remove('hidden'); r.classList.add('flex'); }
        async function executeDelete(id) { document.getElementById('m-actions').classList.add('hidden'); document.getElementById('m-loading').classList.remove('hidden'); document.getElementById('m-loading').classList.add('flex'); try{ await fetch(`${API_URL}/posts/${id}`,{method:"DELETE",headers:{"x-admin-password":App.token}}); await init(); closeModal(); }catch(e){} }

        const compressImage = (f, max=1600, q=0.8) => new Promise(res => { const r=new FileReader(); r.readAsDataURL(f); r.onload=e=>{ const i=new Image(); i.src=e.target.result; i.onload=()=>{ const c=document.createElement('canvas'); let w=i.width, h=i.height; if(w>max){h=Math.round(h*max/w); w=max;} c.width=w; c.height=h; c.getContext('2d').drawImage(i,0,0,w,h); c.toBlob(b=>res(new File([b],f.name.replace(/\.[^/.]+$/,"")+".jpg",{type:'image/jpeg'})),'image/jpeg',q); };};});
        function autoResizeTextarea(el) { el.style.height = 'auto'; el.style.height = el.value.trim() === '' ? '' : el.scrollHeight + 'px'; }

        init();
        document.addEventListener('click', (e) => { if(!document.getElementById('navOverlay').contains(e.target) && !document.getElementById('menuToggle').contains(e.target)) closeMenu(); });
    </script>
</body>
</html>
