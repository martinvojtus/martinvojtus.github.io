<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Martin Vojtus — Všetky práva vyhradené</title>

    <style>
        /* Celkový reset */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif; /* Regular font */
            font-weight: 400;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Sekcia s logom a textom */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo {
            width: 26px; /* Jemné logo */
            height: auto;
        }

        .footer-text {
            font-size: 0.85rem; /* Lepšia viditeľnosť podľa tvojej požiadavky */
            letter-spacing: 0.05em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Tenký Loading Bar */
        .progress-wrapper {
            width: 180px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00FFA3, #DC1FFF);
            box-shadow: 0 0 8px rgba(0, 255, 163, 0.4);
            /* Animácia trvá 2.5 sekundy */
            animation: grow 2.5s cubic-bezier(0.65, 0.05, 0.36, 1) forwards;
        }

        @keyframes grow {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Jemné zmiznutie celého obsahu na konci */
        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body id="content">

    <div class="brand-container">
        <img src="logo.svg" alt="MV" class="logo">
        <div class="footer-text">Martin Vojtus</div>
    </div>

    <div class="progress-wrapper">
        <div class="progress-bar"></div>
    </div>

    <script>
        // Počkáme 2.5s (dĺžka animácie) + malá rezerva na plynulý prechod
        setTimeout(() => {
            document.getElementById('content').classList.add('fade-out');
            
            // Po krátkom fade-out efekte presmerujeme
            setTimeout(() => {
                window.location.replace("https://www.cosmos.so/martinvojtus");
            }, 500);
        }, 2600);
    </script>

</body>
</html>
