<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: black; color: white; }
    </style>
</head>
<body class="flex justify-center min-h-screen items-start pt-6 pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <div id="spinner" class="flex flex-col items-center justify-center mt-32 space-y-4">
        <div class="w-8 h-8 border-4 border-[#F7931A]/20 border-t-[#F7931A] rounded-full animate-spin"></div>
        <div id="loading-text" class="text-center text-[#F7931A] font-bold text-xs tracking-widest uppercase">ANALYZING MACRO CYCLES...</div>
    </div>

    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-10 text-xs"></div>

    <div id="output" class="hidden flex flex-col gap-6 pt-1"></div>

    <footer id="footer" class="hidden text-center text-[9px] text-neutral-500 font-bold mt-12 border-t border-neutral-900 pt-6 tracking-[0.25em] whitespace-nowrap uppercase">
        MARTIN VOJTUŠ &copy; 2026 &bull; BUILD V1.0.0
    </footer>

</div>

<script>
let scoreChartInstance = null;
let spinnerInterval = null;
window.currentScoreData = { score: 0, colorClass: "" };

const loadingMsgs = [
    "ACCESSING LIQUIDITY...", 
    "CALCULATING LOG-REG...", 
    "MAPPING CYCLES...", 
    "GENERATING STRATEGY..."
];

// 1. Zameriavač (Vtlačený dátum bez extra medzery)
const crosshairPlugin = {
  id: 'crosshair',
  afterDraw: chart => {
    const activeElements = chart.getActiveElements();
    if (activeElements.length > 0) {
      let activePoint = activeElements[0];
      let x = activePoint.element.x;
      let yAxis = chart.scales.y;
      let xAxis = chart.scales.x;
      let ctx = chart.ctx;
      
      ctx.save();
      
      // Iba Vertikálna čiara
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();

      // Štítok X (Dátum - vtlačený priamo do grafu tesne nad osou)
      let xLabel = chart.data.labels[activePoint.index];
      if (xLabel) {
          ctx.fillStyle = '#171717'; ctx.font = 'bold 9px sans-serif';
          let textWidth = ctx.measureText(xLabel).width;
          let boxY = yAxis.bottom - 18; // VTLAČENÉ DOVNÚTRA
          let boxX = x - (textWidth + 12)/2;
          
          if (boxX < xAxis.left) boxX = xAxis.left;
          if (boxX + textWidth + 12 > xAxis.right) boxX = xAxis.right - textWidth - 12;
          
          ctx.fillRect(boxX, boxY, textWidth + 12, 16);
          ctx.strokeStyle = '#525252'; ctx.strokeRect(boxX, boxY, textWidth + 12, 16);
          ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(xLabel, boxX + (textWidth + 12)/2, boxY + 8);
      }

      // Aktualizácia percenta v pravej hornej časti (Zelená alebo BTC Orange)
      let val = activePoint.element.$context.parsed.y;
      let scoreDiv = document.getElementById('dynamic-score');
      let titleDiv = document.getElementById('dynamic-title');
      
      if (scoreDiv) {
          let scoreHex = val <= 20 ? "#22c55e" : "#F7931A";
          scoreDiv.innerText = val.toFixed(1) + '%';
          scoreDiv.style.color = scoreHex;
          if (titleDiv) titleDiv.style.color = scoreHex;
      }

      ctx.restore();
    }
  }
};

// 2. Efekty: Gulička na konci
const visualsPlugin = {
    id: 'visualsPlugin',
    afterDatasetsDraw: chart => {
        const ctx = chart.ctx;
        const meta = chart.getDatasetMeta(0);
        if (!meta.data || meta.data.length === 0) return;
        
        const lastPoint = meta.data[meta.data.length - 1];
        const val = chart.data.datasets[0].data[chart.data.datasets[0].data.length - 1];
        let dotColor = val <= 20 ? '#22c55e' : '#F7931A';
        
        ctx.save();
        ctx.beginPath();
        ctx.arc(lastPoint.x, lastPoint.y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = dotColor;
        ctx.fill();
        ctx.restore();
    }
};

Chart.register(crosshairPlugin, visualsPlugin);

function hideTooltips() {
    if (scoreChartInstance) { 
        scoreChartInstance.setActiveElements([]); 
        scoreChartInstance.update(); 
        let scoreDiv = document.getElementById('dynamic-score');
        let titleDiv = document.getElementById('dynamic-title');
        
        if (scoreDiv && window.currentScoreData) {
            scoreDiv.innerText = window.currentScoreData.score + '%';
            scoreDiv.style.color = window.currentScoreData.rawColor;
            if (titleDiv) titleDiv.style.color = window.currentScoreData.rawColor;
        }
    }
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

async function analyze() {
  const spinner = document.getElementById("spinner");
  const loadingText = document.getElementById("loading-text");
  const output = document.getElementById("output");
  const errorBox = document.getElementById("error-box");
  const footer = document.getElementById("footer");

  let msgIndex = 0;
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= loadingMsgs.length) msgIndex = 0;
      loadingText.innerText = loadingMsgs[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"}
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const colorClass = data.change > 0 ? "text-[#22c55e]" : (data.change < 0 ? "text-red-500" : "text-neutral-500");
    const sign = data.change > 0 ? "+" : "";
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const score = data.cycle_score || 0;
    
    // Farby: Zelená alebo BTC Orange (žltá a ružová sú preč)
    let scoreColor = score <= 20 ? "bg-[#22c55e]" : "bg-[#F7931A]";
    let scoreHex = score <= 20 ? "#22c55e" : "#F7931A";

    // Dashboard s jemným oranžovým nádychom v pozadí a ráme (žiadny glow)
    let dashboardStyle = "bg-[#F7931A]/5 border border-[#F7931A]/30";
    
    let phaseBadgeColor = score <= 20 ? "bg-[#030a05] text-[#22c55e] border border-[#22c55e]/50" : "bg-[#F7931A]/10 text-[#F7931A] border border-[#F7931A]/50";

    window.currentScoreData = { score: score, rawColor: scoreHex };

    // Formátovanie textu verdiktu
    let formattedContent = data.analysis
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/\n/g, '<br>');

    // Štýlovanie VERDIKTU podľa zóny (bez glow efektov)
    let boxStyle = "bg-neutral-900 border-neutral-800";
    let titleStyle = "text-white"; 
    if (score <= 20) {
        boxStyle = "bg-[#030a05] border border-[#22c55e]/40"; titleStyle = "text-[#22c55e]";
    } else {
        boxStyle = "bg-[#F7931A]/5 border border-[#F7931A]/40"; titleStyle = "text-[#F7931A]";
    }

    let finalHTML = `
      <div class="relative w-full mb-2">
          <div class="flex justify-between items-center px-1 mb-3 text-[10px] font-bold uppercase tracking-widest">
              <div id="dynamic-title" style="color: ${scoreHex}" class="transition-colors duration-150">CYCLE SCORE</div>
              <div id="dynamic-score" style="color: ${scoreHex}" class="transition-colors duration-150">${score}%</div>
          </div>
          <div class="h-[180px] w-full relative">
              <canvas id="scoreChart"></canvas>
          </div>
      </div>

      <div class="p-6 rounded-3xl ${dashboardStyle}">
        <div class="flex justify-between items-center mb-6">
            <div class="text-neutral-500 text-[10px] font-bold uppercase tracking-[0.15em]">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md uppercase tracking-wide">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-start mb-8 gap-4">
            <div>
                <div class="text-3xl sm:text-4xl font-bold tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-sm font-semibold mt-1 flex items-center gap-1">
                    ${sign}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded text-[9px] uppercase tracking-wider ml-1">24H</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-3xl sm:text-4xl font-bold" style="color: ${scoreHex}">${score}%</div>
                <div class="text-[10px] text-neutral-500 uppercase font-bold tracking-widest mt-1">SCORE</div>
            </div>
        </div>
        
        <div>
            <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden mb-4">
                <div class="h-full transition-all duration-1000 ease-out" style="width: ${score}%; background-color: ${scoreHex}"></div>
            </div>
            <div class="flex flex-col gap-2.5 text-[10px] sm:text-xs text-neutral-400 font-semibold tracking-wider px-1">
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#22c55e] shrink-0"></div><span class="text-white">0% - 20%</span> &bull; VALUE ZONE (DCA IN)</div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#F7931A] shrink-0"></div><span class="text-white">21% - 74%</span> &bull; NEUTRAL ZONE (HODL)</div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#F7931A] shrink-0"></div><span class="text-white">75% - 100%</span> &bull; EXIT ZONE (DCA OUT)</div>
            </div>
        </div>
      </div>

      <div class="p-6 rounded-3xl border transition-all duration-500 ${boxStyle}">
        <h2 class="${titleStyle} text-xs font-bold mb-4 uppercase tracking-[0.15em]">VERDICT & STRATEGY</h2>
        <div class="space-y-2 text-sm leading-relaxed text-neutral-300">${formattedContent}</div>
      </div>
    `;

    output.innerHTML = finalHTML;
    output.classList.remove("hidden");
    footer.classList.remove("hidden");
    
    // LIMIT DÁT NA POSLEDNÝCH 1000 DNÍ
    const limit = -143;
    const chartDates = data.chart_dates.slice(limit);
    const chartScore = data.chart_score.slice(limit);

    if (chartDates.length > 0 && chartScore.length > 0) {
        Chart.defaults.color = '#525252'; 
        Chart.defaults.font.family = "'Inter', sans-serif";
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            layout: { padding: { left: 0, right: 0, top: 5, bottom: 0 } },
            interaction: { mode: 'index', intersect: false }
        };

        const xAxisConfig = { display: true, grid: { display: false, drawBorder: false }, ticks: { display: false } };

        let ctxScore = document.getElementById('scoreChart').getContext('2d');

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(ctxScore, {
            type: 'line',
            data: {
                labels: chartDates,
                datasets: [{ 
                    data: chartScore, 
                    fill: false,
                    borderWidth: 2, 
                    tension: 0.6, 
                    pointRadius: 0,
                    borderColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return;
                        const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                        // Čistý prechod len Zelená -> BTC Oranžová
                        gradient.addColorStop(0, '#22c55e'); 
                        gradient.addColorStop(0.20, '#22c55e'); 
                        gradient.addColorStop(0.40, '#F7931A'); 
                        gradient.addColorStop(1, '#F7931A'); 
                        return gradient;
                    }
                }]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', min: 0, max: 100, 
                        grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false, tickLength: 0 }, 
                        ticks: { display: false } 
                    } 
                } 
            }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = "❌ CONNECTION ERROR. PLEASE REFRESH THE PAGE.";
    errorBox.classList.remove("hidden");
  }
}

window.addEventListener('DOMContentLoaded', analyze);
</script>
</body>
</html>
