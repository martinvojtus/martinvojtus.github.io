<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Vojtus — Všetky práva vyhradené</title>

    <style>
        /* Minimalistický čierny základ */
        html, body {
            background-color: #000 !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Tenký Loading Bar */
        .loader-bg {
            width: 180px;
            height: 2px; /* Extra tenký profil */
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader-fill {
            width: 0%;
            height: 100%;
            /* Tvoj charakteristický gradient */
            background: linear-gradient(90deg, #00FFA3, #DC1FFF);
            box-shadow: 0 0 10px rgba(0, 255, 163, 0.6);
            animation: progressRun 3s cubic-bezier(0.5, 0, 0.5, 1) forwards;
        }

        @keyframes progressRun {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Jemné zmiznutie pred skokom */
        .fade-out {
            opacity: 0;
            transition: opacity 0.8s ease;
        }
    </style>
</head>
<body>

    <div id="main-ui" class="loader-bg">
        <div class="loader-fill"></div>
    </div>

    <script>
        window.onload = function() {
            // Počkáme na dokončenie animácie (3 sekundy)
            setTimeout(function() {
                // Spustíme fade-out efekt baru
                document.getElementById('main-ui').classList.add('fade-out');
                
                // Finálne presmerovanie po doznení efektu
                setTimeout(function() {
                    window.location.replace("https://www.cosmos.so/martinvojtus");
                }, 800);
            }, 3000);
        };
    </script>

</body>
</html>
