<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        /* Skrytie šípok v inpute typu number */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>    
</head>
<body class="font-['Inter'] bg-black text-white flex justify-center min-h-screen items-start pt-6 pb-10 overflow-x-hidden">

<div class="w-full max-w-xl p-5 relative">

    <div class="flex gap-2 sm:gap-3 mb-6 w-full h-[34px]">
        <div class="bg-neutral-900 border border-neutral-800 p-1 rounded-lg flex flex-1 text-[0.55rem] sm:text-[0.6rem] uppercase tracking-widest text-center">
            <button onclick="toggleAsset('BTC')" id="toggle-asset-btc" class="flex-1 rounded-md bg-neutral-700 text-white transition-all duration-300 h-full">Bitcoin</button>
            <button onclick="toggleAsset('SOL')" id="toggle-asset-sol" class="flex-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300 h-full">Solana</button>
        </div>
        <div class="bg-neutral-900 border border-neutral-800 p-1 rounded-lg flex flex-1 text-[0.55rem] sm:text-[0.6rem] uppercase tracking-widest text-center">
            <button onclick="toggleMode('MACRO')" id="toggle-mode-macro" class="flex-1 rounded-md bg-neutral-700 text-white transition-all duration-300 h-full">Macro</button>
            <button onclick="toggleMode('TRADING')" id="toggle-mode-trading" class="flex-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300 h-full">Trading</button>
        </div>
        
        <button onclick="triggerAnalysis()" class="bg-neutral-900 border border-neutral-800 rounded-lg w-[34px] sm:w-[38px] flex items-center justify-center text-neutral-500 hover:text-white transition-all duration-300 shrink-0 h-full">
            <svg id="btn-refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>

        <button onclick="toggleWalletModal()" class="bg-neutral-900 border border-[#ab9ff2]/40 rounded-lg w-[34px] sm:w-[38px] flex items-center justify-center text-[#ab9ff2] hover:bg-[#ab9ff2]/10 transition-all duration-300 shrink-0 h-full shadow-[0_0_10px_rgba(171,159,242,0.15)]">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        </button>
    </div>

    <div class="flex justify-between items-center px-1 mb-4 text-[0.6rem] uppercase tracking-widest relative h-[24px]">
        <div class="w-16 text-left">
            <div id="dynamic-title" class="text-neutral-600 transition-colors duration-500">SCORE</div>
        </div>
        <div id="macro-buttons" class="flex gap-1 absolute left-1/2 -translate-x-1/2">
            <button onclick="updateChart('1Y')" id="btn-1Y" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">1Y</button>
            <button onclick="updateChart('2Y')" id="btn-2Y" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">2Y</button>
            <button onclick="updateChart('4Y')" id="btn-4Y" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">4Y</button>
            <button onclick="updateChart('ALL')" id="btn-ALL" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">ALL</button>
        </div>
        <div id="trading-buttons" class="hidden flex gap-1 absolute left-1/2 -translate-x-1/2">
            <button onclick="changeTradingInterval('1d')" id="btn-1d" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">1D</button>
            <button onclick="changeTradingInterval('4h')" id="btn-4h" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">4H</button>
            <button onclick="changeTradingInterval('2h')" id="btn-2h" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">2H</button>
            <button onclick="changeTradingInterval('1h')" id="btn-1h" class="px-3 py-1 rounded-md text-neutral-500 hover:text-neutral-300 transition-all duration-300">1H</button>
        </div>
        <div class="w-16 flex justify-end">
            <div id="dynamic-score" class="transition-colors duration-500 flex items-center h-full">
                <span class="bg-neutral-800 text-transparent animate-pulse rounded px-0.5">00.0%</span>
            </div>
        </div>
    </div>

    <div class="h-60 w-full relative mb-4">
        <div id="chart-skeleton" class="absolute inset-0 pt-[5px] pb-[28px] flex flex-col justify-between transition-opacity duration-1000 pointer-events-none">
            <div class="w-full h-[1px] opacity-5" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-50" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-50" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-10" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
            <div class="w-full h-[1px] opacity-5" style="background-image: repeating-linear-gradient(to right, #525252 0, #525252 4px, transparent 4px, transparent 8px);"></div>
        </div>
        
        <div class="absolute top-0 bottom-0 -left-[8px] w-[calc(100%+16px)] pointer-events-none">
            <canvas id="scoreChart" class="opacity-0 transition-opacity duration-1000 pointer-events-auto"></canvas>
        </div>
    </div>

    <div id="main-card" class="p-6 rounded-3xl bg-neutral-900/40 border border-neutral-800/50 shadow-2xl shadow-black/50 transition-colors duration-1000">
        <div class="flex justify-between items-center mb-4 text-[0.6rem] uppercase tracking-widest">
            <div id="badge-name" class="border border-neutral-600/50 px-3 py-1.5 rounded-md text-neutral-400">Bitcoin (BTC)</div>
            <div id="badge-phase" class="border border-neutral-800 px-3 py-1.5 rounded-md transition-colors duration-1000 text-transparent bg-neutral-800 animate-pulse">LOADING ZONE</div>
        </div>
        <div class="flex justify-between items-start mb-4 gap-4 px-1">
            <div>
                <div id="val-price" class="text-[1.8rem] font-bold leading-none tracking-tight text-white">
                    <span class="bg-neutral-800 text-transparent animate-pulse rounded">$00,000.00</span>
                </div>
                <div id="val-change" class="text-[0.6rem] uppercase tracking-widest mt-2 flex items-center gap-1.5">
                    <span class="bg-neutral-800 text-transparent animate-pulse rounded px-1">+0.00%</span> 
                    <span class="bg-neutral-800 text-transparent animate-pulse rounded px-1.5 py-0.5">24H</span>
                </div>
            </div>
            <div class="text-right flex flex-col items-end">
                <div id="val-score-large" class="text-[1.8rem] font-bold leading-none">
                    <span class="bg-neutral-800 text-transparent animate-pulse rounded px-1">00.0%</span>
                </div>
                <div class="text-[0.6rem] text-neutral-500 uppercase tracking-widest mt-2">SCORE</div>
            </div>
        </div>
        <div>
            <div class="w-full bg-neutral-800 h-1.5 rounded-full overflow-hidden mb-4 relative">
                <div id="animated-score-bar" class="h-full transition-all duration-[1500ms] ease-out" style="width: 0%; background-color: transparent;"></div>
            </div>
            <table class="w-full text-left text
