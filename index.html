<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>AI Video Analyzer</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f0f10;
  color: #fff;
  display: flex;
  justify-content: center;
}

.container {
  max-width: 700px;
  width: 100%;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.card {
  background: #1a1a1c;
  padding: 20px;
  border-radius: 16px;
}

.input-group {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  height: 48px;
  padding: 0 12px;
  border-radius: 10px;
  border: none;
  background: #2a2a2d;
  color: white;
}

.paste-btn {
  height: 48px;
  padding: 0 16px;
  border-radius: 10px;
  border: none;
  background: #2a2a2d;
  color: #aaa;
  cursor: pointer;
  white-space: nowrap;
}

select {
  width: 100%;
  height: 48px;
  margin-top: 10px;
  padding: 0 12px;
  border-radius: 10px;
  border: none;
  background: #2a2a2d;
  color: white;
}

button {
  width: 100%;
  margin-top: 15px;
  height: 48px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: white;
  font-weight: 600;
  cursor: pointer;
}

.spinner {
  display: none;
  margin: 20px auto;
  width: 30px;
  height: 30px;
  border: 3px solid #444;
  border-top: 3px solid #7c3aed;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

.output {
  margin-top: 20px;
  background: #1a1a1c;
  padding: 20px;
  border-radius: 16px;
  white-space: pre-wrap;
  display: none;
}

</style>
</head>

<body>

<div class="container">

<h1>🎥 AI Video Analyzer</h1>

<div class="card">

<div class="input-group">
  <input id="url" placeholder="Paste YouTube link..." />
  <button class="paste-btn" onclick="paste()">Paste</button>
</div>

<select id="mode">
  <option value="business">💰 Business</option>
  <option value="coding">💻 Coding</option>
  <option value="self">🧠 Self</option>
</select>

<button id="btn" onclick="analyze()">Analyze</button>

<div id="spinner" class="spinner"></div>

</div>

<div id="output" class="output"></div>

</div>

<script>
async function paste() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById("url").value = text;
  } catch {
    alert("Clipboard not allowed");
  }
}

async function analyze() {

  const url = document.getElementById("url").value;
  const mode = document.getElementById("mode").value;

  const btn = document.getElementById("btn");
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");

  if (!url) return alert("Paste link");

  btn.disabled = true;
  spinner.style.display = "block";
  output.style.display = "none";

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url, mode })
    });

    const data = await res.json();

    let text = data.analysis;

    if (text.includes("No transcript available")) {
      text = "⚠️ This video has no transcript.\n\n👉 Next step: enable AI audio transcription (coming soon).";
    }

    output.innerText = text;
    output.style.display = "block";

  } catch (err) {
    output.innerText = "Error: " + err;
    output.style.display = "block";
  }

  spinner.style.display = "none";
  btn.disabled = false;
}
</script>

</body>
</html>
