<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: black; color: white; }
    </style>
</head>
<body class="flex justify-center min-h-screen items-start pt-6 pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <header class="w-full mb-6">
        <div class="flex justify-between items-center w-full mb-1">
            <h1 class="text-3xl font-black tracking-tighter text-white">
                V<span class="text-[#F7931A]">₿</span><span class="text-[#22c55e]">$</span>X
            </h1>
            <div class="bg-neutral-900 rounded-lg p-1 border border-neutral-800 flex gap-1">
                <button id="lang-en" onclick="setLang('EN')" class="px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs">EN</button>
                <button id="lang-sk" onclick="setLang('SK')" class="px-3 py-1 rounded-md text-neutral-400 font-bold text-xs">SK</button>
            </div>
        </div>
        <div class="w-full text-[9px] text-neutral-500 font-bold tracking-[0.25em] uppercase mt-1 text-left">
            Value Bitcoin Dollar Index
        </div>
    </header>

    <button onclick="analyze()" id="btn" class="w-full h-14 bg-[#F7931A] rounded-xl text-black font-black text-lg hover:bg-orange-500 transition active:scale-95 shadow-[0_0_20px_rgba(247,147,26,0.2)]">
      ANALYZE
    </button>

    <div id="spinner" class="hidden text-center text-[#F7931A] font-bold mt-6 text-xs tracking-widest uppercase"></div>
    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-4 text-xs"></div>

    <div id="output" class="hidden flex flex-col gap-6 pt-4"></div>

    <footer class="text-center text-[9px] text-neutral-500 font-bold mt-12 border-t border-neutral-900 pt-6 tracking-[0.25em] uppercase">
        MARTIN VOJTUŠ &copy; 2026 &bull; BUILD V1.0.0
    </footer>

</div>

<script>
let charts = { price: null, rsi: null, score: null };
let currentLang = 'EN';

const i18n = {
    EN: { btn: 'ANALYZE', score: 'Score', load: ["Mapping Cycles...", "Generating Strategy..."] },
    SK: { btn: 'ANALÝZA', score: 'Skóre', load: ["Mapujem cykly...", "Generujem stratégiu..."] }
};

function setLang(lang) {
    currentLang = lang;
    document.getElementById('btn').innerText = i18n[lang].btn;
    document.getElementById('lang-en').className = lang === 'EN' ? "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs" : "px-3 py-1 rounded-md text-neutral-400 font-bold text-xs";
    document.getElementById('lang-sk').className = lang === 'SK' ? "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs" : "px-3 py-1 rounded-md text-neutral-400 font-bold text-xs";
}

const crosshairPlugin = {
    id: 'crosshair',
    afterDraw: (chart) => {
        if (chart.tooltip?._active?.length) {
            const {ctx, scales: {x, y}} = chart;
            const activePoint = chart.tooltip._active[0];
            const px = activePoint.element.x;
            const py = activePoint.element.y;

            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([3, 3]);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            
            // Čiary
            ctx.moveTo(px, y.top); ctx.lineTo(px, y.bottom);
            ctx.moveTo(x.left, py); ctx.lineTo(x.right, py);
            ctx.stroke();

            // Hodnoty na osiach
            ctx.setLineDash([]);
            ctx.fillStyle = '#171717';
            const xLabel = chart.data.labels[activePoint.index];
            const yLabel = y.getValueForPixel(py).toLocaleString();

            // X Label (dole)
            ctx.fillRect(px - 30, y.bottom + 2, 60, 16);
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText(xLabel, px, y.bottom + 13);

            // Y Label (vpravo)
            ctx.fillStyle = '#171717';
            ctx.fillRect(x.right + 2, py - 8, 45, 16);
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.fillText(yLabel, x.right + 5, py + 4);
            ctx.restore();
        }
    }
};
Chart.register(crosshairPlugin);

async function analyze() {
    const btn = document.getElementById('btn');
    const output = document.getElementById('output');
    const spinner = document.getElementById('spinner');
    
    btn.disabled = true;
    spinner.classList.remove('hidden');
    spinner.innerText = i18n[currentLang].load[0];

    try {
        const response = await fetch('https://mv-backend-ak8l.onrender.com/analyze', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ language: currentLang })
        });
        const data = await response.json();
        
        const badgeColor = data.cycle_score <= 20 ? "bg-[#030a05] text-[#22c55e] border-[#22c55e]/60 shadow-[0_0_15px_rgba(34,197,94,0.25)]" : "bg-orange-900/30 text-[#F7931A] border-[#F7931A]/60 shadow-[0_0_15px_rgba(247,147,26,0.25)]";

        output.innerHTML = `
            <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-2xl space-y-8">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-neutral-500 font-bold uppercase tracking-widest">Bitcoin (BTC)</span>
                    <span class="${badgeColor} text-[10px] font-black px-3 py-1 rounded-md uppercase border">${data.phase}</span>
                </div>
                <div class="flex justify-between items-end">
                    <div>
                        <div class="text-4xl font-black">$${data.price.toLocaleString()}</div>
                        <div class="${data.change > 0 ? 'text-[#22c55e]' : 'text-red-500'} text-xs font-bold mt-1">${data.change > 0 ? '+' : ''}${data.change}%</div>
                    </div>
                    <div class="text-right">
                        <div class="text-4xl font-black ${data.cycle_score <= 20 ? 'text-[#22c55e]' : 'text-[#F7931A]'}">${data.cycle_score}%</div>
                        <div class="text-[9px] text-neutral-500 uppercase font-bold tracking-widest">Score</div>
                    </div>
                </div>
            </div>

            <div class="bg-[#1c120a] border border-[#F7931A]/40 rounded-3xl p-6 shadow-[0_0_20px_rgba(247,147,26,0.15)] relative h-[250px]">
                <div class="absolute top-4 left-6 text-[10px] font-bold text-[#F7931A] uppercase tracking-widest">V₿$X Cycle Score</div>
                <canvas id="scoreChart"></canvas>
            </div>

            <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-xl space-y-10">
                <div class="h-[200px] relative">
                    <div class="absolute top-0 left-0 text-[10px] font-bold text-neutral-500 uppercase tracking-widest">Price & MAs</div>
                    <canvas id="priceChart"></canvas>
                </div>
                <div class="h-[150px] relative border-t border-neutral-800 pt-6">
                    <div class="absolute top-6 left-0 text-[10px] font-bold text-neutral-500 uppercase tracking-widest">Weekly RSI</div>
                    <canvas id="rsiChart"></canvas>
                </div>
            </div>
        `;
        
        output.classList.remove('hidden');
        renderCharts(data);
    } catch (e) {
        document.getElementById('error-box').classList.remove('hidden');
    } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
    }
}

function renderCharts(data) {
    const commonOpts = { 
        responsive: true, maintainAspectRatio: false, 
        plugins: { legend: { display: false }, tooltip: { enabled: true, mode: 'index', intersect: false } },
        scales: { x: { display: false }, y: { display: false } },
        elements: { point: { radius: 0 }, line: { borderWidth: 1.5, tension: 0.4 } }
    };

    charts.score = new Chart(document.getElementById('scoreChart'), {
        type: 'line',
        data: { labels: data.chart_dates.slice(-150), datasets: [{ data: data.chart_score.slice(-150), borderColor: '#F7931A', fill: true, backgroundColor: 'rgba(247, 147, 26, 0.05)' }] },
        options: commonOpts
    });

    charts.price = new Chart(document.getElementById('priceChart'), {
        type: 'line',
        data: { labels: data.chart_dates.slice(-150), datasets: [{ data: data.chart_prices.slice(-150), borderColor: 'white' }] },
        options: { ...commonOpts, scales: { ...commonOpts.scales, y: { display: false, type: 'logarithmic' } } }
    });

    charts.rsi = new Chart(document.getElementById('rsiChart'), {
        type: 'line',
        data: { labels: data.chart_dates.slice(-150), datasets: [{ data: data.chart_rsi.slice(-150), borderColor: '#8b5cf6' }] },
        options: commonOpts
    });
}
</script>
</body>
</html>
