<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-black text-white flex justify-center min-h-screen items-start pt-6 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <header class="flex justify-between items-center w-full mb-6">
        <h1 id="main-title" class="text-xl sm:text-2xl font-extrabold tracking-wide text-white flex items-center gap-2 whitespace-nowrap">
            V-ndx <span class="text-[#F7931A]">₿</span>
        </h1>
        <div class="bg-neutral-900 rounded-lg p-1 border border-neutral-800 flex gap-1 shrink-0">
            <button id="lang-en" onclick="setLang('EN')" class="px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition">EN</button>
            <button id="lang-sk" onclick="setLang('SK')" class="px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition">SK</button>
        </div>
    </header>

    <button onclick="analyze()" id="btn" class="w-full h-14 bg-[#F7931A] rounded-xl text-black font-bold text-lg hover:bg-orange-500 transition active:scale-95 shadow-[0_0_15px_rgba(247,147,26,0.2)]">
      Analyze Cycle
    </button>

    <div id="spinner" class="hidden text-center text-[#F7931A] font-medium mt-6 h-6 text-sm"></div>
    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-4 text-sm"></div>

    <div id="divider" class="hidden border-b border-neutral-800 my-6"></div>

    <div id="output" class="hidden flex flex-col gap-5"></div>

    <footer id="footer" class="hidden text-center text-[9px] text-neutral-600 font-bold mt-10 border-t border-neutral-800 pt-6 tracking-[0.2em] whitespace-nowrap"></footer>

</div>

<script>
let priceChartInstance = null;
let rsiChartInstance = null;
let scoreChartInstance = null;

let spinnerInterval = null;
let currentLang = 'EN';

const i18n = {
    EN: {
        btn: 'Analyze Cycle',
        loading: ["Extracting On-Chain Metrics...", "Calculating Regression...", "Evaluating Algorithms...", "Generating Strategy..."],
        score: "Score",
        error: "❌ Connection Error. Backend waking up. Try again in 15s.",
        legAcc: "HEAVY ACCUMULATION / BUY",
        legHold: "HEALTHY GROWTH / HODL",
        legDist: "EXTREME EUPHORIA / SELL"
    },
    SK: {
        btn: 'Analyzovať Cyklus',
        loading: ["Získavam historické dáta...", "Počítam regresné priemery...", "Vyhodnocujem algoritmy...", "Generujem stratégiu..."],
        score: "Skóre",
        error: "❌ Chyba pripojenia. Backend sa prebúdza. Skúste znova o 15s.",
        legAcc: "SILNÁ AKUMULÁCIA / NÁKUP",
        legHold: "ZDRAVÝ RAST / HODL",
        legDist: "EXTRÉMNA EUFÓRIA / PREDAJ"
    }
};

function setLang(lang) {
    currentLang = lang;
    
    if (lang === 'EN') {
        document.getElementById('lang-en').className = "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition";
        document.getElementById('lang-sk').className = "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    } else {
        document.getElementById('lang-sk').className = "px-3 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition";
        document.getElementById('lang-en').className = "px-3 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    }
    
    document.getElementById('btn').innerText = i18n[lang].btn;
    if (!document.getElementById('output').classList.contains('hidden')) analyze();
}

// Zrušenie tooltipov kliknutím mimo
function hideTooltips() {
    [priceChartInstance, rsiChartInstance, scoreChartInstance].forEach(chart => {
        if (chart) { chart.tooltip.setActiveElements([], {x:0,y:0}); chart.update(); }
    });
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

// Vlastný plugin pre Vertikálnu zameriavaciu čiaru (Crosshair)
const crosshairPlugin = {
  id: 'crosshair',
  afterDraw: chart => {
    if (chart.tooltip?._active?.length) {
      let x = chart.tooltip._active[0].element.x;
      let yAxis = chart.scales.y;
      let ctx = chart.ctx;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top);
      ctx.lineTo(x, yAxis.bottom);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.stroke();
      ctx.restore();
    }
  }
};
Chart.register(crosshairPlugin);

async function analyze() {
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const divider = document.getElementById("divider");
  const btn = document.getElementById("btn");
  const errorBox = document.getElementById("error-box");
  const footer = document.getElementById("footer");

  output.classList.add("hidden");
  divider.classList.add("hidden");
  errorBox.classList.add("hidden");
  footer.classList.add("hidden");
  btn.disabled = true;
  btn.classList.add("opacity-50");
  
  spinner.classList.remove("hidden");
  let msgIndex = 0;
  spinner.innerText = i18n[currentLang].loading[0];
  
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= i18n[currentLang].loading.length) msgIndex = 0;
      spinner.innerText = i18n[currentLang].loading[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ language: currentLang }) 
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const colorClass = data.change > 0 ? "text-green-500" : (data.change < 0 ? "text-red-500" : "text-neutral-400");
    const sign = data.change > 0 ? "+" : "";
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const score = data.cycle_score || 0;
    
    let scoreColor = "bg-[#F7931A]";
    let scoreTextColor = "text-[#F7931A]";
    let phaseBadgeColor = "bg-orange-900/20 text-[#F7931A] border-[#F7931A]/30";
    
    if (score <= 20) {
        scoreColor = "bg-green-500";
        scoreTextColor = "text-green-500";
        phaseBadgeColor = "bg-green-900/20 text-green-400 border-green-800/30";
    } else if (score >= 75) {
        scoreColor = "bg-red-500";
        scoreTextColor = "text-red-500";
        phaseBadgeColor = "bg-red-900/20 text-red-400 border-red-800/30";
    }

    let finalHTML = `
      <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-xl">
        
        <div class="flex justify-between items-center mb-6">
            <div class="text-neutral-500 text-xs font-bold uppercase tracking-widest">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md border uppercase tracking-wide">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-center mb-8 whitespace-nowrap">
            <div>
                <div class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-xs sm:text-sm font-semibold mt-1 flex items-center gap-1">
                    ${sign}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded text-[9px] uppercase tracking-wider ml-1">24H</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-3xl sm:text-4xl font-black ${scoreTextColor}">${score}%</div>
                <div class="text-[10px] text-neutral-500 uppercase font-bold tracking-widest mt-1">${i18n[currentLang].score}</div>
            </div>
        </div>
        
        <div class="mb-8">
            <div class="w-full bg-neutral-800 h-2.5 rounded-full overflow-hidden mb-3">
                <div class="h-full ${scoreColor} transition-all duration-1000 ease-out" style="width: ${score}%"></div>
            </div>
            <div class="flex flex-col gap-2 text-[10px] sm:text-xs text-neutral-500 font-bold tracking-wider px-1">
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-green-500 shrink-0"></div><span>0% - 20% (${i18n[currentLang].legAcc})</span></div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#F7931A] shrink-0"></div><span>21% - 74% (${i18n[currentLang].legHold})</span></div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-red-500 shrink-0"></div><span>75% - 100% (${i18n[currentLang].legDist})</span></div>
            </div>
        </div>
        
        <div class="space-y-6">
            <div style="height: 260px; position: relative; border-top: 1px solid #262626; padding-top: 2rem;">
                <div style="position: absolute; top: 12px; left: 0; font-size: 0.70rem; color: #a3a3a3; font-weight: bold; text-transform: uppercase;">Price & MAs (50W, 200W)</div>
                <canvas id="priceChart"></canvas>
            </div>
            <div style="height: 180px; position: relative; border-top: 1px solid #262626; padding-top: 2rem;">
                <div style="position: absolute; top: 12px; left: 0; font-size: 0.70rem; color: #a3a3a3; font-weight: bold; text-transform: uppercase;">Weekly RSI (14)</div>
                <canvas id="rsiChart"></canvas>
            </div>
            <div style="height: 180px; position: relative; border-top: 1px solid #262626; padding-top: 2rem;">
                <div style="position: absolute; top: 12px; left: 0; font-size: 0.70rem; color: #a3a3a3; font-weight: bold; text-transform: uppercase;">Cycle Score (0-100%)</div>
                <canvas id="scoreChart"></canvas>
            </div>
        </div>
      </div>
    `;

    const parts = data.analysis.split('**');
    for (let i = 1; i < parts.length; i += 2) {
      if (parts[i] && parts[i + 1]) {
        const title = parts[i].trim();
        let content = parts[i + 1].trim().replace(/\n/g, '<br>');

        let boxStyle = "bg-neutral-900 border-neutral-800";
        let titleStyle = "text-white"; 
        
        let c = title.toUpperCase();
        if (c.includes("VERDICT") || c.includes("VERDIKT") || c.includes("STRATÉGIA") || c.includes("STRATEGY")) {
            if (score <= 20) {
                boxStyle = "bg-green-900/10 border-green-500/50 shadow-[0_0_20px_rgba(34,197,94,0.15)]"; titleStyle = "text-green-500";
            } else if (score >= 75) {
                boxStyle = "bg-red-900/10 border-red-500/50 shadow-[0_0_20px_rgba(239,68,68,0.15)]"; titleStyle = "text-red-500";
            } else {
                boxStyle = "bg-orange-900/10 border-[#F7931A]/50 shadow-[0_0_20px_rgba(247,147,26,0.15)]"; titleStyle = "text-[#F7931A]";
            }
        }

        finalHTML += `
          <div class="${boxStyle} p-6 rounded-3xl border transition-all duration-500">
            <h2 class="${titleStyle} text-sm font-bold mb-4 uppercase tracking-widest">${title}</h2>
            <div class="text-neutral-300 text-sm leading-loose">${content}</div>
          </div>
        `;
      }
    }

    output.innerHTML = finalHTML;
    divider.classList.remove("hidden");
    output.classList.remove("hidden");
    
    footer.innerHTML = `MARTIN VOJTUŠ &copy; ${new Date().getFullYear()} &bull; BUILD V1.0.0`;
    footer.classList.remove("hidden");
    
    if (data.chart_dates.length > 0 && data.chart_prices.length > 0) {
        Chart.defaults.color = '#525252'; // Farba osí a textov
        Chart.defaults.font.size = 9;
        Chart.defaults.font.family = 'sans-serif';
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            plugins: { 
                legend: { display: false }, 
                tooltip: { 
                    displayColors: false, 
                    backgroundColor: 'rgba(20,20,20,0.95)', 
                    titleColor: '#a3a3a3',
                    bodyColor: '#fff',
                    borderColor: '#333', 
                    borderWidth: 1, 
                    padding: 8,
                    yAlign: 'bottom', // Box vyskočí VŽDY NAD prstom
                    caretPadding: 15,
                    titleFont: { size: 10 },
                    bodyFont: { size: 12, weight: 'bold' }
                } 
            },
            layout: { padding: { left: 0, right: 0, top: 10, bottom: 0 } },
            interaction: { mode: 'index', intersect: false }
        };

        // Konfigurácia X Osi (Dátumy)
        const xAxisConfig = {
            display: true,
            grid: { display: false, drawBorder: false },
            ticks: { maxTicksLimit: 6, maxRotation: 0, autoSkip: true, color: '#737373' }
        };

        if (priceChartInstance) priceChartInstance.destroy();
        priceChartInstance = new Chart(document.getElementById('priceChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'Price ($)', data: data.chart_prices, borderColor: '#ffffff', borderWidth: 1.0, tension: 0.4, pointRadius: 0 },
                    { label: '50W MA', data: data.chart_ma50, borderColor: '#06b6d4', borderWidth: 0.6, tension: 0.4, pointRadius: 0 },
                    { label: '200W MA', data: data.chart_ma200, borderColor: '#a855f7', borderWidth: 0.6, tension: 0.4, pointRadius: 0 }
                ]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', type: 'logarithmic', 
                        grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                        ticks: { color: '#737373', callback: val => '$' + (val/1000).toFixed(0) + 'k' }
                    } 
                } 
            }
        });

        if (rsiChartInstance) rsiChartInstance.destroy();
        rsiChartInstance = new Chart(document.getElementById('rsiChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'RSI', data: data.chart_rsi, borderColor: '#8b5cf6', borderWidth: 1.0, tension: 0.4, pointRadius: 0 }, // Fialová
                    { label: 'Overbought', data: new Array(data.chart_dates.length).fill(85), borderColor: '#525252', borderWidth: 0.6, borderDash: [5, 5], pointRadius: 0 },
                    { label: 'Oversold', data: new Array(data.chart_dates.length).fill(40), borderColor: '#525252', borderWidth: 0.6, borderDash: [5, 5], pointRadius: 0 }
                ]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', min: 20, max: 100, 
                        grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                        ticks: { stepSize: 20, color: '#737373' }
                    } 
                } 
            }
        });

        let ctxScore = document.getElementById('scoreChart').getContext('2d');
        // Upravený gradient - Zelená farba siaha až do výšky 30% grafu, aby bola krásne viditeľná
        let gradientStroke = ctxScore.createLinearGradient(0, 180, 0, 0); 
        gradientStroke.addColorStop(0, '#22c55e');    
        gradientStroke.addColorStop(0.3, '#22c55e');  // Zelená je potiahnutá vyššie
        gradientStroke.addColorStop(0.6, '#F7931A');  
        gradientStroke.addColorStop(0.8, '#ef4444');  
        gradientStroke.addColorStop(1, '#ef4444');    

        let gradientFill = ctxScore.createLinearGradient(0, 180, 0, 0);
        gradientFill.addColorStop(0, 'rgba(34, 197, 94, 0.15)');
        gradientFill.addColorStop(0.5, 'rgba(247, 147, 26, 0.1)');
        gradientFill.addColorStop(1, 'rgba(239, 68, 68, 0.15)');

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(ctxScore, {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'Score %', data: data.chart_score, borderColor: gradientStroke, backgroundColor: gradientFill, fill: true, borderWidth: 1.0, tension: 0.4, pointRadius: 0 }
                ]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', min: 0, max: 100, 
                        grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                        ticks: { stepSize: 25, color: '#737373' }
                    } 
                } 
            }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = i18n[currentLang].error;
    errorBox.classList.remove("hidden");
  }

  btn.disabled = false;
  btn.classList.remove("opacity-50");
}
</script>

</body>
</html>
