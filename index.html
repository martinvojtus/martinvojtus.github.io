<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-black text-white flex justify-center min-h-screen items-start pt-6 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

<header class="flex justify-between items-center w-full mb-6">
    <h1 id="main-title" class="text-xl sm:text-2xl font-extrabold tracking-wide text-[#F7931A] flex items-center gap-2">
        <span class="text-3xl">₿</span> Macro Analyst
    </h1>
    <div class="bg-neutral-900 rounded-lg p-1 border border-neutral-800 flex gap-1 shrink-0">
        <button id="lang-en" onclick="setLang('EN')" class="px-2 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition">EN</button>
        <button id="lang-sk" onclick="setLang('SK')" class="px-2 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition">SK</button>
    </div>
</header>

<button onclick="analyze()" id="btn" class="w-full h-14 bg-[#F7931A] rounded-xl text-black font-bold text-lg hover:bg-orange-500 transition active:scale-95 shadow-lg shadow-orange-900/20">
  Analyze Macro Cycle
</button>

<div id="spinner" class="hidden text-center text-[#F7931A] font-medium mt-6 h-6 text-sm"></div>

<div id="divider" class="hidden border-b border-neutral-800 my-6"></div>

<div id="output" class="hidden flex flex-col gap-4">
</div>

</div>

<script>
// ... (setLang, setTouch tktiež zostávajú)

async function analyze() {
  // ... (fetch logika zostáva rovnaká)

  // UPRAVENÉ VYKRESLENIE GRAFU V PRICECHART:
  if (priceChartInstance) priceChartInstance.destroy();
  priceChartInstance = new Chart(document.getElementById('priceChart').getContext('2d'), {
      type: 'line',
      data: {
          labels: data.chart_dates,
          datasets: [
              { label: 'Price', data: data.chart_prices, borderColor: '#F7931A', borderWidth: 2, pointRadius: 0 },
              { label: '50W MA', data: data.chart_ma50, borderColor: '#06b6d4', borderWidth: 1, pointRadius: 0 },
              { label: '200W MA', data: data.chart_ma200, borderColor: '#a855f7', borderWidth: 1, pointRadius: 0 }
          ]
      },
      options: { 
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { display: false }, y: { display: false, type: 'logarithmic' } } 
      }
  });

  // RSI a Score grafy zostávajú ako predtým...
}
</script>


<script>
let priceChartInstance = null;
let rsiChartInstance = null;
let scoreChartInstance = null;

let spinnerInterval = null;
let currentLang = 'EN';

const i18n = {
    EN: {
        title: '<span class="text-3xl">₿</span> Macro Analyst',
        btn: 'Analyze Macro Cycle',
        loading: ["Calculating 4-Year Fractals...", "Evaluating Indicators...", "Scoring Market Phase...", "Generating AI Verdict..."],
        bottom: "Cycle Bottom",
        top: "Cycle Top",
        score: "Score",
        error: "❌ Connection Error. Backend waking up. Try again in 10s."
    },
    SK: {
        title: '<span class="text-3xl">₿</span> Makro Analytik',
        btn: 'Analyzovať Makro Cyklus',
        loading: ["Počítam 4-ročné fraktály...", "Vyhodnocujem indikátory...", "Skórujem fázu trhu...", "Generujem AI verdikt..."],
        bottom: "Dno Cyklu",
        top: "Vrchol Cyklu",
        score: "Skóre",
        error: "❌ Chyba pripojenia. Backend sa prebúdza. Skúste znova o 10s."
    }
};

function setLang(lang) {
    currentLang = lang;
    
    if (lang === 'EN') {
        document.getElementById('lang-en').className = "px-2 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition";
        document.getElementById('lang-sk').className = "px-2 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    } else {
        document.getElementById('lang-sk').className = "px-2 py-1 rounded-md bg-[#F7931A] text-black font-bold text-xs transition";
        document.getElementById('lang-en').className = "px-2 py-1 rounded-md text-neutral-400 hover:text-white font-bold text-xs transition";
    }
    
    document.getElementById('main-title').innerHTML = i18n[lang].title;
    document.getElementById('btn').innerText = i18n[lang].btn;
    
    if (!document.getElementById('output').classList.contains('hidden')) {
        analyze();
    }
}

document.addEventListener('touchstart', function(e) {
    if (e.target.tagName !== 'CANVAS') {
        const charts = [priceChartInstance, rsiChartInstance, scoreChartInstance];
        charts.forEach(chart => {
            if (chart) {
                chart.tooltip.setActiveElements([], {x:0,y:0});
                chart.update();
            }
        });
    }
});
document.addEventListener('click', function(e) {
    if (e.target.tagName !== 'CANVAS') {
        const charts = [priceChartInstance, rsiChartInstance, scoreChartInstance];
        charts.forEach(chart => {
            if (chart) {
                chart.tooltip.setActiveElements([], {x:0,y:0});
                chart.update();
            }
        });
    }
});

async function analyze() {
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const divider = document.getElementById("divider");
  const btn = document.getElementById("btn");

  output.classList.add("hidden");
  divider.classList.add("hidden");
  btn.disabled = true;
  btn.classList.add("opacity-50");
  
  spinner.classList.remove("hidden");
  
  const loadingMessages = i18n[currentLang].loading;
  let msgIndex = 0;
  spinner.innerText = loadingMessages[0];
  
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= loadingMessages.length) msgIndex = loadingMessages.length - 1;
      spinner.innerText = loadingMessages[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ language: currentLang }) 
    });

    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    const colorClass = data.change > 0 ? "text-green-500" : (data.change < 0 ? "text-red-500" : "text-neutral-400");
    const sign = data.change > 0 ? "+" : "";
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let rawAnalysis = data.analysis;
    let phaseTextInternal = data.phase || "ANALYZING..."; 
    
    let phaseMatch = rawAnalysis.match(/PHASE:\s*(.*)/i);
    if (phaseMatch) {
        phaseTextInternal = phaseMatch[1].trim().toUpperCase();
        rawAnalysis = rawAnalysis.replace(phaseMatch[0], '').trim(); 
    }

    let displayPhaseText = phaseTextInternal;
    if (currentLang === 'SK') {
        if (phaseTextInternal.includes("BULL MARKET")) displayPhaseText = "BÝČÍ TRH";
        else if (phaseTextInternal.includes("BEAR MARKET")) displayPhaseText = "MEDVEDÍ TRH";
        else if (phaseTextInternal.includes("ACCUMULATION") || phaseTextInternal.includes("START")) displayPhaseText = "ŠTART BÝČIEHO TRHU / AKUMULÁCIA";
        else if (phaseTextInternal.includes("DISTRIBUTION")) displayPhaseText = "DISTRIBÚCIA (VAROVANIE)";
    }

    let phaseBadgeColor = "bg-neutral-800 text-neutral-300 border-neutral-700"; 
    if (phaseTextInternal.includes("BULL")) {
        phaseBadgeColor = "bg-green-900/20 text-green-400 border-green-800/30"; 
    } else if (phaseTextInternal.includes("BEAR")) {
        phaseBadgeColor = "bg-red-900/20 text-red-400 border-red-800/30"; 
    } else if (phaseTextInternal.includes("ACCUMULATION") || phaseTextInternal.includes("START")) {
        phaseBadgeColor = "bg-amber-950/40 text-amber-500 border-amber-900/50"; 
    } else if (phaseTextInternal.includes("DISTRIBUTION")) {
        phaseBadgeColor = "bg-orange-900/20 text-[#F7931A] border-[#F7931A]/30"; 
    }

    const score = data.cycle_score || 0;
    let scoreColor = "bg-[#F7931A]"; 

    let finalHTML = `
      <div class="bg-neutral-900 p-5 rounded-2xl border border-neutral-800 shadow-md">
        <div class="flex justify-between items-center mb-4">
            <div class="text-neutral-500 text-xs font-bold uppercase tracking-widest">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md border uppercase text-right tracking-wide">${displayPhaseText}</div>
        </div>
        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-6">
          <span class="text-4xl sm:text-5xl font-bold tracking-tight text-white">$${formattedPrice}</span>
          <span class="${colorClass} text-xl font-semibold">${sign}${data.change.toFixed(2)}%</span>
        </div>
        
        <div class="mb-5">
            <div class="flex justify-between text-xs text-neutral-500 font-bold uppercase tracking-wider mb-2">
                <span>${i18n[currentLang].bottom}</span>
                <span class="text-[#F7931A]">${i18n[currentLang].score}: ${score}%</span>
                <span>${i18n[currentLang].top}</span>
            </div>
            <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden">
                <div class="h-full ${scoreColor} transition-all duration-1000 ease-out" style="width: ${score}%"></div>
            </div>
        </div>
        
        <div class="space-y-6">
            <div class="w-full h-48 relative border-t border-neutral-800 pt-8">
                <div class="text-xs text-neutral-400 font-bold mb-1 absolute top-3 left-0 z-10">Price (Clean)</div>
                <canvas id="priceChart"></canvas>
            </div>
            
            <div class="w-full h-32 relative border-t border-neutral-800 pt-8">
                <div class="text-xs text-neutral-400 font-bold mb-1 absolute top-3 left-0 z-10">Weekly RSI (14)</div>
                <canvas id="rsiChart"></canvas>
            </div>
            
            <div class="w-full h-32 relative border-t border-neutral-800 pt-8">
                <div class="text-xs text-neutral-400 font-bold mb-1 absolute top-3 left-0 z-10">Market Cycle Score (0-100%)</div>
                <canvas id="scoreChart"></canvas>
            </div>
        </div>
      </div>
    `;

    const parts = rawAnalysis.split('**');
    for (let i = 1; i < parts.length; i += 2) {
      if (parts[i] && parts[i + 1]) {
        const title = parts[i].trim();
        let content = parts[i + 1].trim().replace(/^- /gm, '').replace(/\n/g, '<br><br>');
        content = content.replace(/(<br>\s*){3,}/g, '<br><br>'); 

        let boxStyle = "bg-neutral-900 border-neutral-800";
        let titleStyle = "text-[#F7931A]"; 
        
        let t = title.toUpperCase();
        let c = content.toUpperCase();

        if (t.includes("TARGET") || t.includes("CIELE")) {
            boxStyle = "bg-[#F7931A]/10 border-[#F7931A]/30";
            titleStyle = "text-[#F7931A] font-black uppercase tracking-wider";
        }
        
        if (t.includes("VERDICT") || t.includes("VERDIKT")) {
            if (c.includes("BUY") || c.includes("KÚPIŤ") || c.includes("DCA") || phaseTextInternal.includes("BULL") || phaseTextInternal.includes("ACCUMULATION")) {
                boxStyle = "bg-green-900/10 border-green-800/30"; 
                titleStyle = "text-green-500 font-black uppercase tracking-wider";
            } else if (c.includes("SELL") || c.includes("PREDAŤ") || phaseTextInternal.includes("BEAR") || phaseTextInternal.includes("DISTRIBUTION")) {
                boxStyle = "bg-red-900/10 border-red-800/30"; 
                titleStyle = "text-red-500 font-black uppercase tracking-wider";
            } else {
                boxStyle = "bg-[#F7931A]/10 border-[#F7931A]/30";
                titleStyle = "text-[#F7931A] font-black uppercase tracking-wider";
            }
        }

        finalHTML += `
          <div class="${boxStyle} p-5 rounded-2xl border shadow-md">
            <h2 class="${titleStyle} text-sm sm:text-base font-bold mb-3">${title}</h2>
            <div class="text-neutral-300 text-sm leading-relaxed">${content}</div>
          </div>
        `;
      }
    }

    output.innerHTML = finalHTML;
    divider.classList.remove("hidden");
    output.classList.remove("hidden");
    
    if (data.chart_dates.length > 0 && data.chart_prices.length > 0) {
        Chart.defaults.color = '#737373';
        Chart.defaults.font.size = 10;
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { displayColors: false, backgroundColor: '#1a1a1a', borderColor: '#333', borderWidth: 1 } },
            scales: { x: { display: false }, y: { display: false } }, layout: { padding: 0 },
            interaction: { mode: 'index', intersect: false }
        };

        if (priceChartInstance) priceChartInstance.destroy();
        priceChartInstance = new Chart(document.getElementById('priceChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'Price', data: data.chart_prices, borderColor: '#F7931A', borderWidth: 2, tension: 0.1, pointRadius: 0 }
                ]
            },
            options: { ...commonOptions, scales: { x: { display: false }, y: { display: false, type: 'logarithmic' } } }
        });

        if (rsiChartInstance) rsiChartInstance.destroy();
        const rsi70 = new Array(data.chart_dates.length).fill(70);
        const rsi30 = new Array(data.chart_dates.length).fill(30);
        rsiChartInstance = new Chart(document.getElementById('rsiChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'RSI', data: data.chart_rsi, borderColor: '#F7931A', borderWidth: 1.5, tension: 0.1, pointRadius: 0 },
                    { label: 'Overbought', data: rsi70, borderColor: '#ef4444', borderWidth: 1, borderDash: [5, 5], pointRadius: 0 },
                    { label: 'Oversold', data: rsi30, borderColor: '#22c55e', borderWidth: 1, borderDash: [5, 5], pointRadius: 0 }
                ]
            },
            options: { ...commonOptions, scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } } }
        });

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(document.getElementById('scoreChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.chart_dates,
                datasets: [
                    { label: 'Cycle Score %', data: data.chart_score, borderColor: '#F7931A', backgroundColor: 'rgba(247, 147, 26, 0.1)', fill: true, borderWidth: 1.5, tension: 0.2, pointRadius: 0 }
                ]
            },
            options: { ...commonOptions, scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } } }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    output.classList.remove("hidden");
    output.innerHTML = `
      <div class="bg-neutral-900 p-5 rounded-2xl border border-red-900/50">
        <span class="text-red-500 font-bold block text-center">${i18n[currentLang].error}</span>
      </div>`;
  }

  btn.disabled = false;
  btn.classList.remove("opacity-50");
}
</script>

</body>
</html>
