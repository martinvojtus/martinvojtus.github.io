<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: black; color: white; }
    </style>
</head>
<body class="flex justify-center min-h-screen items-start pt-6 pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <div id="spinner" class="flex flex-col items-center justify-center mt-32 space-y-4">
        <div class="w-8 h-8 border-4 border-[#FFFF00]/20 border-t-[#FFFF00] rounded-full animate-spin"></div>
        <div id="loading-text" class="text-center text-[#FFFF00] text-[0.6rem] tracking-widest uppercase">ANALYZING MACRO CYCLES...</div>
    </div>

    <div id="error-box" class="hidden bg-pink-900/20 border border-pink-900 p-4 rounded-xl text-pink-500 text-[0.6rem] tracking-widest uppercase text-center mt-10"></div>

    <div id="output" class="hidden flex flex-col pt-1"></div>

    <footer id="footer" class="hidden text-center text-[0.6rem] text-neutral-500 mt-12 tracking-[0.25em] uppercase">
        MARTIN VOJTUŠ &copy; 2026 &bull; BUILD V1.0.0
    </footer>

</div>

<script>
let scoreChartInstance = null;
let spinnerInterval = null;
window.currentScoreData = { score: 0, colorClass: "" };

const loadingMsgs = [
    "ACCESSING LIQUIDITY...", 
    "CALCULATING LOG-REG...", 
    "MAPPING CYCLES...", 
    "GENERATING STRATEGY..."
];

// 1. Zameriavač 
const crosshairPlugin = {
  id: 'crosshair',
  afterDraw: chart => {
    const activeElements = chart.getActiveElements();
    if (activeElements.length > 0) {
      let activePoint = activeElements[0];
      let x = activePoint.element.x;
      let yAxis = chart.scales.y;
      let xAxis = chart.scales.x;
      let ctx = chart.ctx;
      
      ctx.save();
      
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();

      let xLabel = chart.data.labels[activePoint.index];
      if (xLabel) {
          ctx.fillStyle = '#171717'; 
          // Základná hrúbka fontu pre zameriavač
          ctx.font = 'normal 9.6px sans-serif'; 
          let textWidth = ctx.measureText(xLabel).width;
          let boxY = yAxis.bottom + 4; 
          let boxX = x - (textWidth + 16)/2;
          
          if (boxX < xAxis.left) boxX = xAxis.left;
          if (boxX + textWidth + 16 > xAxis.right) boxX = xAxis.right - textWidth - 16;
          
          ctx.fillRect(boxX, boxY, textWidth + 16, 20);
          ctx.strokeStyle = '#525252'; ctx.strokeRect(boxX, boxY, textWidth + 16, 20);
          ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(xLabel, boxX + (textWidth + 16)/2, boxY + 10);
      }

      let val = activePoint.element.$context.parsed.y;
      let scoreDiv = document.getElementById('dynamic-score');
      let titleDiv = document.getElementById('dynamic-title');
      
      if (scoreDiv) {
          // Color update to Neon Pink/Neon Yellow
          let scoreHex = val <= 20 ? "#22c55e" : (val >= 80 ? "#EC4899" : "#FFFF00");
          scoreDiv.innerText = val.toFixed(1) + '%';
          scoreDiv.style.color = scoreHex;
          if (titleDiv) titleDiv.style.color = scoreHex;
      }

      ctx.restore();
    }
  }
};

// 2. Efekty: Gulička na konci
const visualsPlugin = {
    id: 'visualsPlugin',
    afterDatasetsDraw: chart => {
        const ctx = chart.ctx;
        const meta = chart.getDatasetMeta(0);
        if (!meta.data || meta.data.length === 0) return;
        
        const lastPoint = meta.data[meta.data.length - 1];
        const val = chart.data.datasets[0].data[chart.data.datasets[0].data.length - 1];
        // Color update to Neon Pink/Neon Yellow
        let dotColor = val <= 20 ? '#22c55e' : (val >= 80 ? '#EC4899' : '#FFFF00');
        
        ctx.save();
        ctx.beginPath();
        ctx.arc(lastPoint.x, lastPoint.y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = dotColor;
        ctx.fill();
        ctx.restore();
    }
};

Chart.register(crosshairPlugin, visualsPlugin);

function hideTooltips() {
    if (scoreChartInstance) { 
        scoreChartInstance.setActiveElements([]); 
        scoreChartInstance.update(); 
        let scoreDiv = document.getElementById('dynamic-score');
        let titleDiv = document.getElementById('dynamic-title');
        
        if (scoreDiv && window.currentScoreData) {
            scoreDiv.innerText = Number(window.currentScoreData.score).toFixed(1) + '%';
            scoreDiv.style.color = window.currentScoreData.rawColor;
            if (titleDiv) titleDiv.style.color = window.currentScoreData.rawColor;
        }
    }
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

async function analyze() {
  const spinner = document.getElementById("spinner");
  const loadingText = document.getElementById("loading-text");
  const output = document.getElementById("output");
  const errorBox = document.getElementById("error-box");
  const footer = document.getElementById("footer");

  let msgIndex = 0;
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= loadingMsgs.length) msgIndex = 0;
      loadingText.innerText = loadingMsgs[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"}
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const sign = data.change > 0 ? "+" : "";
    // Price change to Neon Pink text
    const colorClass = data.change > 0 ? "text-[#22c55e]" : (data.change < 0 ? "text-pink-500" : "text-neutral-500");
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const score = data.cycle_score || 0;
    
    // Zone colors to Neon Pink/Neon Yellow
    let scoreHex = score <= 20 ? "#22c55e" : (score >= 80 ? "#EC4899" : "#FFFF00");

    let dashboardStyle = "bg-neutral-900 border-neutral-800"; 
    if (score <= 20) dashboardStyle = "bg-[#030a05] border border-[#22c55e]/30"; 
    else if (score >= 80) dashboardStyle = "bg-[#EC4899]/5 border border-[#EC4899]/30"; 
    else dashboardStyle = "bg-[#FFFF00]/5 border border-[#FFFF00]/30"; 
    
    let phaseBadgeColor = "text-white border border-white/20"; 
    if (score <= 20) phaseBadgeColor = "bg-[#030a05] text-[#22c55e] border border-[#22c55e]/50"; 
    else if (score >= 80) phaseBadgeColor = "bg-[#EC4899]/10 text-[#EC4899] border border-[#EC4899]/50"; 
    else phaseBadgeColor = "bg-[#FFFF00]/10 text-[#FFFF00] border border-[#FFFF00]/50"; 

    window.currentScoreData = { score: score, rawColor: scoreHex };

    let finalHTML = `
      <div class="relative w-full mb-0">
          <div class="flex justify-between items-center px-1 mb-2 text-[0.6rem] uppercase tracking-widest">
              <div id="dynamic-title" style="color: ${scoreHex}" class="transition-colors duration-150">SCORE</div>
              <div id="dynamic-score" style="color: ${scoreHex}" class="transition-colors duration-150">${score.toFixed(1)}%</div>
          </div>
          <div class="h-56 w-full relative">
              <canvas id="scoreChart"></canvas>
          </div>
      </div>

      <div class="p-6 rounded-3xl ${dashboardStyle} mt-0">
          
        <div class="flex justify-between items-center mb-6 text-[0.6rem] uppercase tracking-widest">
            <div class="text-neutral-500">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} px-3 py-1.5 rounded-md">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-start mb-8 gap-4">
            <div>
                <div class="text-[1.8rem] font-bold leading-none tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-[0.6rem] uppercase tracking-widest mt-2 flex items-center gap-1.5">
                    ${sign}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded">24H</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[1.8rem] font-bold leading-none" style="color: ${scoreHex}">${score.toFixed(1)}%</div>
                <div class="text-[0.6rem] text-neutral-500 uppercase tracking-widest mt-2">SCORE</div>
            </div>
        </div>
        
        <div>
            <div class="w-full bg-neutral-800 h-1.5 rounded-full overflow-hidden mb-5">
                <div class="h-full transition-all duration-1000 ease-out" style="width: ${score}%; background-color: ${scoreHex}"></div>
            </div>
            <div class="flex flex-col gap-3 text-[0.6rem] text-neutral-400 uppercase tracking-widest px-1">
                <div class="flex items-center gap-2.5"><div class="w-2 h-2 rounded-full bg-[#22c55e] shrink-0"></div><span class="text-white">0% - 20%</span> &bull; VALUE ZONE (DCA IN)</div>
                <div class="flex items-center gap-2.5"><div class="w-2 h-2 rounded-full bg-[#FFFF00] shrink-0"></div><span class="text-white">21% - 79%</span> &bull; NEUTRAL ZONE (HODL)</div>
                <div class="flex items-center gap-2.5"><div class="w-2 h-2 rounded-full bg-[#EC4899] shrink-0"></div><span class="text-white">80% - 100%</span> &bull; EXIT ZONE (DCA OUT)</div>
            </div>
        </div>
      </div>
    `;

    output.innerHTML = finalHTML;
    output.classList.remove("hidden");
    footer.classList.remove("hidden");
    
    const limit = -143;
    const chartDates = data.chart_dates.slice(limit);
    const chartScore = data.chart_score.slice(limit);

    if (chartDates.length > 0 && chartScore.length > 0) {
        Chart.defaults.color = '#525252'; 
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.font.size = 9.6; 
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            layout: { padding: { left: 0, right: 0, top: 5, bottom: 28 } },
            interaction: { mode: 'index', intersect: false }
        };

        const xAxisConfig = { 
            display: true, 
            grid: { display: false, drawBorder: false }, 
            border: { display: false },
            ticks: { display: false } 
        };

        let ctxScore = document.getElementById('scoreChart').getContext('2d');

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(ctxScore, {
            type: 'line',
            data: {
                labels: chartDates,
                datasets: [{ 
                    data: chartScore, 
                    fill: false,
                    borderWidth: 0.75, 
                    tension: 0.6, 
                    pointRadius: 0,
                    // Chart gradient to Neon Pink/Neon Yellow
                    borderColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return;
                        const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                        gradient.addColorStop(0, '#22c55e'); 
                        gradient.addColorStop(0.20, '#22c55e'); 
                        gradient.addColorStop(0.30, '#FFFF00'); 
                        gradient.addColorStop(0.70, '#FFFF00'); 
                        gradient.addColorStop(0.80, '#EC4899'); 
                        gradient.addColorStop(1, '#EC4899');    
                        return gradient;
                    }
                }]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, 
                        position: 'right', 
                        min: 0, 
                        max: 100, 
                        grid: { 
                            // Grid colors and borderDash update
                            color: function(context) {
                                let v = context.tick.value;
                                let op = 0.1; 
                                
                                if (v === 0 || v === 100) op = 0.05; 
                                else if (v === 20 || v === 80) op = 0.2; 

                                if (v <= 20) return `rgba(34, 197, 94, ${op})`;     
                                if (v < 80) return `rgba(255, 255, 0, ${op})`;     // Neon Yellow RGBA
                                return `rgba(236, 72, 153, ${op})`;                  // Neon Pink RGBA
                            }, 
                            drawBorder: false, 
                            tickLength: 0,
                            // Definovanie čiarkovanej mriežky (Dashed grid lines)
                            borderDash: [4, 4]
                        },
                        border: {
                            display: false,
                            // Also dashed for borders
                            dash: [4, 4]
                        },
                        ticks: { display: false, stepSize: 10 } 
                    } 
                } 
            }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = "❌ CONNECTION ERROR. PLEASE REFRESH THE PAGE.";
    errorBox.classList.remove("hidden");
  }
}

window.addEventListener('DOMContentLoaded', analyze);
</script>
</body>
</html>
