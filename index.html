<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-black text-white flex justify-center min-h-screen items-start pt-2 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <div id="spinner" class="text-center text-[#F7931A] font-bold mt-32 h-6 text-xs tracking-widest uppercase">INITIALIZING V₿$X...</div>
    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-20 text-xs"></div>

    <div id="output" class="hidden flex flex-col gap-6"></div>

    <footer id="footer" class="hidden text-center text-[9px] text-neutral-500 font-bold mt-12 border-t border-neutral-900 pt-6 tracking-[0.25em] whitespace-nowrap uppercase">
        MARTIN VOJTUŠ &copy; 2026 &bull; BUILD V1.0.0
    </footer>

</div>

<script>
let scoreChartInstance = null;
let spinnerInterval = null;

const loadingMsgs = [
    "ACCESSING LIQUIDITY...", 
    "CALCULATING LOG-REG...", 
    "MAPPING CYCLES...", 
    "GENERATING STRATEGY..."
];

// Zameriavač s hodnotami kreslenými dovnútra grafu (zabraňuje orezaniu a prázdnym miestam)
const crosshairPlugin = {
  id: 'crosshair',
  afterDraw: chart => {
    const activeElements = chart.getActiveElements();
    if (activeElements.length > 0) {
      let activePoint = activeElements[0];
      let x = activePoint.element.x;
      let y = activePoint.element.y;
      let yAxis = chart.scales.y;
      let xAxis = chart.scales.x;
      let ctx = chart.ctx;
      
      ctx.save();
      
      // Vertikálna a Horizontálna čiara
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(xAxis.left, y); ctx.lineTo(xAxis.right, y);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();

      // Štítok X (Dátum) ukotvený DOVNÚTRA (hore od spodnej hrany)
      let xLabel = chart.data.labels[activePoint.index];
      if (xLabel) {
          ctx.fillStyle = '#171717'; ctx.font = 'bold 9px sans-serif';
          let textWidth = ctx.measureText(xLabel).width;
          let boxY = yAxis.bottom - 20; // 20px nad spodným okrajom
          let boxX = x - (textWidth + 16)/2;
          
          if (boxX < xAxis.left) boxX = xAxis.left + 2;
          if (boxX + textWidth + 16 > xAxis.right) boxX = xAxis.right - textWidth - 18;
          
          ctx.fillRect(boxX, boxY, textWidth + 16, 18);
          ctx.strokeStyle = '#525252'; ctx.strokeRect(boxX, boxY, textWidth + 16, 18);
          ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(xLabel, boxX + (textWidth + 16)/2, boxY + 9);
      }

      // Štítok Y (Hodnota v %) ukotvený DOVNÚTRA (vľavo od pravej hrany)
      let val = activePoint.element.$context.parsed.y;
      let yLabel = val.toFixed(0) + '%';
      
      ctx.fillStyle = '#171717'; ctx.font = 'bold 9px sans-serif';
      let yTextWidth = ctx.measureText(yLabel).width;
      let yBoxX = xAxis.right - yTextWidth - 18; // 18px doľava od pravého okraja
      
      ctx.fillRect(yBoxX, y - 9, yTextWidth + 16, 18);
      ctx.strokeStyle = '#525252'; ctx.strokeRect(yBoxX, y - 9, yTextWidth + 16, 18);
      ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(yLabel, yBoxX + (yTextWidth + 16)/2, y);

      ctx.restore();
    }
  }
};

Chart.register(crosshairPlugin);

function hideTooltips() {
    if (scoreChartInstance) { 
        scoreChartInstance.setActiveElements([]); 
        scoreChartInstance.update(); 
    }
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

async function analyze() {
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const errorBox = document.getElementById("error-box");
  const footer = document.getElementById("footer");

  let msgIndex = 0;
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= loadingMsgs.length) msgIndex = 0;
      spinner.innerText = loadingMsgs[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"}
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const colorClass = data.change > 0 ? "text-[#22c55e]" : (data.change < 0 ? "text-red-500" : "text-neutral-400");
    const sign = data.change > 0 ? "+" : "";
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const score = data.cycle_score || 0;
    
    let scoreColor = score <= 20 ? "bg-[#22c55e]" : (score >= 75 ? "bg-red-500" : "bg-[#F7931A]");
    let scoreTextColor = score <= 20 ? "text-[#22c55e]" : (score >= 75 ? "text-red-500" : "text-[#F7931A]");
    let phaseBadgeColor = score <= 20 ? "bg-[#030a05] text-[#22c55e] border border-[#22c55e]/60 shadow-[0_0_15px_rgba(34,197,94,0.25)]" : (score >= 75 ? "bg-red-900/30 text-red-400 border border-red-500/60 shadow-[0_0_15px_rgba(239,68,68,0.25)]" : "bg-orange-900/30 text-[#F7931A] border border-[#F7931A]/60 shadow-[0_0_15px_rgba(247,147,26,0.25)]");

    // Zvýraznenie **tučného textu** v jednom kroku
    let formattedContent = data.analysis
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/\n/g, '<br>');

    // Štýlovanie tej JEDINEJ tabuľky
    let boxStyle = "bg-neutral-900 border-neutral-800 shadow-lg";
    let titleStyle = "text-white"; 
    if (score <= 20) {
        boxStyle = "bg-[#030a05] border-[#22c55e]/60 shadow-[0_0_25px_rgba(34,197,94,0.25)]"; titleStyle = "text-[#22c55e]";
    } else if (score >= 75) {
        boxStyle = "bg-red-900/30 border-red-500/60 shadow-[0_0_25px_rgba(239,68,68,0.25)]"; titleStyle = "text-red-400";
    } else {
        boxStyle = "bg-orange-900/30 border-[#F7931A]/60 shadow-[0_0_25px_rgba(247,147,26,0.25)]"; titleStyle = "text-[#F7931A]";
    }

    let finalHTML = `
      <div class="bg-neutral-900 p-6 rounded-3xl border border-neutral-800 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-extrabold tracking-tighter text-white flex items-center gap-1">
                V<span class="text-[#F7931A]">₿</span><span class="text-[#22c55e]">$</span>X
            </h1>
            <div class="${phaseBadgeColor} text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md uppercase tracking-wide">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-center mb-8 whitespace-nowrap">
            <div>
                <div class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-xs sm:text-sm font-semibold mt-1 flex items-center gap-1">
                    ${sign}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded text-[9px] uppercase tracking-wider ml-1">24H</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-3xl sm:text-4xl font-black ${scoreTextColor}">${score}%</div>
                <div class="text-[10px] text-neutral-500 uppercase font-bold tracking-widest mt-1">SCORE</div>
            </div>
        </div>
        
        <div>
            <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden mb-3">
                <div class="h-full ${scoreColor} transition-all duration-1000 ease-out" style="width: ${score}%"></div>
            </div>
            <div class="flex flex-col gap-2 text-[10px] sm:text-xs text-neutral-500 font-bold tracking-wider px-1">
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#22c55e] shrink-0"></div><span>0% - 20% &bull; VALUE ZONE (DCA IN)</span></div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#F7931A] shrink-0"></div><span>21% - 74% &bull; GROWTH ZONE (HODL)</span></div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-red-500 shrink-0"></div><span>75% - 100% &bull; EXIT ZONE (DCA OUT)</span></div>
            </div>
        </div>
      </div>

      <div class="relative w-full h-[220px] mt-4 mb-4">
          <div class="absolute top-0 left-2 text-[10px] font-bold text-[#F7931A] uppercase tracking-widest z-10">V₿$X Cycle Score (0-100%)</div>
          <canvas id="scoreChart"></canvas>
      </div>

      <div class="p-6 rounded-3xl border transition-all duration-500 ${boxStyle}">
        <h2 class="${titleStyle} text-xs font-bold mb-4 uppercase tracking-[0.15em]">V₿$X VERDICT & STRATEGY</h2>
        <div class="text-neutral-300 text-sm leading-loose">${formattedContent}</div>
      </div>
    `;

    output.innerHTML = finalHTML;
    output.classList.remove("hidden");
    footer.classList.remove("hidden");
    
    // LIMIT DÁT NA POSLEDNÝCH 1000 DNÍ
    const limit = -143;
    const chartDates = data.chart_dates.slice(limit);
    const chartScore = data.chart_score.slice(limit);

    if (chartDates.length > 0 && chartScore.length > 0) {
        Chart.defaults.color = '#525252'; 
        Chart.defaults.font.size = 9;
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            layout: { padding: 0 }, // Žiadny vnútorný okraj, 100% využitie šírky
            interaction: { mode: 'index', intersect: false }
        };

        const xAxisConfig = { display: true, grid: { display: false, drawBorder: false }, ticks: { display: false } };

        let ctxScore = document.getElementById('scoreChart').getContext('2d');
        let gradientStroke = ctxScore.createLinearGradient(0, 180, 0, 0); 
        gradientStroke.addColorStop(0, '#22c55e');    
        gradientStroke.addColorStop(0.3, '#22c55e');  
        gradientStroke.addColorStop(0.6, '#F7931A');  
        gradientStroke.addColorStop(0.8, '#ef4444');  
        gradientStroke.addColorStop(1, '#ef4444');    

        let gradientFill = ctxScore.createLinearGradient(0, 180, 0, 0);
        gradientFill.addColorStop(0, 'rgba(34, 197, 94, 0.15)');
        gradientFill.addColorStop(0.5, 'rgba(247, 147, 26, 0.1)');
        gradientFill.addColorStop(1, 'rgba(239, 68, 68, 0.15)');

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(ctxScore, {
            type: 'line',
            data: {
                labels: chartDates,
                datasets: [{ data: chartScore, borderColor: gradientStroke, backgroundColor: gradientFill, fill: true, borderWidth: 1.0, tension: 0.6, pointRadius: 0 }]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: xAxisConfig, 
                    y: { 
                        display: true, position: 'right', min: 0, max: 100, 
                        grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false, tickLength: 0 }, 
                        ticks: { display: false } 
                    } 
                } 
            }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = "❌ CONNECTION ERROR. RELOAD IN 15S.";
    errorBox.classList.remove("hidden");
  }
}

// Spustenie analýzy okamžite po načítaní okna
window.addEventListener('DOMContentLoaded', analyze);
</script>
</body>
</html>
