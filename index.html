<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-black text-white flex justify-center min-h-screen items-start pt-6 font-sans pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <div id="spinner" class="text-center text-[#F7931A] font-bold mt-20 h-6 text-xs tracking-widest uppercase">CALCULATING V₿$X CYCLES...</div>
    <div id="error-box" class="hidden bg-red-900/20 border border-red-900 p-4 rounded-xl text-red-500 font-bold text-center mt-10 text-xs"></div>

    <div id="output" class="hidden flex flex-col gap-6"></div>

    <footer id="footer" class="hidden text-center text-[9px] text-neutral-500 font-bold mt-12 border-t border-neutral-900 pt-6 tracking-[0.25em] whitespace-nowrap uppercase">
        MARTIN VOJTUŠ &copy; 2026 &bull; BUILD V1.0.0
    </footer>

</div>

<script>
let scoreChartInstance = null;
let spinnerInterval = null;
window.currentScoreData = { score: 0, colorClass: "" };

const loadingMsgs = [
    "ACCESSING LIQUIDITY...", 
    "CALCULATING LOG-REG...", 
    "MAPPING CYCLES...", 
    "GENERATING STRATEGY..."
];

const crosshairPlugin = {
  id: 'crosshair',
  afterDraw: chart => {
    const activeElements = chart.getActiveElements();
    if (activeElements.length > 0) {
      let activePoint = activeElements[0];
      let x = activePoint.element.x;
      let yAxis = chart.scales.y;
      let xAxis = chart.scales.x;
      let ctx = chart.ctx;
      
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();

      let xLabel = chart.data.labels[activePoint.index];
      if (xLabel) {
          ctx.fillStyle = '#171717'; ctx.font = 'bold 9px sans-serif';
          let textWidth = ctx.measureText(xLabel).width;
          let boxY = yAxis.bottom - 16; // VTLAČENÉ DOVNÚTRA - nulová medzera pod grafom
          let boxX = x - (textWidth + 12)/2;
          
          if (boxX < xAxis.left) boxX = xAxis.left;
          if (boxX + textWidth + 12 > xAxis.right) boxX = xAxis.right - textWidth - 12;
          
          ctx.fillRect(boxX, boxY, textWidth + 12, 14);
          ctx.strokeStyle = '#525252'; ctx.strokeRect(boxX, boxY, textWidth + 12, 14);
          ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(xLabel, boxX + (textWidth + 12)/2, boxY + 7);
      }

      let val = activePoint.element.$context.parsed.y;
      let scoreDiv = document.getElementById('dynamic-score');
      let titleDiv = document.getElementById('dynamic-title');
      if (scoreDiv) {
          let color = val <= 20 ? "#22c55e" : (val >= 75 ? "#ff1493" : "#38bdf8");
          scoreDiv.innerText = val.toFixed(1) + '%';
          scoreDiv.style.color = color;
          if (titleDiv) titleDiv.style.color = color;
      }
      ctx.restore();
    }
  }
};

const visualsPlugin = {
    id: 'visualsPlugin',
    afterDatasetsDraw: chart => {
        const ctx = chart.ctx;
        const meta = chart.getDatasetMeta(0);
        if (!meta.data || meta.data.length === 0) return;
        const lastPoint = meta.data[meta.data.length - 1];
        const val = chart.data.datasets[0].data[chart.data.datasets[0].data.length - 1];
        let dotColor = val <= 20 ? '#22c55e' : (val >= 75 ? '#ff1493' : '#38bdf8');
        ctx.save();
        ctx.beginPath();
        ctx.arc(lastPoint.x, lastPoint.y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = dotColor;
        ctx.fill();
        ctx.restore();
    }
};

Chart.register(crosshairPlugin, visualsPlugin);

function hideTooltips() {
    if (scoreChartInstance) { 
        scoreChartInstance.setActiveElements([]); 
        scoreChartInstance.update(); 
        let scoreDiv = document.getElementById('dynamic-score');
        let titleDiv = document.getElementById('dynamic-title');
        if (scoreDiv && window.currentScoreData) {
            scoreDiv.innerText = window.currentScoreData.score + '%';
            scoreDiv.style.color = window.currentScoreData.rawColor;
            if (titleDiv) titleDiv.style.color = window.currentScoreData.rawColor;
        }
    }
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

async function analyze() {
  const spinner = document.getElementById("spinner");
  const output = document.getElementById("output");
  const errorBox = document.getElementById("error-box");
  const footer = document.getElementById("footer");

  let msgIndex = 0;
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= loadingMsgs.length) msgIndex = 0;
      spinner.innerText = loadingMsgs[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"}
    });
    const data = await res.json();
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    const score = data.cycle_score || 0;
    let scoreHex = score <= 20 ? "#22c55e" : (score >= 75 ? "#ff1493" : "#38bdf8");
    window.currentScoreData = { score: score, rawColor: scoreHex };

    let formattedContent = data.analysis
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/\n/g, '<br>');

    let finalHTML = `
      <div class="relative w-full mb-4">
          <div class="flex justify-between items-center px-1 mb-3 text-[10px] font-bold uppercase tracking-widest">
              <div id="dynamic-title" style="color: ${scoreHex}">CYCLE SCORE</div>
              <div id="dynamic-score" style="color: ${scoreHex}" class="font-black transition-colors duration-150">${score}%</div>
          </div>
          <div class="h-[180px] w-full relative">
              <canvas id="scoreChart"></canvas>
          </div>
      </div>

      <div class="bg-neutral-900 p-6 rounded-3xl border border-[#ff1493]/40 shadow-[0_0_20px_rgba(255,20,147,0.15)]">
        <div class="flex justify-between items-center mb-6">
            <div class="text-neutral-500 text-[10px] font-bold uppercase tracking-[0.15em]">${data.name} (${data.ticker})</div>
            <div class="text-[10px] font-bold px-3 py-1.5 rounded-md uppercase border border-white/20">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-center mb-8">
            <div>
                <div class="text-3xl sm:text-4xl font-extrabold tracking-tight">$${data.price.toLocaleString()}</div>
                <div class="${data.change > 0 ? 'text-[#22c55e]' : 'text-red-500'} text-xs font-semibold mt-1">${data.change > 0 ? '+' : ''}${data.change}%</div>
            </div>
            <div class="text-right">
                <div class="text-3xl sm:text-4xl font-black" style="color: ${scoreHex}">${score}%</div>
                <div class="text-[10px] text-neutral-500 uppercase font-bold tracking-widest mt-1">SCORE</div>
            </div>
        </div>
        
        <div class="space-y-3">
            <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden">
                <div class="h-full transition-all duration-1000" style="width: ${score}%; background-color: ${scoreHex}"></div>
            </div>
            <div class="flex flex-col gap-2 text-[10px] text-neutral-500 font-bold uppercase tracking-wider">
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#22c55e]"></div>0-20% &bull; VALUE ZONE (DCA IN)</div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#38bdf8]"></div>21-74% &bull; NEUTRAL ZONE (HODL)</div>
                <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#ff1493]"></div>75-100% &bull; EXIT ZONE (DCA OUT)</div>
            </div>
        </div>
      </div>

      <div class="p-6 rounded-3xl border border-white/10 bg-neutral-900 shadow-lg">
        <h2 class="text-xs font-bold mb-4 uppercase tracking-[0.15em] opacity-80">VERDICT & STRATEGY</h2>
        <div class="text-neutral-300 text-sm leading-loose">${formattedContent}</div>
      </div>
    `;

    output.innerHTML = finalHTML;
    output.classList.remove("hidden");
    footer.classList.remove("hidden");
    
    renderChart(data.chart_dates.slice(-143), data.chart_score.slice(-143));

  } catch (error) {
    clearInterval(spinnerInterval);
    errorBox.classList.remove("hidden");
  }
}

function renderChart(dates, scores) {
    let ctx = document.getElementById('scoreChart').getContext('2d');
    if (scoreChartInstance) scoreChartInstance.destroy();
    scoreChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: dates,
            datasets: [{ 
                data: scores, 
                fill: false, borderWidth: 1.5, tension: 0.6, pointRadius: 0,
                borderColor: function(context) {
                    const chart = context.chart;
                    const {ctx, chartArea} = chart;
                    if (!chartArea) return;
                    const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                    gradient.addColorStop(0, '#22c55e'); 
                    gradient.addColorStop(0.20, '#22c55e'); 
                    gradient.addColorStop(0.40, '#38bdf8'); 
                    gradient.addColorStop(0.74, '#38bdf8'); 
                    gradient.addColorStop(0.85, '#ff1493'); 
                    gradient.addColorStop(1, '#ff1493'); 
                    return gradient;
                }
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            layout: { padding: 0 },
            scales: { 
                x: { display: true, grid: { display: false }, ticks: { display: false } },
                y: { display: true, position: 'right', min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { display: false } }
            }
        }
    });
}

window.addEventListener('DOMContentLoaded', analyze);
</script>
</body>
</html>
