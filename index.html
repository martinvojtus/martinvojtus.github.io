<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Design Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 🎨 Globálne nastavenia podľa tvojich preferencií */
        body {
            font-family: 'Inter', sans-serif;
            font-weight: 400; /* Všetky písma sú regular */
            background-color: #fcfcfc;
            color: #1a1a1a;
        }

        /* 📏 Úprava malých písiem z 0.55rem na viditeľnejšiu veľkosť */
        .text-xs-custom {
            font-size: 0.75rem; 
        }

        .contact-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            transition: transform 0.2s ease;
        }

        input, textarea {
            border: 1px solid #d1d1d1;
            padding: 0.75rem;
            border-radius: 4px;
            width: 100%;
            font-weight: 400;
        }

        .btn-primary {
            background: #000;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        
        .btn-primary:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <nav class="p-6 flex justify-between items-center border-b border-gray-100">
        <div class="flex items-center gap-2">
            <div class="font-normal text-lg flex items-center gap-2">
                <span class="bg-black text-white p-1 px-2 rounded">MV</span>
                <span class="hidden sm:inline">Martin Vojtuš</span>
                <span class="sm:hidden text-xs-custom uppercase tracking-widest border-l pl-2">Design Showcase</span>
            </div>
        </div>
        <div class="flex gap-6 text-sm uppercase tracking-wider">
            <a href="#" class="hover:underline">Domov</a>
            <a href="#" class="hover:underline">Ateliér</a>
            <a href="#" class="font-medium underline underline-offset-4">Kontakt</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto py-16 px-6">
        <div class="grid md:grid-cols-2 gap-16">
            
            <section>
                <h1 class="text-4xl mb-8">Napíšte nám ✉️</h1>
                <form class="space-y-4">
                    <div>
                        <label class="block text-xs-custom uppercase mb-1">Meno a priezvisko</label>
                        <input type="text" placeholder="Vaše meno">
                    </div>
                    <div>
                        <label class="block text-xs-custom uppercase mb-1">Email</label>
                        <input type="email" placeholder="vas@email.com">
                    </div>
                    <div>
                        <label class="block text-xs-custom uppercase mb-1">Správa</label>
                        <textarea rows="5" placeholder="Ako vám môžeme pomôcť?"></textarea>
                    </div>
                    <button type="submit" class="btn-primary w-full sm:w-auto">Odoslať správu 🚀</button>
                </form>
            </section>

            <section class="flex flex-col justify-center">
                <div class="contact-card p-8 rounded-lg shadow-sm">
                    <h2 class="text-xl mb-6 font-normal">Kontaktné údaje 📞</h2>
                    
                    <div class="space-y-6">
                        <div class="flex items-start gap-4">
                            <i class="fa-solid fa-location-dot mt-1 text-gray-500"></i>
                            <div>
                                <p class="text-xs-custom uppercase text-gray-500">Adresa</p>
                                <p>1064 Calle Negocio suite E<br>San Clemente, CA 92673</p>
                            </div>
                        </div>

                        <div class="flex items-start gap-4">
                            <i class="fa-solid fa-phone mt-1 text-gray-500"></i>
                            <div>
                                <p class="text-xs-custom uppercase text-gray-500">Telefón</p>
                                <p>949-413-6689</p>
                            </div>
                        </div>

                        <div class="flex items-start gap-4">
                            <i class="fa-solid fa-envelope mt-1 text-gray-500"></i>
                            <div>
                                <p class="text-xs-custom uppercase text-gray-500">Email</p>
                                <p>m.vojtus@yahoo.com</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="mt-20 border-t border-gray-100 p-10 text-center">
        <p class="text-xs-custom text-gray-400 uppercase tracking-widest">
            © 2026 RenaEssence Dental Atelier ✨ Martin Vojtuš
        </p>
    </footer>

</body>
</html>
