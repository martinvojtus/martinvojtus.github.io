<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>martinvojtus — v6.8.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-start: #ffffff;
            --bg-end: #000000;
            --iphone-gray: #e0e0e0;
            --text-white: #ffffff;
            --unit: 1rem; 
            --f-btn: 2rem;
            --btn-height: 80px;
        }

        /* 🛠️ Core Reset */
        * { 
            box-sizing: border-box; 
            font-weight: 400 !important; 
            letter-spacing: normal !important; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            height: 100%; width: 100%; margin: 0;
            background-color: var(--bg-start);
            color: var(--text-white);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: var(--unit);
            animation: bodyDarken 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @keyframes bodyDarken { to { background-color: var(--bg-end); } }

        #white-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; opacity: 0; z-index: 100;
            pointer-events: none; transition: opacity 0.5s ease;
        }

        #frame {
            position: absolute; background-color: var(--iphone-gray); z-index: 10;
            width: 50vw; aspect-ratio: 1170 / 2532; border-radius: 8vw;
            animation: 
                flyIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                expandToBlack 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards;
        }

        @keyframes flyIn {
            0% { transform: translateY(110vh) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes expandToBlack { to { transform: scale(30); background-color: var(--bg-end); } }

        /* 🎨 LOGO */
        .logo-svg {
            position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
            fill: #000; z-index: 40; opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
            animation: 
                fadeInCenter 0.6s ease forwards 1.4s,
                moveLogo 1.2s cubic-bezier(0.65, 0, 0.35, 1) 2.2s forwards,
                logoToWhite 1.2s ease 2.2s forwards;
        }

        @keyframes fadeInCenter { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes logoToWhite { to { fill: var(--text-white); } }
        @keyframes moveLogo { to { transform: translate(-50%, calc(-50% - 40px - var(--unit) - var(--unit) - var(--unit) - 30px)) scale(1); } }

        .ui-element { position: absolute; left: 50%; z-index: 35; opacity: 0; transform: translateX(-50%); }

        @keyframes flyFromBottom {
            0% { transform: translate(-50%, 40px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        /* 🏷️ Horný text */
        .logo-text {
            bottom: calc(50% + 40px + var(--unit));
            font-size: var(--unit); text-transform: lowercase;
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.8s forwards;
        }

        /* 🔘 ENTER PILL */
        .pill {
            top: 50%; width: 320px; height: var(--btn-height); border-radius: var(--unit);
            display: flex; align-items: center; justify-content: center;
            background: var(--text-white); color: #000; border: none; cursor: pointer;
            overflow: hidden; position: absolute; left: 50%; transform: translate(-50%, -50%);
            z-index: 110; 
            animation: flyFromBottomCenter 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.95s forwards;
        }
        
        @keyframes flyFromBottomCenter {
            0% { transform: translate(-50%, 30px); opacity: 0; }
            100% { transform: translate(-50%, -50%); opacity: 1; }
        }

        .pill h1 { font-size: var(--f-btn); margin: 0; z-index: 2; transition: opacity 0.3s; text-transform: uppercase; }

        .loading-fill { position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: #000; z-index: 1; }
        .loading-active .loading-fill { width: 100%; transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

        /* 🏁 Footer - opravená viditeľnosť */
        footer {
            top: calc(50% + 40px + var(--unit));
            font-size: var(--unit); text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5); /* 👻 Nahrádza fixnú opacity pre zachovanie animácie */
            animation: flyFromBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 3.1s forwards;
        }

        #cookie-banner {
            position: fixed; bottom: var(--unit); left: 50%; transform: translate(-50%, 250px);
            width: calc(100% - 2rem); max-width: 380px;
            background: #ffffff; color: #000000; padding: var(--unit); 
            border-radius: var(--unit); z-index: 60; text-align: center;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        #cookie-banner.show { transform: translate(-50%, 0); }
        .cookie-text { font-size: var(--unit); margin-bottom: var(--unit); text-transform: lowercase; }
        .cookie-btns { display: flex; gap: var(--unit); }
        .c-btn { flex: 1; padding: 0.8rem; border-radius: var(--unit); border: none; font-size: 0.9rem; text-transform: lowercase; cursor: pointer; font-family: 'Space Grotesk', sans-serif; }
        .c-btn-accept { background: #000000; color: #ffffff; }
        .c-btn-decline { background: #e0e0e0; color: #000000; }

        .hidden { opacity: 0 !important; pointer-events: none; }
    </style>
</head>
<body>

    <div id="white-screen"></div>
    <div id="frame"></div>

    <svg id="logo-main" class="logo-svg" viewBox="-234 -135 468 405">
        <path d="M 0,0 L 233.827, -135 L 233.827, 135 L 0, 270 L -233.827, 135 L -233.827, -135 Z" />
    </svg>

    <div id="text-main" class="ui-element logo-text">martinvojtus • space</div>
    
    <button id="cosmos-btn" class="ui-element pill" onclick="handleFinalTransition()">
        <div class="loading-fill" id="fill"></div>
        <h1>ENTER</h1>
    </button>

    <footer id="footer-main" class="ui-element">BUILD V6.8.0 • 2026</footer>

    <div id="cookie-banner">
        <div class="cookie-text">cookies? 🍪</div>
        <div class="cookie-btns">
            <button class="c-btn c-btn-decline" onclick="hideCookies()">nie</button>
            <button class="c-btn c-btn-accept" onclick="hideCookies()">ano</button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('cookie-banner').classList.add('show');
        }, 4000);

        function hideCookies() {
            if ("vibrate" in navigator) navigator.vibrate(15);
            document.getElementById('cookie-banner').classList.remove('show');
        }

        function handleFinalTransition() {
            const btn = document.getElementById('cosmos-btn');
            const elements = ['logo-main', 'text-main', 'footer-main', 'cookie-banner'];
            
            if ("vibrate" in navigator) navigator.vibrate([30, 10, 30]);

            elements.forEach(id => document.getElementById(id).classList.add('hidden'));
            btn.querySelector('h1').style.opacity = '0';

            document.getElementById('white-screen').style.opacity = "1";
            btn.style.backgroundColor = "#e0e0e0";
            btn.style.pointerEvents = "none";

            setTimeout(() => {
                btn.classList.add('loading-active');
            }, 600);

            setTimeout(() => {
                window.location.replace("https://martinvojtus.github.io/ui.html");
            }, 2300);
        }
    </script>
</body>
</html>
