<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Vojtus — Všetky práva vyhradené</title>
    
    <style>
        /* ZACHOVANIE PÔVODNÉHO DIZAJNU */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 400; /* Všetky fonty Regular */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        /* HLAVIČKA S LOGOM */
        .header-section {
            margin-bottom: 40px;
        }

        .logo {
            width: 40px; /* Pôvodná veľkosť */
            margin-bottom: 10px;
        }

        .brand-title {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .author-name {
            font-size: 0.85rem; /* Upravené na 0.85rem pre viditeľnosť */
            opacity: 0.7;
            margin-top: 5px;
        }

        /* PILL-SHAPED TLAČIDLÁ */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            text-decoration: none;
            color: #fff;
            padding: 14px 45px;
            border-radius: 50px; /* Pill-shaped */
            font-size: 0.85rem;
            transition: all 0.2s ease;
            cursor: pointer;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
        }

        /* ŠPECIFICKÝ SOLANA BUTTON (Gradient Frame) */
        .solana-btn {
            border: 2px solid transparent;
            background-image: linear-gradient(#000, #000), linear-gradient(45deg, #00FFA3, #DC1FFF);
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        .solana-btn:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        /* LOADING BAR (SKRYTÝ NA ZAČIATKU) */
        #loader-overlay {
            display: none; /* Zobrazí sa až po kliknutí */
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loader-bar-bg {
            width: 180px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00FFA3, #DC1FFF);
            box-shadow: 0 0 10px rgba(0, 255, 163, 0.5);
        }

        @keyframes loadProgress {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* PÄTA */
        footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.85rem;
            opacity: 0.5;
        }

        /* SCHOVANIE HLAVNÉHO OBSAHU */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="main-content">
        <div class="header-section">
            <img src="logo.svg" alt="Logo" class="logo">
            <div class="brand-title">MagPulsor</div>
            <div class="author-name">Martin Vojtus</div>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="startLoading()">ENTER PORTFOLIO 🎨</button>
            
            <a href="#" class="btn solana-btn">DONATE SOLANA ⚡</a>
        </div>
    </div>

    <div id="loader-overlay">
        <div class="author-name">Načítavam Martin Vojtus...</div>
        <div class="loader-bar-bg">
            <div id="fill" class="loader-bar-fill"></div>
        </div>
    </div>

    <footer>
        Martin Vojtus — Všetky práva vyhradené
    </footer>

    <script>
        function startLoading() {
            // 1. Skryjeme hlavné menu
            document.getElementById('main-content').classList.add('hidden');
            
            // 2. Zobrazíme loading bar
            const overlay = document.getElementById('loader-overlay');
            overlay.style.display = 'flex';
            
            // 3. Spustíme animáciu plnenia
            const fill = document.getElementById('fill');
            fill.style.animation = 'loadProgress 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards';

            // 4. Po dokončení animácie presmerujeme
            setTimeout(() => {
                window.location.replace("https://www.cosmos.so/martinvojtus");
            }, 2700);
        }
    </script>

</body>
</html>
