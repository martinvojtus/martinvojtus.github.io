<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    </style>
</head>
<body class="font-['Inter'] bg-black text-white flex justify-center min-h-screen items-start pt-6 pb-10">

<div class="w-full max-w-xl p-5 space-y-4">

    <div id="spinner" class="flex flex-col items-center justify-center mt-32 space-y-4">
        <div class="w-8 h-8 border-4 border-neutral-600/50 border-t-white rounded-full animate-spin"></div>
        <div id="loading-text" class="text-center text-white text-[0.6rem] tracking-widest uppercase">ANALYZING MACRO CYCLES...</div>
    </div>

    <div id="error-box" class="hidden bg-pink-900/20 border border-pink-900 p-4 rounded-xl text-pink-500 text-[0.6rem] tracking-widest uppercase text-center mt-10"></div>

    <div id="output" class="hidden flex flex-col pt-1"></div>

    <footer id="footer" class="hidden text-center text-[0.6rem] text-neutral-500 mt-12 tracking-[0.25em] uppercase">
        MARTIN VOJTUŠ &copy; 2026 &bull; BUILD V1.0.0
    </footer>

</div>

<script>
let scoreChartInstance = null;
let spinnerInterval = null;
window.currentScoreData = { score: 0, colorClass: "" };

const loadingMsgs = [
    "ACCESSING LIQUIDITY...", 
    "CALCULATING LOG-REG...", 
    "MAPPING CYCLES...", 
    "GENERATING STRATEGY..."
];

const customChartPlugin = {
  id: 'customChart',
  afterDraw: chart => {
    const ctx = chart.ctx;
    if (!chart.chartArea) return; 
    const { chartArea: {top, bottom, left, right}, scales: {y} } = chart;

    // 1. Vlastný Rendering Gridu
    ctx.save();
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    
    for (let v = 0; v <= 100; v += 10) {
        const yPos = y.getPixelForValue(v);
        
        let op = 0.1; 
        if (v === 0 || v === 100) op = 0.05; 
        else if (v === 20 || v === 80) op = 0.5; 

        if (v <= 20) ctx.strokeStyle = `rgba(34, 197, 94, ${op})`;     
        else if (v < 80) ctx.strokeStyle = `rgba(255, 255, 0, ${op})`;     
        else ctx.strokeStyle = `rgba(236, 72, 153, ${op})`;                  

        ctx.beginPath();
        ctx.moveTo(0, yPos); 
        ctx.lineTo(chart.width, yPos); 
        ctx.stroke();
    }
    ctx.restore();

    // 2. Vlastný Rendering Crosshair a Tooltipu pri Hoveri
    const activeElements = chart.getActiveElements();
    if (activeElements.length > 0) {
      let activePoint = activeElements[0];
      let xPos = activePoint.element.x;
      
      ctx.save();
      
      // Vertikálna čiara
      ctx.beginPath();
      ctx.moveTo(xPos, top); 
      ctx.lineTo(xPos, bottom);
      ctx.lineWidth = 1; 
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; 
      ctx.stroke();

      // Tooltip s Dátumom
      let xLabel = chart.data.labels[activePoint.index];
      if (xLabel && xLabel !== "") {
          ctx.fillStyle = '#171717'; 
          ctx.font = 'normal 9.6px sans-serif'; 
          let textWidth = ctx.measureText(xLabel).width;
          let boxY = bottom + 4; 
          let boxX = xPos - (textWidth + 16)/2;
          
          if (boxX < left) boxX = left;
          if (boxX + textWidth + 16 > right) boxX = right - textWidth - 16;
          
          ctx.fillRect(boxX, boxY, textWidth + 16, 20);
          ctx.strokeStyle = '#525252'; ctx.strokeRect(boxX, boxY, textWidth + 16, 20);
          ctx.fillStyle = '#a3a3a3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(xLabel, boxX + (textWidth + 16)/2, boxY + 10);
      }

      // Aktualizácia dynamic score v UI
      let visualY = activePoint.element.$context.parsed.y;
      let val = ((visualY - 5) / 90) * 100;
      val = Math.max(0, Math.min(100, val)); 

      let scoreDiv = document.getElementById('dynamic-score');
      let titleDiv = document.getElementById('dynamic-title');
      
      if (scoreDiv) {
          let scoreHex = val <= 20 ? "#22c55e" : (val >= 80 ? "#EC4899" : "#FFFF00");
          scoreDiv.innerText = val.toFixed(1) + '%';
          scoreDiv.style.color = scoreHex;
          if (titleDiv) titleDiv.style.color = scoreHex;
      }

      ctx.restore();
    }

    // 3. Vykreslenie živej koncovej guličky (Now)
    const datasetMeta = chart.getDatasetMeta(0);
    let lastValidIndex = -1;
    if (chart.data.labels) {
        for (let i = chart.data.labels.length - 1; i >= 0; i--) {
            if (chart.data.labels[i] !== "") {
                lastValidIndex = i;
                break;
            }
        }
    }

    if (datasetMeta.data && datasetMeta.data.length > 0 && lastValidIndex !== -1) {
        const lastValidPoint = datasetMeta.data[lastValidIndex];
        const visualValue = chart.data.datasets[0].data[lastValidIndex];
        if (visualValue !== null && visualValue !== undefined) {
            const val = ((visualValue - 5) / 90) * 100;
            let dotColor = val <= 20 ? '#22c55e' : (val >= 80 ? '#EC4899' : '#FFFF00');
            
            ctx.save();
            ctx.beginPath();
            ctx.arc(lastValidPoint.x, lastValidPoint.y, 4, 0, 2 * Math.PI);
            ctx.fillStyle = dotColor;
            ctx.fill();
            ctx.restore();
        }
    }
  }
};

Chart.register(customChartPlugin);

function hideTooltips() {
    if (scoreChartInstance) { 
        scoreChartInstance.setActiveElements([]); 
        scoreChartInstance.update(); 
        let scoreDiv = document.getElementById('dynamic-score');
        let titleDiv = document.getElementById('dynamic-title');
        
        if (scoreDiv && window.currentScoreData) {
            scoreDiv.innerText = Number(window.currentScoreData.score).toFixed(1) + '%';
            scoreDiv.style.color = window.currentScoreData.rawColor;
            if (titleDiv) titleDiv.style.color = window.currentScoreData.rawColor;
        }
    }
}
document.addEventListener('touchstart', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });
document.addEventListener('click', e => { if (e.target.tagName !== 'CANVAS') hideTooltips(); });

async function analyze() {
  const spinner = document.getElementById("spinner");
  const loadingText = document.getElementById("loading-text");
  const output = document.getElementById("output");
  const errorBox = document.getElementById("error-box");
  const footer = document.getElementById("footer");

  let msgIndex = 0;
  spinnerInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex >= loadingMsgs.length) msgIndex = 0;
      loadingText.innerText = loadingMsgs[msgIndex];
  }, 1800); 

  try {
    const res = await fetch("https://mv-backend-ak8l.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"}
    });

    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");

    if(data.error) throw new Error(data.error);

    const sign = data.change > 0 ? "+" : "";
    const colorClass = data.change > 0 ? "text-[#22c55e]" : (data.change < 0 ? "text-pink-500" : "text-neutral-500");
    const formattedPrice = Number(data.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const score = data.cycle_score || 0;
    
    let scoreHex = score <= 20 ? "#22c55e" : (score >= 80 ? "#EC4899" : "#FFFF00");

    let dashboardStyle = "bg-neutral-900 border-neutral-800"; 
    if (score <= 20) dashboardStyle = "bg-[#030a05] border border-[#22c55e]/30"; 
    else if (score >= 80) dashboardStyle = "bg-[#EC4899]/5 border border-[#EC4899]/30"; 
    else dashboardStyle = "bg-[#FFFF00]/5 border border-[#FFFF00]/30"; 
    
    let phaseBadgeColor = "text-white border border-white/20"; 
    if (score <= 20) phaseBadgeColor = "bg-[#030a05] text-[#22c55e] border border-[#22c55e]/50"; 
    else if (score >= 80) phaseBadgeColor = "bg-[#EC4899]/10 text-[#EC4899] border border-[#EC4899]/50"; 
    else phaseBadgeColor = "bg-[#FFFF00]/10 text-[#FFFF00] border border-[#FFFF00]/50"; 

    window.currentScoreData = { score: score, rawColor: scoreHex };

    let finalHTML = `
      <div class="relative w-full mb-0">
          <div class="flex justify-between items-center px-1 mb-2 text-[0.6rem] uppercase tracking-widest">
              <div id="dynamic-title" style="color: ${scoreHex}" class="transition-colors duration-150">SCORE</div>
              <div id="dynamic-score" style="color: ${scoreHex}" class="transition-colors duration-150">${score.toFixed(1)}%</div>
          </div>
          <div class="h-60 w-full relative">
              <canvas id="scoreChart"></canvas>
          </div>
      </div>

      <div class="p-6 rounded-3xl ${dashboardStyle} mt-0">
          
        <div class="flex justify-between items-center mb-6 text-[0.6rem] uppercase tracking-widest">
            <div class="text-neutral-400 border border-neutral-600/50 px-3 py-1.5 rounded-md">${data.name} (${data.ticker})</div>
            <div class="${phaseBadgeColor} px-3 py-1.5 rounded-md">${data.phase}</div>
        </div>
        
        <div class="flex justify-between items-start mb-8 gap-4 px-1">
            <div>
                <div class="text-[1.8rem] font-bold leading-none tracking-tight text-white">$${formattedPrice}</div>
                <div class="${colorClass} text-[0.6rem] uppercase tracking-widest mt-2 flex items-center gap-1.5">
                    ${sign}${data.change.toFixed(2)}% <span class="text-white bg-neutral-800 px-1.5 py-0.5 rounded">24H</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[1.8rem] font-bold leading-none" style="color: ${scoreHex}">${score.toFixed(1)}%</div>
                <div class="text-[0.6rem] text-neutral-500 uppercase tracking-widest mt-2">SCORE</div>
            </div>
        </div>
        
        <div>
            <div class="w-full bg-neutral-800 h-1.5 rounded-full overflow-hidden mb-7">
                <div class="h-full transition-all duration-1000 ease-out" style="width: ${score}%; background-color: ${scoreHex}"></div>
            </div>
            
            <table class="w-full text-left text-[0.6rem] text-neutral-400 uppercase tracking-widest border border-neutral-800 rounded-lg overflow-hidden border-separate [border-spacing:0]">
                <tbody>
                    <tr>
                        <td class="py-2.5 px-0 border-b border-neutral-800 w-10 align-middle text-center">
                            <div class="w-2 h-2 rounded-full bg-[#22c55e] inline-block mt-[2px]"></div>
                        </td>
                        <td class="py-2.5 px-0 border-b border-l border-neutral-800 text-white font-medium whitespace-nowrap w-24 text-center">
                            0 – 20 (%)
                        </td>
                        <td class="py-2.5 pl-5 border-b border-l border-neutral-800">
                            VALUE ZONE (DCA IN)
                        </td>
                    </tr>
                    <tr>
                        <td class="py-2.5 px-0 border-b border-neutral-800 align-middle text-center">
                            <div class="w-2 h-2 rounded-full bg-[#FFFF00] inline-block mt-[2px]"></div>
                        </td>
                        <td class="py-2.5 px-0 border-b border-l border-neutral-800 text-white font-medium whitespace-nowrap text-center">
                            21 – 79 (%)
                        </td>
                        <td class="py-2.5 pl-5 border-b border-l border-neutral-800">
                            NEUTRAL ZONE (HODL)
                        </td>
                    </tr>
                    <tr>
                        <td class="py-2.5 px-0 align-middle text-center">
                            <div class="w-2 h-2 rounded-full bg-[#EC4899] inline-block mt-[2px]"></div>
                        </td>
                        <td class="py-2.5 px-0 border-l border-neutral-800 text-white font-medium whitespace-nowrap text-center">
                            80 – 100 (%)
                        </td>
                        <td class="py-2.5 pl-5 border-l border-neutral-800">
                            EXIT ZONE (DCA OUT)
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
      </div>
    `;

    output.innerHTML = finalHTML;
    output.classList.remove("hidden");
    footer.classList.remove("hidden");
    
    const limit = -260;
    let chartDates = data.chart_dates.slice(limit);
    let chartScoreRaw = data.chart_score.slice(limit);

    let chartScoreVisual = chartScoreRaw.map(v => (v === null || v === undefined) ? null : 5 + (v / 100) * 90);

    if (chartDates.length > 0 && chartScoreVisual.length > 0) {
        Chart.defaults.color = '#525252'; 
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.font.size = 9.6; 
        
        const commonOptions = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            layout: { padding: { left: 0, right: 6, top: 5, bottom: 28 } },
            interaction: { mode: 'index', intersect: false }
        };

        let ctxScore = document.getElementById('scoreChart').getContext('2d');

        if (scoreChartInstance) scoreChartInstance.destroy();
        scoreChartInstance = new Chart(ctxScore, {
            type: 'line',
            data: {
                labels: chartDates,
                datasets: [{ 
                    data: chartScoreVisual, 
                    fill: false,
                    borderWidth: 0.75, 
                    tension: 0.5, 
                    pointRadius: 0,
                    pointHoverRadius: 4, 
                    pointHoverBackgroundColor: '#171717',
                    pointHoverBorderWidth: 1.5,
                    pointHoverBorderColor: function(context) {
                        const visualY = context.parsed.y;
                        const val = ((visualY - 5) / 90) * 100;
                        return val <= 20 ? "#22c55e" : (val >= 80 ? "#EC4899" : "#FFFF00");
                    },
                    borderColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return;
                        const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                        gradient.addColorStop(0, '#22c55e'); 
                        gradient.addColorStop(0.23, '#22c55e'); 
                        gradient.addColorStop(0.32, '#FFFF00'); 
                        gradient.addColorStop(0.68, '#FFFF00'); 
                        gradient.addColorStop(0.77, '#EC4899'); 
                        gradient.addColorStop(1, '#EC4899');    
                        return gradient;
                    }
                }]
            },
            options: { 
                ...commonOptions, 
                scales: { 
                    x: { display: false },
                    y: { 
                        display: false, 
                        min: 0, 
                        max: 100 
                    } 
                } 
            }
        });
    }

  } catch (error) {
    clearInterval(spinnerInterval);
    spinner.classList.add("hidden");
    errorBox.innerText = "❌ CONNECTION ERROR. PLEASE REFRESH THE PAGE.";
    errorBox.classList.remove("hidden");
  }
}

window.addEventListener('DOMContentLoaded', analyze);
</script>
</body>
</html>
